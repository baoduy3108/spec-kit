{ cd: 'Phân hoá thiên nhiên', m: 2, a: true,  t: 'Đồng bằng sông Hồng có hệ thống đê điều ngăn lũ nên trong đê không còn được bồi phù sa hằng năm.', v: 'Khác với ĐBSCL không có hệ thống đê bao lớn nên vẫn được bồi tự nhiên.' },
{ cd: 'Phân hoá thiên nhiên', m: 2, a: true,  t: 'Thiên nhiên vùng biển và thềm lục địa, vùng đồng bằng ven biển và vùng đồi núi thể hiện sự phân hoá theo chiều Đông – Tây.', v: 'Ba dải này có quan hệ chặt chẽ với nhau.' },

{ cd: 'Dân cư', m: 2, a: false, t: 'Nước ta có 63 dân tộc cùng sinh sống.', v: 'Việt Nam có 54 dân tộc. 63 là số đơn vị hành chính cấp tỉnh trước đây.' },
{ cd: 'Dân cư', m: 2, a: false, t: 'Tỉ lệ gia tăng dân số tự nhiên của nước ta hiện nay vẫn ở mức rất cao trên 2%.', v: 'Đã giảm mạnh xuống khoảng 1% nhờ chính sách dân số.' },
{ cd: 'Dân cư', m: 2, a: true,  t: 'Quá trình đô thị hoá ở nước ta diễn ra chưa tương xứng với trình độ công nghiệp hoá.', v: 'Dẫn tới nhiều vấn đề về hạ tầng, việc làm và môi trường đô thị.' },
{ cd: 'Dân cư', m: 3, a: true,  t: 'Giải pháp quan trọng cho tình trạng phân bố dân cư chưa hợp lí là phân bố lại dân cư và lao động giữa các vùng.', v: 'Kết hợp với phát triển kinh tế ở vùng thưa dân.' },
{ cd: 'Dân cư', m: 2, a: false, t: 'Lao động nước ta chủ yếu tập trung trong khu vực dịch vụ.', v: 'Tỉ trọng khu vực nông – lâm – thuỷ sản tuy giảm nhưng vẫn còn lớn; cơ cấu đang chuyển dịch dần.' },

{ cd: 'Vùng kinh tế', m: 2, a: false, t: 'Trung du và miền núi Bắc Bộ là vùng có mật độ dân số cao nhất cả nước.', v: 'Đây là vùng thưa dân. ĐỒNG BẰNG SÔNG HỒNG mới có mật độ cao nhất.' },
{ cd: 'Vùng kinh tế', m: 2, a: false, t: 'Cây chè được trồng nhiều nhất ở Tây Nguyên.', v: 'Chè trồng nhiều nhất ở TRUNG DU VÀ MIỀN NÚI BẮC BỘ. Tây Nguyên nổi bật với cà phê.' },
{ cd: 'Vùng kinh tế', m: 2, a: true,  t: 'Tây Nguyên đứng đầu cả nước về diện tích và sản lượng cà phê.', v: 'Đắk Lắk là tỉnh trọng điểm.' },
{ cd: 'Vùng kinh tế', m: 2, a: false, t: 'Đồng bằng sông Hồng là vùng có diện tích trồng lúa lớn nhất cả nước.', v: 'ĐỒNG BẰNG SÔNG CỬU LONG mới đứng đầu về cả diện tích lẫn sản lượng lúa.' },
{ cd: 'Vùng kinh tế', m: 2, a: true,  t: 'Thế mạnh nổi bật của Đồng bằng sông Hồng là nguồn lao động dồi dào có trình độ và cơ sở hạ tầng tốt.', v: 'Có thủ đô Hà Nội là trung tâm chính trị, kinh tế, văn hoá.' },
{ cd: 'Vùng kinh tế', m: 2, a: true,  t: 'Bắc Trung Bộ là vùng chịu nhiều thiên tai nhất cả nước.', v: 'Bão, lũ lụt, gió phơn khô nóng, cát bay cát chảy.' },
{ cd: 'Vùng kinh tế', m: 3, a: true,  t: 'Việc phát triển thuỷ điện ở Tây Nguyên vừa cung cấp điện vừa cung cấp nước tưới cho mùa khô.', v: 'Đồng thời phát triển nuôi trồng thuỷ sản và du lịch.' },
{ cd: 'Vùng kinh tế', m: 2, a: true,  t: 'Đông Nam Bộ dẫn đầu cả nước về diện tích và sản lượng cao su.', v: 'Nhờ đất xám và đất badan cùng khí hậu cận xích đạo ổn định.' },
{ cd: 'Vùng kinh tế', m: 2, a: false, t: 'Duyên hải Nam Trung Bộ có diện tích đồng bằng lớn nhất cả nước.', v: 'Đồng bằng ở đây NHỎ HẸP, bị chia cắt bởi các dãy núi đâm ngang ra biển.' },
{ cd: 'Vùng kinh tế', m: 2, a: true,  t: 'Nghề làm muối phát triển mạnh ở Duyên hải Nam Trung Bộ nhờ nắng nhiều, ít mưa và nước biển có độ mặn cao.', v: 'Tiêu biểu là Cà Ná và Sa Huỳnh.' },
{ cd: 'Vùng kinh tế', m: 3, a: true,  t: 'Vấn đề lương thực của Đồng bằng sông Cửu Long gắn chặt với việc cải tạo đất phèn, đất mặn và chủ động nguồn nước ngọt.', v: 'Cùng với thích ứng biến đổi khí hậu và nước biển dâng.' },

{ cd: 'Kỹ năng', m: 2, a: false, t: 'Biểu đồ cột là biểu đồ thích hợp nhất để thể hiện cơ cấu qua nhiều năm.', v: 'Cột dùng để so sánh độ lớn. Thể hiện cơ cấu nhiều năm phải dùng biểu đồ MIỀN.' },
{ cd: 'Kỹ năng', m: 2, a: false, t: 'Tổng các tỉ trọng trong một cơ cấu có thể lớn hơn 100%.', v: 'Tổng luôn bằng đúng 100%.' },
{ cd: 'Kỹ năng', m: 2, a: true,  t: 'Bình quân lương thực đầu người được tính bằng sản lượng lương thực chia cho tổng số dân.', v: 'Đơn vị thường là kg/người.' },
{ cd: 'Kỹ năng', m: 2, a: true,  t: 'Khi nhận xét bảng số liệu, cần nêu được xu hướng chung trước rồi mới đi vào chi tiết và dẫn chứng số liệu.', v: 'Tránh liệt kê lại số liệu mà không rút ra nhận xét.' },
{ cd: 'Kỹ năng', m: 3, a: true,  t: 'Cán cân xuất nhập khẩu dương khi giá trị xuất khẩu lớn hơn giá trị nhập khẩu, gọi là xuất siêu.', v: 'Ngược lại là nhập siêu.' },
{ cd: 'Kỹ năng', m: 3, a: false, t: 'Nhập siêu là tình trạng giá trị xuất khẩu lớn hơn giá trị nhập khẩu.', v: 'Đó là XUẤT siêu. Nhập siêu là nhập khẩu lớn hơn xuất khẩu.' },

{ cd: 'Ngành kinh tế', m: 2, a: false, t: 'Ngành chăn nuôi hiện chiếm tỉ trọng lớn hơn ngành trồng trọt trong cơ cấu giá trị sản xuất nông nghiệp nước ta.', v: 'Trồng trọt vẫn chiếm tỉ trọng lớn hơn, dù chăn nuôi đang tăng dần.' },
{ cd: 'Ngành kinh tế', m: 2, a: true,  t: 'Vùng nuôi trồng thuỷ sản lớn nhất nước ta là Đồng bằng sông Cửu Long.', v: 'Nhờ diện tích mặt nước lớn và hệ thống sông ngòi, kênh rạch dày đặc.' },
{ cd: 'Ngành kinh tế', m: 2, a: true,  t: 'Công nghiệp chế biến lương thực thực phẩm là ngành công nghiệp trọng điểm của nước ta.', v: 'Có thế mạnh lâu dài, hiệu quả kinh tế cao và tác động mạnh tới các ngành khác.' },
{ cd: 'Ngành kinh tế', m: 2, a: true,  t: 'Hai trung tâm công nghiệp lớn nhất nước ta là Thành phố Hồ Chí Minh và Hà Nội.', v: 'Tập trung nhiều ngành với quy mô và giá trị sản xuất lớn.' },
{ cd: 'Ngành kinh tế', m: 2, a: false, t: 'Ngành công nghiệp khai thác bôxit tập trung chủ yếu ở Đông Nam Bộ.', v: 'Bôxit tập trung ở TÂY NGUYÊN. Đông Nam Bộ nổi bật với dầu khí.' },
{ cd: 'Ngành kinh tế', m: 3, a: true,  t: 'Việc đẩy mạnh giao thông vận tải và bưu chính viễn thông tạo điều kiện thúc đẩy các ngành kinh tế khác phát triển.', v: 'Hạ tầng là điều kiện tiên quyết cho phát triển vùng.' },
{ cd: 'Ngành kinh tế', m: 2, a: true,  t: 'Rừng phòng hộ có vai trò hạn chế thiên tai, bảo vệ nguồn nước và chống xói mòn đất.', v: 'Bên cạnh rừng đặc dụng và rừng sản xuất.' },
{ cd: 'Ngành kinh tế', m: 2, a: false, t: 'Rừng sản xuất là loại rừng có chức năng chính là bảo tồn các hệ sinh thái tự nhiên quý hiếm.', v: 'Đó là chức năng của rừng ĐẶC DỤNG (vườn quốc gia, khu bảo tồn).' },
{ cd: 'Ngành kinh tế', m: 3, a: true,  t: 'Suy giảm tài nguyên rừng làm gia tăng xói mòn đất, lũ lụt và suy giảm đa dạng sinh học.', v: 'Vì vậy bảo vệ rừng gắn liền với bảo vệ môi trường và phòng chống thiên tai.' },
{ cd: 'Ngành kinh tế', m: 2, a: true,  t: 'Ngành du lịch nước ta có tính mùa vụ rõ rệt ở nhiều địa phương.', v: 'Do phụ thuộc khí hậu, mùa lễ hội và kì nghỉ.' },
{ cd: 'Ngành kinh tế', m: 3, a: true,  t: 'Cơ cấu thành phần kinh tế nước ta chuyển dịch theo hướng phát huy vai trò của kinh tế tư nhân và khu vực có vốn đầu tư nước ngoài.', v: 'Trong khi kinh tế nhà nước vẫn giữ vai trò chủ đạo ở các lĩnh vực then chốt.' },

/* ========== BỔ SUNG MỨC 3–4: VẬN DỤNG & VẬN DỤNG CAO ========== */
{ cd: 'Vị trí địa lí', m: 4, a: true,  t: 'Do nằm hoàn toàn trong vùng nội chí tuyến bán cầu Bắc nên mọi địa điểm trên đất liền nước ta đều có hai lần Mặt Trời lên thiên đỉnh trong năm.', v: 'Đây là hệ quả trực tiếp của vị trí nội chí tuyến, tạo nền nhiệt cao và tổng bức xạ lớn quanh năm.' },
{ cd: 'Vị trí địa lí', m: 4, a: true,  t: 'Vị trí tiếp giáp Biển Đông làm cho thiên nhiên nước ta khác hẳn các nước cùng vĩ độ ở Tây Nam Á và Bắc Phi vốn khô hạn hoang mạc.', v: 'Biển Đông cung cấp ẩm, làm khí hậu điều hoà và mang lại lượng mưa lớn cho lãnh thổ.' },
{ cd: 'Vị trí địa lí', m: 3, a: true,  t: 'Vị trí nằm trên ngã tư đường hàng hải và hàng không quốc tế tạo điều kiện cho nước ta phát triển kinh tế biển và hội nhập.', v: 'Đồng thời cũng đặt ra yêu cầu cao về bảo vệ chủ quyền biển đảo và an ninh quốc phòng.' },
{ cd: 'Khí hậu', m: 4, a: true,  t: 'Gió phơn Tây Nam gây khô nóng cho Bắc Trung Bộ là do khối khí từ vịnh Bengal vượt dãy Trường Sơn, trút mưa ở sườn Tây rồi biến tính khô nóng khi xuống sườn Đông.', v: 'Hiệu ứng phơn: lên cao giảm nhiệt và gây mưa, xuống thấp nén đoạn nhiệt nên nóng và khô.' },
{ cd: 'Khí hậu', m: 4, a: false, t: 'Miền Nam nước ta có biên độ nhiệt độ trung bình năm lớn hơn miền Bắc.', v: 'Ngược lại. Miền Bắc có mùa đông lạnh do gió mùa Đông Bắc nên biên độ nhiệt năm lớn; miền Nam nóng quanh năm, biên độ nhỏ.' },
{ cd: 'Khí hậu', m: 4, a: true,  t: 'Mưa vào thu đông ở Trung Bộ là do gió Đông Bắc gặp dãy Trường Sơn kết hợp bão, dải hội tụ nhiệt đới và áp thấp.', v: 'Vì vậy Trung Bộ có mùa mưa lệch hẳn về thu đông so với cả nước.' },
{ cd: 'Khí hậu', m: 4, a: true,  t: 'Cùng thời điểm tháng 7, gió mùa Tây Nam gây mưa lớn cho Nam Bộ và Tây Nguyên nhưng lại gây khô nóng cho ven biển Trung Bộ.', v: 'Cùng một khối khí nhưng địa hình chắn gió tạo ra hai kiểu thời tiết trái ngược ở hai sườn Trường Sơn.' },
{ cd: 'Phân hoá thiên nhiên', m: 4, a: true,  t: 'Đai ôn đới gió mùa trên núi ở nước ta chỉ xuất hiện ở dãy Hoàng Liên Sơn, từ độ cao khoảng 2600 m trở lên.', v: 'Vì chỉ nơi này đủ độ cao; đó cũng là đai hẹp nhất và duy nhất có nhiệt độ trung bình năm dưới 15 °C.' },
{ cd: 'Phân hoá thiên nhiên', m: 4, a: true,  t: 'Ranh giới đai nhiệt đới gió mùa ở miền Bắc thấp hơn miền Nam khoảng 300–400 m.', v: 'Miền Bắc có mùa đông lạnh nên nền nhiệt thấp hơn, đai nhiệt đới kết thúc sớm hơn theo độ cao.' },
{ cd: 'Phân hoá thiên nhiên', m: 3, a: true,  t: 'Thiên nhiên nước ta phân hoá theo cả ba chiều: Bắc – Nam, Đông – Tây và theo độ cao.', v: 'Nguyên nhân lần lượt là vĩ độ kết hợp gió mùa, ảnh hưởng của biển kết hợp địa hình, và quy luật đai cao.' },
{ cd: 'Dân cư', m: 4, a: true,  t: 'Nước ta đang trong thời kì cơ cấu dân số vàng nhưng đồng thời cũng đã bước vào giai đoạn già hoá dân số.', v: 'Hai đặc điểm cùng tồn tại: tỉ lệ người trong tuổi lao động cao, nhưng tỉ trọng người từ 65 tuổi trở lên tăng nhanh.' },
{ cd: 'Dân cư', m: 4, a: true,  t: 'Tỉ lệ gia tăng dân số tự nhiên giảm nhưng quy mô dân số nước ta vẫn tiếp tục tăng thêm mỗi năm.', v: 'Vì quy mô dân số nền đã rất lớn, nên dù tỉ lệ giảm thì số người tăng tuyệt đối vẫn đáng kể.' },
{ cd: 'Dân cư', m: 4, a: false, t: 'Đô thị hoá ở nước ta hiện nay đã tương xứng với trình độ phát triển công nghiệp.', v: 'Đô thị hoá nước ta vẫn diễn ra chưa tương xứng, còn tự phát ở nhiều nơi, gây sức ép về hạ tầng, việc làm và môi trường.' },
{ cd: 'Vùng kinh tế', m: 4, a: true,  t: 'Đồng bằng sông Cửu Long mạnh về lúa gạo, thuỷ sản và cây ăn quả nhưng hạn chế lớn nhất là xâm nhập mặn và thiếu nước ngọt vào mùa khô.', v: 'Biến đổi khí hậu và nước biển dâng làm vấn đề này ngày càng gay gắt, đòi hỏi chuyển đổi cơ cấu mùa vụ.' },
{ cd: 'Vùng kinh tế', m: 4, a: true,  t: 'Tây Nguyên có mùa khô kéo dài sâu sắc nên thuỷ lợi là vấn đề quan trọng hàng đầu của vùng.', v: 'Mùa khô 4–5 tháng, mực nước ngầm hạ thấp, ảnh hưởng trực tiếp đến cây công nghiệp lâu năm như cà phê.' },
{ cd: 'Vùng kinh tế', m: 4, a: true,  t: 'Đông Nam Bộ dẫn đầu cả nước về thu hút vốn đầu tư nước ngoài nhờ cơ sở hạ tầng, lao động kĩ thuật và vị trí đầu mối giao thông.', v: 'Đây là vùng có GRDP bình quân đầu người và tỉ trọng công nghiệp – dịch vụ cao nhất cả nước.' },
{ cd: 'Vùng kinh tế', m: 4, a: false, t: 'Trung du và miền núi Bắc Bộ có thế mạnh nổi bật nhất là nuôi trồng thuỷ sản nước lợ.', v: 'Thế mạnh của vùng là khoáng sản, thuỷ điện, cây công nghiệp cận nhiệt và chăn nuôi gia súc lớn. Thuỷ sản nước lợ là thế mạnh của các vùng đồng bằng ven biển.' },
{ cd: 'Vùng kinh tế', m: 4, a: true,  t: 'Duyên hải Nam Trung Bộ có lợi thế phát triển nghề cá và du lịch biển nhưng lại thiếu nước và hay hạn hán ở đồng bằng ven biển.', v: 'Đây là vùng khô hạn nhất cả nước, đặc biệt là khu vực Ninh Thuận – Bình Thuận.' },
{ cd: 'Kỹ năng', m: 4, a: true,  t: 'Khi bảng số liệu có nhiều năm và đề yêu cầu thể hiện TỐC ĐỘ TĂNG TRƯỞNG, biểu đồ thích hợp nhất là biểu đồ đường.', v: 'Trước khi vẽ phải xử lí số liệu về dạng chỉ số %, lấy năm đầu bằng 100 %.' },
{ cd: 'Kỹ năng', m: 4, a: true,  t: 'Muốn thể hiện đồng thời quy mô và cơ cấu của hai hoặc ba năm, biểu đồ thích hợp nhất là biểu đồ tròn có bán kính khác nhau.', v: 'Bán kính tỉ lệ với căn bậc hai của tổng giá trị để phản ánh đúng quy mô.' },
{ cd: 'Kỹ năng', m: 4, a: true,  t: 'Biểu đồ miền thích hợp nhất để thể hiện sự chuyển dịch cơ cấu qua nhiều năm (thường từ 4 năm trở lên).', v: 'Nếu chỉ có 1–3 năm thì dùng biểu đồ tròn hoặc cột chồng.' },
{ cd: 'Kỹ năng', m: 4, a: false, t: 'Khi đề cho số liệu tuyệt đối và yêu cầu thể hiện cơ cấu, có thể vẽ ngay biểu đồ tròn mà không cần xử lí số liệu.', v: 'Phải chuyển sang số liệu tương đối (%) trước rồi mới vẽ; bỏ bước này là mất điểm xử lí số liệu.' },

{ cd: 'Quyền & nghĩa vụ', m: 2, a: true,  t: 'Vợ chồng bình đẳng với nhau trong cả quan hệ nhân thân lẫn quan hệ tài sản.', v: 'Tài sản chung khi đăng kí quyền sở hữu phải ghi tên cả hai vợ chồng.' },

{ cd: 'Quyền & nghĩa vụ', m: 2, a: true,  t: 'Pháp luật cấm kết hôn giữa những người có cùng dòng máu về trực hệ và trong phạm vi ba đời.', v: 'Nhằm bảo đảm chất lượng nòi giống và phù hợp đạo đức xã hội.' },

{ cd: 'Quyền & nghĩa vụ', m: 2, a: true,  t: 'Mọi công dân đều bình đẳng trước pháp luật, không phân biệt dân tộc, giới tính, tôn giáo hay địa vị xã hội.', v: 'Bình đẳng cả về quyền, nghĩa vụ lẫn trách nhiệm pháp lí.' },
{ cd: 'Quyền & nghĩa vụ', m: 3, a: false, t: 'Người giữ chức vụ cao trong cơ quan nhà nước được giảm nhẹ trách nhiệm pháp lí khi vi phạm pháp luật.', v: 'Vi phạm nguyên tắc bình đẳng về TRÁCH NHIỆM PHÁP LÍ — mọi công dân đều bị xử lí như nhau.' },
{ cd: 'Quyền & nghĩa vụ', m: 2, a: true,  t: 'Công dân có quyền học tập không hạn chế và học thường xuyên, học suốt đời.', v: 'Nhà nước tạo điều kiện để mọi người đều được học tập.' },
{ cd: 'Quyền & nghĩa vụ', m: 2, a: true,  t: 'Bình đẳng giới nghĩa là nam và nữ có vị trí, vai trò ngang nhau, được tạo điều kiện phát huy năng lực như nhau.', v: 'Thể hiện trong cả lĩnh vực chính trị, kinh tế, lao động, giáo dục và gia đình.' },

{ cd: 'Pháp luật quốc tế', m: 2, a: true,  t: 'Pháp luật quốc tế do các quốc gia và chủ thể khác của luật quốc tế thoả thuận xây dựng nên.', v: 'Không có cơ quan lập pháp đứng trên các quốc gia.' },
{ cd: 'Pháp luật quốc tế', m: 2, a: false, t: 'Pháp luật quốc tế do Liên hợp quốc ban hành và áp đặt lên các quốc gia thành viên.', v: 'Pháp luật quốc tế hình thành trên cơ sở THOẢ THUẬN giữa các quốc gia.' },
{ cd: 'Pháp luật quốc tế', m: 2, a: true,  t: 'Nguyên tắc tận tâm thực hiện cam kết quốc tế là một nguyên tắc cơ bản của pháp luật quốc tế.', v: 'Còn gọi là nguyên tắc pacta sunt servanda.' },
{ cd: 'Pháp luật quốc tế', m: 2, a: true,  t: 'Cấm dùng vũ lực hoặc đe doạ dùng vũ lực trong quan hệ quốc tế là nguyên tắc cơ bản của pháp luật quốc tế.', v: 'Cùng với nguyên tắc giải quyết tranh chấp bằng biện pháp hoà bình.' },
{ cd: 'Pháp luật quốc tế', m: 2, a: true,  t: 'Điều ước quốc tế là thoả thuận bằng văn bản giữa các chủ thể của luật quốc tế.', v: 'Có thể mang tên Công ước, Hiệp định, Hiệp ước, Nghị định thư.' },
{ cd: 'Pháp luật quốc tế', m: 2, a: true,  t: 'Nguyên tắc dân tộc tự quyết khẳng định mọi dân tộc đều có quyền tự quyết định chế độ chính trị và con đường phát triển của mình.', v: 'Đây là cơ sở pháp lí cho phong trào giải phóng dân tộc.' },
{ cd: 'Pháp luật quốc tế', m: 3, a: true,  t: 'Công ước Liên hợp quốc về Luật Biển năm 1982 là cơ sở pháp lí quan trọng nhất để giải quyết các vấn đề trên biển.', v: 'Việt Nam phê chuẩn Công ước này năm 1994.' }

TD.KHO_LT.gdkt.push(
{ cd: 'Tăng trưởng – Phát triển', m: 2, a: false, t: 'GDP là tổng thu nhập của công dân một nước dù họ sản xuất ở đâu.', v: 'Đó là GNI. GDP là tổng sản phẩm tạo ra TRONG LÃNH THỔ một nước.' },

{ cd: 'Tăng trưởng – Phát triển', m: 2, a: false, t: 'Chuyển dịch cơ cấu kinh tế tiến bộ là tăng tỉ trọng ngành nông nghiệp trong GDP.', v: 'Ngược lại — hướng tiến bộ là GIẢM tỉ trọng nông nghiệp.' },
{ cd: 'Tăng trưởng – Phát triển', m: 3, a: true,  t: 'Vai trò của tăng trưởng kinh tế là tạo tiền đề vật chất để giải quyết các vấn đề xã hội.', v: 'Có tăng trưởng mới có nguồn lực cho giáo dục, y tế, giảm nghèo.' },

{ cd: 'Hội nhập quốc tế', m: 2, a: false, t: 'Việt Nam gia nhập Tổ chức Thương mại Thế giới WTO năm 1995.', v: 'Năm 1995 là mốc gia nhập ASEAN. Vào WTO là năm 2007.' },

{ cd: 'Hội nhập quốc tế', m: 2, a: false, t: 'Hội nhập kinh tế quốc tế đồng nghĩa với việc từ bỏ chủ quyền quốc gia về kinh tế.', v: 'Hội nhập là chủ động tham gia trên cơ sở giữ vững độc lập, tự chủ.' },
{ cd: 'Hội nhập quốc tế', m: 2, a: true,  t: 'Xuất siêu là tình trạng giá trị xuất khẩu lớn hơn giá trị nhập khẩu.', v: 'Ngược lại là nhập siêu.' },
{ cd: 'Hội nhập quốc tế', m: 2, a: true,  t: 'Chủ động và tích cực hội nhập quốc tế là chủ trương nhất quán của Việt Nam.', v: 'Trên nguyên tắc giữ vững độc lập, tự chủ và bảo đảm lợi ích quốc gia – dân tộc.' },
{ cd: 'Hội nhập quốc tế', m: 3, a: true,  t: 'Để tận dụng cơ hội từ hội nhập, doanh nghiệp Việt Nam cần nâng cao năng lực cạnh tranh và chất lượng nguồn nhân lực.', v: 'Đồng thời tuân thủ các tiêu chuẩn quốc tế về chất lượng và môi trường.' },

{ cd: 'Bảo hiểm – An sinh', m: 2, a: true,  t: 'Bảo hiểm thương mại mang tính tự nguyện và do doanh nghiệp bảo hiểm cung cấp.', v: 'Người tham gia đóng phí theo hợp đồng đã thoả thuận.' },
{ cd: 'Bảo hiểm – An sinh', m: 2, a: false, t: 'Tham gia bảo hiểm y tế là hoàn toàn tự nguyện với mọi công dân.', v: 'BHYT mang tính BẮT BUỘC toàn dân theo lộ trình quy định của pháp luật.' },
{ cd: 'Bảo hiểm – An sinh', m: 2, a: true,  t: 'Bảo hiểm xã hội tự nguyện dành cho người lao động không thuộc diện tham gia bảo hiểm xã hội bắt buộc.', v: 'Người tham gia được lựa chọn mức đóng và phương thức đóng.' },
{ cd: 'Bảo hiểm – An sinh', m: 3, a: true,  t: 'Chính sách an sinh xã hội góp phần bảo đảm công bằng và ổn định xã hội.', v: 'Giúp giảm thiểu rủi ro và thu hẹp khoảng cách giàu nghèo.' },
{ cd: 'Bảo hiểm – An sinh', m: 2, a: false, t: 'Người đã nghỉ hưu thì không còn được hưởng bất kì chế độ bảo hiểm xã hội nào.', v: 'Chế độ hưu trí chính là một trong các chế độ của bảo hiểm xã hội.' },

{ cd: 'Quản lí thu chi', m: 2, a: true,  t: 'Quỹ dự phòng nên được lập để ứng phó với các tình huống bất ngờ như ốm đau, mất việc.', v: 'Thường khuyến nghị dự phòng bằng 3–6 tháng chi tiêu.' },

{ cd: 'Quản lí thu chi', m: 2, a: false, t: 'Mục tiêu tài chính không cần cụ thể về số tiền và thời hạn.', v: 'Mục tiêu tài chính phải CỤ THỂ, đo lường được và có thời hạn rõ ràng thì mới thực hiện được.' },
{ cd: 'Quản lí thu chi', m: 2, a: true,  t: 'Đầu tư luôn đi kèm rủi ro, lợi nhuận kì vọng càng cao thì rủi ro càng lớn.', v: 'Cần đa dạng hoá và chỉ đầu tư khoản tiền nhàn rỗi.' },

{ cd: 'Doanh nghiệp – Thuế', m: 2, a: true,  t: 'Doanh nghiệp phải kinh doanh đúng ngành nghề đã đăng kí trong giấy chứng nhận đăng kí doanh nghiệp.', v: 'Kinh doanh ngoài ngành nghề đăng kí là vi phạm pháp luật.' },

{ cd: 'Doanh nghiệp – Thuế', m: 2, a: false, t: 'Doanh nghiệp có quyền tự do xả thải ra môi trường nếu đã nộp đủ thuế.', v: 'Nộp thuế không thay thế nghĩa vụ bảo vệ môi trường. Xả thải trái phép là vi phạm pháp luật.' },
{ cd: 'Doanh nghiệp – Thuế', m: 2, a: true,  t: 'Cạnh tranh lành mạnh là động lực thúc đẩy doanh nghiệp đổi mới và nâng cao chất lượng sản phẩm.', v: 'Pháp luật cấm các hành vi cạnh tranh không lành mạnh.' },
{ cd: 'Doanh nghiệp – Thuế', m: 3, a: true,  t: 'Ý tưởng kinh doanh tốt cần xuất phát từ nhu cầu thực tế của thị trường và lợi thế của người kinh doanh.', v: 'Kèm theo đánh giá khả năng thực hiện và rủi ro.' },
{ cd: 'Doanh nghiệp – Thuế', m: 2, a: true,  t: 'Kế hoạch kinh doanh thường gồm mục tiêu, sản phẩm, thị trường, đối thủ, nguồn lực và các bước triển khai.', v: 'Giúp chủ động và giảm rủi ro khi khởi nghiệp.' },

{ cd: 'Quyền & nghĩa vụ', m: 2, a: false, t: 'Người từ đủ 16 tuổi trở lên được tham gia bầu cử đại biểu Quốc hội.', v: 'Phải đủ 18 tuổi trở lên.' },
{ cd: 'Quyền & nghĩa vụ', m: 2, a: true,  t: 'Công dân có quyền khiếu nại, tố cáo với cơ quan nhà nước có thẩm quyền.', v: 'Khiếu nại nhằm bảo vệ quyền lợi của chính mình; tố cáo nhằm báo về hành vi vi phạm pháp luật.' },
{ cd: 'Quyền & nghĩa vụ', m: 2, a: false, t: 'Khiếu nại và tố cáo là hai khái niệm hoàn toàn giống nhau.', v: 'Khiếu nại là đề nghị xem xét lại quyết định ảnh hưởng tới quyền lợi CỦA MÌNH; tố cáo là báo về hành vi vi phạm gây hại cho nhà nước, tổ chức, cá nhân khác.' },
{ cd: 'Quyền & nghĩa vụ', m: 2, a: true,  t: 'Công dân có quyền bất khả xâm phạm về thân thể, chỗ ở và bí mật thư tín.', v: 'Việc bắt người, khám xét chỗ ở phải theo trình tự pháp luật quy định.' },
{ cd: 'Quyền & nghĩa vụ', m: 2, a: false, t: 'Bất kì ai cũng có quyền bắt người mà mình nghi ngờ phạm tội.', v: 'Chỉ được bắt người theo quyết định của cơ quan có thẩm quyền, trừ trường hợp phạm tội quả tang hoặc đang bị truy nã.' },
{ cd: 'Quyền & nghĩa vụ', m: 2, a: true,  t: 'Công dân được bắt người trong trường hợp phạm tội quả tang hoặc đang bị truy nã.', v: 'Sau khi bắt phải giải ngay đến cơ quan công an, viện kiểm sát hoặc uỷ ban nhân dân gần nhất.' },

{ cd: 'Quyền & nghĩa vụ', m: 3, a: false, t: 'Người sử dụng lao động được quyền trả lương cho lao động nữ thấp hơn lao động nam khi làm cùng công việc.', v: 'Vi phạm nguyên tắc BÌNH ĐẲNG GIỚI trong lao động — cùng công việc phải trả lương như nhau.' },
{ cd: 'Quyền & nghĩa vụ', m: 2, a: true,  t: 'Công dân từ đủ 18 tuổi đến hết 25 tuổi thuộc diện gọi nhập ngũ, có thể kéo dài đến 27 tuổi với người được đào tạo trình độ cao đẳng, đại học.', v: 'Đây là nghĩa vụ bảo vệ Tổ quốc.' },
{ cd: 'Quyền & nghĩa vụ', m: 2, a: true,  t: 'Quyền tự do tín ngưỡng, tôn giáo của công dân được pháp luật bảo hộ, nhưng không được lợi dụng để vi phạm pháp luật.', v: 'Mọi tôn giáo đều bình đẳng trước pháp luật.' },
{ cd: 'Quyền & nghĩa vụ', m: 2, a: false, t: 'Người theo tôn giáo được miễn trừ trách nhiệm pháp lí khi vi phạm pháp luật.', v: 'Mọi công dân đều bình đẳng trước pháp luật, không có ngoại lệ vì lí do tôn giáo.' },
{ cd: 'Quyền & nghĩa vụ', m: 3, a: true,  t: 'Trách nhiệm pháp lí gồm bốn loại: hình sự, hành chính, dân sự và kỉ luật.', v: 'Tuỳ tính chất và mức độ vi phạm mà áp dụng loại trách nhiệm tương ứng.' },
{ cd: 'Quyền & nghĩa vụ', m: 2, a: true,  t: 'Vi phạm pháp luật là hành vi trái pháp luật, có lỗi, do người có năng lực trách nhiệm pháp lí thực hiện.', v: 'Đủ ba dấu hiệu này mới cấu thành vi phạm pháp luật.' },

{ cd: 'Pháp luật quốc tế', m: 2, a: false, t: 'Điều ước quốc tế chỉ có hiệu lực với các quốc gia là thành viên Liên hợp quốc.', v: 'Điều ước có hiệu lực với các bên KÍ KẾT và phê chuẩn nó, không phụ thuộc tư cách thành viên Liên hợp quốc.' },
{ cd: 'Pháp luật quốc tế', m: 2, a: false, t: 'Một quốc gia có thể tuỳ ý không thực hiện điều ước quốc tế mà mình đã phê chuẩn.', v: 'Vi phạm nguyên tắc tận tâm thực hiện cam kết quốc tế.' },
{ cd: 'Pháp luật quốc tế', m: 2, a: true,  t: 'Nguyên tắc không can thiệp vào công việc nội bộ của quốc gia khác là nguyên tắc cơ bản của pháp luật quốc tế.', v: 'Xuất phát từ nguyên tắc bình đẳng chủ quyền giữa các quốc gia.' },
{ cd: 'Pháp luật quốc tế', m: 2, a: true,  t: 'Công dân nước ngoài cư trú tại Việt Nam phải tuân theo pháp luật Việt Nam.', v: 'Trừ những trường hợp được hưởng quyền ưu đãi, miễn trừ ngoại giao theo điều ước quốc tế.' },
{ cd: 'Pháp luật quốc tế', m: 3, a: true,  t: 'Khi điều ước quốc tế mà Việt Nam là thành viên có quy định khác với luật trong nước, thường áp dụng quy định của điều ước quốc tế.', v: 'Theo nguyên tắc được ghi nhận trong pháp luật Việt Nam.' },
{ cd: 'Pháp luật quốc tế', m: 2, a: true,  t: 'Hợp tác quốc tế là một trong các nguyên tắc cơ bản của pháp luật quốc tế nhằm giải quyết các vấn đề toàn cầu.', v: 'Như biến đổi khí hậu, dịch bệnh, khủng bố, tội phạm xuyên quốc gia.' },

/* ========== BỔ SUNG MỨC 3–4: VẬN DỤNG & VẬN DỤNG CAO ========== */
{ cd: 'Tăng trưởng – Phát triển', m: 4, a: true,  t: 'Một nền kinh tế có tăng trưởng GDP cao nhưng bất bình đẳng gia tăng và môi trường suy thoái thì chưa được coi là phát triển bền vững.', v: 'Phát triển bền vững đòi hỏi hài hoà cả ba trụ cột: kinh tế, xã hội và môi trường.' },
{ cd: 'Tăng trưởng – Phát triển', m: 4, a: true,  t: 'GDP bình quân đầu người phản ánh mức sống tốt hơn tổng GDP khi so sánh giữa các quốc gia có quy mô dân số khác nhau.', v: 'Một nước GDP lớn nhưng dân đông vẫn có thể có mức sống thấp.' },
{ cd: 'Tăng trưởng – Phát triển', m: 4, a: false, t: 'Tăng trưởng kinh tế và phát triển kinh tế là hai khái niệm đồng nhất.', v: 'Tăng trưởng chỉ là sự gia tăng về lượng; phát triển bao gồm cả chuyển dịch cơ cấu và tiến bộ xã hội.' },
{ cd: 'Hội nhập quốc tế', m: 4, a: true,  t: 'Tham gia các hiệp định thương mại tự do vừa mở rộng thị trường xuất khẩu vừa tạo sức ép cạnh tranh lớn lên doanh nghiệp trong nước.', v: 'Vì hàng nhập khẩu cũng được giảm thuế, buộc doanh nghiệp nội địa phải nâng chất lượng và hạ giá thành.' },
{ cd: 'Hội nhập quốc tế', m: 4, a: true,  t: 'Hội nhập kinh tế quốc tế đòi hỏi doanh nghiệp phải đáp ứng các tiêu chuẩn về xuất xứ, lao động và môi trường của thị trường nhập khẩu.', v: 'Không đáp ứng thì dù thuế bằng 0 % hàng vẫn không vào được thị trường đó.' },
{ cd: 'Hội nhập quốc tế', m: 4, a: false, t: 'Hội nhập kinh tế quốc tế chỉ mang lại lợi ích, không kèm theo rủi ro nào cho nền kinh tế.', v: 'Kèm theo rủi ro: phụ thuộc thị trường bên ngoài, dễ bị tác động bởi khủng hoảng toàn cầu, cạnh tranh gay gắt.' },
{ cd: 'Bảo hiểm – An sinh', m: 4, a: true,  t: 'Người lao động làm việc theo hợp đồng lao động từ đủ 1 tháng trở lên thuộc đối tượng tham gia bảo hiểm xã hội bắt buộc.', v: 'Cả người lao động và người sử dụng lao động đều có trách nhiệm đóng theo tỉ lệ luật định.' },
{ cd: 'Bảo hiểm – An sinh', m: 4, a: true,  t: 'Bảo hiểm xã hội và bảo hiểm thương mại khác nhau ở chỗ bảo hiểm xã hội phi lợi nhuận, do Nhà nước tổ chức thực hiện.', v: 'Bảo hiểm thương mại do doanh nghiệp kinh doanh, hoạt động vì lợi nhuận, tham gia trên cơ sở tự nguyện.' },
{ cd: 'Bảo hiểm – An sinh', m: 4, a: false, t: 'Người tham gia bảo hiểm y tế được thanh toán 100 % chi phí trong mọi trường hợp khám chữa bệnh.', v: 'Mức hưởng phụ thuộc nhóm đối tượng, có đúng tuyến hay không và danh mục dịch vụ được chi trả.' },
{ cd: 'Quản lí thu chi', m: 4, a: true,  t: 'Khi lập kế hoạch tài chính cá nhân, nên trích khoản tiết kiệm ngay khi có thu nhập rồi mới chi tiêu phần còn lại.', v: 'Nguyên tắc "trả cho mình trước"; nếu để chi tiêu trước thì hầu như không còn gì để tiết kiệm.' },
{ cd: 'Quản lí thu chi', m: 4, a: true,  t: 'Quỹ dự phòng khẩn cấp nên đủ trang trải chi phí sinh hoạt thiết yếu trong khoảng 3–6 tháng.', v: 'Giúp không phải vay nợ lãi cao khi mất việc, ốm đau hay có sự cố đột xuất.' },
{ cd: 'Quản lí thu chi', m: 4, a: false, t: 'Vay tiêu dùng để mua sắm những thứ không thiết yếu là một cách quản lí tài chính hợp lí khi còn trẻ.', v: 'Vay tiêu dùng lãi suất cao cho nhu cầu không thiết yếu làm suy giảm khả năng tích luỹ và dễ dẫn tới vòng xoáy nợ.' },
{ cd: 'Quản lí thu chi', m: 3, a: true,  t: 'Lập kế hoạch chi tiêu cần phân biệt rõ khoản chi thiết yếu và khoản chi không thiết yếu.', v: 'Khi thu nhập giảm thì cắt khoản không thiết yếu trước, giữ nguyên khoản thiết yếu.' },
{ cd: 'Doanh nghiệp – Thuế', m: 4, a: true,  t: 'Thuế giá trị gia tăng là thuế gián thu: người tiêu dùng cuối cùng chịu thuế còn doanh nghiệp chỉ thu hộ và nộp thay Nhà nước.', v: 'Thuế đã nằm trong giá bán hàng hoá, dịch vụ mà người mua trả.' },
{ cd: 'Doanh nghiệp – Thuế', m: 4, a: false, t: 'Thuế thu nhập cá nhân là thuế gián thu.', v: 'Đó là thuế TRỰC THU: người có thu nhập chính là người nộp thuế và chịu thuế.' },
{ cd: 'Doanh nghiệp – Thuế', m: 4, a: true,  t: 'Thuế có ba vai trò chính: tạo nguồn thu ngân sách, điều tiết kinh tế vĩ mô và góp phần thực hiện công bằng xã hội.', v: 'Thuế luỹ tiến với thu nhập cao là công cụ điều tiết thu nhập, giảm bất bình đẳng.' },
{ cd: 'Doanh nghiệp – Thuế', m: 4, a: true,  t: 'Chủ doanh nghiệp tư nhân chịu trách nhiệm bằng toàn bộ tài sản của mình về mọi hoạt động của doanh nghiệp.', v: 'Khác với công ty TNHH và công ty cổ phần — chỉ chịu trách nhiệm hữu hạn trong phạm vi vốn góp.' },
{ cd: 'Quyền & nghĩa vụ', m: 4, a: true,  t: 'Tự ý vào chỗ ở của người khác khi chưa được đồng ý là vi phạm quyền bất khả xâm phạm về chỗ ở, kể cả khi nghi ngờ người đó giữ tài sản của mình.', v: 'Nghi ngờ phải trình báo cơ quan có thẩm quyền; chỉ khám xét theo quyết định của người có thẩm quyền và đúng trình tự luật định.' },
{ cd: 'Quyền & nghĩa vụ', m: 4, a: true,  t: 'Đọc trộm tin nhắn, thư điện tử của người khác là hành vi xâm phạm quyền được bảo đảm an toàn và bí mật thư tín, điện thoại, điện tín.', v: 'Kể cả người thân trong gia đình cũng không được tự ý mở thư tín của người khác.' },
{ cd: 'Quyền & nghĩa vụ', m: 4, a: false, t: 'Công dân chỉ bình đẳng trước pháp luật về quyền, còn về nghĩa vụ và trách nhiệm pháp lí thì tuỳ theo địa vị xã hội.', v: 'Bình đẳng trước pháp luật gồm cả ba mặt: quyền, nghĩa vụ và trách nhiệm pháp lí, không phân biệt địa vị.' },
{ cd: 'Quyền & nghĩa vụ', m: 4, a: true,  t: 'Người từ đủ 16 tuổi trở lên phải chịu trách nhiệm hành chính về mọi vi phạm hành chính do mình gây ra.', v: 'Người từ đủ 14 đến dưới 16 tuổi chỉ bị xử phạt hành chính về vi phạm do lỗi cố ý.' },
{ cd: 'Quyền & nghĩa vụ', m: 4, a: true,  t: 'Khiếu nại và tố cáo khác nhau ở chủ thể và mục đích: khiếu nại nhằm khôi phục quyền lợi của chính người khiếu nại, tố cáo nhằm ngăn chặn hành vi vi phạm.', v: 'Vì thế mọi công dân đều có quyền tố cáo, còn khiếu nại chỉ do người bị ảnh hưởng trực tiếp thực hiện.' },
{ cd: 'Pháp luật quốc tế', m: 4, a: true,  t: 'Vùng đặc quyền kinh tế rộng 200 hải lí tính từ đường cơ sở; quốc gia ven biển có quyền chủ quyền về kinh tế nhưng các nước khác vẫn được tự do hàng hải và hàng không.', v: 'Theo Công ước Luật Biển 1982 (UNCLOS). Đây là điểm phân biệt với lãnh hải — nơi quốc gia có chủ quyền đầy đủ.' },
{ cd: 'Pháp luật quốc tế', m: 4, a: true,  t: 'Lãnh hải nước ta rộng 12 hải lí tính từ đường cơ sở và là bộ phận lãnh thổ quốc gia trên biển.', v: 'Tàu thuyền nước ngoài được quyền đi qua không gây hại nhưng phải tuân thủ pháp luật Việt Nam.' },
{ cd: 'Pháp luật quốc tế', m: 4, a: false, t: 'Trong vùng đặc quyền kinh tế, quốc gia ven biển có chủ quyền hoàn toàn và tuyệt đối như trên đất liền.', v: 'Chỉ có QUYỀN CHỦ QUYỀN về thăm dò, khai thác tài nguyên và quyền tài phán về một số lĩnh vực, không phải chủ quyền đầy đủ.' }

{ cd: 'Cấu trúc đề', m: 1, a: false, t: 'Phần Đọc hiểu trong đề Ngữ văn chiếm 6,0 điểm.', v: 'Đọc hiểu chiếm 4,0 điểm; phần Viết mới chiếm 6,0 điểm.' },
{ cd: 'Cấu trúc đề', m: 2, a: true,  t: 'Ngữ liệu phần Đọc hiểu được lấy hoàn toàn ngoài sách giáo khoa.', v: 'Vì vậy không thể học tủ, phải luyện kĩ năng đọc và phương pháp làm bài.' },
{ cd: 'Cấu trúc đề', m: 2, a: false, t: 'Ngữ liệu phần Đọc hiểu luôn được trích từ các văn bản đã học trong sách giáo khoa.', v: 'Theo chương trình mới, ngữ liệu đọc hiểu lấy NGOÀI sách giáo khoa.' },
{ cd: 'Cấu trúc đề', m: 2, a: true,  t: 'Phần Đọc hiểu thường có 5 câu hỏi sắp xếp theo ba mức độ nhận biết, thông hiểu và vận dụng.', v: 'Hai câu đầu thường ở mức nhận biết.' },
{ cd: 'Cấu trúc đề', m: 2, a: true,  t: 'Trong phần Viết, câu viết đoạn văn chiếm 2,0 điểm còn câu viết bài văn chiếm 4,0 điểm.', v: 'Nên phân bổ thời gian tương ứng: khoảng 25 phút cho đoạn, 65–70 phút cho bài.' },
{ cd: 'Cấu trúc đề', m: 3, a: true,  t: 'Đề có thể hoán đổi nghị luận xã hội và nghị luận văn học giữa câu viết đoạn và câu viết bài.', v: 'Vì vậy phải luyện viết được cả đoạn nghị luận xã hội lẫn đoạn nghị luận văn học.' },
{ cd: 'Cấu trúc đề', m: 2, a: true,  t: 'Nên dành khoảng 20–25 phút cho phần Đọc hiểu để còn đủ thời gian cho phần Viết.', v: 'Phần Viết chiếm tới 6 điểm nên cần nhiều thời gian hơn.' },

/* ========== ĐỌC HIỂU – THỂ THƠ, PHƯƠNG THỨC ========== */
{ cd: 'Đọc hiểu', m: 1, a: true,  t: 'Thơ lục bát có các dòng xen kẽ 6 tiếng và 8 tiếng.', v: 'Còn song thất lục bát có cấu trúc 7-7-6-8.' },
{ cd: 'Đọc hiểu', m: 1, a: true,  t: 'Thơ tự do là thể thơ có số tiếng trong các dòng không đều nhau.', v: 'Đây là thể phổ biến nhất trong ngữ liệu thơ hiện đại.' },
{ cd: 'Đọc hiểu', m: 1, a: false, t: 'Thơ tự do là thể thơ mà mỗi dòng đều có đúng tám tiếng.', v: 'Dòng đều tám tiếng là thơ TÁM CHỮ. Thơ tự do có số tiếng KHÔNG đều.' },
{ cd: 'Đọc hiểu', m: 2, a: true,  t: 'Sáu phương thức biểu đạt gồm tự sự, miêu tả, biểu cảm, nghị luận, thuyết minh và hành chính – công vụ.', v: 'Khi đề hỏi phương thức biểu đạt CHÍNH thì chỉ ghi một.' },
{ cd: 'Đọc hiểu', m: 2, a: true,  t: 'Văn bản có cốt truyện, nhân vật và diễn biến sự việc thì phương thức biểu đạt chính là tự sự.', v: 'Còn văn bản bộc lộ cảm xúc là biểu cảm.' },
{ cd: 'Đọc hiểu', m: 2, a: false, t: 'Khi đề yêu cầu xác định phương thức biểu đạt chính, nên liệt kê tất cả các phương thức có trong văn bản.', v: 'Chữ "CHÍNH" nghĩa là chỉ ghi MỘT phương thức nổi bật nhất.' },
{ cd: 'Đọc hiểu', m: 2, a: true,  t: 'Văn bản cung cấp tri thức khách quan về sự vật, hiện tượng thì thuộc phương thức thuyết minh.', v: 'Đặc trưng là tính chính xác, khách quan và không bộc lộ cảm xúc.' },
{ cd: 'Đọc hiểu', m: 2, a: true,  t: 'Văn bản trình bày luận điểm, lí lẽ và bằng chứng để thuyết phục người đọc thuộc phương thức nghị luận.', v: 'Thường có hệ thống lập luận chặt chẽ.' },
{ cd: 'Đọc hiểu', m: 2, a: true,  t: 'Ngôi kể thứ nhất là ngôi kể mà người kể xưng "tôi" và trực tiếp tham gia câu chuyện.', v: 'Ngôi thứ ba thì người kể giấu mình, gọi nhân vật bằng tên.' },
{ cd: 'Đọc hiểu', m: 2, a: false, t: 'Trong ngôi kể thứ ba, người kể chuyện xưng "tôi" và tham gia trực tiếp vào câu chuyện.', v: 'Đó là ngôi thứ NHẤT. Ngôi thứ ba thì người kể giấu mình.' },

/* ========== BIỆN PHÁP TU TỪ ========== */
{ cd: 'Biện pháp tu từ', m: 2, a: true,  t: 'Ẩn dụ là biện pháp gọi tên sự vật này bằng tên sự vật khác dựa trên nét tương đồng.', v: 'Còn hoán dụ dựa trên quan hệ gần gũi, tương cận.' },
{ cd: 'Biện pháp tu từ', m: 2, a: true,  t: 'Hoán dụ là biện pháp gọi tên sự vật này bằng tên sự vật khác dựa trên quan hệ gần gũi như bộ phận – toàn thể, vật chứa – vật bị chứa.', v: 'Ví dụ: "áo nâu" chỉ người nông dân.' },
{ cd: 'Biện pháp tu từ', m: 3, a: false, t: 'Hình ảnh "áo nâu, áo xanh" chỉ người nông dân và công nhân là biện pháp ẩn dụ.', v: 'Đó là HOÁN DỤ — lấy dấu hiệu của sự vật để gọi sự vật, dựa trên quan hệ gần gũi chứ không phải tương đồng.' },
{ cd: 'Biện pháp tu từ', m: 3, a: true,  t: 'Hình ảnh "thuyền" và "bến" chỉ người đi và người ở lại là biện pháp ẩn dụ.', v: 'Dựa trên nét TƯƠNG ĐỒNG giữa thuyền hay đi và bến luôn đứng đợi.' },
{ cd: 'Biện pháp tu từ', m: 2, a: true,  t: 'Nhân hoá là biện pháp gán đặc điểm, hành động của con người cho sự vật, hiện tượng.', v: 'Làm cho thế giới đồ vật, cây cối trở nên sinh động, gần gũi.' },
{ cd: 'Biện pháp tu từ', m: 2, a: true,  t: 'Điệp ngữ là biện pháp lặp lại từ ngữ nhằm nhấn mạnh ý và tạo nhịp điệu cho câu văn, câu thơ.', v: 'Có điệp từ, điệp ngữ và điệp cấu trúc.' },
{ cd: 'Biện pháp tu từ', m: 2, a: true,  t: 'Nói giảm nói tránh là biện pháp dùng cách diễn đạt tế nhị để tránh gây cảm giác đau buồn, nặng nề.', v: 'Ví dụ dùng "đi xa", "về với tổ tiên" thay cho "chết".' },
{ cd: 'Biện pháp tu từ', m: 2, a: false, t: 'Nói quá là biện pháp dùng cách diễn đạt tế nhị nhằm tránh gây cảm giác đau buồn.', v: 'Đó là NÓI GIẢM NÓI TRÁNH. Nói quá là phóng đại mức độ để nhấn mạnh.' },
{ cd: 'Biện pháp tu từ', m: 2, a: true,  t: 'Câu hỏi tu từ là câu có hình thức nghi vấn nhưng không nhằm hỏi mà để khẳng định hoặc bộc lộ cảm xúc.', v: 'Không đòi hỏi câu trả lời.' },
{ cd: 'Biện pháp tu từ', m: 3, a: true,  t: 'Khi nêu tác dụng của biện pháp tu từ, cần chỉ rõ từ ngữ thể hiện, tác dụng nghệ thuật và tác dụng nội dung.', v: 'Chỉ gọi tên biện pháp mà không nêu tác dụng sẽ mất một nửa số điểm.' },
{ cd: 'Biện pháp tu từ', m: 3, a: false, t: 'Khi trả lời câu hỏi về biện pháp tu từ, chỉ cần gọi đúng tên biện pháp là đủ điểm.', v: 'Phải nêu đủ ba bước: gọi tên và chỉ từ ngữ, tác dụng nghệ thuật, tác dụng nội dung.' },
{ cd: 'Biện pháp tu từ', m: 2, a: true,  t: 'Liệt kê là biện pháp sắp xếp nối tiếp hàng loạt từ ngữ cùng loại nhằm diễn tả đầy đủ, sâu sắc hơn.', v: 'Có liệt kê theo cặp và liệt kê không theo cặp.' },
{ cd: 'Biện pháp tu từ', m: 2, a: true,  t: 'So sánh là đối chiếu hai sự vật có nét tương đồng, thường có từ so sánh như "như", "tựa", "là".', v: 'Khác với ẩn dụ là so sánh ngầm, lược bỏ vế được so sánh.' },
{ cd: 'Biện pháp tu từ', m: 3, a: true,  t: 'Đối lập (tương phản) là biện pháp đặt cạnh nhau những hình ảnh, ý trái ngược để làm nổi bật ý cần nhấn mạnh.', v: 'Thường thấy trong thơ ca và văn chính luận.' },

/* ========== NGHỊ LUẬN XÃ HỘI ========== */
{ cd: 'Nghị luận xã hội', m: 2, a: true,  t: 'Đoạn văn nghị luận xã hội khoảng 200 chữ phải được viết liền mạch trong một đoạn, không xuống dòng.', v: 'Viết thành nhiều đoạn là lỗi hình thức và bị trừ điểm.' },
{ cd: 'Nghị luận xã hội', m: 2, a: false, t: 'Có thể chia đoạn văn nghị luận xã hội 200 chữ thành ba đoạn nhỏ cho rõ ý.', v: 'Yêu cầu là MỘT đoạn văn — chia nhiều đoạn là sai hình thức.' },
{ cd: 'Nghị luận xã hội', m: 2, a: true,  t: 'Dàn ý đoạn nghị luận xã hội thường gồm: nêu vấn đề, giải thích, bàn luận có dẫn chứng, phản đề và bài học.', v: 'Phần phản đề thể hiện tư duy phản biện, là tiêu chí chấm điểm rõ ràng.' },
{ cd: 'Nghị luận xã hội', m: 3, a: true,  t: 'Dẫn chứng trong nghị luận xã hội nên là người thật việc thật, ngắn gọn và tiêu biểu.', v: 'Không nên kể lể dài dòng làm loãng lập luận.' },
{ cd: 'Nghị luận xã hội', m: 3, a: false, t: 'Trong đoạn nghị luận xã hội, nên dành phần lớn dung lượng để kể chi tiết một câu chuyện làm dẫn chứng.', v: 'Dẫn chứng chỉ nên 1–2 câu. Trọng tâm phải là LẬP LUẬN của người viết.' },
{ cd: 'Nghị luận xã hội', m: 2, a: true,  t: 'Nghị luận về một tư tưởng đạo lí thường bắt đầu bằng việc giải thích khái niệm, từ khoá.', v: 'Sau đó mới bàn luận về biểu hiện, ý nghĩa và phản đề.' },
{ cd: 'Nghị luận xã hội', m: 2, a: true,  t: 'Nghị luận về một hiện tượng đời sống cần nêu được thực trạng, nguyên nhân, hậu quả và giải pháp.', v: 'Khác với nghị luận tư tưởng đạo lí thiên về giải thích và bàn luận.' },
{ cd: 'Nghị luận xã hội', m: 3, a: true,  t: 'Phần phản đề trong nghị luận xã hội thường bắt đầu bằng các cụm như "Tuy nhiên", "Bên cạnh đó vẫn còn".', v: 'Nhằm chỉ ra mặt trái hoặc những biểu hiện lệch lạc.' },
{ cd: 'Nghị luận xã hội', m: 2, a: true,  t: 'Đoạn văn 200 chữ tương đương khoảng hai phần ba đến ba phần tư trang giấy thi.', v: 'Viết quá dài vừa bị trừ điểm vừa mất thời gian của câu 4 điểm.' },

/* ========== NGHỊ LUẬN VĂN HỌC ========== */
{ cd: 'Nghị luận văn học', m: 2, a: true,  t: 'Bài văn nghị luận văn học phải có bố cục ba phần rõ ràng: mở bài, thân bài và kết bài.', v: 'Riêng phần bố cục đã chiếm khoảng 0,5 điểm.' },
{ cd: 'Nghị luận văn học', m: 3, a: true,  t: 'Khi phân tích tác phẩm, phải bám vào từ ngữ, hình ảnh cụ thể rồi mới bình giá.', v: 'Diễn xuôi lại nội dung là lỗi làm mất điểm nặng nhất.' },
{ cd: 'Nghị luận văn học', m: 3, a: false, t: 'Trong bài nghị luận văn học, kể lại đầy đủ nội dung tác phẩm là cách làm bài hiệu quả.', v: 'Kể lại nội dung KHÔNG phải phân tích. Phải chỉ ra tác giả dùng từ ngữ, hình ảnh nào và điều đó gợi ra ý nghĩa gì.' },
{ cd: 'Nghị luận văn học', m: 2, a: true,  t: 'Mở bài nghị luận văn học cần giới thiệu tác giả, tác phẩm và vấn đề nghị luận.', v: 'Nếu đề có trích dẫn thì nên dẫn lại trong mở bài.' },
{ cd: 'Nghị luận văn học', m: 2, a: true,  t: 'Phần thân bài nên khái quát hoàn cảnh sáng tác và vị trí đoạn trích trước khi đi vào phân tích.', v: 'Giúp bài viết có chiều sâu và mạch lạc.' },
{ cd: 'Nghị luận văn học', m: 3, a: true,  t: 'Đánh giá nghệ thuật là phần bắt buộc trong bài nghị luận văn học, không thể chỉ phân tích nội dung.', v: 'Gồm thể thơ, nhịp điệu, giọng điệu, biện pháp tu từ, cách xây dựng nhân vật.' },
{ cd: 'Nghị luận văn học', m: 3, a: false, t: 'Bài nghị luận văn học chỉ cần phân tích nội dung, không cần bàn về nghệ thuật.', v: 'Nghệ thuật là một tiêu chí chấm điểm bắt buộc, chiếm phần đáng kể trong thang điểm.' },
{ cd: 'Nghị luận văn học', m: 3, a: true,  t: 'Điểm sáng tạo trong bài nghị luận văn học đến từ cách mở bài ấn tượng, liên hệ so sánh và nhận xét riêng có chiều sâu.', v: 'Chiếm khoảng 1,0 điểm trong thang điểm.' },
{ cd: 'Nghị luận văn học', m: 2, a: true,  t: 'Có thể triển khai thân bài theo bổ dọc (theo mạch cảm xúc từng khổ) hoặc bổ ngang (theo luận điểm).', v: 'Chọn cách phù hợp với yêu cầu của đề.' },

/* ========== ĐẶC TRƯNG THỂ LOẠI ========== */
{ cd: 'Thể loại', m: 2, a: true,  t: 'Khi phân tích thơ, cần bám vào mạch cảm xúc, nhân vật trữ tình, hình ảnh, ngôn từ và nhịp điệu.', v: 'Đó là các yếu tố đặc trưng làm nên chất thơ.' },
{ cd: 'Thể loại', m: 2, a: true,  t: 'Tình huống truyện là yếu tố then chốt cần phân tích đầu tiên khi làm bài về truyện ngắn.', v: 'Tình huống bộc lộ tính cách nhân vật và tư tưởng tác phẩm.' },
{ cd: 'Thể loại', m: 2, a: false, t: 'Khi phân tích truyện ngắn, yếu tố quan trọng nhất cần bám vào là nhịp điệu và vần.', v: 'Nhịp điệu, vần là đặc trưng của THƠ. Truyện ngắn cần bám vào tình huống, nhân vật, ngôi kể.' },
{ cd: 'Thể loại', m: 2, a: true,  t: 'Nhân vật trong truyện được khắc hoạ qua ngoại hình, hành động, lời nói và diễn biến nội tâm.', v: 'Cùng với mối quan hệ với các nhân vật khác.' },
{ cd: 'Thể loại', m: 2, a: true,  t: 'Xung đột kịch là yếu tố cốt lõi cần phân tích khi làm bài về tác phẩm kịch.', v: 'Xung đột được thể hiện qua hành động kịch và ngôn ngữ đối thoại.' },
{ cd: 'Thể loại', m: 2, a: true,  t: 'Kí và tản văn đề cao cái tôi tác giả cùng những chi tiết đời thực.', v: 'Ngôn ngữ thường giàu hình ảnh và chất trữ tình.' },
{ cd: 'Thể loại', m: 2, a: true,  t: 'Chương trình mới mở rộng ngữ liệu sang cả kịch, kí, tản văn và văn bản nghị luận chứ không chỉ thơ và truyện.', v: 'Vì vậy cần luyện khung phân tích cho đủ các thể loại.' },
{ cd: 'Thể loại', m: 3, a: true,  t: 'Điểm nhìn trần thuật là vị trí, góc độ mà người kể chuyện quan sát và kể lại câu chuyện.', v: 'Sự dịch chuyển điểm nhìn là một thủ pháp nghệ thuật đáng phân tích.' },
{ cd: 'Thể loại', m: 3, a: true,  t: 'Văn bản nghị luận cần phân tích luận đề, hệ thống luận điểm, lí lẽ, bằng chứng và giọng điệu.', v: 'Khác với văn bản văn học thiên về hình tượng và cảm xúc.' },

/* ========== TIẾNG VIỆT ========== */
{ cd: 'Tiếng Việt', m: 2, a: true,  t: 'Phép liên kết trong văn bản gồm phép lặp, phép thế, phép nối và phép liên tưởng.', v: 'Giúp các câu, các đoạn gắn kết chặt chẽ với nhau.' },
{ cd: 'Tiếng Việt', m: 2, a: true,  t: 'Phép thế là dùng đại từ hoặc từ ngữ đồng nghĩa để thay thế cho từ ngữ đã xuất hiện trước đó.', v: 'Tránh lặp từ và tạo liên kết cho văn bản.' },
{ cd: 'Tiếng Việt', m: 2, a: false, t: 'Phép nối là dùng đại từ để thay thế cho từ ngữ đã xuất hiện ở câu trước.', v: 'Đó là phép THẾ. Phép nối dùng các quan hệ từ như "vì vậy", "tuy nhiên", "ngoài ra".' },
{ cd: 'Tiếng Việt', m: 2, a: true,  t: 'Nghĩa tường minh là nghĩa được diễn đạt trực tiếp bằng từ ngữ, còn hàm ý là phần thông báo không nói ra trực tiếp.', v: 'Hàm ý phải suy ra từ ngữ cảnh.' },
{ cd: 'Tiếng Việt', m: 2, a: true,  t: 'Các thao tác lập luận gồm giải thích, phân tích, chứng minh, bình luận, so sánh và bác bỏ.', v: 'Một bài nghị luận thường kết hợp nhiều thao tác.' },
{ cd: 'Tiếng Việt', m: 2, a: true,  t: 'Phong cách ngôn ngữ nghệ thuật có tính hình tượng, tính truyền cảm và tính cá thể hoá.', v: 'Đặc trưng của văn bản văn học.' },
{ cd: 'Tiếng Việt', m: 2, a: true,  t: 'Phong cách ngôn ngữ chính luận thể hiện quan điểm chính trị – xã hội với lập luận chặt chẽ và giọng điệu hùng hồn.', v: 'Ví dụ như các bản tuyên ngôn, lời kêu gọi.' },
{ cd: 'Tiếng Việt', m: 3, a: true,  t: 'Câu chủ đề của đoạn văn thường đứng ở đầu đoạn (diễn dịch) hoặc cuối đoạn (quy nạp).', v: 'Đoạn song hành và móc xích thì không có câu chủ đề rõ rệt.' },
{ cd: 'Tiếng Việt', m: 3, a: false, t: 'Đoạn văn quy nạp có câu chủ đề đứng ở đầu đoạn.', v: 'Quy nạp là câu chủ đề đứng CUỐI đoạn. Đầu đoạn là diễn dịch.' },

/* ========== KĨ NĂNG LÀM BÀI ========== */
{ cd: 'Kĩ năng làm bài', m: 2, a: true,  t: 'Nên đọc kĩ yêu cầu của đề và gạch chân từ khoá trước khi viết.', v: 'Lạc đề là lỗi nghiêm trọng nhất, dù viết hay đến đâu cũng mất phần lớn số điểm.' },
{ cd: 'Kĩ năng làm bài', m: 2, a: true,  t: 'Nên lập dàn ý ngắn ra giấy nháp trước khi viết bài văn.', v: 'Mất 5 phút nhưng bảo đảm bài viết đủ ý và mạch lạc.' },
{ cd: 'Kĩ năng làm bài', m: 2, a: false, t: 'Với phần Đọc hiểu, nên viết câu trả lời càng dài càng tốt để chắc chắn được điểm.', v: 'Đọc hiểu cần trả lời TRỰC TIẾP và đúng trọng tâm. Viết dài lan man vừa mất thời gian vừa không thêm điểm.' },
{ cd: 'Kĩ năng làm bài', m: 2, a: true,  t: 'Với câu hỏi nhận biết ở phần Đọc hiểu, nên trả lời ngắn gọn, trực tiếp vào yêu cầu.', v: 'Ví dụ hỏi thể thơ thì chỉ cần ghi tên thể thơ.' },
{ cd: 'Kĩ năng làm bài', m: 3, a: true,  t: 'Câu hỏi vận dụng ở phần Đọc hiểu thường yêu cầu nêu bài học, thông điệp hoặc quan điểm cá nhân có lí giải.', v: 'Phải nêu rõ quan điểm và giải thích vì sao, không được trả lời cụt lủn.' },
{ cd: 'Kĩ năng làm bài', m: 2, a: true,  t: 'Chữ viết rõ ràng và trình bày sạch sẽ góp phần vào điểm hình thức của bài làm.', v: 'Phần hình thức và chính tả chiếm khoảng 0,5 điểm ở câu viết đoạn.' },
{ cd: 'Kĩ năng làm bài', m: 3, a: false, t: 'Trong bài thi Ngữ văn, lỗi chính tả và diễn đạt không ảnh hưởng đến điểm số.', v: 'Hình thức, chính tả và diễn đạt đều nằm trong thang điểm chấm.' },
{ cd: 'Kĩ năng làm bài', m: 2, a: true,  t: 'Nên dành vài phút cuối giờ để đọc lại và sửa lỗi chính tả, diễn đạt.', v: 'Nhiều lỗi có thể phát hiện và sửa nhanh trong lượt đọc lại.' }
];

TD.KHO_LT.van.push(
{ cd: 'Cấu trúc đề', m: 2, a: false, t: 'Thời gian làm bài môn Ngữ văn là 90 phút.', v: 'Ngữ văn làm bài 120 phút. 90 phút là thời gian môn Toán.' },
{ cd: 'Cấu trúc đề', m: 2, a: false, t: 'Môn Ngữ văn thi theo hình thức trắc nghiệm khách quan.', v: 'Ngữ văn là môn duy nhất thi hoàn toàn theo hình thức TỰ LUẬN.' },
{ cd: 'Cấu trúc đề', m: 2, a: false, t: 'Phần Viết trong đề Ngữ văn chỉ có một câu duy nhất là viết bài văn nghị luận văn học.', v: 'Phần Viết gồm HAI câu: một câu viết đoạn (2,0đ) và một câu viết bài (4,0đ).' },
{ cd: 'Cấu trúc đề', m: 2, a: false, t: 'Phần Đọc hiểu chỉ gồm các câu hỏi ở mức độ nhận biết.', v: 'Có đủ ba mức: nhận biết, thông hiểu và vận dụng.' },
{ cd: 'Cấu trúc đề', m: 2, a: true,  t: 'Vì ngữ liệu nằm ngoài sách giáo khoa nên trọng tâm ôn tập môn Văn là kĩ năng và phương pháp, không phải học thuộc bài mẫu.', v: 'Học tủ là chiến lược rủi ro nhất với môn Văn hiện nay.' },

{ cd: 'Đọc hiểu', m: 2, a: false, t: 'Thơ thất ngôn bát cú Đường luật gồm tám câu, mỗi câu tám tiếng.', v: 'Thất ngôn nghĩa là BẢY tiếng mỗi câu; bát cú là tám câu.' },
{ cd: 'Đọc hiểu', m: 2, a: false, t: 'Trong thơ lục bát, các dòng đều có sáu tiếng.', v: 'Lục bát xen kẽ dòng SÁU tiếng và dòng TÁM tiếng.' },
{ cd: 'Đọc hiểu', m: 2, a: true,  t: 'Nhân vật trữ tình là hình tượng người bộc lộ cảm xúc, suy nghĩ trong tác phẩm trữ tình.', v: 'Không đồng nhất hoàn toàn với tác giả ngoài đời.' },
{ cd: 'Đọc hiểu', m: 2, a: false, t: 'Nhân vật trữ tình trong bài thơ luôn chính là tác giả ngoài đời thực.', v: 'Nhân vật trữ tình là hình tượng nghệ thuật, không đồng nhất hoàn toàn với tác giả.' },
{ cd: 'Đọc hiểu', m: 2, a: true,  t: 'Khi đề hỏi về hiệu quả của một hình ảnh, cần nêu được cả giá trị gợi hình và giá trị biểu cảm của nó.', v: 'Rồi liên hệ tới tư tưởng, tình cảm mà tác giả gửi gắm.' },
{ cd: 'Đọc hiểu', m: 2, a: false, t: 'Khi đề hỏi nội dung chính của đoạn trích, nên chép lại nguyên văn một câu trong đoạn.', v: 'Phải KHÁI QUÁT bằng lời của mình chứ không chép lại nguyên văn.' },
{ cd: 'Đọc hiểu', m: 2, a: true,  t: 'Chủ đề của văn bản là vấn đề chính mà tác giả đặt ra và tập trung thể hiện.', v: 'Khác với đề tài là phạm vi hiện thực được phản ánh.' },

{ cd: 'Biện pháp tu từ', m: 2, a: false, t: 'So sánh và ẩn dụ là hai tên gọi khác nhau của cùng một biện pháp tu từ.', v: 'So sánh có từ so sánh và nêu cả hai vế; ẩn dụ là so sánh NGẦM, lược bỏ vế được so sánh.' },
{ cd: 'Biện pháp tu từ', m: 2, a: false, t: 'Điệp ngữ là biện pháp thay thế từ ngữ đã dùng bằng từ đồng nghĩa để tránh lặp.', v: 'Ngược lại — điệp ngữ là chủ động LẶP LẠI từ ngữ để nhấn mạnh.' },
{ cd: 'Biện pháp tu từ', m: 2, a: false, t: 'Câu hỏi tu từ là câu nghi vấn dùng để hỏi và cần người nghe trả lời.', v: 'Câu hỏi tu từ KHÔNG đòi hỏi câu trả lời, chỉ nhằm khẳng định hoặc bộc lộ cảm xúc.' },
{ cd: 'Biện pháp tu từ', m: 3, a: false, t: 'Nói quá là biện pháp làm giảm nhẹ mức độ của sự vật, hiện tượng.', v: 'Nói quá là PHÓNG ĐẠI mức độ để nhấn mạnh, gây ấn tượng.' },
{ cd: 'Biện pháp tu từ', m: 2, a: true,  t: 'Đảo ngữ là biện pháp thay đổi trật tự thông thường của các thành phần câu nhằm nhấn mạnh.', v: 'Ví dụ đưa vị ngữ lên trước chủ ngữ.' },
{ cd: 'Biện pháp tu từ', m: 2, a: true,  t: 'Chơi chữ là biện pháp lợi dụng đặc sắc về âm, về nghĩa của từ để tạo sắc thái dí dỏm, hài hước.', v: 'Thường gặp trong ca dao, câu đối.' },

{ cd: 'Nghị luận xã hội', m: 2, a: false, t: 'Đoạn văn nghị luận xã hội không cần dẫn chứng thực tế, chỉ cần lí lẽ là đủ.', v: 'Dẫn chứng thực tế là yêu cầu bắt buộc để bài viết có sức thuyết phục.' },
{ cd: 'Nghị luận xã hội', m: 2, a: false, t: 'Phần phản đề trong nghị luận xã hội là phần không bắt buộc và không được tính điểm.', v: 'Tư duy phản biện là một tiêu chí chấm điểm rõ ràng trong thang điểm hiện nay.' },
{ cd: 'Nghị luận xã hội', m: 2, a: false, t: 'Bài học và liên hệ bản thân nên đặt ở đầu đoạn nghị luận xã hội.', v: 'Bài học và liên hệ bản thân là phần KẾT, đặt ở cuối đoạn.' },
{ cd: 'Nghị luận xã hội', m: 3, a: true,  t: 'Với đề nghị luận về hiện tượng tiêu cực, phần giải pháp cần cụ thể và khả thi, tránh nói chung chung.', v: 'Nên nêu giải pháp từ nhiều phía: cá nhân, gia đình, nhà trường, xã hội.' },
{ cd: 'Nghị luận xã hội', m: 2, a: true,  t: 'Câu mở đoạn nghị luận xã hội nên nêu trực tiếp vấn đề, tránh dẫn dắt dài dòng.', v: 'Dung lượng chỉ 200 chữ nên không có chỗ cho phần dẫn dắt lê thê.' },

{ cd: 'Nghị luận văn học', m: 2, a: false, t: 'Bài nghị luận văn học không cần mở bài và kết bài, chỉ cần phân tích là đủ.', v: 'Bố cục ba phần là yêu cầu bắt buộc và có điểm riêng trong thang chấm.' },
{ cd: 'Nghị luận văn học', m: 3, a: false, t: 'Trong nghị luận văn học, nên trích dẫn càng nhiều thơ văn càng tốt, không cần phân tích.', v: 'Trích dẫn phải đi kèm PHÂN TÍCH. Trích tràn lan mà không bình giá thì không có điểm.' },
{ cd: 'Nghị luận văn học', m: 2, a: false, t: 'Kết bài nghị luận văn học nên đưa ra một vấn đề hoàn toàn mới chưa nhắc tới trong thân bài.', v: 'Kết bài phải khái quát và khẳng định lại vấn đề đã bàn, không đưa vấn đề mới.' },
{ cd: 'Nghị luận văn học', m: 3, a: true,  t: 'So sánh, liên hệ với tác phẩm khác cùng đề tài là cách hiệu quả để lấy điểm sáng tạo.', v: 'Nhưng phải liên hệ đúng chỗ và ngắn gọn, tránh lan man.' },
{ cd: 'Nghị luận văn học', m: 2, a: true,  t: 'Mỗi luận điểm trong thân bài nên được trình bày thành một đoạn văn riêng.', v: 'Giúp bài viết mạch lạc và người chấm dễ theo dõi.' },
{ cd: 'Nghị luận văn học', m: 3, a: true,  t: 'Khi đề yêu cầu phân tích kèm nhận xét, phần nhận xét phải được tách riêng và làm rõ.', v: 'Đây thường là phần phân hoá để lấy điểm giỏi.' },

{ cd: 'Thể loại', m: 2, a: false, t: 'Khi phân tích thơ, yếu tố quan trọng nhất là phân tích cốt truyện và diễn biến sự việc.', v: 'Cốt truyện là đặc trưng của TRUYỆN. Thơ cần bám vào mạch cảm xúc, hình ảnh, ngôn từ.' },
{ cd: 'Thể loại', m: 2, a: false, t: 'Tác phẩm kịch được phân tích chủ yếu qua vần và nhịp điệu.', v: 'Kịch phân tích qua XUNG ĐỘT, hành động kịch và ngôn ngữ đối thoại.' },
{ cd: 'Thể loại', m: 2, a: false, t: 'Thể loại kí đòi hỏi hư cấu cao và nhân vật hoàn toàn tưởng tượng.', v: 'Kí đề cao tính XÁC THỰC và chi tiết đời thực, cùng cái tôi tác giả.' },
{ cd: 'Thể loại', m: 2, a: true,  t: 'Truyện ngắn thường xoay quanh một tình huống, một lát cắt của đời sống.', v: 'Khác với tiểu thuyết có dung lượng lớn và nhiều tuyến nhân vật.' },
{ cd: 'Thể loại', m: 2, a: true,  t: 'Giọng điệu là thái độ, tình cảm của tác giả thể hiện qua cách kể, cách tả trong tác phẩm.', v: 'Có thể trữ tình, xót xa, mỉa mai, hào hùng…' },

{ cd: 'Tiếng Việt', m: 2, a: false, t: 'Phép lặp trong liên kết văn bản là lỗi diễn đạt cần tránh.', v: 'Phép lặp có chủ ý là một PHÉP LIÊN KẾT hợp lệ, khác với lỗi lặp từ vô ý.' },
{ cd: 'Tiếng Việt', m: 2, a: false, t: 'Phong cách ngôn ngữ khoa học có tính hình tượng và truyền cảm cao.', v: 'Đó là đặc trưng của phong cách NGHỆ THUẬT. Phong cách khoa học đề cao tính khái quát, lí trí và khách quan.' },
{ cd: 'Tiếng Việt', m: 2, a: false, t: 'Thao tác lập luận bác bỏ là dùng dẫn chứng để làm sáng tỏ một ý kiến đúng.', v: 'Đó là thao tác CHỨNG MINH. Bác bỏ là phản đối, chỉ ra cái sai của một ý kiến.' },
{ cd: 'Tiếng Việt', m: 2, a: true,  t: 'Thao tác lập luận phân tích là chia đối tượng thành các bộ phận để xem xét kĩ lưỡng.', v: 'Sau đó thường kết hợp với tổng hợp để khái quát lại.' },
{ cd: 'Tiếng Việt', m: 2, a: true,  t: 'Đoạn văn diễn dịch có câu chủ đề ở đầu đoạn, các câu sau triển khai làm rõ.', v: 'Đây là kiểu đoạn dễ viết và dễ kiểm soát nhất khi làm bài thi.' },
{ cd: 'Tiếng Việt', m: 3, a: false, t: 'Hàm ý là phần nghĩa được diễn đạt trực tiếp bằng từ ngữ trong câu.', v: 'Đó là nghĩa TƯỜNG MINH. Hàm ý là phần không nói ra trực tiếp, phải suy luận từ ngữ cảnh.' },
{ cd: 'Tiếng Việt', m: 2, a: true,  t: 'Từ Hán Việt thường mang sắc thái trang trọng, cổ kính so với từ thuần Việt cùng nghĩa.', v: 'Ví dụ "phụ nữ" trang trọng hơn "đàn bà".' },

{ cd: 'Kĩ năng làm bài', m: 2, a: false, t: 'Nên làm phần Viết trước rồi mới quay lại làm phần Đọc hiểu.', v: 'Nên làm theo thứ tự đề: Đọc hiểu trước để "khởi động" và vì nó nhanh, còn nhiều thời gian cho phần Viết.' },
{ cd: 'Kĩ năng làm bài', m: 2, a: false, t: 'Nếu không đủ thời gian, nên bỏ hẳn câu viết bài văn 4 điểm để hoàn thiện các phần khác.', v: 'Câu 4 điểm chiếm tỉ trọng lớn nhất — dù thiếu thời gian cũng phải viết được mở bài, một vài luận điểm và kết bài.' },
{ cd: 'Kĩ năng làm bài', m: 2, a: false, t: 'Viết càng dài thì điểm bài văn càng cao.', v: 'Điểm phụ thuộc chất lượng lập luận và phân tích, không phụ thuộc độ dài.' },
{ cd: 'Kĩ năng làm bài', m: 2, a: true,  t: 'Nên phân bổ thời gian trước khi làm bài và bám sát mốc thời gian đã định.', v: 'Đề xuất: Đọc hiểu 20–25 phút, đoạn văn 25 phút, bài văn 65–70 phút, soát lại 5 phút.' },
{ cd: 'Kĩ năng làm bài', m: 3, a: true,  t: 'Khi bí ý ở phần viết, có thể quay lại bám vào từ khoá của đề để triển khai tiếp.', v: 'Từ khoá của đề luôn gợi ra hướng lập luận.' },
{ cd: 'Kĩ năng làm bài', m: 2, a: true,  t: 'Nên gạch đầu dòng dàn ý ngay trên đề thi hoặc giấy nháp để không bỏ sót luận điểm.', v: 'Mất vài phút nhưng bảo đảm bài không thiếu ý.' },

/* ========== BỔ SUNG MỨC 3–4: VẬN DỤNG & VẬN DỤNG CAO ========== */
{ cd: 'Cấu trúc đề', m: 4, a: true,  t: 'Khi đề yêu cầu viết đoạn nghị luận văn học 200 chữ về MỘT khía cạnh của tác phẩm, phải tập trung phân tích đúng khía cạnh đó thay vì tóm tắt toàn bộ tác phẩm.', v: 'Lạc đề bộ phận là lỗi mất điểm nặng nhất ở câu 2 điểm; giám khảo chấm theo đúng yêu cầu đã nêu.' },
{ cd: 'Cấu trúc đề', m: 4, a: false, t: 'Vì ngữ liệu lấy ngoài sách giáo khoa nên việc học kĩ các tác phẩm trong sách là vô ích.', v: 'Tác phẩm trong sách là nơi rèn kĩ năng đọc và kho dẫn chứng cho phần viết; ngữ liệu mới chỉ thay chất liệu chứ không thay kĩ năng.' },
{ cd: 'Cấu trúc đề', m: 3, a: true,  t: 'Với đề yêu cầu viết đoạn 200 chữ, dung sai chấp nhận được thường khoảng 2/3 đến 1,5 lần số chữ quy định.', v: 'Viết quá ngắn bị coi là chưa đủ ý, quá dài dễ lan man và mất thời gian cho câu 4 điểm.' },
{ cd: 'Đọc hiểu', m: 3, a: true,  t: 'Câu hỏi dạng "Anh/chị hiểu như thế nào về ý kiến…" thuộc mức thông hiểu: phải giải thích từ khoá rồi diễn giải bằng lời của mình.', v: 'Chỉ chép lại nguyên câu trong ngữ liệu sẽ không được điểm vì chưa thể hiện sự hiểu.' },
{ cd: 'Đọc hiểu', m: 3, a: true,  t: 'Với câu "Thông điệp nào có ý nghĩa nhất với anh/chị? Vì sao?", phải nêu rõ MỘT thông điệp rồi lí giải bằng trải nghiệm hoặc nhận thức cá nhân.', v: 'Nêu nhiều thông điệp mà không lí giải là lỗi phổ biến khiến mất nửa số điểm.' },
{ cd: 'Đọc hiểu', m: 3, a: false, t: 'Với câu hỏi rút ra bài học, chỉ cần chép lại một câu có sẵn trong ngữ liệu là đủ điểm.', v: 'Câu vận dụng đòi hỏi HS tự rút ra và diễn đạt bằng ngôn ngữ của mình, có lí giải ngắn.' },
{ cd: 'Đọc hiểu', m: 4, a: true,  t: 'Khi câu hỏi yêu cầu chỉ ra biện pháp tu từ, nếu chỉ gọi tên mà không nêu tác dụng thì thường chỉ đạt tối đa một nửa số điểm của câu đó.', v: 'Đáp án luôn gồm hai vế: gọi tên biện pháp + phân tích hiệu quả nghệ thuật trong ngữ cảnh cụ thể.' },
{ cd: 'Đọc hiểu', m: 4, a: true,  t: 'Câu hỏi "Theo tác giả, …" bắt buộc phải trả lời đúng theo nội dung văn bản, không được nêu quan điểm riêng.', v: 'Khác với câu "Theo anh/chị…" mới là chỗ trình bày ý kiến cá nhân. Đọc kĩ chủ ngữ của câu hỏi.' },
{ cd: 'Đọc hiểu', m: 3, a: true,  t: 'Nên đọc hết các câu hỏi trước rồi mới đọc ngữ liệu để biết cần chú ý những chi tiết nào.', v: 'Cách này rút ngắn thời gian đọc lại và giúp gạch chân đúng chỗ ngay từ lượt đọc đầu.' },
{ cd: 'Biện pháp tu từ', m: 4, a: true,  t: 'Trong hai câu "Mặt trời của bắp thì nằm trên đồi / Mặt trời của mẹ, em nằm trên lưng", "mặt trời" thứ hai là ẩn dụ chỉ đứa con.', v: 'Ẩn dụ dựa trên nét tương đồng: con là nguồn sống, nguồn ấm áp của mẹ như mặt trời với cây bắp.' },
{ cd: 'Biện pháp tu từ', m: 4, a: true,  t: 'Điệp ngữ lặp lại từ ngữ, còn điệp cấu trúc lặp lại mô hình cú pháp mà không nhất thiết lặp nguyên từ.', v: 'Cả hai đều tạo nhịp điệu và nhấn mạnh, nhưng khi phân tích phải gọi đúng tên biện pháp.' },
{ cd: 'Biện pháp tu từ', m: 4, a: false, t: 'Mọi phép so sánh đều bắt buộc phải có từ so sánh như "như", "tựa", "là".', v: 'Có so sánh ngầm, không dùng từ so sánh, ví dụ "Anh đội viên mơ màng / Như nằm trong giấc mộng" khác với kiểu so sánh ẩn.' },
{ cd: 'Biện pháp tu từ', m: 4, a: true,  t: 'Nói giảm nói tránh trong câu "Bác đã đi rồi sao, Bác ơi!" làm dịu nỗi đau mất mát và thể hiện sự kính trọng.', v: 'Dùng "đi" thay cho "mất" — đây là dạng nói giảm rất hay được hỏi trong đề đọc hiểu.' },
{ cd: 'Biện pháp tu từ', m: 3, a: true,  t: 'Khi phân tích tác dụng của biện pháp tu từ, cần nêu đủ ba tầng: tạo hình ảnh/nhịp điệu, làm nổi bật nội dung, thể hiện tình cảm tác giả.', v: 'Đây là công thức trả lời đầy đủ, hầu như luôn khớp với thang điểm chi tiết.' },
{ cd: 'Nghị luận xã hội', m: 4, a: true,  t: 'Trong đoạn nghị luận xã hội 200 chữ nên chọn MỘT dẫn chứng ngắn gọn, tiêu biểu thay vì kể dài nhiều dẫn chứng.', v: 'Dung lượng quá nhỏ; kể lể dẫn chứng sẽ lấn hết chỗ dành cho lập luận và bàn luận mở rộng.' },
{ cd: 'Nghị luận xã hội', m: 4, a: false, t: 'Đoạn văn nghị luận xã hội 200 chữ vẫn phải xuống dòng chia thành ba đoạn mở – thân – kết.', v: 'Đoạn văn viết liền mạch, KHÔNG xuống dòng. Xuống dòng là biến đoạn thành bài, bị trừ điểm hình thức.' },
{ cd: 'Nghị luận xã hội', m: 4, a: true,  t: 'Phần bàn luận mở rộng (lật ngược vấn đề, phê phán biểu hiện trái chiều) là chỗ tạo khác biệt giữa bài khá và bài giỏi.', v: 'Bài chỉ khẳng định một chiều thường dừng ở mức trung bình khá vì thiếu chiều sâu tư duy phản biện.' },
{ cd: 'Nghị luận xã hội', m: 3, a: true,  t: 'Với đề nghị luận về một hiện tượng đời sống, cần có phần chỉ ra nguyên nhân và đề xuất giải pháp.', v: 'Khác với nghị luận về tư tưởng đạo lí — vốn nghiêng về giải thích, chứng minh và bàn luận.' },
{ cd: 'Nghị luận văn học', m: 4, a: true,  t: 'Khi phân tích một đoạn thơ, phải bám vào từ ngữ, hình ảnh, nhịp điệu, biện pháp tu từ cụ thể chứ không diễn xuôi nội dung.', v: 'Diễn xuôi là lỗi nặng nhất của bài nghị luận văn học: kể lại ý thơ mà không phân tích chất liệu nghệ thuật.' },
{ cd: 'Nghị luận văn học', m: 4, a: true,  t: 'Bài nghị luận văn học đạt điểm cao thường có phần đánh giá, mở rộng, liên hệ ở cuối chứ không dừng lại ở phân tích.', v: 'Đánh giá đóng góp của tác giả, vị trí tác phẩm hoặc liên hệ tác phẩm cùng đề tài giúp bài có tầm khái quát.' },
{ cd: 'Nghị luận văn học', m: 4, a: false, t: 'Trong bài nghị luận văn học, phần giới thiệu tác giả – tác phẩm càng dài càng thể hiện sự hiểu biết.', v: 'Mở bài dài dòng chiếm thời gian mà không được tính điểm nội dung. Chỉ cần 2–3 câu rồi vào vấn đề.' },
{ cd: 'Nghị luận văn học', m: 4, a: true,  t: 'Với đề so sánh hai đoạn trích, phải có phần chỉ ra điểm tương đồng, điểm khác biệt và lí giải nguyên nhân khác biệt.', v: 'Lí giải nguyên nhân (hoàn cảnh sáng tác, phong cách, thể loại) là tầng cao nhất của dạng đề so sánh.' },
{ cd: 'Thể loại', m: 4, a: true,  t: 'Truyện ngắn hiện đại có thể không có cốt truyện rõ ràng mà thiên về dòng tâm trạng, cảm giác của nhân vật.', v: 'Kiểu "truyện không có chuyện" như của Thạch Lam; khi phân tích phải bám vào tâm trạng chứ không bám sự kiện.' },
{ cd: 'Thể loại', m: 4, a: true,  t: 'Trong kí, cái tôi tác giả xuất hiện trực tiếp và là yếu tố tạo nên sức hấp dẫn của tác phẩm.', v: 'Khác truyện — nơi tác giả ẩn sau nhân vật. Phân tích kí phải chỉ ra được cái tôi quan sát và cảm nhận.' },
{ cd: 'Thể loại', m: 3, a: true,  t: 'Kịch xây dựng xung đột và tính cách nhân vật chủ yếu qua hành động và lời thoại.', v: 'Vì vậy khi phân tích kịch phải bám vào lời thoại và chỉ dẫn sân khấu.' },
{ cd: 'Tiếng Việt', m: 4, a: true,  t: 'Phép thế và phép lặp đều là phương tiện liên kết, nhưng phép thế dùng từ ngữ khác thay cho từ đã có còn phép lặp giữ nguyên từ ngữ đó.', v: 'Phép thế giúp tránh lặp; phép lặp lại dùng để nhấn mạnh. Đề hay hỏi gọi tên phép liên kết trong đoạn.' },
{ cd: 'Tiếng Việt', m: 4, a: true,  t: 'Nghĩa hàm ẩn là nội dung người nói muốn truyền đạt nhưng không nói trực tiếp, phải suy ra từ ngữ cảnh.', v: 'Câu hỏi "Câu nói của nhân vật hàm ý gì?" chính là hỏi nghĩa hàm ẩn.' },
{ cd: 'Tiếng Việt', m: 3, a: false, t: 'Câu bị động trong tiếng Việt luôn phải có từ "bị" hoặc "được".', v: 'Có những câu mang ý bị động mà không dùng từ nào, ví dụ "Ngôi nhà xây xong năm ngoái".' },
{ cd: 'Kĩ năng làm bài', m: 4, a: true,  t: 'Nếu sắp hết giờ ở câu viết bài văn, nên viết nhanh một kết bài ngắn thay vì bỏ trống.', v: 'Bài không có kết bị trừ điểm hình thức và bố cục; một kết bài 2 câu cũng cứu được phần điểm đó.' },
{ cd: 'Kĩ năng làm bài', m: 4, a: true,  t: 'Mỗi luận điểm trong bài văn nên tách thành một đoạn riêng có câu chủ đề mở đầu.', v: 'Giúp giám khảo thấy rõ ý và cho điểm đúng phần; viết một khối liền dễ bị đánh giá là ý lộn xộn.' },
{ cd: 'Kĩ năng làm bài', m: 3, a: false, t: 'Có thể bỏ hẳn phần đọc hiểu để dành toàn bộ thời gian cho phần viết vì phần viết nhiều điểm hơn.', v: 'Đọc hiểu 4 điểm là phần dễ ăn điểm nhất, tốn ít thời gian nhất — bỏ nó là tự đánh mất cơ hội rõ ràng.' },
{ cd: 'Kĩ năng làm bài', m: 3, a: true,  t: 'Nên dành 3–5 phút cuối để soát lỗi chính tả, diễn đạt và bổ sung ý còn thiếu.', v: 'Lỗi chính tả nhiều làm mất điểm tiêu chí diễn đạt dù nội dung tốt.' }
);

</script>
<script>
/* ============================================================
   TIẾNG ANH — KHO MỆNH ĐỀ NGỮ PHÁP & CHIẾN THUẬT (Tà Đạo)
   Mệnh đề viết bằng tiếng Việt về quy tắc tiếng Anh — học quy tắc
   nhanh hơn học từng câu lẻ.
   ============================================================ */
window.TD = window.TD || {}; TD.KHO_LT = TD.KHO_LT || {};

TD.KHO_LT.anh = [
/* ========== THÌ ========== */
{ cd: 'Thì động từ', m: 1, a: true,  t: 'Dấu hiệu "since" đi với mốc thời gian và "for" đi với khoảng thời gian, cả hai đều báo hiệu thì hiện tại hoàn thành.', v: 'Ví dụ: since 2018, for three years → have/has + V3.' },
{ cd: 'Thì động từ', m: 1, a: false, t: 'Dấu hiệu "since" và "for" báo hiệu thì quá khứ đơn.', v: 'Chúng báo hiệu thì HIỆN TẠI HOÀN THÀNH (have/has + V3).' },
{ cd: 'Thì động từ', m: 2, a: true,  t: 'Các trạng từ "already", "yet", "just", "ever", "never" thường đi với thì hiện tại hoàn thành.', v: '"yet" thường ở cuối câu phủ định hoặc nghi vấn.' },
{ cd: 'Thì động từ', m: 2, a: true,  t: 'Cụm "ago", "last week", "yesterday", "in 1990" báo hiệu thì quá khứ đơn.', v: 'Mốc thời gian đã xác định trong quá khứ thì dùng V2/V-ed.' },
{ cd: 'Thì động từ', m: 2, a: false, t: 'Có thể dùng thì hiện tại hoàn thành với trạng ngữ "yesterday".', v: 'Hiện tại hoàn thành KHÔNG đi với mốc thời gian quá khứ xác định. Phải dùng quá khứ đơn.' },
{ cd: 'Thì động từ', m: 2, a: true,  t: 'Thì quá khứ hoàn thành diễn tả hành động xảy ra trước một hành động khác trong quá khứ.', v: 'Thường đi với "before", "after", "by the time".' },
{ cd: 'Thì động từ', m: 2, a: true,  t: 'Trong câu có "while", hành động kéo dài dùng thì quá khứ tiếp diễn.', v: 'Hành động xen vào ngắn hơn dùng quá khứ đơn.' },
{ cd: 'Thì động từ', m: 2, a: true,  t: 'Sau các liên từ chỉ thời gian như "when", "as soon as", "until", không dùng "will" mà dùng thì hiện tại.', v: 'Ví dụ: I will call you when I arrive (không phải "will arrive").' },
{ cd: 'Thì động từ', m: 2, a: false, t: 'Sau "when" chỉ tương lai, ta dùng "will + V" để diễn tả hành động tương lai.', v: 'Sau liên từ thời gian phải dùng thì HIỆN TẠI dù ý nghĩa là tương lai.' },
{ cd: 'Thì động từ', m: 2, a: true,  t: 'Thì hiện tại đơn dùng với các trạng từ tần suất như always, usually, often, sometimes, every day.', v: 'Chủ ngữ số ít ngôi thứ ba thì động từ thêm -s/-es.' },
{ cd: 'Thì động từ', m: 2, a: true,  t: '"Be going to" diễn tả dự định đã có kế hoạch từ trước hoặc dự đoán có căn cứ.', v: 'Còn "will" dùng cho quyết định tức thời hoặc dự đoán chủ quan.' },

/* ========== CÂU ĐIỀU KIỆN – GIẢ ĐỊNH ========== */
{ cd: 'Câu điều kiện', m: 2, a: true,  t: 'Câu điều kiện loại 2 diễn tả điều không có thật ở hiện tại, dùng V2 ở mệnh đề If và "would + V" ở mệnh đề chính.', v: 'Với động từ "to be" thì dùng "were" cho mọi ngôi.' },
{ cd: 'Câu điều kiện', m: 2, a: true,  t: 'Câu điều kiện loại 3 diễn tả điều không có thật trong quá khứ, dùng "had + V3" và "would have + V3".', v: 'Hàm ý điều đã xảy ra trái ngược với mệnh đề If.' },
{ cd: 'Câu điều kiện', m: 3, a: false, t: 'Câu "If I had studied harder, I would have passed" hàm ý rằng tôi đã học rất chăm.', v: 'Điều kiện loại 3 NGƯỢC với thực tế: thực tế là tôi đã KHÔNG học chăm và đã trượt.' },
{ cd: 'Câu điều kiện', m: 3, a: true,  t: 'Đảo ngữ của câu điều kiện loại 3 là "Had + S + V3, S + would have + V3".', v: 'Loại 1 đảo thành "Should + S + V", loại 2 thành "Were + S + to V".' },
{ cd: 'Câu điều kiện', m: 2, a: true,  t: 'Câu ước ở hiện tại dùng "wish + S + V2/were", câu ước ở quá khứ dùng "wish + S + had + V3".', v: 'Câu ước cho tương lai dùng "wish + S + would + V".' },
{ cd: 'Câu điều kiện', m: 2, a: false, t: 'Câu "I wish I were taller" diễn tả điều đã xảy ra trong quá khứ.', v: 'Đó là câu ước ở HIỆN TẠI, trái với thực tế hiện tại (thực tế là tôi không cao).' },
{ cd: 'Câu điều kiện', m: 2, a: true,  t: 'Câu điều kiện loại 1 diễn tả điều có thể xảy ra ở hiện tại hoặc tương lai.', v: 'Cấu trúc: If + S + V(s/es), S + will + V.' },

/* ========== BỊ ĐỘNG – TƯỜNG THUẬT – MỆNH ĐỀ QUAN HỆ ========== */
{ cd: 'Bị động – Tường thuật', m: 2, a: true,  t: 'Câu bị động có dạng "be + V3", trong đó "be" được chia theo thì của câu chủ động.', v: 'Tân ngữ của câu chủ động trở thành chủ ngữ của câu bị động.' },
{ cd: 'Bị động – Tường thuật', m: 3, a: true,  t: 'Cấu trúc "People say that..." có thể đổi thành "It is said that..." hoặc "S + is said to + V".', v: 'Đây là dạng bị động kép, rất hay ra ở câu viết lại.' },
{ cd: 'Bị động – Tường thuật', m: 2, a: true,  t: 'Khi tường thuật, thì của động từ thường được lùi một bậc so với câu trực tiếp.', v: 'Present simple → past simple, present perfect → past perfect, will → would.' },
{ cd: 'Bị động – Tường thuật', m: 3, a: true,  t: 'Khi tường thuật câu hỏi có từ để hỏi, phải bỏ trợ động từ do/does/did và đưa về trật tự câu kể.', v: 'Ví dụ: "Where do you live?" → She asked where I lived.' },
{ cd: 'Bị động – Tường thuật', m: 3, a: false, t: 'Khi tường thuật câu hỏi, ta giữ nguyên trật tự đảo ngữ của câu hỏi trực tiếp.', v: 'Phải đưa về trật tự CÂU KỂ (S + V) và bỏ trợ động từ.' },
{ cd: 'Bị động – Tường thuật', m: 2, a: true,  t: 'Tường thuật câu hỏi Yes/No dùng "asked if/whether + S + V".', v: 'Cũng phải lùi thì và đổi trạng từ chỉ thời gian, nơi chốn.' },
{ cd: 'Bị động – Tường thuật', m: 2, a: true,  t: 'Khi tường thuật, "this" đổi thành "that", "now" thành "then", "tomorrow" thành "the next day", "ago" thành "before".', v: 'Đổi cả đại từ nhân xưng cho phù hợp ngữ cảnh.' },
{ cd: 'Bị động – Tường thuật', m: 2, a: true,  t: 'Tường thuật câu mệnh lệnh dùng "told/asked + O + to V" và phủ định là "not to V".', v: 'Ví dụ: "Close the door" → He told me to close the door.' },
{ cd: 'Mệnh đề quan hệ', m: 2, a: true,  t: 'Đại từ quan hệ "who" dùng cho người, "which" dùng cho vật, "that" dùng cho cả hai.', v: '"whose" chỉ sở hữu, "where/when/why" là trạng từ quan hệ.' },
{ cd: 'Mệnh đề quan hệ', m: 2, a: true,  t: 'Không dùng "that" trong mệnh đề quan hệ không xác định (đứng sau dấu phẩy).', v: 'Mệnh đề không xác định chỉ bổ sung thông tin, có thể lược bỏ mà câu vẫn đủ nghĩa.' },
{ cd: 'Mệnh đề quan hệ', m: 2, a: false, t: 'Có thể dùng "that" thay cho "which" trong mệnh đề quan hệ đứng sau dấu phẩy.', v: 'KHÔNG được — sau dấu phẩy chỉ dùng which/who/whom, không dùng that.' },
{ cd: 'Mệnh đề quan hệ', m: 3, a: true,  t: 'Rút gọn mệnh đề quan hệ chủ động dùng V-ing, rút gọn bị động dùng V3.', v: 'Ví dụ: The man standing there / The book written by him.' },
{ cd: 'Mệnh đề quan hệ', m: 3, a: false, t: 'Rút gọn mệnh đề quan hệ ở dạng bị động dùng V-ing.', v: 'Bị động rút gọn bằng V3 (quá khứ phân từ), chủ động mới dùng V-ing.' },
{ cd: 'Mệnh đề quan hệ', m: 2, a: true,  t: 'Nếu sau đại từ quan hệ là động từ ngay lập tức thì đại từ đó đóng vai trò chủ ngữ.', v: 'Nếu sau nó là một chủ ngữ mới thì đại từ đóng vai trò tân ngữ và có thể lược bỏ.' },

/* ========== TỪ LOẠI – TỪ VỰNG ========== */
{ cd: 'Từ loại', m: 2, a: true,  t: 'Các hậu tố -tion, -sion, -ment, -ness, -ity, -ance thường tạo thành danh từ.', v: 'Còn -er, -or, -ist thường chỉ người thực hiện hành động.' },
{ cd: 'Từ loại', m: 2, a: true,  t: 'Các hậu tố -ful, -less, -ous, -ive, -able, -al, -ic thường tạo thành tính từ.', v: 'Hậu tố -ly thường tạo trạng từ.' },
{ cd: 'Từ loại', m: 2, a: true,  t: 'Sau mạo từ a/an/the hoặc sau tính từ thường là danh từ.', v: 'Đây là mẹo xác định từ loại mà không cần biết nghĩa.' },
{ cd: 'Từ loại', m: 2, a: true,  t: 'Sau động từ "be", "seem", "become", "look" thường là tính từ.', v: 'Còn sau động từ thường là trạng từ.' },
{ cd: 'Từ loại', m: 2, a: false, t: 'Sau động từ thường như "work", "run", "speak" phải dùng tính từ để bổ nghĩa.', v: 'Phải dùng TRẠNG TỪ (thường có đuôi -ly) để bổ nghĩa cho động từ.' },
{ cd: 'Từ loại', m: 3, a: true,  t: 'Tính từ đuôi -ing mô tả tính chất của sự vật, tính từ đuôi -ed mô tả cảm xúc của người.', v: 'Ví dụ: an interesting book nhưng I am interested in it.' },
{ cd: 'Từ loại', m: 3, a: false, t: 'Câu "I am very boring in this lesson" là câu đúng ngữ pháp và ngữ nghĩa.', v: 'Phải là "bored" — đuôi -ed cho cảm xúc của người. "boring" nghĩa là bản thân người đó gây chán.' },
{ cd: 'Từ loại', m: 2, a: true,  t: 'Các hậu tố -ise/-ize, -ify, -en thường tạo thành động từ.', v: 'Ví dụ: modernise, simplify, strengthen.' },

/* ========== NGỮ ÂM – TRỌNG ÂM ========== */
{ cd: 'Ngữ âm – Trọng âm', m: 2, a: true,  t: 'Đuôi -ed đọc là /ɪd/ khi động từ nguyên thể kết thúc bằng âm /t/ hoặc /d/.', v: 'Ví dụ: wanted, needed, decided.' },
{ cd: 'Ngữ âm – Trọng âm', m: 2, a: false, t: 'Đuôi -ed đọc là /ɪd/ khi động từ kết thúc bằng âm /k/ hoặc /p/.', v: 'Kết thúc bằng âm vô thanh như /k/, /p/ thì đuôi -ed đọc là /t/.' },
{ cd: 'Ngữ âm – Trọng âm', m: 2, a: true,  t: 'Đuôi -s/-es đọc là /ɪz/ sau các âm s, x, z, ch, sh, ge, ce.', v: 'Sau âm vô thanh đọc /s/, còn lại đọc /z/.' },
{ cd: 'Ngữ âm – Trọng âm', m: 2, a: true,  t: 'Với từ hai âm tiết, danh từ và tính từ thường nhấn âm tiết thứ nhất, động từ thường nhấn âm tiết thứ hai.', v: 'Ví dụ: REcord (danh từ) và reCORD (động từ).' },
{ cd: 'Ngữ âm – Trọng âm', m: 2, a: true,  t: 'Các đuôi -ic, -tion, -sion, -ial, -ian kéo trọng âm về âm tiết ngay trước nó.', v: 'Ví dụ: ecoNOmic, inforMAtion, deCIsion.' },
{ cd: 'Ngữ âm – Trọng âm', m: 2, a: false, t: 'Đuôi -ic khiến trọng âm rơi vào chính âm tiết chứa đuôi đó.', v: 'Trọng âm rơi vào âm tiết NGAY TRƯỚC đuôi -ic.' },
{ cd: 'Ngữ âm – Trọng âm', m: 3, a: true,  t: 'Các đuôi -ment, -ness, -ful, -less, -er, -ly, -ing, -ed không làm thay đổi trọng âm của từ gốc.', v: 'Đó là các hậu tố trung tính về trọng âm.' },
{ cd: 'Ngữ âm – Trọng âm', m: 3, a: true,  t: 'Các đuôi -ity, -ify, -graphy, -logy thường khiến trọng âm rơi vào âm tiết thứ ba từ cuối đếm lên.', v: 'Ví dụ: aBIlity, phoTOgraphy, biOlogy.' },

/* ========== CẤU TRÚC – CHIẾN THUẬT ========== */
{ cd: 'Cấu trúc – Chiến thuật', m: 1, a: true,  t: 'Đề Tiếng Anh tốt nghiệp THPT gồm 40 câu trắc nghiệm làm trong 50 phút, mỗi câu 0,25 điểm.', v: 'Trung bình chỉ hơn một phút cho mỗi câu.' },
{ cd: 'Cấu trúc – Chiến thuật', m: 2, a: true,  t: 'Đề thi theo cấu trúc mới có các dạng bài điền vào thông báo/quảng cáo, sắp xếp câu, hoàn thành đoạn văn và đọc hiểu.', v: 'Giảm mạnh các câu ngữ pháp thuần tuý, tăng câu đặt trong ngữ cảnh.' },
{ cd: 'Cấu trúc – Chiến thuật', m: 3, a: true,  t: 'Trong dạng bài sắp xếp câu, câu mở đầu thường không chứa đại từ thay thế như "it", "this", "they".', v: 'Vì câu đầu phải tự đứng độc lập được, chưa thể tham chiếu tới thứ gì phía trước.' },
{ cd: 'Cấu trúc – Chiến thuật', m: 3, a: true,  t: 'Với câu hỏi dạng NOT mentioned hoặc EXCEPT, đáp án là phương án KHÔNG xuất hiện trong bài đọc.', v: 'Cách làm là tìm ba phương án có trong bài rồi loại.' },
{ cd: 'Cấu trúc – Chiến thuật', m: 3, a: false, t: 'Với câu hỏi dạng EXCEPT, ta chọn phương án đầu tiên tìm thấy trong bài đọc.', v: 'Ngược lại — phương án CÓ trong bài là loại; đáp án là phương án KHÔNG có.' },
{ cd: 'Cấu trúc – Chiến thuật', m: 3, a: true,  t: 'Thông tin trả lời các câu hỏi đọc hiểu thường xuất hiện theo đúng thứ tự các câu hỏi.', v: 'Nhờ vậy có thể quét bài theo trình tự thay vì đọc lại từ đầu.' },
{ cd: 'Cấu trúc – Chiến thuật', m: 3, a: true,  t: 'Nên đọc câu hỏi và gạch chân từ khoá trước khi đọc bài đọc hiểu.', v: 'Giúp định hướng và tiết kiệm thời gian đáng kể.' },
{ cd: 'Cấu trúc – Chiến thuật', m: 2, a: false, t: 'Trong bài đọc hiểu nên dịch kĩ từng câu để hiểu trọn vẹn bài đọc.', v: 'Không đủ thời gian. Chỉ đọc kĩ đoạn chứa từ khoá của câu hỏi.' },
{ cd: 'Cấu trúc – Chiến thuật', m: 2, a: true,  t: 'Không nên bỏ trống câu nào trong bài thi trắc nghiệm vì không bị trừ điểm khi trả lời sai.', v: 'Đoán ngẫu nhiên vẫn có xác suất 25%.' },
{ cd: 'Cấu trúc – Chiến thuật', m: 3, a: true,  t: 'Các phương án chứa từ tuyệt đối như always, never, all, only thường không phải đáp án đúng trong bài đọc hiểu.', v: 'Vì văn bản học thuật thường diễn đạt có mức độ.' },
{ cd: 'Cấu trúc – Chiến thuật', m: 3, a: true,  t: 'Từ nối chỉ trình tự như First, Then, After that, Finally là manh mối quan trọng để làm dạng bài sắp xếp.', v: 'Cùng với đại từ thay thế và các cặp hỏi – đáp trong hội thoại.' },

/* ========== CÁC ĐIỂM NGỮ PHÁP KHÁC ========== */
{ cd: 'Ngữ pháp khác', m: 2, a: true,  t: 'Sau các động từ enjoy, avoid, finish, mind, suggest, practise phải dùng V-ing.', v: 'Còn sau want, decide, hope, promise, agree thì dùng to V.' },
{ cd: 'Ngữ pháp khác', m: 2, a: false, t: 'Sau động từ "enjoy" ta dùng "to V".', v: 'Sau "enjoy" phải dùng V-ing: I enjoy reading books.' },
{ cd: 'Ngữ pháp khác', m: 2, a: true,  t: 'Sau giới từ luôn dùng danh từ hoặc V-ing, không dùng động từ nguyên thể.', v: 'Ví dụ: interested in learning, good at swimming.' },
{ cd: 'Ngữ pháp khác', m: 2, a: true,  t: 'Cấu trúc so sánh hơn với tính từ ngắn là "adj + -er + than", với tính từ dài là "more + adj + than".', v: 'So sánh nhất: the + adj-est hoặc the most + adj.' },
{ cd: 'Ngữ pháp khác', m: 2, a: true,  t: 'Cấu trúc so sánh kép "the + comparative, the + comparative" diễn tả càng… càng…', v: 'Ví dụ: The harder you study, the better your results will be.' },
{ cd: 'Ngữ pháp khác', m: 2, a: true,  t: 'Danh từ không đếm được đi với "much", "a little", còn danh từ đếm được số nhiều đi với "many", "a few".', v: '"a lot of" và "plenty of" dùng được cho cả hai loại.' },
{ cd: 'Ngữ pháp khác', m: 2, a: false, t: 'Ta dùng "many" với danh từ không đếm được như "information" hay "advice".', v: 'Phải dùng "much" hoặc "a lot of". "information" và "advice" là danh từ không đếm được.' },
{ cd: 'Ngữ pháp khác', m: 2, a: true,  t: 'Câu hỏi đuôi có mệnh đề chính khẳng định thì phần đuôi ở dạng phủ định và ngược lại.', v: "Ví dụ: You are a student, aren't you?" },
{ cd: 'Ngữ pháp khác', m: 2, a: true,  t: 'Các liên từ although, though, even though đi với một mệnh đề đầy đủ, còn despite và in spite of đi với danh từ hoặc V-ing.', v: 'Ví dụ: Although it rained / Despite the rain.' },
{ cd: 'Ngữ pháp khác', m: 2, a: false, t: 'Sau "despite" và "in spite of" ta dùng một mệnh đề đầy đủ có chủ ngữ và động từ.', v: 'Sau chúng phải dùng DANH TỪ hoặc V-ing. Mệnh đề đầy đủ đi sau although/though.' },
{ cd: 'Ngữ pháp khác', m: 3, a: true,  t: 'Đảo ngữ với các cụm phủ định như Never, Rarely, Hardly, No sooner đòi hỏi đảo trợ động từ lên trước chủ ngữ.', v: 'Ví dụ: Never have I seen such a beautiful place.' },
{ cd: 'Ngữ pháp khác', m: 2, a: true,  t: 'Mạo từ "a" dùng trước phụ âm, "an" dùng trước nguyên âm — xét theo ÂM chứ không theo chữ cái.', v: 'Ví dụ: an hour (h câm), a university (âm /juː/).' },
{ cd: 'Ngữ pháp khác', m: 2, a: false, t: 'Mạo từ "an" luôn được dùng trước các từ bắt đầu bằng chữ cái u.', v: 'Xét theo ÂM: "a university" vì bắt đầu bằng âm /juː/, nhưng "an umbrella" vì bắt đầu bằng /ʌ/.' },
{ cd: 'Ngữ pháp khác', m: 2, a: true,  t: 'Động từ khiếm khuyết như can, must, should luôn đi với động từ nguyên thể không "to".', v: 'Ngoại lệ: ought to, have to, be able to.' },
{ cd: 'Ngữ pháp khác', m: 3, a: true,  t: 'Cấu trúc "used to + V" diễn tả thói quen trong quá khứ, còn "be/get used to + V-ing" nghĩa là quen với việc gì.', v: 'Hai cấu trúc dễ nhầm nhất trong đề thi.' },
{ cd: 'Ngữ pháp khác', m: 3, a: false, t: 'Cấu trúc "be used to + V" nghĩa là đã từng làm gì trong quá khứ.', v: 'Nhầm hai cấu trúc: "used to + V" mới là thói quen quá khứ; "be used to + V-ing" là quen với việc gì.' }
];

TD.KHO_LT.anh.push(
{ cd: 'Thì động từ', m: 2, a: false, t: 'Thì hiện tại tiếp diễn dùng để diễn tả thói quen lặp đi lặp lại hằng ngày.', v: 'Đó là thì hiện tại ĐƠN. Hiện tại tiếp diễn diễn tả hành động đang xảy ra lúc nói.' },
{ cd: 'Thì động từ', m: 2, a: true,  t: 'Các động từ chỉ trạng thái như know, like, want, believe thường không dùng ở thì tiếp diễn.', v: 'Chúng diễn tả trạng thái chứ không phải hành động đang diễn ra.' },
{ cd: 'Thì động từ', m: 2, a: false, t: 'Câu "I am knowing the answer" là câu đúng ngữ pháp.', v: '"know" là động từ trạng thái, không dùng ở thì tiếp diễn. Phải là "I know the answer".' },
{ cd: 'Thì động từ', m: 2, a: true,  t: 'Thì tương lai hoàn thành "will have + V3" diễn tả hành động sẽ hoàn tất trước một mốc trong tương lai.', v: 'Thường đi với "by + mốc thời gian tương lai".' },
{ cd: 'Thì động từ', m: 2, a: true,  t: 'Thì hiện tại hoàn thành tiếp diễn nhấn mạnh tính liên tục và kéo dài của hành động từ quá khứ đến hiện tại.', v: 'Cấu trúc: have/has been + V-ing.' },
{ cd: 'Thì động từ', m: 2, a: false, t: 'Trong câu "By the time he arrived, the film had started", hành động "arrived" xảy ra trước "had started".', v: 'Ngược lại — "had started" (quá khứ hoàn thành) xảy ra TRƯỚC "arrived".' },

{ cd: 'Câu điều kiện', m: 3, a: true,  t: 'Câu điều kiện hỗn hợp có thể dùng "had + V3" ở mệnh đề If và "would + V" ở mệnh đề chính.', v: 'Diễn tả điều kiện trong quá khứ nhưng kết quả ở hiện tại.' },
{ cd: 'Câu điều kiện', m: 2, a: true,  t: 'Câu điều kiện loại 0 dùng thì hiện tại đơn ở cả hai mệnh đề, diễn tả chân lí hoặc thói quen.', v: 'Ví dụ: If you heat water to 100°C, it boils.' },
{ cd: 'Câu điều kiện', m: 2, a: false, t: 'Trong câu điều kiện loại 1, mệnh đề If dùng "will + V".', v: 'Mệnh đề If dùng thì HIỆN TẠI ĐƠN. "will" chỉ xuất hiện ở mệnh đề chính.' },
