<b>Ứng dụng:</b> BaSO₄ làm thuốc cản quang chụp X-quang dạ dày (không tan nên không độc).`,
  meo: 'Na – vàng, K – tím, Ba – lục: 3 màu bắt buộc thuộc. Bài thực hành nhận biết muối luôn có.' },

{ so: 80, moi: true, chu_de: 'Đại cương kim loại chuyển tiếp dãy thứ nhất', cap: 2,
  hoi: 'Đặc điểm chung của kim loại chuyển tiếp dãy 3d? Vì sao hợp chất của chúng có màu?',
  dap: `Dãy 3d: Sc, Ti, V, <b>Cr</b>, <b>Mn</b>, <b>Fe</b>, Co, Ni, <b>Cu</b>, Zn.<br>
<b>Đặc điểm:</b> ① nhiều số oxi hoá ② hợp chất thường <b>có màu</b> ③ nhiều chất có <b>tính thuận từ</b> ④ tạo được <b>phức chất</b> ⑤ nhiều chất làm <b>xúc tác</b> ⑥ khối lượng riêng lớn, t°<sub>nc</sub> cao, cứng.<br>
<b>Vì sao có màu:</b> orbital d bị <b>tách mức năng lượng</b> dưới ảnh hưởng của phối tử; electron d hấp thụ ánh sáng khả kiến để nhảy mức ⇒ hợp chất mang màu bù.<br>
Zn²⁺ (3d¹⁰ bão hoà) và Sc³⁺ (3d⁰) <b>không màu</b> — vì không còn khả năng chuyển mức d–d.`,
  meo: 'd⁰ hoặc d¹⁰ ⇒ KHÔNG màu. Đó là lý do dung dịch ZnSO₄, ScCl₃ trong suốt còn CuSO₄ thì xanh.' },

{ so: 81, moi: true, chu_de: 'Cân bằng trong dung dịch nước – pH', cap: 2,
  hoi: 'Công thức pH? Thuyết Brønsted–Lowry? Chuẩn độ acid – base?',
  dap: `<b>pH = −log[H⁺]</b>; [H⁺]·[OH⁻] = 10⁻¹⁴; <b>pH + pOH = 14</b>.<br>
pH &lt; 7 acid · pH = 7 trung tính · pH &gt; 7 base.<br>
<b>Brønsted–Lowry:</b> acid là chất <b>cho H⁺</b>, base là chất <b>nhận H⁺</b>. ⇒ HCO₃⁻, H₂O, HS⁻ là chất <b>lưỡng tính</b>.<br>
<b>Chuẩn độ:</b> tại điểm tương đương: <b>n<sub>H⁺</sub> = n<sub>OH⁻</sub></b> ⇒ C<sub>A</sub>·V<sub>A</sub>·a = C<sub>B</sub>·V<sub>B</sub>·b (a, b = số H⁺/OH⁻ mỗi phân tử).<br>
<b>Sự thuỷ phân muối:</b> muối của acid mạnh + base yếu (NH₄Cl, AlCl₃) → <b>pH &lt; 7</b>; acid yếu + base mạnh (CH₃COONa, Na₂CO₃) → <b>pH &gt; 7</b>; mạnh + mạnh (NaCl) → pH = 7.`,
  meo: 'Trộn acid mạnh + base mạnh: tính n(H⁺) − n(OH⁻) rồi chia cho tổng thể tích ⇒ ra [H⁺] hoặc [OH⁻] dư.' },

{ so: 82, cd: 'Phi kim – Vô cơ', moi: true, chu_de: 'Nitrogen – Sulfur (Hoá 11)', cap: 2,
  hoi: 'Vì sao N₂ trơ? Mưa acid hình thành thế nào? Sản xuất H₂SO₄ theo mấy giai đoạn?',
  dap: `N₂ trơ vì có <b>liên kết ba N≡N</b> rất bền (E<sub>b</sub> = 945 kJ/mol).<br>
<b>Chu trình mưa acid:</b> N₂ + O₂ <span class="ar">tia lửa điện/động cơ</span> 2NO → NO₂ → HNO₃; S + O₂ → SO₂ → SO₃ → H₂SO₄.<br>
<b>Sản xuất H₂SO₄ (3 giai đoạn):</b><br>
&nbsp;① S hoặc FeS₂ + O₂ → SO₂ &nbsp; ② 2SO₂ + O₂ <span class="ar">V₂O₅, 450°C</span> 2SO₃ &nbsp; ③ SO₃ + H₂O → H₂SO₄ (hấp thụ bằng H₂SO₄ đặc tạo oleum).<br>
<b>Sản xuất NH₃ (Haber–Bosch):</b> N₂ + 3H₂ ⇄ 2NH₃, Δ<sub>r</sub>H &lt; 0, xúc tác Fe, 400–450 °C, 150–200 bar.<br>
&nbsp;→ Vì toả nhiệt nên nhiệt độ thấp có lợi cho cân bằng, nhưng phải giữ 450 °C để tốc độ đủ nhanh — <b>bài toán đánh đổi kinh điển</b>.`,
  meo: 'Câu đúng/sai rất hay hỏi: "tăng nhiệt độ làm tăng hiệu suất tổng hợp NH₃" → SAI (toả nhiệt, tăng t° làm giảm hiệu suất).' },

{ so: 83, moi: true, chu_de: 'Xà phòng & chất giặt rửa tổng hợp', cap: 1,
  hoi: 'Phân biệt xà phòng và chất giặt rửa tổng hợp? Vì sao xà phòng mất tác dụng trong nước cứng?',
  dap: `<table class="kq"><tr><th></th><th>Xà phòng</th><th>Chất giặt rửa tổng hợp</th></tr>
<tr><td>Thành phần</td><td>muối Na/K của <b>acid béo</b> (C₁₅H₃₁COONa, C₁₇H₃₅COONa)</td><td>muối Na của <b>alkylbenzenesulfonic acid</b> (R–C₆H₄–SO₃Na)</td></tr>
<tr><td>Nguồn</td><td>từ chất béo (thuỷ phân trong kiềm)</td><td>tổng hợp từ dầu mỏ</td></tr>
<tr><td>Trong nước cứng</td><td><b>mất tác dụng</b> (tạo ↓ với Ca²⁺, Mg²⁺)</td><td><b>vẫn giặt tốt</b></td></tr>
<tr><td>Môi trường</td><td>dễ phân huỷ sinh học</td><td>khó phân huỷ → gây ô nhiễm</td></tr></table>
<b>Cơ chế giặt rửa:</b> phân tử có <b>đầu ưa nước</b> (–COO⁻, –SO₃⁻) và <b>đuôi kị nước</b> (gốc hydrocarbon dài) ⇒ đuôi bám vào vết bẩn dầu mỡ, đầu hướng ra nước, kéo vết bẩn đi.`,
  meo: '2C₁₇H₃₅COONa + Ca²⁺ → (C₁₇H₃₅COO)₂Ca↓ — đây là lý do xà phòng "chết" trong nước cứng.' },

TD.KHO.toan_ct.push(

  ct: '<b>Trung bình:</b> x̄ = Σn<sub>i</sub>c<sub>i</sub>/n với c<sub>i</sub> là giá trị đại diện (trung điểm nhóm).<br><b>Trung vị:</b> M<sub>e</sub> = a<sub>m</sub> + [(n/2 − C)/n<sub>m</sub>]·h<br><b>Tứ phân vị Q<sub>k</sub>:</b> thay n/2 bằng kn/4 trong công thức trên.<br><b>Mốt:</b> M<sub>o</sub> = a<sub>m</sub> + [(n<sub>m</sub>−n<sub>m−1</sub>)/((n<sub>m</sub>−n<sub>m−1</sub>)+(n<sub>m</sub>−n<sub>m+1</sub>))]·h<br>(a<sub>m</sub>: đầu mút trái nhóm chứa, h: độ dài nhóm, C: tần số tích luỹ trước nhóm đó.)',
  khi: 'Nội dung [MỚI] của CT 2018 — chắc chắn có trong đề.',
  vd: 'n = 40, nhóm chứa trung vị [20;30) có C = 15, n<sub>m</sub> = 10, h = 10 ⇒ M<sub>e</sub> = 20 + (20−15)/10·10 = <b>25</b>.',
  bay: 'Giá trị đại diện c<sub>i</sub> là TRUNG ĐIỂM của nhóm, không phải đầu mút trái.' },

{ nhom: 'V. Thống kê', ten: 'Phương sai, độ lệch chuẩn & ngoại lệ', cap: 3,
  ct: '<b>Phương sai:</b> s² = (1/n)Σn<sub>i</sub>(c<sub>i</sub> − x̄)² = (1/n)Σn<sub>i</sub>c<sub>i</sub>² − x̄²<br><b>Độ lệch chuẩn:</b> s = √(s²) — cùng đơn vị với số liệu.<br><b>Khoảng biến thiên:</b> R = max − min<br><b>Khoảng tứ phân vị:</b> Δ<sub>Q</sub> = Q₃ − Q₁ (ít bị ảnh hưởng bởi giá trị bất thường)<br><b>Ngoại lệ:</b> x &lt; Q₁ − 1,5Δ<sub>Q</sub> hoặc x &gt; Q₃ + 1,5Δ<sub>Q</sub>.',
  khi: 'So sánh độ phân tán hai mẫu, phát hiện giá trị bất thường.',
  vd: 'Q₁ = 4, Q₃ = 10 ⇒ Δ<sub>Q</sub> = 6; ngưỡng ngoại lệ: dưới 4 − 9 = −5 hoặc trên 10 + 9 = 19.',
  bay: 'Độ lệch chuẩn nhỏ hơn = số liệu đồng đều hơn. Đừng so phương sai của hai mẫu khác đơn vị.' },

{ nhom: 'V. Xác suất', ten: 'Quy tắc đếm – Hoán vị – Chỉnh hợp – Tổ hợp', cap: 1,
  ct: '<b>Quy tắc cộng</b> (hoặc): n₁ + n₂. <b>Quy tắc nhân</b> (và, liên tiếp): n₁·n₂.<br>Hoán vị: P<sub>n</sub> = n! &nbsp;·&nbsp; Chỉnh hợp: A<sup>k</sup><sub>n</sub> = n!/(n−k)! &nbsp;·&nbsp; Tổ hợp: C<sup>k</sup><sub>n</sub> = n!/[k!(n−k)!]<br><b>Có thứ tự dùng A, không thứ tự dùng C.</b><br>C<sup>k</sup><sub>n</sub> = C<sup>n−k</sup><sub>n</sub> &nbsp;·&nbsp; C<sup>k</sup><sub>n</sub> + C<sup>k+1</sup><sub>n</sub> = C<sup>k+1</sup><sub>n+1</sub>.',
  khi: 'Mọi bài đếm và xác suất cổ điển.',
  vd: 'Chọn 3 trong 10 người vào một tổ (không phân vai): C³₁₀ = <b>120</b>. Nếu chọn tổ trưởng, tổ phó, thư kí: A³₁₀ = <b>720</b>.',
  bay: 'Câu hỏi có phân biệt vai trò/vị trí ⇒ dùng A. Chỉ lấy ra một nhóm ⇒ dùng C.' },

{ nhom: 'V. Xác suất', ten: 'Nhị thức Newton', cap: 2,
  ct: '(a + b)ⁿ = Σ<sub>k=0</sub><sup>n</sup> C<sup>k</sup><sub>n</sub>·a<sup>n−k</sup>·b<sup>k</sup><br>Số hạng tổng quát: <b>T<sub>k+1</sub> = C<sup>k</sup><sub>n</sub>·a<sup>n−k</sup>·b<sup>k</sup></b> (có n+1 số hạng).<br>Tổng hệ số = giá trị biểu thức khi a = b = 1. Σ C<sup>k</sup><sub>n</sub> = 2ⁿ.',
  khi: 'Tìm hệ số của xᵐ, tìm số hạng không chứa x.',
  vd: '(x + 2/x)⁶: T<sub>k+1</sub> = C<sup>k</sup>₆·x^(6−k)·(2/x)^k = C<sup>k</sup>₆·2^k·x^(6−2k). Không chứa x ⇒ k = 3 ⇒ C³₆·8 = <b>160</b>.',
  bay: 'Số hạng thứ k+1 ứng với chỉ số k. Hỏi "số hạng thứ 4" nghĩa là k = 3.' },

{ nhom: 'V. Xác suất', ten: 'Xác suất có điều kiện & công thức Bayes', cap: 3,
  ct: '<b>P(A|B) = P(A∩B)/P(B)</b> (với P(B) &gt; 0)<br><b>Nhân xác suất:</b> P(A∩B) = P(B)·P(A|B)<br>Độc lập ⇔ P(A∩B) = P(A)·P(B) ⇔ P(A|B) = P(A).<br><b>Xác suất toàn phần:</b> P(B) = P(A)P(B|A) + P(Ā)P(B|Ā)<br><b>Bayes:</b> P(A|B) = P(A)·P(B|A) / P(B)',
  khi: 'Nội dung [MỚI] của CT 2018 — dạng sơ đồ hình cây, bài toán chẩn đoán.',
  vd: 'Hộp 1 (60 %) có 20 % phế phẩm; hộp 2 (40 %) có 5 %. P(phế) = 0,6·0,2 + 0,4·0,05 = <b>0,14</b>. Nếu lấy được phế phẩm, xác suất từ hộp 1 là 0,12/0,14 ≈ <b>0,857</b>.',
  bay: 'Vẽ sơ đồ hình cây trước: nhánh 1 là nguyên nhân, nhánh 2 là kết quả. Bayes chính là đi ngược cây.' },

{ nhom: 'VI. Hình không gian', ten: 'Góc trong không gian', cap: 2,
  ct: '<b>Góc đường thẳng & mặt phẳng:</b> góc giữa đường thẳng và hình chiếu của nó lên mặt phẳng (0° ≤ φ ≤ 90°).<br><b>Góc hai mặt phẳng:</b> dựng trong mặt phẳng vuông góc với giao tuyến, đo góc giữa hai đường cùng ⊥ giao tuyến.<br><b>Góc hai đường chéo nhau:</b> dời song song về cùng một điểm.<br>Mẹo toạ độ hoá: gắn hệ trục vào đỉnh có 3 cạnh đôi một vuông góc rồi dùng công thức Oxyz.',
  khi: 'Bài hình không gian tổng hợp, thường mức vận dụng.',
  vd: 'Chóp S.ABCD, SA ⊥ (ABCD): góc giữa SC và (ABCD) là góc SCA, tan = SA/AC.',
  bay: 'Xác định hình chiếu sai là mất trọn câu. Với SA ⊥ đáy thì hình chiếu của S luôn là A.' },

{ nhom: 'VI. Hình không gian', ten: 'Khoảng cách — kĩ thuật thể tích', cap: 3,
  ct: '<b>d(A, (P)) = 3V / S<sub>(P)</sub></b> — cách nhanh nhất khi biết thể tích khối chóp.<br>Nếu AB ∥ (P) thì d(A,(P)) = d(B,(P)).<br>Nếu AB cắt (P) tại I thì d(A,(P))/d(B,(P)) = IA/IB.<br><b>Khoảng cách hai đường chéo nhau:</b> dựng đoạn vuông góc chung, hoặc d(a,b) = d(a, (P)) với (P) chứa b và ∥ a.',
  khi: 'Dạng khó nhất của hình không gian — luôn thử hướng thể tích trước.',
  vd: 'V = 6, S<sub>BCD</sub> = 9 ⇒ d(A, (BCD)) = 3·6/9 = <b>2</b>.',
  bay: 'Đổi đỉnh để tính V cho dễ: V<sub>A.BCD</sub> = V<sub>D.ABC</sub>. Chọn mặt đáy nào tính diện tích dễ nhất.' },

{ nhom: 'VI. Hình không gian', ten: 'Nón – Trụ – Cầu: diện tích & thể tích', cap: 1,
  ct: '<b>Nón:</b> S<sub>xq</sub> = πrl, S<sub>tp</sub> = πrl + πr², V = (1/3)πr²h, l² = r² + h²<br><b>Trụ:</b> S<sub>xq</sub> = 2πrh, S<sub>tp</sub> = 2πrh + 2πr², V = πr²h<br><b>Cầu:</b> S = 4πR², V = (4/3)πR³<br>Nón cụt: V = (πh/3)(R² + Rr + r²).',
  khi: 'Câu nhận biết – thông hiểu về khối tròn xoay.',
  vd: 'Nón r = 3, h = 4 ⇒ l = 5, S<sub>xq</sub> = 15π, V = <b>12π</b>.',
  bay: 'S<sub>xq</sub> nón dùng đường sinh l, còn V dùng chiều cao h. Lẫn l với h là bẫy số một.' },

{ nhom: 'VII. Dãy số', ten: 'Giới hạn & tính liên tục', cap: 2,
  ct: 'lim (uⁿ) = 0 khi |u| &lt; 1. lim (1/nᵏ) = 0 với k &gt; 0.<br>Giới hạn phân thức khi x → ∞: chia cho luỹ thừa bậc cao nhất; so bậc tử với bậc mẫu.<br>Dạng 0/0: phân tích nhân tử hoặc nhân liên hợp.<br><b>Liên tục tại x₀ ⇔ lim<sub>x→x₀</sub>f(x) = f(x₀)</b> (tồn tại và bằng giá trị hàm).<br>f liên tục trên [a;b] và f(a)·f(b) &lt; 0 ⇒ phương trình f(x) = 0 có nghiệm trong (a;b).',
  khi: 'Câu về giới hạn, tìm m để hàm liên tục, chứng minh có nghiệm.',
  vd: 'lim<sub>x→2</sub>(x²−4)/(x−2) = lim (x+2) = <b>4</b>.',
  bay: 'Hàm cho theo nhiều công thức: phải kiểm tra giới hạn TRÁI và PHẢI tại điểm nối, cả hai phải bằng f(x₀).' },

{ nhom: 'VIII. Lượng giác', ten: 'Công thức lượng giác trọng tâm', cap: 2,
  ct: 'sin²x + cos²x = 1 &nbsp;·&nbsp; 1 + tan²x = 1/cos²x<br><b>Cộng:</b> sin(a±b) = sin a cos b ± cos a sin b; cos(a±b) = cos a cos b ∓ sin a sin b<br><b>Nhân đôi:</b> sin2a = 2sin a cos a; cos2a = cos²a − sin²a = 2cos²a − 1 = 1 − 2sin²a<br><b>Hạ bậc:</b> sin²a = (1−cos2a)/2; cos²a = (1+cos2a)/2<br><b>Biến đổi tích ⇄ tổng</b> khi cần gộp hai hàm cùng loại.',
  khi: 'Rút gọn biểu thức, giải phương trình lượng giác, tính tích phân lượng giác.',
  vd: '∫sin²x dx = ∫(1−cos2x)/2 dx = x/2 − sin2x/4 + C.',
  bay: 'Nhớ dấu ∓ trong công thức cos(a+b) = cos a cos b − sin a sin b — ngược dấu so với sin.' },

{ nhom: 'VIII. Lượng giác', ten: 'Phương trình lượng giác cơ bản', cap: 2,
  ct: 'sin x = sin α ⇔ x = α + k2π hoặc x = π − α + k2π<br>cos x = cos α ⇔ x = ±α + k2π<br>tan x = tan α ⇔ x = α + kπ<br><b>Đặc biệt:</b> sin x = 0 ⇔ x = kπ; cos x = 0 ⇔ x = π/2 + kπ; sin x = 1 ⇔ x = π/2 + k2π.<br>a·sin x + b·cos x = c có nghiệm ⇔ a² + b² ≥ c².',
  khi: 'Giải phương trình lượng giác, đếm nghiệm trên một khoảng.',
  vd: '2sin x − 1 = 0 ⇒ sin x = 1/2 ⇒ x = π/6 + k2π hoặc x = 5π/6 + k2π.',
  bay: 'Đếm nghiệm trên khoảng cho trước: thay k = 0, ±1, ±2… rồi lọc, đừng đoán.' },

{ nhom: 'IX. Vecto & hệ thức lượng', ten: 'Hệ thức lượng trong tam giác', cap: 2,
  ct: '<b>Định lí cosin:</b> a² = b² + c² − 2bc·cos A<br><b>Định lí sin:</b> a/sin A = b/sin B = c/sin C = 2R<br><b>Diện tích:</b> S = ½ab·sin C = abc/(4R) = pr = √[p(p−a)(p−b)(p−c)]<br>Trung tuyến: m<sub>a</sub>² = (2b² + 2c² − a²)/4.',
  khi: 'Bài toán thực tế đo đạc khoảng cách, chiều cao — dạng ưa thích của CT 2018.',
  vd: 'b = 5, c = 8, A = 60° ⇒ a² = 25 + 64 − 2·5·8·0,5 = 49 ⇒ <b>a = 7</b>.',
  bay: 'Định lí cosin dùng khi biết 2 cạnh + góc XEN GIỮA hoặc biết 3 cạnh. Biết góc đối diện thì dùng định lí sin.' },

{ nhom: 'IX. Vecto & hệ thức lượng', ten: 'Vecto trong không gian & phân tích vecto', cap: 2,
  ct: 'Quy tắc ba điểm: AB→ + BC→ = AC→. Quy tắc hình bình hành: AB→ + AD→ = AC→.<br>Quy tắc hình hộp: AB→ + AD→ + AA′→ = AC′→.<br><b>Trung điểm:</b> MA→ + MB→ = 2MI→. <b>Trọng tâm:</b> GA→ + GB→ + GC→ = 0→.<br>Ba vecto đồng phẳng ⇔ tồn tại m, n để c→ = m·a→ + n·b→.',
  khi: 'Chứng minh vuông góc, tính góc, toạ độ hoá bài hình không gian.',
  vd: 'G là trọng tâm ABC ⇒ với mọi M: MA→ + MB→ + MC→ = 3MG→.',
  bay: 'AB→ = −BA→. Sai chiều vecto làm sai toàn bộ dấu của phép tính về sau.' }
);

<script>
/* ============================================================
   VẬT LÍ — BÍ KÍP CÔNG THỨC (Lôi Đình Điện)

window.TD = window.TD || {}; TD.KHO = TD.KHO || {};

TD.KHO.ly_ct = [
/* ================= CHƯƠNG I: VẬT LÍ NHIỆT ================= */
{ nhom: 'I. Vật lí nhiệt', ten: 'Thang nhiệt độ & nội năng', cap: 1,
  ct: '<b>T(K) = t(°C) + 273</b> &nbsp;·&nbsp; ΔT(K) = Δt(°C)<br>t(°F) = 1,8·t(°C) + 32<br><b>Nội năng U</b> = tổng động năng chuyển động nhiệt + thế năng tương tác của các phân tử.<br>Nội năng phụ thuộc <b>nhiệt độ và thể tích</b>.',
  khi: 'Câu lý thuyết mở đầu, đổi đơn vị.',
  vd: '27 °C = 300 K. Tăng 20 °C cũng chính là tăng 20 K.',
  bay: 'Độ chênh lệch nhiệt độ trong thang K và °C là BẰNG NHAU — nhưng giá trị tuyệt đối thì khác 273.' },

{ nhom: 'I. Vật lí nhiệt', ten: 'Nhiệt lượng & phương trình cân bằng nhiệt', cap: 2,
  ct: '<b>Q = m·c·Δt</b> &nbsp;(c: nhiệt dung riêng, J/kg·K)<br><b>Cân bằng nhiệt: Q<sub>toả</sub> = Q<sub>thu</sub></b><br>Nhiệt dung: C = m·c (J/K)<br>c<sub>nước</sub> = <b>4200</b> J/kg·K · c<sub>nhôm</sub> = 880 · c<sub>đồng</sub> = 380 · c<sub>sắt</sub> = 460',
  khi: 'Bài trộn các chất ở nhiệt độ khác nhau, đun nóng.',
  vd: 'Thả 0,5 kg đồng ở 100 °C vào 2 kg nước ở 20 °C: 0,5·380·(100−t) = 2·4200·(t−20) ⇒ t ≈ <b>21,1 °C</b>.',
  bay: 'Nếu có chuyển thể (đá tan, nước sôi) thì phải cộng thêm Q = λm hoặc Q = Lm.' },

{ nhom: 'I. Vật lí nhiệt', ten: 'Nhiệt nóng chảy & nhiệt hoá hơi riêng', cap: 2,
  ct: '<b>Q = λ·m</b> &nbsp;(nóng chảy / đông đặc; λ: nhiệt nóng chảy riêng, J/kg)<br><b>Q = L·m</b> &nbsp;(hoá hơi / ngưng tụ; L: nhiệt hoá hơi riêng, J/kg)<br>λ<sub>nước đá</sub> = <b>3,34·10⁵</b> J/kg &nbsp;·&nbsp; L<sub>nước</sub> = <b>2,26·10⁶</b> J/kg',
  khi: 'Bài có đá tan, nước sôi bay hơi — nhiệt độ KHÔNG đổi trong quá trình chuyển thể.',
  vd: 'Làm tan hoàn toàn 0,2 kg nước đá ở 0 °C cần Q = 3,34·10⁵ · 0,2 = <b>66,8 kJ</b>.',
  bay: 'Trong lúc chuyển thể, nhiệt độ đứng yên ⇒ KHÔNG dùng công thức mcΔt cho giai đoạn đó.' },

{ nhom: 'I. Vật lí nhiệt', ten: 'Định luật I nhiệt động lực học', cap: 3,
  ct: '<b>ΔU = A + Q</b><br>Q &gt; 0: hệ <b>nhận</b> nhiệt · Q &lt; 0: hệ <b>toả</b> nhiệt<br>A &gt; 0: hệ <b>nhận</b> công (bị nén) · A &lt; 0: hệ <b>sinh</b> công (giãn nở)<br>Công khí thực hiện khi giãn đẳng áp: A = −p·ΔV',
  khi: 'Mọi bài về quá trình biến đổi trạng thái khí.',
  vd: 'Khí nhận 200 J nhiệt và sinh công 80 J: ΔU = −80 + 200 = <b>+120 J</b> (nội năng tăng).',
  bay: 'Quy ước dấu là chỗ mất điểm nhiều nhất. Quá trình <b>đẳng nhiệt</b>: ΔU = 0 ⇒ Q = −A. Quá trình <b>đoạn nhiệt</b>: Q = 0 ⇒ ΔU = A. Quá trình <b>đẳng tích</b>: A = 0 ⇒ ΔU = Q.' },

/* ================= CHƯƠNG II: KHÍ LÍ TƯỞNG ================= */
{ nhom: 'II. Khí lí tưởng', ten: 'Ba định luật chất khí', cap: 2,
  ct: '<b>Boyle (đẳng nhiệt, T = const):</b> p·V = const ⇒ p₁V₁ = p₂V₂<br><b>Charles (đẳng tích, V = const):</b> p/T = const ⇒ p₁/T₁ = p₂/T₂<br><b>Gay-Lussac (đẳng áp, p = const):</b> V/T = const ⇒ V₁/T₁ = V₂/T₂',
  khi: 'Khi một trong ba đại lượng p, V, T được giữ không đổi.',
  vd: 'Nén khí từ 2 L xuống 0,5 L ở nhiệt độ không đổi, áp suất tăng <b>4 lần</b>.',
  bay: 'T phải dùng đơn vị <b>Kelvin</b>, không được dùng °C. Đây là lỗi sai phổ biến nhất chương này.' },

{ nhom: 'II. Khí lí tưởng', ten: 'Phương trình trạng thái & Clapeyron–Mendeleev', cap: 3,
  ct: '<b>p₁V₁/T₁ = p₂V₂/T₂</b> &nbsp;(cùng một lượng khí)<br><b>pV = nRT</b> &nbsp;với n = m/M<br>R = <b>8,31</b> J/(mol·K) &nbsp;[p: Pa, V: m³, T: K]<br>Khối lượng riêng: ρ = m/V = pM/(RT)',
  khi: 'Bài đổi cả 3 thông số, hoặc bài cho khối lượng/số mol khí.',

{ nhom: 'II. Di truyền NST', ten: 'Liên kết gene & hoán vị gene', cap: 4,

{ nhom: 'II. Di truyền NST', ten: 'Di truyền liên kết giới tính', cap: 3,

/* ============ III. DI TRUYỀN QUẦN THỂ ============ */

{ nhom: 'III. Di truyền quần thể', ten: 'Định luật Hardy – Weinberg', cap: 3,

{ nhom: 'II. Di truyền NST', ten: 'Di truyền phả hệ & xác suất', cap: 3,
  ct: 'Bố mẹ bình thường sinh con bệnh ⇒ bệnh do gene <b>LẶN</b>, bố mẹ đều dị hợp.<br>Bệnh xuất hiện ở mọi thế hệ, bố bệnh truyền cho tất cả con gái ⇒ gene trội trên X.<br>Bệnh chủ yếu ở nam, mẹ mang gene ⇒ gene lặn trên X.<br>Bệnh chỉ truyền theo dòng mẹ ⇒ gene ngoài nhân (ti thể).<br>Xác suất tổng hợp = tích xác suất các sự kiện độc lập.',
  khi: 'Bài phả hệ — luôn có trong đề, thường ở phần trả lời ngắn.',
  vd: 'Bố mẹ Aa × Aa, con bình thường ⇒ xác suất con đó là Aa = <b>2/3</b> (đã loại aa).',
  bay: 'Khi đề nói "người bình thường" thì phải LOẠI kiểu gene bệnh rồi mới tính xác suất — mẫu số đổi từ 4 thành 3.' },

{ nhom: 'III. Di truyền quần thể', ten: 'Quần thể tự thụ phấn', cap: 2,
  ct: 'Sau n thế hệ tự thụ, từ 100 % Aa:<br><b>Aa = (1/2)ⁿ</b> &nbsp;·&nbsp; <b>AA = aa = [1 − (1/2)ⁿ]/2</b><br>Tần số allele KHÔNG đổi; chỉ có tỉ lệ kiểu gene thay đổi theo hướng tăng đồng hợp, giảm dị hợp.<br>Quần thể ban đầu có xAA : yAa : zaa thì áp dụng công thức trên cho phần y.',
  khi: 'Bài tự thụ phấn, giao phối gần.',
  vd: 'Aa tự thụ 3 thế hệ ⇒ Aa = 1/8 = <b>12,5 %</b>, AA = aa = 43,75 %.',
  bay: 'Tự thụ phấn KHÔNG làm đổi tần số allele — chỉ đổi cấu trúc kiểu gene. Nhiều bạn nhầm chỗ này.' },

{ nhom: 'III. Di truyền quần thể', ten: 'Hardy – Weinberg cho gene trên X', cap: 3,
  ct: 'Giới XY: tần số kiểu hình = tần số allele (X^A Y và X^a Y ⇒ p và q).<br>Giới XX: p² X^A X^A + 2pq X^A X^a + q² X^a X^a.<br>Tần số allele chung của quần thể: p = (2·p<sub>XX</sub> + p<sub>XY</sub>)/3 khi tỉ lệ giới 1 : 1.<br>Vì vậy bệnh lặn trên X biểu hiện ở nam nhiều hơn nữ rất nhiều khi q nhỏ.',
  khi: 'Bài quần thể có gene trên NST giới tính.',
  vd: 'q = 0,1 ⇒ nam bệnh 10 %, nữ bệnh chỉ q² = <b>1 %</b>.',
  bay: 'Đừng áp p² + 2pq + q² cho giới XY — giới đó chỉ có một allele nên tần số kiểu hình bằng luôn tần số allele.' },

{ nhom: 'V. Sinh thái', ten: 'Tăng trưởng & kích thước quần thể', cap: 2,
  ct: '<b>N<sub>t</sub> = N₀ + B − D + I − E</b> (sinh − tử + nhập cư − xuất cư)<br>Tăng trưởng theo tiềm năng sinh học (đường cong J): dN/dt = rN<br>Tăng trưởng thực tế (đường cong S): dN/dt = rN(K − N)/K, K là sức chứa môi trường.<br>Mật độ = số cá thể / đơn vị diện tích (hoặc thể tích).',
  khi: 'Bài về biến động số lượng cá thể, khai thác hợp lí.',
  vd: 'Khai thác hợp lí nên giữ quần thể ở khoảng <b>N = K/2</b> — nơi tốc độ tăng trưởng lớn nhất.',
  bay: 'Đường cong J chỉ xảy ra khi nguồn sống dồi dào vô hạn — thực tế hầu như luôn là đường cong S.' },

{ nhom: 'V. Sinh thái', ten: 'Hiệu suất sinh thái & tháp sinh thái', cap: 2,
  ct: '<b>Hiệu suất sinh thái</b> = (năng lượng bậc sau / năng lượng bậc trước) × 100 %, trung bình chỉ khoảng <b>10 %</b>.<br>Vì vậy chuỗi thức ăn thường chỉ 4–5 mắt xích.<br>Tháp năng lượng LUÔN có đáy rộng đỉnh hẹp; tháp số lượng và tháp sinh khối có thể bị lộn ngược.<br>Năng lượng đi qua chuỗi theo một chiều, không tuần hoàn; vật chất thì tuần hoàn.',
  khi: 'Bài tính năng lượng qua các bậc dinh dưỡng.',
  vd: 'Sinh vật sản xuất có 10⁶ kcal, hiệu suất 10 % mỗi bậc ⇒ bậc 3 còn <b>10⁴ kcal</b>.',
  bay: 'Chỉ tháp NĂNG LƯỢNG là không bao giờ lộn ngược. Hai loại tháp kia thì có thể.' },

{ nhom: 'V. Sinh thái', ten: 'Chuỗi & lưới thức ăn', cap: 1,
  ct: 'Chuỗi thức ăn khởi đầu bằng sinh vật SẢN XUẤT hoặc bằng mùn bã hữu cơ.<br>Bậc dinh dưỡng cấp 1 = sinh vật sản xuất; cấp 2 = sinh vật tiêu thụ bậc 1…<br>Một loài có thể tham gia nhiều chuỗi ⇒ tạo LƯỚI thức ăn.<br>Lưới càng phức tạp thì hệ sinh thái càng ổn định.',
  khi: 'Câu nhận biết – thông hiểu về hệ sinh thái.',
  vd: 'Cỏ → châu chấu → ếch → rắn: rắn là sinh vật tiêu thụ bậc 3, bậc dinh dưỡng cấp <b>4</b>.',
  bay: 'Bậc dinh dưỡng luôn lớn hơn bậc tiêu thụ đúng 1 đơn vị. Đừng lẫn hai cách đếm.' },

{ nhom: 'VI. Sinh 10–11', ten: 'Tuần hoàn & cân bằng nội môi', cap: 2,
  ct: '<b>Huyết áp</b> giảm dần từ động mạch chủ → mao mạch → tĩnh mạch.<br><b>Vận tốc máu</b> nhỏ nhất ở mao mạch (tổng tiết diện lớn nhất) ⇒ thuận lợi trao đổi chất.<br>Chu kì tim người ≈ 0,8 s (nhĩ co 0,1 · thất co 0,3 · dãn chung 0,4). Nhịp tim = 60/chu kì.<br>Cân bằng nội môi do gan, thận và hệ nội tiết điều hoà; insulin hạ đường huyết, glucagon tăng đường huyết.',
  khi: 'Câu vận dụng về sinh lí người và động vật.',
  vd: 'Chu kì tim 0,8 s ⇒ nhịp tim = 60/0,8 = <b>75 lần/phút</b>.',
  bay: 'Vận tốc máu tỉ lệ NGHỊCH với tổng tiết diện mạch, không phải với tiết diện một mạch riêng lẻ.' },

{ nhom: 'VI. Sinh 10–11', ten: 'Trao đổi nước & dinh dưỡng khoáng ở thực vật', cap: 2,
  ct: 'Nước đi vào rễ theo cơ chế thẩm thấu, vận chuyển trong mạch gỗ nhờ: áp suất rễ + lực hút do thoát hơi nước + lực liên kết giữa các phân tử nước.<br><b>Thoát hơi nước</b> chủ yếu qua khí khổng, là "tai hoạ tất yếu" — vừa mất nước vừa tạo động lực hút.<br>Nguyên tố đa lượng: N, P, K, S, Ca, Mg. Thiếu N ⇒ lá vàng; thiếu Mg ⇒ vàng giữa gân lá.',
  khi: 'Câu về sinh lí thực vật, ứng dụng trong trồng trọt.',
  vd: 'Cây héo vào trưa nắng do tốc độ thoát hơi nước lớn hơn tốc độ hút nước của rễ.',
  bay: 'Khí khổng ĐÓNG khi cây thiếu nước, kéo theo giảm quang hợp — đó là lí do hạn làm giảm năng suất.' }

{ nhom: 'A. Thế giới', ten: 'Liên hợp quốc', cap: 1,
  ct: '<b>Thành lập:</b> 24/10/1945, Hiến chương thông qua tại Hội nghị San Francisco (6/1945).<br><b>Mục tiêu:</b> ① duy trì hoà bình và an ninh quốc tế ② phát triển quan hệ hữu nghị giữa các dân tộc ③ hợp tác quốc tế giải quyết vấn đề kinh tế – xã hội – văn hoá – nhân đạo.<br><b>Nguyên tắc (5):</b> bình đẳng chủ quyền · tôn trọng toàn vẹn lãnh thổ và độc lập chính trị · không can thiệp nội bộ · giải quyết tranh chấp bằng <b>biện pháp hoà bình</b> · <b>nhất trí giữa 5 nước Uỷ viên thường trực</b> HĐBA (Anh, Pháp, Mỹ, Nga, Trung Quốc).<br><b>6 cơ quan chính:</b> Đại hội đồng, <b>Hội đồng Bảo an</b>, Hội đồng Kinh tế – Xã hội, Hội đồng Quản thác, Toà án Quốc tế, Ban Thư kí.<br><b>Việt Nam gia nhập: 20/9/1977</b> (thành viên thứ 149); Uỷ viên không thường trực HĐBA nhiệm kì 2008–2009 và 2020–2021.',

{ nhom: 'A. Thế giới', ten: 'Trật tự thế giới & Chiến tranh lạnh', cap: 2,

{ nhom: 'A. Thế giới', ten: 'ASEAN', cap: 2,
  ct: '<b>Thành lập: 8/8/1967 tại Bangkok (Thái Lan)</b> — 5 nước sáng lập: <b>Indonesia, Malaysia, Philippines, Singapore, Thái Lan</b>.<br><b>Mở rộng:</b> Brunei (1984) → <b>Việt Nam (28/7/1995)</b> → Lào, Myanmar (1997) → Campuchia (1999) → <b>10 thành viên</b>. Timor Leste đang trong tiến trình gia nhập.<br><b>Hiệp ước Bali (2/1976)</b> — Hiệp ước Thân thiện và Hợp tác (TAC) đánh dấu bước phát triển mới.<br><b>Cộng đồng ASEAN thành lập 31/12/2015</b> gồm 3 trụ cột: Chính trị – An ninh (APSC), <b>Kinh tế (AEC)</b>, Văn hoá – Xã hội (ASCC).<br><b>Nguyên tắc:</b> đồng thuận, không can thiệp công việc nội bộ.',

{ nhom: 'B. Việt Nam', ten: 'Cách mạng tháng Tám 1945', cap: 3,
  ct: '<b>Thời cơ "ngàn năm có một":</b> Nhật đầu hàng Đồng minh (15/8/1945) — quân Nhật ở Đông Dương rệu rã, quân Đồng minh chưa vào.<br><b>Diễn biến:</b> Hội nghị toàn quốc của Đảng (13–15/8/1945 tại Tân Trào) quyết định Tổng khởi nghĩa → Đại hội Quốc dân Tân Trào (16–17/8) → khởi nghĩa thắng lợi ở <b>Hà Nội 19/8</b>, <b>Huế 23/8</b>, <b>Sài Gòn 25/8</b> → <b>2/9/1945</b> Hồ Chí Minh đọc Tuyên ngôn Độc lập tại Quảng trường Ba Đình.<br><b>Ý nghĩa:</b> phá tan xiềng xích Pháp – Nhật, lật đổ chế độ phong kiến, lập <b>nước Việt Nam Dân chủ Cộng hoà</b> — nhà nước dân chủ nhân dân đầu tiên ở Đông Nam Á.<br><b>Bài học:</b> nắm bắt <b>thời cơ</b>; kết hợp đấu tranh chính trị với vũ trang; xây dựng khối đại đoàn kết dân tộc (Mặt trận Việt Minh).',
  khi: 'Chủ đề trọng tâm nhất của lịch sử Việt Nam.',
  vd: 'Nguyên nhân quyết định thắng lợi: <b>sự lãnh đạo đúng đắn của Đảng</b> và quá trình chuẩn bị suốt 15 năm (1930–1945).',
  bay: 'Thời cơ chỉ là điều kiện <b>khách quan</b>; nhân tố quyết định vẫn là sự chuẩn bị chủ quan của Đảng và nhân dân.' },

{ nhom: 'B. Việt Nam', ten: 'Kháng chiến chống Pháp (1945–1954)', cap: 3,
  ct: '<b>19/12/1946:</b> Toàn quốc kháng chiến — "Lời kêu gọi toàn quốc kháng chiến" của Hồ Chí Minh.<br><b>Đường lối:</b> toàn dân, toàn diện, trường kì, tự lực cánh sinh.<br><b>Chiến dịch Việt Bắc thu – đông 1947:</b> làm phá sản kế hoạch "đánh nhanh thắng nhanh".<br><b>Chiến dịch Biên giới thu – đông 1950:</b> ta <b>giành thế chủ động</b> trên chiến trường chính Bắc Bộ, khai thông biên giới Việt – Trung.<br><b>Chiến dịch Điện Biên Phủ (13/3 – 7/5/1954):</b> "lừng lẫy năm châu, chấn động địa cầu" — đập tan kế hoạch Nava, buộc Pháp kí Hiệp định Genève.<br><b>Hiệp định Genève (21/7/1954):</b> các nước công nhận độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ 3 nước Đông Dương; lấy <b>vĩ tuyến 17</b> làm giới tuyến quân sự tạm thời.',
  khi: 'Mốc sự kiện phải thuộc.',

  bay: '1950 mới là mốc "giành thế chủ động", còn 1947 chỉ là "phá sản kế hoạch đánh nhanh thắng nhanh".' },

{ nhom: 'B. Việt Nam', ten: 'Kháng chiến chống Mỹ (1954–1975)', cap: 3,
  ct: '<b>Các chiến lược của Mỹ:</b> "Chiến tranh đơn phương" (1954–1960) → <b>"Chiến tranh đặc biệt"</b> (1961–1965, quân đội Sài Gòn + cố vấn Mỹ) → <b>"Chiến tranh cục bộ"</b> (1965–1968, quân Mỹ trực tiếp tham chiến) → <b>"Việt Nam hoá chiến tranh"</b> (1969–1973).<br><b>Phong trào Đồng khởi (1959–1960):</b> đưa cách mạng miền Nam từ thế giữ gìn lực lượng sang <b>thế tiến công</b>; dẫn tới thành lập <b>Mặt trận Dân tộc Giải phóng miền Nam Việt Nam (20/12/1960)</b>.<br><b>Tổng tiến công Tết Mậu Thân 1968:</b> buộc Mỹ "phi Mỹ hoá" chiến tranh, chấp nhận đàm phán ở Paris.<br><b>"Điện Biên Phủ trên không" (12/1972):</b> đánh bại tập kích B52, buộc Mỹ kí Hiệp định Paris.<br><b>Hiệp định Paris (27/1/1973):</b> Mỹ cam kết tôn trọng độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ Việt Nam; <b>rút hết quân về nước</b>.<br><b>Đại thắng mùa Xuân 1975:</b> 3 chiến dịch — Tây Nguyên (Buôn Ma Thuột 10/3) → Huế – Đà Nẵng → <b>Hồ Chí Minh (26–30/4/1975)</b>.',
  khi: 'Chủ đề lớn, câu hỏi vận dụng cao hay khai thác.',
  vd: 'Ý nghĩa lớn nhất của Hiệp định Paris: <b>Mỹ phải rút hết quân</b>, tạo thời cơ để ta tiến lên giải phóng miền Nam.',

{ nhom: 'A. Kinh tế', ten: 'Quản lí thu chi trong gia đình', cap: 3,

{ chuong: 'Đại cương kim loại', dang: 'mc', muc: 2,

{ chuong: 'Năng lượng hoá học', dang: 'mc', muc: 2,
  q: 'Cho phản ứng: CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(l), Δ<sub>r</sub>H°₂₉₈ = −890,3 kJ. Phát biểu nào đúng?',
  opts: ['Phản ứng thu nhiệt', 'Phản ứng toả nhiệt, năng lượng của sản phẩm thấp hơn chất đầu', 'Phản ứng cần cung cấp nhiệt liên tục để duy trì', 'Δ<sub>f</sub>H° của CH₄ bằng 0'], ans: 1,
  giai: 'ΔH < 0 ⇒ phản ứng toả nhiệt, tổng năng lượng sản phẩm thấp hơn chất đầu. Δ<sub>f</sub>H° = 0 chỉ đúng với đơn chất bền (như O₂), CH₄ là hợp chất.',

/* ---------------- MỨC 3 – VẬN DỤNG ---------------- */
{ chuong: 'Ester – Lipid', dang: 'tln', muc: 3,
  q: 'Xà phòng hoá hoàn toàn 17,6 gam ethyl acetate bằng 300 ml dung dịch NaOH 1M. Cô cạn dung dịch sau phản ứng thu được m gam chất rắn khan. Giá trị của m là bao nhiêu? (làm tròn đến hàng phần mười)',
  ans: '20,4',
  giai: 'n(CH₃COOC₂H₅) = 17,6/88 = 0,2 mol; n(NaOH) = 0,3 mol ⇒ NaOH dư 0,1 mol.\nCH₃COOC₂H₅ + NaOH → CH₃COONa + C₂H₅OH\nChất rắn khan = CH₃COONa (0,2 mol) + NaOH dư (0,1 mol) = 0,2·82 + 0,1·40 = 16,4 + 4 = 20,4 g.\nKiểm tra lại bằng BTKL: 17,6 + 0,3·40 = m + m(C₂H₅OH) ⇒ 29,6 = m + 0,2·46 = m + 9,2 ⇒ m = 20,4 g.',
  meo: 'Luôn kiểm tra NaOH dư — "chất rắn khan" bao gồm cả kiềm dư, không chỉ muối.' },

{ chuong: 'Kim loại + acid', dang: 'tln', muc: 3,
  q: 'Hoà tan hoàn toàn 8,3 gam hỗn hợp Al và Fe trong dung dịch HCl dư, thu được 5,6 lít khí H₂ (đktc). Khối lượng muối khan thu được sau khi cô cạn là bao nhiêu gam? (làm tròn đến hàng phần trăm)',
  ans: '26,05',
  giai: 'n(H₂) = 5,6/22,4 = 0,25 mol. Trong phản ứng KL + HCl: n(Cl⁻ tạo muối) = n(HCl) = 2n(H₂) = 0,5 mol.\nBTKL: m(muối) = m(KL) + m(Cl⁻) = 8,3 + 0,5·35,5 = 8,3 + 17,75 = 26,05 gam.',
  meo: 'Công thức tủ: m(muối clorua) = m(KL) + 71·n(H₂). Ở đây: 8,3 + 71·0,25 = 26,05.' },

{ chuong: 'CO₂ + kiềm', dang: 'tln', muc: 3,
  q: 'Hấp thụ hoàn toàn 0,5 mol CO₂ vào dung dịch chứa 0,4 mol Ca(OH)₂. Sau phản ứng thu được bao nhiêu mol kết tủa?',
  ans: '0,3',
  giai: 'n(OH⁻) = 0,8 mol; T = 0,8/0,5 = 1,6 ⇒ 1 < T < 2 ⇒ tạo cả 2 muối CaCO₃ và Ca(HCO₃)₂.\nÁp dụng: n(CO₃²⁻) = n(OH⁻) − n(CO₂) = 0,8 − 0,5 = 0,3 mol.\nVì n(Ca²⁺) = 0,4 > 0,3 nên toàn bộ CO₃²⁻ kết tủa ⇒ n(CaCO₃) = 0,3 mol.',
  meo: 'Công thức vàng khi có 2 muối: n↓ = n(OH⁻) − n(CO₂), sau đó so với n(Ca²⁺) để lấy giá trị nhỏ hơn.' },

{ chuong: 'Nhôm', dang: 'tln', muc: 3,
  q: 'Cho 0,7 mol NaOH vào dung dịch chứa 0,2 mol AlCl₃. Sau phản ứng thu được bao nhiêu mol kết tủa?',
  ans: '0,1',
  giai: 'T = n(OH⁻)/n(Al³⁺) = 0,7/0,2 = 3,5 ⇒ 3 < T < 4 ⇒ kết tủa đã tan một phần.\nÁp dụng: n↓ = 4n(Al³⁺) − n(OH⁻) = 4·0,2 − 0,7 = 0,8 − 0,7 = 0,1 mol.',
  meo: 'Hai công thức phải thuộc: T ≤ 3 ⇒ n↓ = n(OH⁻)/3; 3 < T < 4 ⇒ n↓ = 4n(Al³⁺) − n(OH⁻).' },

{ chuong: 'Carbohydrate', dang: 'tln', muc: 3,
  q: 'Lên men 162 gam tinh bột thành ethanol với hiệu suất toàn bộ quá trình là 80%. Khối lượng ethanol thu được là bao nhiêu gam? (làm tròn đến hàng phần mười)',
  ans: '73,6',
  giai: '(C₆H₁₀O₅)ₙ → nC₆H₁₂O₆ → 2nC₂H₅OH\nTỉ lệ khối lượng: 162 g tinh bột (1 mắt xích) → 2·46 = 92 g ethanol nếu H = 100%.\nVới H = 80%: m = 162·(92/162)·0,8 = 92·0,8 = 73,6 gam.',
  meo: 'Nhớ cặp số 162 → 92. Đi xuôi thì NHÂN hiệu suất, đi ngược thì CHIA.' },

{ chuong: 'Điện phân', dang: 'tln', muc: 3,
  q: 'Điện phân dung dịch CuSO₄ với điện cực trơ, cường độ dòng điện 5A trong thời gian 3860 giây. Khối lượng Cu bám vào catot là bao nhiêu gam? (làm tròn đến hàng phần mười)',
  ans: '6,4',
  giai: 'n(e) = It/F = 5·3860/96500 = 0,2 mol.\nCatot: Cu²⁺ + 2e → Cu ⇒ n(Cu) = 0,2/2 = 0,1 mol.\nm(Cu) = 0,1·64 = 6,4 gam.',
  meo: 'Bài điện phân luôn bắt đầu bằng n(e) = It/96500, rồi chia cho số e mà ion nhận.' },

/* ---------------- MỨC 4 – VẬN DỤNG CAO ---------------- */
{ chuong: 'Kim loại + HNO₃', dang: 'tln', muc: 4,
  q: 'Hoà tan hoàn toàn 11,2 gam hỗn hợp X gồm Fe, FeO, Fe₂O₃, Fe₃O₄ trong dung dịch HNO₃ loãng dư, thu được 0,05 mol khí NO (sản phẩm khử duy nhất). Số mol HNO₃ đã phản ứng là bao nhiêu? (làm tròn đến hàng phần trăm)',
  ans: '0,515',
  giai: 'Quy đổi hỗn hợp X về {Fe: a mol; O: b mol}.\n(1) Khối lượng: 56a + 16b = 11,2\n(2) Bảo toàn electron: Fe → Fe³⁺ + 3e (cho 3a); O + 2e → O²⁻ (nhận 2b); N⁺⁵ + 3e → NO (nhận 3·0,05 = 0,15)\n⇒ 3a = 2b + 0,15\nTừ (1): 56a + 16b = 11,2. Thế b = (3a − 0,15)/2:\n56a + 8(3a − 0,15) = 11,2 ⇒ 56a + 24a − 1,2 = 11,2 ⇒ 80a = 12,4 ⇒ a = 0,155\n⇒ b = (0,465 − 0,15)/2 = 0,1575\nBTNT N: n(HNO₃) = n(NO₃⁻ trong muối) + n(NO) = 3a + 0,05 = 3·0,155 + 0,05 = 0,515 mol.',
  meo: 'Kỹ thuật lõi: quy đổi về {Fe; O} + bảo toàn electron + bảo toàn nguyên tố N. Nhớ O nhận 2e.' },

{ chuong: 'Peptide', dang: 'tln', muc: 4,
  q: 'Thuỷ phân hoàn toàn 0,1 mol pentapeptide mạch hở X (tạo từ các α-amino acid có 1 nhóm NH₂ và 1 nhóm COOH) bằng dung dịch NaOH vừa đủ. Số mol NaOH đã phản ứng và số mol H₂O sinh ra lần lượt là bao nhiêu? (ghi dạng a;b)',
  ans: '0,5;0,1',
  giai: 'Pentapeptide có 5 mắt xích ⇒ thuỷ phân bằng NaOH cần 5 NaOH cho mỗi phân tử:\nX + 5NaOH → 5 muối + 1 H₂O\n⇒ n(NaOH) = 5·0,1 = 0,5 mol; n(H₂O) = 1·0,1 = 0,1 mol.',
  meo: 'Quy tắc: n-peptide + nNaOH → n muối + 1 H₂O. H₂O sinh ra tính theo SỐ PHÂN TỬ peptide, không phải số liên kết peptide.' },

{ chuong: 'Chất béo', dang: 'tln', muc: 4,
  q: 'Đun nóng 44,5 gam hỗn hợp E gồm triolein và tristearin cần vừa đủ 0,15 mol NaOH, thu được m gam hỗn hợp muối và glycerol. Giá trị của m là bao nhiêu? (làm tròn đến hàng phần mười)',
  ans: '45,9',
  giai: 'Chất béo + 3NaOH → 3 muối + glycerol ⇒ n(chất béo) = 0,15/3 = 0,05 mol.\nn(glycerol) = n(chất béo) = 0,05 mol.\nBTKL: m(E) + m(NaOH) = m(muối) + m(glycerol)\n44,5 + 0,15·40 = m + 0,05·92\n44,5 + 6 = m + 4,6 ⇒ m = 45,9 gam.',
  meo: 'Bài chất béo gần như luôn giải bằng BTKL. Nhớ M(glycerol) = 92 và tỉ lệ NaOH : chất béo = 3 : 1.' },

{ chuong: 'Đốt cháy hữu cơ', dang: 'tln', muc: 4,
  q: 'Đốt cháy hoàn toàn 0,1 mol amine no, đơn chức, mạch hở X thu được 0,2 mol CO₂. Số đồng phân cấu tạo của X là bao nhiêu?',
  ans: '2',
  giai: 'Số C = n(CO₂)/n(X) = 0,2/0,1 = 2 ⇒ X là C₂H₇N (amine no đơn hở CₙH₂ₙ₊₃N với n = 2).\nCác đồng phân của C₂H₇N:\n(1) CH₃CH₂NH₂ — ethylamine (bậc I)\n(2) CH₃NHCH₃ — dimethylamine (bậc II)\n⇒ có 2 đồng phân cấu tạo.',
  meo: 'Amine no đơn hở: CₙH₂ₙ₊₃N. Đếm đồng phân phải xét cả bậc I, II, III.' },

{ chuong: 'Điện phân', dang: 'tln', muc: 4,
  q: 'Điện phân 200 ml dung dịch CuSO₄ 1M với điện cực trơ, cường độ dòng 5A. Sau thời gian t giây, khối lượng dung dịch giảm 15,2 gam. Giá trị của t là bao nhiêu giây? (làm tròn đến hàng đơn vị)',
  ans: '7334',
  giai: 'n(CuSO₄) = 0,2 mol. Giả sử chỉ có Cu bám catot và O₂ thoát anot, Cu²⁺ chưa hết.\nGọi n(e) = 2x ⇒ catot: n(Cu) = x; anot: 2H₂O → O₂ + 4H⁺ + 4e ⇒ n(O₂) = 2x/4 = x/2.\nm(dd giảm) = m(Cu) + m(O₂) = 64x + 32·(x/2) = 64x + 16x = 80x = 15,2 ⇒ x = 0,19 mol.\nKiểm tra: x = 0,19 < 0,2 ⇒ Cu²⁺ còn dư, giả thiết đúng.\nn(e) = 2·0,19 = 0,38 mol ⇒ t = n(e)·96500/I = 0,38·96500/5 = 7334 giây.',
  meo: 'Công thức lõi: m(dd giảm) = m(kim loại bám catot) + m(khí thoát ra ở cả hai cực).' },

/* ---------------- DẠNG ĐÚNG / SAI (4 ý) ---------------- */
{ chuong: 'Ester – Lipid', dang: 'ds', muc: 3,
  q: 'Cho ester X có công thức phân tử C₄H₈O₂. Thuỷ phân X trong dung dịch NaOH thu được sodium acetate. Xét các phát biểu sau:',
  items: [
    { t: 'Công thức cấu tạo của X là CH₃COOC₂H₅.', a: true },
    { t: 'X có phản ứng tráng bạc.', a: false },
    { t: 'Thuỷ phân X thu được alcohol ethylic.', a: true },
    { t: 'X là ester no, đơn chức, mạch hở.', a: true }
  ],
  giai: 'Ý a ĐÚNG: muối là CH₃COONa ⇒ gốc acid là CH₃COO–; C₄H₈O₂ trừ CH₃COO còn C₂H₅ ⇒ X là CH₃COOC₂H₅.\nÝ b SAI: chỉ ester của formic acid (HCOOR) mới tráng bạc vì có nhóm –CHO. X là ester của acetic acid nên không tráng bạc.\nÝ c ĐÚNG: sản phẩm còn lại là C₂H₅OH.\nÝ d ĐÚNG: C₄H₈O₂ có k = (2·4+2−8)/2 = 1, ứng với nhóm C=O ⇒ ester no, đơn chức, mạch hở.',
  meo: 'Chỉ HCOOR mới tráng bạc trong họ ester — kiểm tra ngay khi thấy ý này.' },

{ chuong: 'Đại cương kim loại', dang: 'ds', muc: 3,
  q: 'Tiến hành thí nghiệm: nhúng thanh Fe vào dung dịch CuSO₄. Xét các phát biểu sau:',
  items: [
    { t: 'Có lớp kim loại màu đỏ bám vào thanh Fe.', a: true },
    { t: 'Màu xanh của dung dịch nhạt dần.', a: true },
    { t: 'Xảy ra ăn mòn điện hoá học.', a: true },
    { t: 'Khối lượng thanh Fe giảm sau phản ứng.', a: false }
  ],
  giai: 'Fe + CuSO₄ → FeSO₄ + Cu.\nÝ a ĐÚNG: Cu sinh ra bám vào thanh Fe, có màu đỏ.\nÝ b ĐÚNG: Cu²⁺ (xanh) bị tiêu thụ, thay bằng Fe²⁺ (lục rất nhạt) ⇒ màu xanh nhạt dần.\nÝ c ĐÚNG: khi Cu bám lên Fe, hình thành cặp điện cực Fe–Cu tiếp xúc trong dung dịch điện li ⇒ đủ 3 điều kiện ăn mòn điện hoá.\nÝ d SAI: mỗi mol Fe (56) tan đi được thay bằng 1 mol Cu (64) bám vào ⇒ khối lượng thanh TĂNG 8 g/mol.',
  meo: 'Tăng giảm khối lượng: Δm = n·(M vào − M ra) = n·(64 − 56) = 8n ⇒ thanh nặng thêm.' },

{ chuong: 'Carbohydrate', dang: 'ds', muc: 3,

{ chuong: 'Reading strategy', dang: 'ds', muc: 3,

<!-- Kho mệnh đề trọng điểm (Tà Đạo) -->
<script>
/* ============================================================
   HOÁ HỌC — KHO MỆNH ĐỀ LÝ THUYẾT TRỌNG ĐIỂM (Tà Đạo)
   Mỗi mệnh đề đã thẩm định đúng/sai. Đề Tà Đạo lắp từ kho này:
   mệnh đề đúng → câu "chọn phát biểu ĐÚNG"
   mệnh đề sai  → câu "chọn phát biểu SAI"
   t = nội dung · a = đúng/sai · v = vì sao · cd = chủ đề · m = mức độ
   ============================================================ */
window.TD = window.TD || {}; TD.KHO_LT = TD.KHO_LT || {};

TD.KHO_LT.hoa = [
/* ========== ĐẠI CƯƠNG KIM LOẠI ========== */
{ cd: 'Đại cương kim loại', m: 1, a: true,  t: 'Tính chất hoá học đặc trưng của kim loại là tính khử.', v: 'Kim loại luôn nhường electron để tạo ion dương, tức là bị oxi hoá và đóng vai trò chất khử.' },
{ cd: 'Đại cương kim loại', m: 1, a: false, t: 'Tính chất hoá học đặc trưng của kim loại là tính oxi hoá.', v: 'Ngược lại — kim loại nhường electron nên có tính KHỬ. Chỉ ion kim loại mới có tính oxi hoá.' },
{ cd: 'Đại cương kim loại', m: 1, a: true,  t: 'Các tính chất vật lí chung của kim loại gây ra bởi các electron tự do trong mạng tinh thể.', v: 'Electron tự do giải thích cả tính dẻo, dẫn điện, dẫn nhiệt và ánh kim.' },
{ cd: 'Đại cương kim loại', m: 1, a: true,  t: 'Kim loại dẫn điện tốt nhất là Ag.', v: 'Thứ tự dẫn điện: Ag > Cu > Au > Al > Fe.' },
{ cd: 'Đại cương kim loại', m: 1, a: false, t: 'Kim loại dẫn điện tốt nhất là Cu.', v: 'Cu đứng thứ hai. Ag mới là kim loại dẫn điện tốt nhất.' },
{ cd: 'Đại cương kim loại', m: 1, a: true,  t: 'Kim loại có nhiệt độ nóng chảy cao nhất là W (vonfam).', v: 'W nóng chảy ở 3410 °C nên được dùng làm dây tóc bóng đèn.' },
{ cd: 'Đại cương kim loại', m: 1, a: true,  t: 'Kim loại cứng nhất là Cr, mềm nhất là Cs.', v: 'Cr có độ cứng gần bằng kim cương trong thang Mohs; Cs mềm đến mức cắt được bằng dao.' },
{ cd: 'Đại cương kim loại', m: 1, a: false, t: 'Kim loại có khối lượng riêng nhỏ nhất là Na.', v: 'Nhẹ nhất là Li (D ≈ 0,53 g/cm³). Nặng nhất là Os.' },
{ cd: 'Đại cương kim loại', m: 2, a: true,  t: 'Cu và Ag không tan trong dung dịch HCl loãng.', v: 'Cả hai đứng sau H trong dãy điện hoá nên không khử được ion H⁺.' },
{ cd: 'Đại cương kim loại', m: 2, a: false, t: 'Cu tan được trong dung dịch HCl loãng giải phóng khí H₂.', v: 'Cu đứng sau H nên không phản ứng. Cu chỉ tan trong HNO₃ hoặc H₂SO₄ đặc nóng.' },
{ cd: 'Đại cương kim loại', m: 2, a: true,  t: 'Al, Fe và Cr bị thụ động hoá trong HNO₃ đặc, nguội.', v: 'Lớp oxit bền hình thành ngăn phản ứng tiếp diễn, nên có thể dùng bình nhôm chở acid đặc nguội.' },
{ cd: 'Đại cương kim loại', m: 2, a: false, t: 'Có thể dùng bình bằng đồng để chuyên chở HNO₃ đặc, nguội.', v: 'Cu KHÔNG bị thụ động và sẽ tan ngay. Kim loại thụ động là Al, Fe, Cr.' },
{ cd: 'Đại cương kim loại', m: 2, a: true,  t: 'Ăn mòn điện hoá học cần đủ ba điều kiện: hai điện cực khác bản chất, tiếp xúc với nhau và cùng nhúng trong dung dịch chất điện li.', v: 'Thiếu bất kỳ điều kiện nào thì chỉ là ăn mòn hoá học.' },
{ cd: 'Đại cương kim loại', m: 3, a: true,  t: 'Khi nhúng thanh Fe vào dung dịch CuSO₄ thì xảy ra ăn mòn điện hoá học.', v: 'Cu sinh ra bám lên Fe tạo cặp điện cực Fe–Cu tiếp xúc trong dung dịch điện li.' },
{ cd: 'Đại cương kim loại', m: 3, a: false, t: 'Nhúng thanh Fe nguyên chất vào dung dịch HCl thì xảy ra ăn mòn điện hoá học.', v: 'Chỉ có một kim loại, không có cặp điện cực ⇒ đây là ăn mòn HOÁ HỌC.' },
{ cd: 'Đại cương kim loại', m: 2, a: true,  t: 'Để bảo vệ vỏ tàu biển bằng thép, người ta gắn các khối Zn vào phần vỏ chìm trong nước.', v: 'Zn hoạt động hơn Fe nên đóng vai trò cực âm và bị ăn mòn thay cho thép.' },
{ cd: 'Đại cương kim loại', m: 3, a: false, t: 'Trong hợp kim Fe–Sn để ngoài không khí ẩm, Sn bị ăn mòn trước.', v: 'Fe hoạt động hơn Sn nên Fe là cực âm và bị ăn mòn trước. Đó là lý do sắt tây xước là gỉ rất nhanh.' },
{ cd: 'Đại cương kim loại', m: 2, a: true,  t: 'Điện phân nóng chảy là phương pháp duy nhất để điều chế các kim loại từ Al trở về trước trong dãy điện hoá.', v: 'Ion của các kim loại này không bị khử trong dung dịch nước vì nước bị khử trước.' },
{ cd: 'Đại cương kim loại', m: 2, a: false, t: 'Có thể điều chế Na bằng cách điện phân dung dịch NaCl.', v: 'Điện phân dung dịch NaCl chỉ cho H₂, Cl₂ và NaOH. Muốn có Na phải điện phân NaCl NÓNG CHẢY.' },
{ cd: 'Đại cương kim loại', m: 2, a: true,  t: 'CO khử được các oxit của kim loại đứng sau Al trong dãy điện hoá.', v: 'Fe₂O₃, CuO, ZnO bị CO khử; Al₂O₃ và MgO thì không.' },
{ cd: 'Đại cương kim loại', m: 2, a: false, t: 'Có thể dùng CO để khử Al₂O₃ thành Al ở nhiệt độ cao.', v: 'Al₂O₃ rất bền, CO không khử được. Al chỉ điều chế bằng điện phân nóng chảy Al₂O₃.' },

/* ========== NHÓM IA – IIA – NHÔM ========== */
{ cd: 'IA – IIA – Nhôm', m: 1, a: true,  t: 'Các kim loại kiềm được bảo quản bằng cách ngâm chìm trong dầu hoả.', v: 'Chúng phản ứng mạnh với cả nước lẫn oxi trong không khí.' },
{ cd: 'IA – IIA – Nhôm', m: 1, a: false, t: 'Có thể bảo quản kim loại Na bằng cách ngâm trong nước cất.', v: 'Na phản ứng mãnh liệt với nước. Phải ngâm trong dầu hoả.' },
{ cd: 'IA – IIA – Nhôm', m: 1, a: true,  t: 'Hợp chất của natri cho ngọn lửa màu vàng, của kali cho ngọn lửa màu tím.', v: 'Đây là cách nhận biết nhanh muối Na và K bằng thử màu ngọn lửa.' },
{ cd: 'IA – IIA – Nhôm', m: 2, a: true,  t: 'Nước cứng là nước chứa nhiều ion Ca²⁺ và Mg²⁺.', v: 'Chính hai ion này tạo kết tủa với xà phòng và đóng cặn trong nồi hơi.' },
{ cd: 'IA – IIA – Nhôm', m: 2, a: false, t: 'Nước cứng là nước chứa nhiều ion Na⁺ và K⁺.', v: 'Na⁺ và K⁺ không gây cứng nước. Ion gây cứng là Ca²⁺ và Mg²⁺.' },
{ cd: 'IA – IIA – Nhôm', m: 2, a: true,  t: 'Na₂CO₃ và Na₃PO₄ làm mềm được cả nước cứng tạm thời lẫn nước cứng vĩnh cửu.', v: 'Cả hai tạo kết tủa với Ca²⁺, Mg²⁺ bất kể anion đi kèm là gì.' },
{ cd: 'IA – IIA – Nhôm', m: 2, a: false, t: 'Đun sôi làm mềm được mọi loại nước cứng.', v: 'Đun sôi chỉ làm mềm nước cứng TẠM THỜI (chứa HCO₃⁻), không tác dụng với nước cứng vĩnh cửu.' },
{ cd: 'IA – IIA – Nhôm', m: 2, a: true,  t: 'NaHCO₃ là muối có tính lưỡng tính và bị nhiệt phân.', v: 'HCO₃⁻ vừa cho vừa nhận H⁺; 2NaHCO₃ → Na₂CO₃ + CO₂ + H₂O khi đun nóng.' },
{ cd: 'IA – IIA – Nhôm', m: 2, a: false, t: 'Na₂CO₃ bị phân huỷ khi đun nóng tạo Na₂O và CO₂.', v: 'Muối carbonate của kim loại kiềm rất bền nhiệt, không bị nhiệt phân. Chỉ muối hiđrocarbonat mới bị.' },
{ cd: 'IA – IIA – Nhôm', m: 2, a: true,  t: 'Al₂O₃ và Al(OH)₃ đều là chất lưỡng tính, tan được trong cả dung dịch HCl và dung dịch NaOH.', v: 'Đây là tính chất đặc trưng khiến nhôm khác hẳn các kim loại thông thường.' },
{ cd: 'IA – IIA – Nhôm', m: 2, a: false, t: 'Al là kim loại lưỡng tính vì tan được trong cả acid và base.', v: 'KHÔNG có khái niệm "kim loại lưỡng tính". Al là kim loại; chỉ oxit và hiđroxit của nó mới lưỡng tính.' },
{ cd: 'IA – IIA – Nhôm', m: 3, a: true,  t: 'Khi Al tác dụng với dung dịch NaOH, chất oxi hoá là nước.', v: 'H⁺ của H₂O bị khử thành H₂; NaOH chỉ có vai trò hoà tan lớp Al₂O₃ và Al(OH)₃.' },
{ cd: 'IA – IIA – Nhôm', m: 3, a: false, t: 'Khi Al tác dụng với dung dịch NaOH, NaOH đóng vai trò chất oxi hoá.', v: 'Số oxi hoá của Na và O trong NaOH không đổi. Chất oxi hoá thật sự là H₂O.' },
{ cd: 'IA – IIA – Nhôm', m: 3, a: true,  t: 'Sục CO₂ dư vào dung dịch NaAlO₂ thu được kết tủa Al(OH)₃ không tan.', v: 'H₂CO₃ là acid yếu, chỉ đủ đẩy AlO₂⁻ thành Al(OH)₃ chứ không hoà tan được kết tủa.' },
{ cd: 'IA – IIA – Nhôm', m: 3, a: false, t: 'Cho dung dịch NH₃ dư vào dung dịch AlCl₃ thì kết tủa tan hết.', v: 'NH₃ là base yếu, không hoà tan được Al(OH)₃ ⇒ kết tủa trắng vẫn còn. Chỉ NaOH dư mới hoà tan.' },
{ cd: 'IA – IIA – Nhôm', m: 3, a: true,  t: 'Phản ứng nhiệt nhôm luôn tạo ra Al₂O₃.', v: 'Al khử oxit kim loại và bản thân Al bị oxi hoá thành Al₂O₃.' },
{ cd: 'IA – IIA – Nhôm', m: 3, a: true,  t: 'Hỗn hợp sau phản ứng nhiệt nhôm tác dụng với dung dịch NaOH sinh khí H₂ thì chứng tỏ Al còn dư.', v: 'Trong hỗn hợp chỉ Al mới phản ứng với NaOH sinh H₂; Al₂O₃ tan nhưng không cho khí.' },
{ cd: 'IA – IIA – Nhôm', m: 1, a: true,  t: 'Criolit Na₃AlF₆ được thêm vào quá trình điện phân Al₂O₃ để hạ nhiệt độ nóng chảy và tăng độ dẫn điện.', v: 'Nhờ criolit mà nhiệt độ điện phân hạ từ hơn 2000 °C xuống khoảng 900 °C.' },
{ cd: 'IA – IIA – Nhôm', m: 1, a: false, t: 'Thạch cao nung có công thức CaSO₄·2H₂O và dùng để bó bột.', v: 'Thạch cao NUNG là CaSO₄·H₂O. CaSO₄·2H₂O là thạch cao SỐNG.' },

/* ========== SẮT – CROM ========== */
{ cd: 'Sắt – Crom', m: 1, a: true,  t: 'Sắt là kim loại có tính nhiễm từ.', v: 'Fe, Co, Ni là các kim loại sắt từ, bị nam châm hút.' },
{ cd: 'Sắt – Crom', m: 2, a: true,  t: 'Fe tác dụng với dung dịch HCl tạo muối sắt(II).', v: 'H⁺ là chất oxi hoá yếu, chỉ đưa Fe lên mức +2.' },
{ cd: 'Sắt – Crom', m: 2, a: false, t: 'Fe tác dụng với dung dịch HCl tạo muối sắt(III) clorua.', v: 'HCl chỉ oxi hoá Fe lên Fe²⁺. Muốn có Fe³⁺ phải dùng Cl₂, HNO₃ hoặc H₂SO₄ đặc nóng.' },
{ cd: 'Sắt – Crom', m: 2, a: true,  t: 'Fe tác dụng với khí Cl₂ dư tạo FeCl₃.', v: 'Cl₂ là chất oxi hoá mạnh, đưa Fe thẳng lên mức +3.' },
{ cd: 'Sắt – Crom', m: 2, a: false, t: 'Fe tác dụng với bột lưu huỳnh tạo Fe₂S₃.', v: 'S là chất oxi hoá yếu, chỉ tạo FeS (sắt II sunfua).' },
{ cd: 'Sắt – Crom', m: 3, a: true,  t: 'Khi cho Fe dư tác dụng với dung dịch HNO₃ loãng, muối thu được là Fe(NO₃)₂.', v: 'Fe dư khử tiếp Fe³⁺ về Fe²⁺: Fe + 2Fe³⁺ → 3Fe²⁺.' },
{ cd: 'Sắt – Crom', m: 3, a: false, t: 'Cho Fe dư vào dung dịch HNO₃ loãng thu được muối Fe(NO₃)₃.', v: 'Vì Fe còn dư nên nó khử hết Fe³⁺ về Fe²⁺ ⇒ muối cuối cùng là Fe(NO₃)₂.' },
{ cd: 'Sắt – Crom', m: 3, a: true,  t: 'Dung dịch AgNO₃ oxi hoá được Fe²⁺ thành Fe³⁺.', v: 'Ag⁺ + Fe²⁺ → Fe³⁺ + Ag↓, vì cặp Ag⁺/Ag đứng sau Fe³⁺/Fe²⁺ trong dãy điện hoá.' },
{ cd: 'Sắt – Crom', m: 2, a: true,  t: 'Cu tan được trong dung dịch FeCl₃.', v: 'Cu + 2FeCl₃ → CuCl₂ + 2FeCl₂ vì Fe³⁺ có tính oxi hoá mạnh hơn Cu²⁺.' },
{ cd: 'Sắt – Crom', m: 2, a: false, t: 'Cu không phản ứng với dung dịch FeCl₃ vì Cu đứng sau Fe trong dãy điện hoá.', v: 'Phải so cặp Fe³⁺/Fe²⁺ với Cu²⁺/Cu chứ không so Fe với Cu. Fe³⁺ oxi hoá được Cu.' },
{ cd: 'Sắt – Crom', m: 3, a: true,  t: 'Fe₂O₃ tác dụng với HNO₃ loãng chỉ xảy ra phản ứng trao đổi, không giải phóng khí.', v: 'Fe trong Fe₂O₃ đã ở mức oxi hoá cao nhất +3 nên không bị oxi hoá thêm.' },
{ cd: 'Sắt – Crom', m: 3, a: false, t: 'Cho Fe₃O₄ tác dụng với HNO₃ loãng dư thì không có khí thoát ra.', v: 'Fe₃O₄ chứa Fe²⁺ nên bị oxi hoá lên Fe³⁺, sinh khí NO.' },
{ cd: 'Sắt – Crom', m: 2, a: true,  t: 'Fe(OH)₂ có màu trắng xanh và bị hoá nâu đỏ ngoài không khí.', v: 'Fe(OH)₂ bị O₂ và H₂O oxi hoá thành Fe(OH)₃ màu nâu đỏ.' },
{ cd: 'Sắt – Crom', m: 1, a: true,  t: 'Gang và thép đều là hợp kim của sắt với carbon.', v: 'Gang chứa 2–5% C, thép chứa dưới 2% C.' },
{ cd: 'Sắt – Crom', m: 1, a: false, t: 'Quặng hematit có công thức Fe₃O₄.', v: 'Hematit đỏ là Fe₂O₃. Fe₃O₄ là quặng manhetit.' },
{ cd: 'Sắt – Crom', m: 2, a: true,  t: 'Cr₂O₃ là oxit lưỡng tính còn CrO₃ là oxit acid.', v: 'CrO là oxit base, Cr₂O₃ lưỡng tính, CrO₃ là oxit acid ứng với H₂CrO₄ và H₂Cr₂O₇.' },
{ cd: 'Sắt – Crom', m: 2, a: false, t: 'Cr tan được trong dung dịch NaOH loãng do Cr là kim loại lưỡng tính.', v: 'Cr KHÔNG tan trong NaOH loãng. Chỉ Al và Zn mới tan trong kiềm.' },
{ cd: 'Sắt – Crom', m: 2, a: true,  t: 'Khi thêm dung dịch base vào dung dịch K₂Cr₂O₇ màu da cam, dung dịch chuyển sang màu vàng.', v: 'Cr₂O₇²⁻ + 2OH⁻ → 2CrO₄²⁻ + H₂O; cromat CrO₄²⁻ có màu vàng.' },
{ cd: 'Sắt – Crom', m: 2, a: false, t: 'Thêm acid vào dung dịch K₂CrO₄ thì dung dịch chuyển từ vàng sang xanh lục.', v: 'Thêm acid thì chuyển sang màu DA CAM của đicromat, không phải xanh lục.' },

/* ========== ĐIỆN PHÂN – PIN ĐIỆN ========== */

{ cd: 'Đại cương hữu cơ', m: 2, a: true,  t: 'Đốt cháy hoàn toàn alkane luôn thu được số mol H₂O lớn hơn số mol CO₂.', v: 'Hiệu số đúng bằng số mol alkane: n(alkane) = n(H₂O) − n(CO₂).' },

{ cd: 'Đại cương hữu cơ', m: 2, a: true,  t: 'Hydrocarbon ở thể khí trong điều kiện thường có số nguyên tử carbon từ 4 trở xuống.', v: 'Từ C₅ trở đi là chất lỏng, từ khoảng C₁₈ trở đi là chất rắn.' },
{ cd: 'Đại cương hữu cơ', m: 2, a: true,  t: 'Phương pháp chưng cất dùng để tách các chất lỏng có nhiệt độ sôi khác nhau.', v: 'Chiết dựa vào độ tan khác nhau; kết tinh dựa vào độ tan thay đổi theo nhiệt độ.' },

<script>
/* ============================================================
   TOÁN — KHO MỆNH ĐỀ LÝ THUYẾT TRỌNG ĐIỂM (Tà Đạo)
   Bám CT GDPT 2018. Chủ yếu là mệnh đề về điều kiện áp dụng và
   công thức — đúng kiểu câu Đúng/Sai của đề thi thật.
   ============================================================ */
window.TD = window.TD || {}; TD.KHO_LT = TD.KHO_LT || {};

TD.KHO_LT.toan = [
/* ========== ĐẠO HÀM – KHẢO SÁT HÀM SỐ ========== */
{ cd: 'Đạo hàm – Khảo sát', m: 1, a: true,  t: 'Nếu y′ > 0 trên khoảng K thì hàm số đồng biến trên khoảng K.', v: 'Dấu của đạo hàm quyết định chiều biến thiên của hàm số.' },
{ cd: 'Đạo hàm – Khảo sát', m: 1, a: false, t: 'Nếu y′ > 0 trên khoảng K thì hàm số nghịch biến trên khoảng K.', v: 'y′ > 0 ứng với hàm ĐỒNG biến. Nghịch biến ứng với y′ < 0.' },
{ cd: 'Đạo hàm – Khảo sát', m: 2, a: true,  t: 'Điểm x₀ là điểm cực trị của hàm số khi và chỉ khi đạo hàm đổi dấu khi đi qua x₀.', v: 'Chỉ y′(x₀) = 0 thì chưa đủ — ví dụ y = x³ có y′(0) = 0 nhưng x = 0 không phải cực trị.' },
{ cd: 'Đạo hàm – Khảo sát', m: 2, a: false, t: 'Nếu y′(x₀) = 0 thì x₀ chắc chắn là điểm cực trị của hàm số.', v: 'Chưa đủ — đạo hàm phải ĐỔI DẤU qua x₀. Hàm y = x³ là phản ví dụ.' },
{ cd: 'Đạo hàm – Khảo sát', m: 2, a: true,  t: 'Hàm số bậc ba y = ax³ + bx² + cx + d có hai điểm cực trị khi và chỉ khi phương trình y′ = 0 có hai nghiệm phân biệt.', v: 'Tức là Δ của tam thức y′ = 3ax² + 2bx + c phải dương.' },
{ cd: 'Đạo hàm – Khảo sát', m: 2, a: true,  t: 'Hàm số bậc ba luôn có ít nhất một điểm cực trị hoặc không có điểm cực trị nào.', v: 'Cụ thể là có đúng 2 cực trị khi Δ(y′) > 0 và không có cực trị nào khi Δ(y′) ≤ 0.' },
{ cd: 'Đạo hàm – Khảo sát', m: 3, a: true,  t: 'Hàm trùng phương y = ax⁴ + bx² + c có ba điểm cực trị khi và chỉ khi a·b < 0.', v: 'Khi a·b ≥ 0 thì hàm chỉ có một điểm cực trị.' },
{ cd: 'Đạo hàm – Khảo sát', m: 3, a: false, t: 'Hàm số y = ax⁴ + bx² + c luôn có ba điểm cực trị.', v: 'Chỉ khi a·b < 0. Nếu a·b ≥ 0 thì hàm chỉ có MỘT điểm cực trị.' },
{ cd: 'Đạo hàm – Khảo sát', m: 2, a: true,  t: 'Hàm số y = (ax + b)/(cx + d) không có điểm cực trị nào.', v: 'Đạo hàm y′ = (ad − bc)/(cx + d)² luôn giữ nguyên dấu trên từng khoảng xác định.' },
{ cd: 'Đạo hàm – Khảo sát', m: 2, a: false, t: 'Hàm số y = (2x + 1)/(x − 3) có một điểm cực đại và một điểm cực tiểu.', v: 'Hàm phân thức bậc nhất trên bậc nhất KHÔNG có cực trị.' },
{ cd: 'Đạo hàm – Khảo sát', m: 2, a: true,  t: 'Đồ thị hàm số y = (ax + b)/(cx + d) có tiệm cận đứng x = −d/c và tiệm cận ngang y = a/c.', v: 'Điều kiện c ≠ 0 và ad − bc ≠ 0.' },
{ cd: 'Đạo hàm – Khảo sát', m: 3, a: true,  t: 'Đồ thị hàm số có tiệm cận xiên khi bậc của tử lớn hơn bậc của mẫu đúng một đơn vị.', v: 'Khi đó đồ thị không có tiệm cận ngang.' },
{ cd: 'Đạo hàm – Khảo sát', m: 3, a: false, t: 'Một đồ thị hàm số có thể vừa có tiệm cận ngang vừa có tiệm cận xiên ở cùng một phía.', v: 'Không thể — ở mỗi phía chỉ có hoặc tiệm cận ngang hoặc tiệm cận xiên.' },
{ cd: 'Đạo hàm – Khảo sát', m: 3, a: true,  t: 'Có thể tìm tiệm cận xiên của hàm phân thức bằng cách chia đa thức tử cho đa thức mẫu.', v: 'Phần nguyên của phép chia chính là phương trình tiệm cận xiên.' },
{ cd: 'Đạo hàm – Khảo sát', m: 2, a: true,  t: 'Để tìm giá trị lớn nhất và nhỏ nhất của hàm số trên đoạn [a; b], ta so sánh giá trị hàm tại các điểm tới hạn trong khoảng và tại hai đầu mút.', v: 'Bỏ sót hai đầu mút là lỗi phổ biến nhất của dạng bài này.' },
{ cd: 'Đạo hàm – Khảo sát', m: 2, a: false, t: 'Giá trị lớn nhất của hàm số trên đoạn [a; b] luôn đạt tại điểm cực đại của hàm số.', v: 'Có thể đạt tại đầu mút của đoạn. Phải so sánh cả giá trị tại a và b.' },
{ cd: 'Đạo hàm – Khảo sát', m: 3, a: true,  t: 'Số giao điểm của đồ thị hàm số y = f(x) với đường thẳng y = m bằng số nghiệm của phương trình f(x) = m.', v: 'Dựa vào bảng biến thiên để biện luận số nghiệm theo m.' },
{ cd: 'Đạo hàm – Khảo sát', m: 2, a: true,  t: 'Phương trình tiếp tuyến của đồ thị hàm số tại điểm M(x₀; y₀) là y = f′(x₀)(x − x₀) + y₀.', v: 'Hệ số góc của tiếp tuyến chính là đạo hàm tại tiếp điểm.' },
{ cd: 'Đạo hàm – Khảo sát', m: 2, a: true,  t: 'Đạo hàm của tích hai hàm số được tính theo công thức (uv)′ = u′v + uv′.', v: 'Còn thương thì (u/v)′ = (u′v − uv′)/v².' },
{ cd: 'Đạo hàm – Khảo sát', m: 2, a: false, t: 'Đạo hàm của tích hai hàm số bằng tích các đạo hàm: (uv)′ = u′·v′.', v: 'Sai — công thức đúng là (uv)′ = u′v + uv′.' },

/* ========== MŨ – LOGARIT ========== */
{ cd: 'Mũ – Logarit', m: 1, a: true,  t: 'Điều kiện của cơ số logarit là a > 0 và a ≠ 1.', v: 'Đồng thời biểu thức dưới dấu logarit phải dương.' },
{ cd: 'Mũ – Logarit', m: 2, a: true,  t: 'Công thức log_a(xy) = log_a x + log_a y đúng khi x > 0 và y > 0.', v: 'Bỏ qua điều kiện dương là nguồn sai lầm phổ biến khi biến đổi.' },
{ cd: 'Mũ – Logarit', m: 2, a: false, t: 'Ta luôn có log_a(x + y) = log_a x + log_a y.', v: 'Sai hoàn toàn — công thức đúng là cho TÍCH: log_a(xy) = log_a x + log_a y.' },
{ cd: 'Mũ – Logarit', m: 2, a: true,  t: 'Công thức đổi cơ số: log_a b = log_c b / log_c a với các cơ số hợp lệ.', v: 'Hệ quả: log_a b = 1/log_b a.' },
{ cd: 'Mũ – Logarit', m: 2, a: true,  t: 'Ta có log_a(xⁿ) = n·log_a x với x > 0.', v: 'Nếu x có thể âm thì phải viết log_a(xⁿ) = n·log_a|x| với n chẵn.' },
{ cd: 'Mũ – Logarit', m: 3, a: true,  t: 'Khi giải bất phương trình logarit với cơ số 0 < a < 1, phải đổi chiều bất đẳng thức.', v: 'Vì hàm logarit cơ số nhỏ hơn 1 là hàm nghịch biến.' },
{ cd: 'Mũ – Logarit', m: 3, a: false, t: 'Khi giải bất phương trình logarit, luôn giữ nguyên chiều bất đẳng thức sau khi bỏ dấu logarit.', v: 'Chỉ giữ nguyên khi cơ số a > 1. Nếu 0 < a < 1 thì phải ĐỔI CHIỀU.' },
{ cd: 'Mũ – Logarit', m: 2, a: true,  t: 'Hàm số y = aˣ với a > 1 là hàm đồng biến trên toàn bộ tập số thực.', v: 'Với 0 < a < 1 thì hàm nghịch biến.' },
{ cd: 'Mũ – Logarit', m: 2, a: true,  t: 'Đồ thị hàm số y = aˣ luôn đi qua điểm (0; 1) và nằm hoàn toàn phía trên trục hoành.', v: 'Vì aˣ > 0 với mọi x.' },
{ cd: 'Mũ – Logarit', m: 3, a: true,  t: 'Công thức lãi kép sau n kì là A = P(1 + r)ⁿ với P là số tiền gốc và r là lãi suất mỗi kì.', v: 'Khác lãi đơn A = P(1 + rn).' },
{ cd: 'Mũ – Logarit', m: 3, a: false, t: 'Công thức tính số tiền cả gốc lẫn lãi theo lãi kép sau n kì là A = P(1 + rn).', v: 'Đó là công thức lãi ĐƠN. Lãi kép dùng luỹ thừa: A = P(1 + r)ⁿ.' },
{ cd: 'Mũ – Logarit', m: 2, a: true,  t: 'Tập xác định của hàm số y = log_a x là khoảng (0; +∞).', v: 'Còn tập giá trị là toàn bộ tập số thực.' },

/* ========== NGUYÊN HÀM – TÍCH PHÂN ========== */
{ cd: 'Nguyên hàm – Tích phân', m: 1, a: true,  t: 'Nguyên hàm của hàm số f(x) = 1/x là ln|x| + C.', v: 'Phải có dấu giá trị tuyệt đối vì hàm 1/x xác định cả với x âm.' },
{ cd: 'Nguyên hàm – Tích phân', m: 2, a: false, t: 'Nguyên hàm của hàm số f(x) = 1/x là ln x + C với mọi x.', v: 'Thiếu dấu giá trị tuyệt đối — công thức đúng là ln|x| + C.' },
{ cd: 'Nguyên hàm – Tích phân', m: 2, a: true,  t: 'Công thức ∫xⁿ dx = xⁿ⁺¹/(n+1) + C chỉ đúng khi n ≠ −1.', v: 'Trường hợp n = −1 phải dùng ∫(1/x)dx = ln|x| + C.' },
{ cd: 'Nguyên hàm – Tích phân', m: 2, a: true,  t: 'Ta có ∫f(ax + b)dx = (1/a)·F(ax + b) + C với F là một nguyên hàm của f.', v: 'Quên nhân hệ số 1/a là lỗi sai kinh điển.' },
{ cd: 'Nguyên hàm – Tích phân', m: 2, a: false, t: 'Ta có ∫f(ax + b)dx = F(ax + b) + C.', v: 'Thiếu hệ số 1/a. Công thức đúng là (1/a)·F(ax + b) + C.' },
{ cd: 'Nguyên hàm – Tích phân', m: 2, a: true,  t: 'Công thức Newton–Leibniz: tích phân từ a đến b của f(x) bằng F(b) − F(a).', v: 'F là một nguyên hàm bất kì của f trên đoạn [a; b].' },
{ cd: 'Nguyên hàm – Tích phân', m: 2, a: true,  t: 'Tích phân của hàm số lẻ trên đoạn đối xứng [−a; a] luôn bằng 0.', v: 'Còn hàm chẵn thì tích phân trên [−a; a] bằng hai lần tích phân trên [0; a].' },
{ cd: 'Nguyên hàm – Tích phân', m: 3, a: false, t: 'Tích phân của hàm số chẵn trên đoạn đối xứng [−a; a] luôn bằng 0.', v: 'Đó là tính chất của hàm LẺ. Hàm chẵn cho kết quả bằng 2 lần tích phân trên [0; a].' },
{ cd: 'Nguyên hàm – Tích phân', m: 3, a: true,  t: 'Công thức tích phân từng phần là ∫u dv = uv − ∫v du.', v: 'Thứ tự ưu tiên chọn u: nhất log, nhì đa thức, tam lượng giác, tứ hàm mũ.' },
{ cd: 'Nguyên hàm – Tích phân', m: 3, a: true,  t: 'Khi đổi biến trong tích phân xác định, phải đổi cả cận tích phân theo biến mới.', v: 'Nếu không đổi cận thì kết quả sẽ sai.' },
{ cd: 'Nguyên hàm – Tích phân', m: 3, a: false, t: 'Khi dùng phương pháp đổi biến cho tích phân xác định, có thể giữ nguyên cận rồi trả biến về cuối cùng.', v: 'Được về mặt kỹ thuật nhưng phải trả biến, còn nếu giữ cận cũ mà thay biến mới thì SAI.' },
{ cd: 'Nguyên hàm – Tích phân', m: 3, a: true,  t: 'Diện tích hình phẳng giới hạn bởi hai đường y = f(x) và y = g(x) được tính bằng tích phân của |f(x) − g(x)| trên đoạn giữa hai hoành độ giao điểm.', v: 'Phải lấy trị tuyệt đối hoặc chia khoảng theo dấu của hiệu.' },
{ cd: 'Nguyên hàm – Tích phân', m: 3, a: false, t: 'Diện tích hình phẳng giới hạn bởi hai đường cong bằng tích phân của hiệu hai hàm, không cần lấy trị tuyệt đối.', v: 'Nếu không lấy trị tuyệt đối, phần nằm dưới sẽ cho diện tích âm và kết quả sai.' },
{ cd: 'Nguyên hàm – Tích phân', m: 3, a: true,  t: 'Thể tích khối tròn xoay khi quay hình phẳng quanh trục Ox được tính bằng π nhân tích phân của f²(x).', v: 'Vì bình phương nên không cần lấy trị tuyệt đối.' },

/* ========== HÌNH HỌC OXYZ ========== */
{ cd: 'Oxyz', m: 2, a: true,  t: 'Tích vô hướng của hai vectơ cho kết quả là một số thực còn tích có hướng cho kết quả là một vectơ.', v: 'Đây là điểm phân biệt cơ bản nhất giữa hai phép toán.' },
{ cd: 'Oxyz', m: 2, a: false, t: 'Tích có hướng của hai vectơ trong không gian cho kết quả là một số thực.', v: 'Tích CÓ HƯỚNG cho một VECTƠ vuông góc với cả hai vectơ ban đầu.' },
{ cd: 'Oxyz', m: 2, a: true,  t: 'Hai vectơ vuông góc với nhau khi và chỉ khi tích vô hướng của chúng bằng 0.', v: 'Còn hai vectơ cùng phương khi tích có hướng bằng vectơ không.' },
{ cd: 'Oxyz', m: 2, a: true,  t: 'Vectơ tích có hướng của hai vectơ luôn vuông góc với cả hai vectơ đó.', v: 'Nhờ tính chất này ta tìm được vectơ pháp tuyến của mặt phẳng đi qua ba điểm.' },
{ cd: 'Oxyz', m: 2, a: true,  t: 'Mặt phẳng có phương trình Ax + By + Cz + D = 0 nhận vectơ (A; B; C) làm vectơ pháp tuyến.', v: 'Hệ số của x, y, z chính là toạ độ vectơ pháp tuyến.' },
{ cd: 'Oxyz', m: 2, a: false, t: 'Mặt phẳng Ax + By + Cz + D = 0 nhận vectơ (A; B; C) làm vectơ chỉ phương.', v: 'Đó là vectơ PHÁP TUYẾN. Mặt phẳng không có "vectơ chỉ phương" duy nhất.' },
{ cd: 'Oxyz', m: 3, a: true,  t: 'Khoảng cách từ điểm M(x₀; y₀; z₀) đến mặt phẳng Ax + By + Cz + D = 0 bằng trị tuyệt đối của (Ax₀ + By₀ + Cz₀ + D) chia cho căn bậc hai của (A² + B² + C²).', v: 'Quên trị tuyệt đối ở tử sẽ cho khoảng cách âm.' },
{ cd: 'Oxyz', m: 2, a: true,  t: 'Mặt cầu có phương trình x² + y² + z² − 2ax − 2by − 2cz + d = 0 có tâm I(a; b; c) và bán kính R = √(a² + b² + c² − d).', v: 'Điều kiện tồn tại mặt cầu là a² + b² + c² − d > 0.' },
{ cd: 'Oxyz', m: 3, a: true,  t: 'Mặt phẳng tiếp xúc với mặt cầu khi và chỉ khi khoảng cách từ tâm mặt cầu đến mặt phẳng bằng bán kính.', v: 'Nếu khoảng cách nhỏ hơn bán kính thì mặt phẳng cắt mặt cầu theo một đường tròn.' },
{ cd: 'Oxyz', m: 3, a: false, t: 'Mặt phẳng cắt mặt cầu khi khoảng cách từ tâm đến mặt phẳng lớn hơn bán kính.', v: 'Ngược lại — cắt khi khoảng cách NHỎ HƠN bán kính. Lớn hơn thì không giao nhau.' },
{ cd: 'Oxyz', m: 3, a: true,  t: 'Bán kính đường tròn giao tuyến của mặt phẳng và mặt cầu bằng căn bậc hai của (R² − d²).', v: 'Với d là khoảng cách từ tâm mặt cầu đến mặt phẳng.' },
{ cd: 'Oxyz', m: 2, a: true,  t: 'Điểm M nằm bên trong mặt cầu tâm I bán kính R khi và chỉ khi IM < R.', v: 'Nằm trên mặt cầu khi IM = R và nằm ngoài khi IM > R.' },
{ cd: 'Oxyz', m: 3, a: true,  t: 'Diện tích tam giác ABC bằng một nửa độ dài tích có hướng của hai vectơ AB và AC.', v: 'Còn thể tích tứ diện ABCD bằng một phần sáu trị tuyệt đối của tích hỗn tạp.' },

/* ========== THỐNG KÊ – XÁC SUẤT ========== */
{ cd: 'Thống kê – Xác suất', m: 2, a: true,  t: 'Với mẫu số liệu ghép nhóm, giá trị đại diện của mỗi nhóm là trung điểm của nhóm đó.', v: 'Mọi phép tính trung bình, phương sai đều dùng giá trị đại diện này.' },
{ cd: 'Thống kê – Xác suất', m: 2, a: false, t: 'Với mẫu số liệu ghép nhóm, số trung bình được tính từ chính các số liệu gốc.', v: 'Số liệu gốc đã bị mất khi ghép nhóm. Phải dùng GIÁ TRỊ ĐẠI DIỆN là trung điểm nhóm.' },
{ cd: 'Thống kê – Xác suất', m: 2, a: true,  t: 'Khoảng tứ phân vị được tính bằng hiệu giữa tứ phân vị thứ ba và tứ phân vị thứ nhất.', v: 'Δ_Q = Q₃ − Q₁, đo độ phân tán và ít bị ảnh hưởng bởi giá trị bất thường.' },
{ cd: 'Thống kê – Xác suất', m: 2, a: true,  t: 'Tứ phân vị thứ hai Q₂ chính là trung vị của mẫu số liệu.', v: 'Q₁ và Q₃ chia phần dưới và phần trên của mẫu.' },
{ cd: 'Thống kê – Xác suất', m: 3, a: true,  t: 'Khoảng tứ phân vị ít chịu ảnh hưởng bởi các giá trị bất thường hơn khoảng biến thiên.', v: 'Vì nó chỉ dựa vào 50% số liệu ở giữa.' },
{ cd: 'Thống kê – Xác suất', m: 3, a: false, t: 'Khoảng biến thiên là số đo độ phân tán ít bị ảnh hưởng nhất bởi giá trị bất thường.', v: 'Ngược lại — khoảng biến thiên chỉ phụ thuộc giá trị lớn nhất và nhỏ nhất nên rất nhạy với giá trị bất thường.' },
{ cd: 'Thống kê – Xác suất', m: 2, a: true,  t: 'Độ lệch chuẩn bằng căn bậc hai của phương sai.', v: 'Độ lệch chuẩn có cùng đơn vị với số liệu nên dễ diễn giải hơn phương sai.' },
{ cd: 'Thống kê – Xác suất', m: 3, a: true,  t: 'Xác suất có điều kiện P(A|B) được tính bằng P(A ∩ B) chia cho P(B) với P(B) > 0.', v: 'Đây là nền tảng của công thức nhân xác suất và công thức Bayes.' },
{ cd: 'Thống kê – Xác suất', m: 3, a: false, t: 'Xác suất có điều kiện P(A|B) luôn bằng P(B|A).', v: 'Hai đại lượng này hoàn toàn khác nhau, chỉ bằng nhau khi P(A) = P(B).' },
{ cd: 'Thống kê – Xác suất', m: 3, a: true,  t: 'Hai biến cố A và B độc lập khi và chỉ khi P(A ∩ B) = P(A)·P(B).', v: 'Tương đương với P(A|B) = P(A), tức việc B xảy ra không ảnh hưởng đến khả năng của A.' },
{ cd: 'Thống kê – Xác suất', m: 3, a: false, t: 'Hai biến cố xung khắc thì luôn độc lập với nhau.', v: 'Ngược lại — hai biến cố xung khắc có P(A ∩ B) = 0 nên KHÔNG độc lập nếu cả hai đều có xác suất dương.' },
{ cd: 'Thống kê – Xác suất', m: 2, a: true,  t: 'Công thức cộng xác suất: P(A ∪ B) = P(A) + P(B) − P(A ∩ B).', v: 'Nếu A và B xung khắc thì P(A ∩ B) = 0 nên P(A ∪ B) = P(A) + P(B).' },
{ cd: 'Thống kê – Xác suất', m: 2, a: true,  t: 'Xác suất của biến cố đối được tính bằng P(Ā) = 1 − P(A).', v: 'Rất hữu ích với các bài toán "có ít nhất một".' },
{ cd: 'Thống kê – Xác suất', m: 2, a: true,  t: 'Số cách chọn k phần tử từ n phần tử mà không quan tâm thứ tự là tổ hợp chập k của n.', v: 'Nếu có quan tâm thứ tự thì dùng chỉnh hợp.' },
{ cd: 'Thống kê – Xác suất', m: 2, a: false, t: 'Số cách chọn k phần tử từ n phần tử mà không quan tâm thứ tự là chỉnh hợp chập k của n.', v: 'Không quan tâm thứ tự thì dùng TỔ HỢP. Chỉnh hợp dùng khi có thứ tự.' },

/* ========== HÌNH KHÔNG GIAN ========== */
{ cd: 'Hình không gian', m: 2, a: true,  t: 'Thể tích khối chóp bằng một phần ba tích của diện tích đáy và chiều cao.', v: 'Còn khối lăng trụ thì bằng diện tích đáy nhân chiều cao.' },
{ cd: 'Hình không gian', m: 2, a: false, t: 'Thể tích khối chóp bằng tích của diện tích đáy và chiều cao.', v: 'Thiếu hệ số một phần ba. Công thức đó là của khối LĂNG TRỤ.' },
{ cd: 'Hình không gian', m: 3, a: true,  t: 'Công thức tỉ số thể tích chỉ áp dụng được cho khối chóp có đáy là tam giác.', v: 'Với chóp tứ giác phải chia thành hai chóp tam giác trước.' },
{ cd: 'Hình không gian', m: 3, a: false, t: 'Công thức tỉ số thể tích áp dụng được cho mọi khối chóp bất kể hình dạng đáy.', v: 'Chỉ áp dụng cho chóp TAM GIÁC. Đây là hạn chế quan trọng phải nhớ.' },
{ cd: 'Hình không gian', m: 2, a: true,  t: 'Diện tích xung quanh hình nón bằng π nhân bán kính đáy nhân đường sinh.', v: 'Chú ý dùng đường sinh l chứ không phải chiều cao h.' },
{ cd: 'Hình không gian', m: 2, a: false, t: 'Diện tích xung quanh hình nón bằng π nhân bán kính đáy nhân chiều cao.', v: 'Phải dùng ĐƯỜNG SINH l chứ không phải chiều cao h. Chỉ thể tích mới dùng h.' },
{ cd: 'Hình không gian', m: 2, a: true,  t: 'Với hình nón, đường sinh, bán kính đáy và chiều cao liên hệ bởi l² = r² + h².', v: 'Đó là định lí Pythagore trong tam giác vuông tạo bởi trục, bán kính và đường sinh.' },
{ cd: 'Hình không gian', m: 2, a: true,  t: 'Thể tích khối cầu bằng bốn phần ba nhân π nhân lập phương bán kính.', v: 'Còn diện tích mặt cầu bằng 4πR².' },
{ cd: 'Hình không gian', m: 2, a: false, t: 'Diện tích mặt cầu bán kính R bằng πR².', v: 'Đó là diện tích HÌNH TRÒN. Diện tích mặt cầu là 4πR².' },
{ cd: 'Hình không gian', m: 3, a: true,  t: 'Góc giữa đường thẳng và mặt phẳng là góc giữa đường thẳng đó và hình chiếu vuông góc của nó trên mặt phẳng.', v: 'Góc này luôn nằm trong khoảng từ 0° đến 90°.' },
{ cd: 'Hình không gian', m: 3, a: true,  t: 'Có thể tính khoảng cách từ một điểm đến mặt phẳng bằng công thức d = 3V/S, với V là thể tích khối chóp và S là diện tích mặt đáy tương ứng.', v: 'Kỹ thuật "đổi đỉnh" này giải được đa số bài khoảng cách khó mà không cần dựng hình.' },
{ cd: 'Hình không gian', m: 2, a: true,  t: 'Hai mặt phẳng vuông góc với nhau khi mặt phẳng này chứa một đường thẳng vuông góc với mặt phẳng kia.', v: 'Đây là dấu hiệu nhận biết hai mặt phẳng vuông góc.' },

/* ========== DÃY SỐ – CẤP SỐ ========== */
{ cd: 'Dãy số – Cấp số', m: 2, a: true,  t: 'Trong cấp số cộng, ba số hạng liên tiếp a, b, c thoả mãn 2b = a + c.', v: 'Còn cấp số nhân thì b² = a·c.' },
{ cd: 'Dãy số – Cấp số', m: 2, a: false, t: 'Trong cấp số nhân, ba số hạng liên tiếp a, b, c thoả mãn 2b = a + c.', v: 'Đó là tính chất của cấp số CỘNG. Cấp số nhân có b² = a·c.' },
