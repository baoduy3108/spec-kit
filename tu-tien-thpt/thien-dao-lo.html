{ cd: 'Vật lí nhiệt', m: 2, a: true,  t: 'Sự bay hơi xảy ra ở mọi nhiệt độ còn sự sôi chỉ xảy ra ở nhiệt độ sôi xác định.', v: 'Bay hơi diễn ra trên bề mặt; sôi diễn ra cả trong lòng chất lỏng.' },
{ cd: 'Vật lí nhiệt', m: 2, a: false, t: 'Sự bay hơi của chất lỏng chỉ xảy ra khi chất lỏng đạt tới nhiệt độ sôi.', v: 'Bay hơi xảy ra ở MỌI nhiệt độ, đó là lý do quần áo phơi ngoài trời vẫn khô.' },
{ cd: 'Vật lí nhiệt', m: 2, a: true,  t: 'Khi nén khí đoạn nhiệt, nhiệt độ của khí tăng lên.', v: 'Q = 0 nên ΔU = A > 0 (khí nhận công) ⇒ nội năng tăng ⇒ nhiệt độ tăng.' },
{ cd: 'Vật lí nhiệt', m: 3, a: false, t: 'Khi khí giãn nở đoạn nhiệt, nhiệt độ của khí tăng lên.', v: 'Khí sinh công mà không nhận nhiệt nên nội năng GIẢM, nhiệt độ giảm.' },
{ cd: 'Vật lí nhiệt', m: 2, a: true,  t: 'Nước có nhiệt dung riêng lớn nên được dùng làm chất tải nhiệt trong các hệ thống làm mát.', v: 'Nước hấp thụ nhiều nhiệt mà nhiệt độ tăng ít, rất phù hợp để vận chuyển nhiệt.' },
{ cd: 'Vật lí nhiệt', m: 2, a: false, t: 'Hai vật có cùng nhiệt độ thì có cùng nội năng.', v: 'Nội năng còn phụ thuộc khối lượng, bản chất và thể tích của vật.' },
{ cd: 'Vật lí nhiệt', m: 2, a: true,  t: 'Nhiệt luôn tự truyền từ vật có nhiệt độ cao sang vật có nhiệt độ thấp hơn.', v: 'Quá trình ngược lại không tự xảy ra — đó là nội dung của nguyên lí II nhiệt động lực học.' },
{ cd: 'Vật lí nhiệt', m: 2, a: false, t: 'Vật có nhiệt độ cao hơn thì chứa nhiều nhiệt lượng hơn.', v: 'Nhiệt lượng là phần năng lượng TRAO ĐỔI, không phải đại lượng chứa sẵn trong vật. Vật chứa nội năng.' },

/* --- Khí lí tưởng (bổ sung) --- */
{ cd: 'Khí lí tưởng', m: 2, a: true,  t: 'Ở cùng điều kiện nhiệt độ và áp suất, các thể tích khí bằng nhau chứa cùng số phân tử.', v: 'Đó là định luật Avogadro.' },
{ cd: 'Khí lí tưởng', m: 3, a: true,  t: 'Trên đồ thị p–V, đường đẳng nhiệt là một nhánh hypebol.', v: 'Vì pV = hằng số nên p tỉ lệ nghịch với V.' },
{ cd: 'Khí lí tưởng', m: 3, a: false, t: 'Trên đồ thị p–V, đường đẳng nhiệt là một đường thẳng đi qua gốc toạ độ.', v: 'Đó là hình dạng của đường đẳng tích trên đồ thị p–T, không phải đẳng nhiệt trên p–V.' },
{ cd: 'Khí lí tưởng', m: 3, a: true,  t: 'Trên đồ thị p–T, đường đẳng tích là đường thẳng kéo dài đi qua gốc toạ độ.', v: 'Vì p tỉ lệ thuận với T khi thể tích không đổi.' },
{ cd: 'Khí lí tưởng', m: 2, a: true,  t: 'Khi làm lạnh một lượng khí trong bình kín, áp suất của khí giảm.', v: 'Quá trình đẳng tích, p tỉ lệ thuận với T.' },
{ cd: 'Khí lí tưởng', m: 3, a: true,  t: 'Khối lượng riêng của một lượng khí lí tưởng tỉ lệ thuận với áp suất và tỉ lệ nghịch với nhiệt độ tuyệt đối.', v: 'Từ pV = (m/M)RT suy ra ρ = pM/(RT).' },
{ cd: 'Khí lí tưởng', m: 2, a: false, t: 'Áp suất của một lượng khí trong bình kín không đổi khi ta thay đổi nhiệt độ của bình.', v: 'Đó là quá trình đẳng tích: nhiệt độ tăng thì áp suất tăng theo.' },
{ cd: 'Khí lí tưởng', m: 2, a: true,  t: 'Không nên để bình chứa khí nén dưới ánh nắng gay gắt vì áp suất trong bình sẽ tăng, có nguy cơ nổ.', v: 'Đây là ứng dụng thực tế trực tiếp của định luật Charles.' },

/* --- Từ trường (bổ sung) --- */
{ cd: 'Từ trường', m: 1, a: true,  t: 'Đường sức từ là những đường cong khép kín hoặc vô hạn ở hai đầu.', v: 'Khác đường sức điện — đường sức điện xuất phát từ điện tích dương và kết thúc ở điện tích âm.' },
{ cd: 'Từ trường', m: 1, a: false, t: 'Đường sức từ xuất phát từ cực Bắc và kết thúc ở cực Nam, không khép kín.', v: 'Bên ngoài nam châm thì đi từ Bắc sang Nam, nhưng bên trong nam châm chúng đi ngược lại nên KHÉP KÍN.' },
{ cd: 'Từ trường', m: 2, a: true,  t: 'Từ trường chỉ tác dụng lực lên điện tích đang chuyển động.', v: 'Điện tích đứng yên trong từ trường không chịu lực từ.' },
{ cd: 'Từ trường', m: 2, a: false, t: 'Từ trường tác dụng lực lên mọi điện tích đặt trong nó, kể cả điện tích đứng yên.', v: 'Chỉ tác dụng lên điện tích CHUYỂN ĐỘNG. Điện tích đứng yên chỉ chịu lực điện.' },
{ cd: 'Từ trường', m: 3, a: true,  t: 'Lực Lorentz luôn vuông góc với vận tốc nên không sinh công và không làm thay đổi độ lớn vận tốc của hạt.', v: 'Vì vậy hạt mang điện bay vuông góc vào từ trường đều sẽ chuyển động tròn đều.' },
{ cd: 'Từ trường', m: 2, a: true,  t: 'Máy phát điện xoay chiều hoạt động dựa trên hiện tượng cảm ứng điện từ.', v: 'Khung dây quay trong từ trường làm từ thông biến thiên tuần hoàn.' },
{ cd: 'Từ trường', m: 3, a: true,  t: 'Dòng điện Foucault (dòng xoáy) được ứng dụng trong phanh điện từ và bếp từ.', v: 'Dòng xoáy sinh ra trong khối kim loại đặt trong từ trường biến thiên, toả nhiệt hoặc tạo lực cản.' },
{ cd: 'Từ trường', m: 2, a: false, t: 'Cuộn sơ cấp của máy biến áp là cuộn nối với tải tiêu thụ điện.', v: 'Cuộn SƠ CẤP nối với nguồn; cuộn THỨ CẤP mới nối với tải.' },
{ cd: 'Từ trường', m: 3, a: true,  t: 'Máy biến áp có số vòng cuộn thứ cấp lớn hơn cuộn sơ cấp là máy tăng áp.', v: 'U₂/U₁ = N₂/N₁ nên N₂ > N₁ thì U₂ > U₁.' },
{ cd: 'Từ trường', m: 2, a: true,  t: 'Suất điện động cảm ứng trong khung dây tỉ lệ thuận với tốc độ biến thiên của từ thông.', v: 'Từ thông biến thiên càng nhanh thì suất điện động càng lớn.' },

/* --- Hạt nhân (bổ sung) --- */
{ cd: 'Vật lí hạt nhân', m: 1, a: true,  t: 'Các đồng vị của cùng một nguyên tố có cùng số proton nhưng khác số neutron.', v: 'Vì cùng Z nên chúng có cùng tính chất hoá học.' },
{ cd: 'Vật lí hạt nhân', m: 1, a: false, t: 'Các đồng vị của cùng một nguyên tố có cùng số khối nhưng khác số proton.', v: 'Ngược lại — cùng số PROTON, khác số NEUTRON nên khác số khối.' },
{ cd: 'Vật lí hạt nhân', m: 2, a: true,  t: 'Lực hạt nhân là lực tương tác mạnh, chỉ có tác dụng trong phạm vi kích thước hạt nhân.', v: 'Bán kính tác dụng cỡ 10⁻¹⁵ m, đủ để thắng lực đẩy Coulomb giữa các proton.' },
{ cd: 'Vật lí hạt nhân', m: 2, a: false, t: 'Lực hạt nhân là lực hút tĩnh điện giữa các proton và neutron.', v: 'Neutron không mang điện nên không thể là lực tĩnh điện. Đó là lực tương tác mạnh.' },
{ cd: 'Vật lí hạt nhân', m: 2, a: true,  t: 'Một đơn vị khối lượng nguyên tử u tương đương 931,5 MeV/c².', v: 'Đây là hệ số quy đổi bắt buộc thuộc để tính năng lượng liên kết.' },
{ cd: 'Vật lí hạt nhân', m: 3, a: true,  t: 'Độ phóng xạ của một mẫu chất giảm theo thời gian với cùng chu kì bán rã như số hạt nhân.', v: 'H = λN nên H cũng tuân theo quy luật H = H₀·2^(−t/T).' },
{ cd: 'Vật lí hạt nhân', m: 2, a: true,  t: 'Đơn vị của độ phóng xạ trong hệ SI là becquerel (Bq), bằng một phân rã trên giây.', v: 'Một curie (Ci) bằng 3,7·10¹⁰ Bq.' },
{ cd: 'Vật lí hạt nhân', m: 3, a: true,  t: 'Sau ba chu kì bán rã, lượng chất phóng xạ còn lại bằng một phần tám lượng ban đầu.', v: '1/2³ = 1/8; phần đã phân rã là 7/8.' },
{ cd: 'Vật lí hạt nhân', m: 3, a: false, t: 'Sau ba chu kì bán rã, lượng chất phóng xạ đã phân rã bằng một phần tám lượng ban đầu.', v: 'Đã phân rã là 7/8. Còn LẠI mới là 1/8.' },
{ cd: 'Vật lí hạt nhân', m: 2, a: true,  t: 'Phương pháp xác định tuổi cổ vật bằng carbon-14 dựa trên quy luật phân rã phóng xạ.', v: 'Chu kì bán rã của ¹⁴C khoảng 5730 năm, phù hợp với thang thời gian khảo cổ.' },
{ cd: 'Vật lí hạt nhân', m: 2, a: true,  t: 'Năng lượng Mặt Trời có nguồn gốc từ phản ứng nhiệt hạch.', v: 'Các hạt nhân hydrogen kết hợp thành helium trong lõi Mặt Trời.' },
{ cd: 'Vật lí hạt nhân', m: 2, a: false, t: 'Nhà máy điện hạt nhân hiện nay hoạt động dựa trên phản ứng nhiệt hạch có điều khiển.', v: 'Hiện nay dùng phản ứng PHÂN HẠCH có điều khiển. Nhiệt hạch có điều khiển vẫn đang nghiên cứu.' },
{ cd: 'Vật lí hạt nhân', m: 2, a: true,  t: 'Trong lò phản ứng hạt nhân, các thanh điều khiển có tác dụng hấp thụ bớt neutron để giữ hệ số nhân neutron bằng 1.', v: 'Nhờ vậy phản ứng dây chuyền diễn ra ổn định, không bùng nổ.' },

/* --- Lớp 10 – 11 (bổ sung) --- */
{ cd: 'Lớp 10 – 11', m: 2, a: true,  t: 'Trong chuyển động tròn đều, gia tốc luôn hướng vào tâm và độ lớn vận tốc không đổi.', v: 'Gia tốc hướng tâm chỉ làm đổi hướng vận tốc, không đổi độ lớn.' },
{ cd: 'Lớp 10 – 11', m: 2, a: false, t: 'Trong chuyển động tròn đều, vật không có gia tốc vì tốc độ không đổi.', v: 'Vẫn có gia tốc hướng tâm vì HƯỚNG của vận tốc luôn thay đổi.' },
{ cd: 'Lớp 10 – 11', m: 2, a: true,  t: 'Hai vật rơi tự do từ cùng độ cao sẽ chạm đất cùng lúc bất kể khối lượng.', v: 'Gia tốc rơi tự do g không phụ thuộc khối lượng, với điều kiện bỏ qua sức cản không khí.' },
{ cd: 'Lớp 10 – 11', m: 2, a: true,  t: 'Định luật III Newton phát biểu rằng lực và phản lực có cùng độ lớn, ngược chiều và đặt vào hai vật khác nhau.', v: 'Vì đặt vào hai vật khác nhau nên chúng không triệt tiêu lẫn nhau.' },
{ cd: 'Lớp 10 – 11', m: 2, a: false, t: 'Lực và phản lực trong định luật III Newton triệt tiêu lẫn nhau nên vật đứng yên.', v: 'Chúng đặt vào HAI VẬT KHÁC NHAU nên không thể triệt tiêu.' },
{ cd: 'Lớp 10 – 11', m: 2, a: true,  t: 'Cơ năng của vật được bảo toàn khi vật chỉ chịu tác dụng của lực thế.', v: 'Nếu có ma sát thì một phần cơ năng chuyển thành nhiệt và cơ năng giảm.' },
{ cd: 'Lớp 10 – 11', m: 2, a: true,  t: 'Trong dao động điều hoà, động năng và thế năng biến thiên tuần hoàn với tần số gấp đôi tần số dao động.', v: 'Còn cơ năng toàn phần thì không đổi theo thời gian.' },
{ cd: 'Lớp 10 – 11', m: 2, a: true,  t: 'Hai nguồn sóng kết hợp phải có cùng tần số và độ lệch pha không đổi theo thời gian.', v: 'Đây là điều kiện để xảy ra hiện tượng giao thoa ổn định.' },
{ cd: 'Lớp 10 – 11', m: 2, a: true,  t: 'Sóng âm không truyền được trong chân không.', v: 'Sóng âm là sóng cơ, cần môi trường vật chất để lan truyền.' },
{ cd: 'Lớp 10 – 11', m: 2, a: false, t: 'Sóng âm truyền trong chân không nhanh hơn trong không khí.', v: 'Sóng âm hoàn toàn KHÔNG truyền được trong chân không.' },
{ cd: 'Lớp 10 – 11', m: 2, a: true,  t: 'Trong đoạn mạch chỉ chứa điện trở thuần, cường độ dòng điện tỉ lệ thuận với hiệu điện thế.', v: 'Định luật Ohm: I = U/R.' },
{ cd: 'Lớp 10 – 11', m: 2, a: true,  t: 'Suất điện động của nguồn điện đặc trưng cho khả năng thực hiện công của nguồn để dịch chuyển điện tích.', v: 'ξ = A/q, đơn vị vôn.' },
{ cd: 'Lớp 10 – 11', m: 2, a: false, t: 'Hiệu điện thế giữa hai cực của nguồn điện luôn bằng suất điện động của nguồn.', v: 'Chỉ bằng nhau khi mạch hở. Khi có dòng chạy qua thì U = ξ − I·r.' },
{ cd: 'Lớp 10 – 11', m: 2, a: true,  t: 'Điện trở của kim loại tăng khi nhiệt độ tăng.', v: 'Dao động nhiệt của ion trong mạng tinh thể cản trở dòng electron nhiều hơn.' },
{ cd: 'Lớp 10 – 11', m: 2, a: false, t: 'Điện trở của kim loại giảm khi nhiệt độ tăng.', v: 'Kim loại thì TĂNG. Chất bán dẫn mới có điện trở giảm khi nhiệt độ tăng.' },

/* ========== BỔ SUNG MỨC 3–4: VẬN DỤNG & VẬN DỤNG CAO ========== */
{ cd: 'Vật lí nhiệt', m: 4, a: true,  t: 'Trộn hai lượng nước có khối lượng bằng nhau ở 20 °C và 80 °C thì nhiệt độ cân bằng là 50 °C.', v: 'Cùng chất, cùng khối lượng nên m·c triệt tiêu: t = (20 + 80)/2 = 50 °C.' },
{ cd: 'Vật lí nhiệt', m: 4, a: false, t: 'Trộn 1 kg nước ở 100 °C với 1 kg nước đá ở 0 °C thì nước đá không tan hết.', v: 'Nước toả 4200·1·100 = 420 000 J, chỉ cần 334 000 J là tan hết đá; còn dư 86 000 J nên hỗn hợp ấm lên khoảng 10 °C.' },
{ cd: 'Vật lí nhiệt', m: 4, a: false, t: 'Một động cơ nhiệt hoạt động giữa hai nguồn 600 K và 300 K có thể đạt hiệu suất 60 %.', v: 'Hiệu suất cực đại (Carnot) H = 1 − 300/600 = 50 %. Không máy nào vượt được giới hạn này.' },
{ cd: 'Vật lí nhiệt', m: 4, a: true,  t: 'Sau một chu trình khép kín, độ biến thiên nội năng bằng 0 nên nhiệt lượng khí nhận đúng bằng công khí sinh ra.', v: 'ΔU = 0 ⇒ Q = −A, tức nhiệt nhận vào chuyển hết thành công có ích của chu trình.' },
{ cd: 'Vật lí nhiệt', m: 3, a: true,  t: 'Muốn đun 2 kg nước từ 25 °C lên 100 °C cần khoảng 630 kJ nhiệt lượng.', v: 'Q = m·c·Δt = 2·4200·75 = 630 000 J = 630 kJ.' },
{ cd: 'Khí lí tưởng', m: 4, a: true,  t: 'Nung nóng đẳng tích một lượng khí từ 27 °C lên 327 °C thì áp suất tăng gấp đôi.', v: 'Đổi Kelvin: 300 K → 600 K. Đẳng tích p ∝ T nên áp suất tăng 2 lần.' },
{ cd: 'Khí lí tưởng', m: 4, a: false, t: 'Nung nóng đẳng tích một lượng khí từ 27 °C lên 54 °C thì áp suất tăng gấp đôi.', v: 'Phải dùng Kelvin: 300 K → 327 K, áp suất chỉ tăng 1,09 lần. Đây là bẫy quen thuộc của đề thi.' },
{ cd: 'Khí lí tưởng', m: 4, a: true,  t: 'Ở cùng nhiệt độ và áp suất, 1 g khí H₂ chiếm thể tích lớn hơn 1 g khí O₂ khoảng 16 lần.', v: 'Cùng khối lượng nhưng M(H₂) = 2, M(O₂) = 32 nên số mol H₂ gấp 16 lần; V ∝ n.' },
{ cd: 'Khí lí tưởng', m: 4, a: true,  t: 'Động năng tịnh tiến trung bình của phân tử khí lí tưởng chỉ phụ thuộc nhiệt độ, không phụ thuộc loại khí.', v: 'W̄đ = (3/2)kT, chỉ chứa T nên mọi khí ở cùng nhiệt độ đều có động năng trung bình như nhau.' },
{ cd: 'Khí lí tưởng', m: 4, a: false, t: 'Ở cùng nhiệt độ, phân tử O₂ và phân tử H₂ chuyển động với tốc độ trung bình bằng nhau.', v: 'Cùng động năng nhưng m khác nhau: v ∝ 1/√m nên H₂ nhanh hơn O₂ khoảng 4 lần.' },
{ cd: 'Khí lí tưởng', m: 3, a: true,  t: 'Nén đẳng nhiệt một lượng khí xuống còn 1/3 thể tích thì áp suất tăng 3 lần.', v: 'Định luật Boyle: pV = hằng số nên V giảm bao nhiêu lần thì p tăng bấy nhiêu lần.' },
{ cd: 'Từ trường', m: 4, a: true,  t: 'Khung dây 100 vòng có từ thông qua mỗi vòng giảm đều từ 0,02 Wb về 0 trong 0,1 s thì suất điện động cảm ứng có độ lớn 20 V.', v: '|e| = N·|ΔΦ|/Δt = 100·0,02/0,1 = 20 V.' },
{ cd: 'Từ trường', m: 4, a: true,  t: 'Khi tăng điện áp truyền tải lên 10 lần mà giữ nguyên công suất truyền đi thì công suất hao phí trên đường dây giảm 100 lần.', v: 'ΔP = P²R/(U²cos²φ) tỉ lệ nghịch với U², nên U tăng 10 lần thì ΔP giảm 10² = 100 lần.' },
{ cd: 'Từ trường', m: 4, a: false, t: 'Máy biến áp lí tưởng làm tăng điện áp thì đồng thời làm tăng công suất truyền tải.', v: 'Máy biến áp lí tưởng bảo toàn công suất: U₁I₁ = U₂I₂. Tăng áp thì dòng giảm tương ứng.' },
{ cd: 'Từ trường', m: 4, a: false, t: 'Lực từ tác dụng lên đoạn dây mang dòng điện đặt song song với đường sức từ đạt giá trị lớn nhất.', v: 'F = BIℓsinα; song song thì α = 0 nên F = 0. Lực lớn nhất khi dây vuông góc với đường sức.' },
{ cd: 'Từ trường', m: 3, a: true,  t: 'Dòng điện xoay chiều có cường độ hiệu dụng 2 A thì cường độ cực đại là 2√2 ≈ 2,83 A.', v: 'I₀ = I√2. Ampe kế và vôn kế xoay chiều luôn chỉ giá trị hiệu dụng.' },
{ cd: 'Vật lí hạt nhân', m: 4, a: true,  t: 'Một mẫu chất phóng xạ sau 3 chu kì bán rã chỉ còn lại 12,5 % số hạt nhân ban đầu.', v: 'N = N₀/2³ = N₀/8 = 12,5 %.' },
{ cd: 'Vật lí hạt nhân', m: 4, a: true,  t: 'Sau thời gian bằng 2 chu kì bán rã, số hạt nhân đã bị phân rã chiếm 75 % số hạt ban đầu.', v: 'Còn lại 1/4 = 25 %, vậy đã phân rã 75 %.' },
{ cd: 'Vật lí hạt nhân', m: 4, a: false, t: 'Muốn so sánh độ bền vững của hai hạt nhân, ta so tổng năng lượng liên kết của chúng.', v: 'Phải so năng lượng liên kết RIÊNG (trên mỗi nucleon). Hạt nhân nặng có tổng năng lượng liên kết lớn nhưng chưa chắc bền hơn Fe-56.' },
{ cd: 'Vật lí hạt nhân', m: 4, a: true,  t: 'Tính trên mỗi nucleon, phản ứng nhiệt hạch toả năng lượng lớn hơn phản ứng phân hạch.', v: 'Đó là lí do nhiệt hạch được coi là nguồn năng lượng tương lai, dù điều kiện nhiệt độ rất khắt khe.' },
{ cd: 'Vật lí hạt nhân', m: 3, a: true,  t: 'Độ phóng xạ của một mẫu giảm theo thời gian đúng cùng quy luật hàm mũ với số hạt nhân còn lại.', v: 'H = λN nên H = H₀·2^(−t/T), giống hệt công thức của N.' },
{ cd: 'Lớp 10 – 11', m: 3, a: true,  t: 'Trong dao động điều hoà, vận tốc sớm pha π/2 so với li độ còn gia tốc ngược pha với li độ.', v: 'x = Acos(ωt+φ), v = −ωAsin(...), a = −ω²x. Quan hệ pha này là gốc của mọi bài dao động.' },
{ cd: 'Lớp 10 – 11', m: 3, a: false, t: 'Tại vị trí biên, vật dao động điều hoà có tốc độ cực đại.', v: 'Tại biên tốc độ bằng 0 và gia tốc mới cực đại. Tốc độ cực đại ở vị trí cân bằng.' },
{ cd: 'Lớp 10 – 11', m: 4, a: true,  t: 'Tăng chiều dài con lắc đơn lên 4 lần thì chu kì dao động tăng 2 lần.', v: 'T = 2π√(ℓ/g) nên T ∝ √ℓ; ℓ tăng 4 lần thì T tăng √4 = 2 lần.' },
{ cd: 'Lớp 10 – 11', m: 3, a: true,  t: 'Chu kì con lắc đơn không phụ thuộc khối lượng vật nặng và biên độ (khi biên độ nhỏ).', v: 'Chỉ phụ thuộc chiều dài dây và gia tốc trọng trường nơi treo con lắc.' },
{ cd: 'Lớp 10 – 11', m: 3, a: true,  t: 'Với hai nguồn kết hợp cùng pha, điểm có hiệu đường đi bằng số nguyên lần bước sóng sẽ dao động với biên độ cực đại.', v: 'd₂ − d₁ = kλ là cực đại; d₂ − d₁ = (k + 0,5)λ là cực tiểu.' },
{ cd: 'Lớp 10 – 11', m: 3, a: true,  t: 'Sóng dừng trên dây hai đầu cố định có chiều dài bằng số nguyên lần nửa bước sóng.', v: 'ℓ = kλ/2. Nếu một đầu tự do thì ℓ = (2k+1)λ/4.' },
{ cd: 'Lớp 10 – 11', m: 3, a: false, t: 'Khoảng cách giữa hai nút sóng liên tiếp trong sóng dừng bằng một bước sóng.', v: 'Bằng NỬA bước sóng. Khoảng cách nút – bụng gần nhất mới là λ/4.' },
{ cd: 'Lớp 10 – 11', m: 3, a: true,  t: 'Trong mạch RLC nối tiếp xảy ra cộng hưởng, tổng trở nhỏ nhất và bằng đúng điện trở thuần R.', v: 'Khi Z_L = Z_C thì Z = R, dòng điện hiệu dụng đạt cực đại I = U/R và u cùng pha với i.' },
{ cd: 'Lớp 10 – 11', m: 3, a: true,  t: 'Công suất tiêu thụ của mạch RLC nối tiếp là P = UIcosφ và chỉ toả nhiệt trên điện trở thuần.', v: 'Cuộn cảm thuần và tụ điện không tiêu thụ điện năng, chỉ trao đổi năng lượng với nguồn.' },
{ cd: 'Lớp 10 – 11', m: 3, a: false, t: 'Tia hồng ngoại có bước sóng nhỏ hơn tia tử ngoại.', v: 'Hồng ngoại có bước sóng LỚN hơn ánh sáng đỏ, còn tử ngoại nhỏ hơn ánh sáng tím.' },
{ cd: 'Lớp 10 – 11', m: 3, a: true,  t: 'Sắp theo bước sóng giảm dần: sóng vô tuyến, hồng ngoại, ánh sáng nhìn thấy, tử ngoại, tia X, tia gamma.', v: 'Bước sóng giảm thì tần số và năng lượng photon tăng.' },
{ cd: 'Lớp 10 – 11', m: 3, a: true,  t: 'Hiện tượng quang điện ngoài chỉ xảy ra khi bước sóng ánh sáng kích thích nhỏ hơn hoặc bằng giới hạn quang điện.', v: 'Điều kiện λ ≤ λ₀ với λ₀ = hc/A, A là công thoát của kim loại.' },
{ cd: 'Lớp 10 – 11', m: 3, a: false, t: 'Chiếu ánh sáng có cường độ càng lớn thì càng dễ gây ra hiện tượng quang điện.', v: 'Quang điện phụ thuộc BƯỚC SÓNG chứ không phụ thuộc cường độ. Cường độ chỉ quyết định số electron bật ra khi đã xảy ra hiện tượng.' },
{ cd: 'Lớp 10 – 11', m: 4, a: true,  t: 'Giảm bước sóng ánh sáng kích thích thì động năng ban đầu cực đại của electron quang điện tăng.', v: 'hc/λ = A + Wđmax; λ giảm ⇒ năng lượng photon tăng ⇒ phần dư thành động năng tăng.' }
);

{ cd: 'Di truyền phân tử', m: 1, a: false, t: 'Đơn phân cấu tạo nên phân tử DNA là các amino acid.', v: 'Amino acid là đơn phân của PROTEIN. DNA cấu tạo từ nucleotide.' },
{ cd: 'Di truyền phân tử', m: 1, a: true,  t: 'Trong phân tử DNA mạch kép, A liên kết với T bằng 2 liên kết hydrogen và G liên kết với C bằng 3 liên kết hydrogen.', v: 'Nhờ vậy DNA giàu G–C thì bền nhiệt hơn.' },

{ cd: 'Di truyền phân tử', m: 2, a: false, t: 'Mã di truyền có tính thoái hoá nghĩa là một bộ ba có thể mã hoá nhiều amino acid khác nhau.', v: 'Ngược lại — nhiều bộ ba cùng mã hoá MỘT amino acid. Mỗi bộ ba chỉ mã hoá một amino acid, đó là tính đặc hiệu.' },
{ cd: 'Di truyền phân tử', m: 2, a: true,  t: 'Bộ ba mở đầu trên mRNA là AUG, mã hoá amino acid methionine.', v: 'Ba bộ ba kết thúc là UAA, UAG, UGA và không mã hoá amino acid nào.' },

{ cd: 'Di truyền phân tử', m: 3, a: true,  t: 'Đột biến thay thế một cặp nucleotide không làm thay đổi chiều dài của gene.', v: 'Chỉ đột biến thêm hoặc mất nucleotide mới làm thay đổi chiều dài.' },
{ cd: 'Di truyền phân tử', m: 3, a: true,  t: 'Đột biến thêm hoặc mất một cặp nucleotide gây hậu quả nghiêm trọng nhất vì làm dịch khung đọc.', v: 'Toàn bộ các bộ ba từ vị trí đột biến trở đi đều bị thay đổi.' },
{ cd: 'Di truyền phân tử', m: 3, a: false, t: 'Đột biến thay thế một cặp nucleotide luôn làm thay đổi cấu trúc protein.', v: 'Do mã di truyền thoái hoá, nhiều trường hợp bộ ba mới vẫn mã hoá cùng amino acid (đột biến câm).' },
{ cd: 'Di truyền phân tử', m: 2, a: true,  t: 'Phiên mã là quá trình tổng hợp RNA dựa trên mạch khuôn của gene, còn dịch mã là quá trình tổng hợp protein.', v: 'Phiên mã diễn ra trong nhân, dịch mã diễn ra ở ribosome trong tế bào chất.' },
{ cd: 'Di truyền phân tử', m: 2, a: true,  t: 'RNA khác DNA ở chỗ có đường ribose và chứa base uracil thay cho thymine.', v: 'RNA cũng thường có mạch đơn thay vì mạch kép.' },
{ cd: 'Di truyền phân tử', m: 2, a: true,  t: 'Gene là một đoạn của phân tử DNA mang thông tin mã hoá cho một sản phẩm xác định.', v: 'Sản phẩm có thể là chuỗi polypeptide hoặc một phân tử RNA.' },

{ cd: 'Di truyền NST', m: 2, a: true,  t: 'Thể ba nhiễm có bộ nhiễm sắc thể dạng 2n + 1.', v: 'Ví dụ hội chứng Down ở người là thể ba cặp số 21, có 47 nhiễm sắc thể.' },
{ cd: 'Di truyền NST', m: 2, a: false, t: 'Thể ba nhiễm có bộ nhiễm sắc thể dạng 3n.', v: '3n là thể TAM BỘI (đột biến đa bội). Thể ba là 2n + 1, chỉ thừa một chiếc ở một cặp.' },
{ cd: 'Di truyền NST', m: 2, a: true,  t: 'Đột biến đa bội lẻ như 3n thường làm cây bất thụ nên tạo quả không hạt.', v: 'Bộ nhiễm sắc thể lẻ không phân li đều trong giảm phân. Ứng dụng tạo dưa hấu, chuối không hạt.' },
{ cd: 'Di truyền NST', m: 2, a: true,  t: 'Đột biến đa bội phổ biến ở thực vật hơn ở động vật.', v: 'Ở động vật đa bội thường gây rối loạn cơ chế xác định giới tính và gây chết.' },
{ cd: 'Di truyền NST', m: 2, a: true,  t: 'Hội chứng Turner ở người có bộ nhiễm sắc thể giới tính XO với tổng số 45 nhiễm sắc thể.', v: 'Còn hội chứng Klinefelter là XXY với 47 nhiễm sắc thể.' },
{ cd: 'Di truyền NST', m: 3, a: true,  t: 'Trao đổi chéo giữa các chromatid xảy ra ở kì đầu của giảm phân I và là cơ sở của hoán vị gene.', v: 'Sự kiện này tạo ra các tổ hợp gene mới trên cùng một nhiễm sắc thể.' },
{ cd: 'Di truyền NST', m: 3, a: false, t: 'Hoán vị gene xảy ra do trao đổi chéo giữa các nhiễm sắc thể không tương đồng.', v: 'Trao đổi chéo xảy ra giữa các chromatid của cặp nhiễm sắc thể TƯƠNG ĐỒNG.' },
{ cd: 'Di truyền NST', m: 3, a: true,  t: 'Tần số hoán vị gene không bao giờ vượt quá 50%.', v: 'Vì chỉ hai trong bốn chromatid tham gia trao đổi chéo tại một điểm.' },

{ cd: 'Di truyền NST', m: 3, a: true,  t: 'Tần số hoán vị gene phản ánh khoảng cách tương đối giữa hai gene trên nhiễm sắc thể.', v: 'Hai gene càng xa nhau thì tần số hoán vị càng lớn — đây là cơ sở lập bản đồ di truyền.' },
{ cd: 'Di truyền NST', m: 2, a: true,  t: 'Liên kết gene hoàn toàn làm hạn chế sự xuất hiện của biến dị tổ hợp.', v: 'Các gene trên cùng nhiễm sắc thể di truyền cùng nhau thành một nhóm.' },
{ cd: 'Di truyền NST', m: 3, a: true,  t: 'Bệnh mù màu và bệnh máu khó đông do gene lặn nằm trên nhiễm sắc thể X quy định nên biểu hiện nhiều ở nam giới.', v: 'Nam chỉ có một nhiễm sắc thể X nên chỉ cần một allele lặn là biểu hiện bệnh.' },
{ cd: 'Di truyền NST', m: 3, a: false, t: 'Bệnh mù màu biểu hiện ở nữ nhiều hơn ở nam.', v: 'Ngược lại — nam giới chỉ có một X nên dễ biểu hiện hơn nhiều.' },
{ cd: 'Di truyền NST', m: 3, a: true,  t: 'Di truyền qua tế bào chất cho kết quả lai thuận khác lai nghịch và đời con luôn có kiểu hình giống mẹ.', v: 'Gene nằm trong ti thể hoặc lục lạp, được truyền qua tế bào chất của trứng.' },
{ cd: 'Di truyền NST', m: 3, a: false, t: 'Gene nằm trong ti thể tuân theo các quy luật di truyền của Mendel.', v: 'Không — di truyền ngoài nhân theo dòng mẹ, không phân li theo quy luật Mendel.' },
{ cd: 'Di truyền NST', m: 2, a: true,  t: 'Phép lai phân tích là phép lai giữa cá thể mang kiểu hình trội với cá thể đồng hợp lặn.', v: 'Dùng để xác định kiểu gene của cá thể trội là đồng hợp hay dị hợp.' },
{ cd: 'Di truyền NST', m: 2, a: true,  t: 'Cơ thể dị hợp về n cặp gene phân li độc lập tạo ra 2ⁿ loại giao tử.', v: 'Đời con tự thụ cho 3ⁿ loại kiểu gene và 2ⁿ loại kiểu hình nếu trội hoàn toàn.' },

{ cd: 'Di truyền phân tử', m: 3, a: true,  t: 'Khi môi trường có lactose, lactose đóng vai trò chất cảm ứng làm protein ức chế mất khả năng bám vào vùng vận hành.', v: 'Nhờ đó các gene cấu trúc được phiên mã.' },
{ cd: 'Di truyền phân tử', m: 2, a: false, t: 'Vùng khởi động P của operon là nơi protein ức chế bám vào.', v: 'Protein ức chế bám vào vùng VẬN HÀNH O. Vùng P là nơi RNA polymerase bám vào.' },
{ cd: 'Di truyền phân tử', m: 2, a: true,  t: 'Một gene có thể nhân đôi nhiều lần nhưng số lần phiên mã của các gene khác nhau trong cùng tế bào có thể rất khác nhau.', v: 'Đó là biểu hiện của điều hoà hoạt động gene.' },
{ cd: 'Di truyền phân tử', m: 2, a: true,  t: 'Ở sinh vật nhân thực, quá trình phiên mã và dịch mã diễn ra tách biệt về không gian và thời gian.', v: 'Phiên mã trong nhân, dịch mã ở tế bào chất. Ở sinh vật nhân sơ thì hai quá trình gần như đồng thời.' },
{ cd: 'Di truyền phân tử', m: 2, a: false, t: 'Ở sinh vật nhân sơ, quá trình dịch mã chỉ bắt đầu sau khi phiên mã đã hoàn tất.', v: 'Ở nhân sơ không có màng nhân nên dịch mã có thể bắt đầu ngay khi mRNA còn đang được phiên mã.' },
{ cd: 'Di truyền phân tử', m: 3, a: true,  t: 'Nhiều ribosome có thể cùng dịch mã trên một phân tử mRNA tạo thành polysome.', v: 'Nhờ vậy tế bào tổng hợp nhanh nhiều chuỗi polypeptide giống nhau.' },

/* --- Di truyền NST (bổ sung) --- */
{ cd: 'Di truyền NST', m: 2, a: true,  t: 'Đột biến mất đoạn nhiễm sắc thể thường gây hậu quả nghiêm trọng vì làm mất cân bằng gene.', v: 'Được ứng dụng để loại bỏ gene xấu hoặc lập bản đồ gene.' },
{ cd: 'Di truyền NST', m: 2, a: true,  t: 'Đột biến lặp đoạn làm tăng số lượng bản sao của gene trên nhiễm sắc thể.', v: 'Ví dụ lặp đoạn ở lúa mạch làm tăng hoạt tính enzyme amylase, có lợi cho công nghiệp bia.' },
{ cd: 'Di truyền NST', m: 2, a: true,  t: 'Đột biến đảo đoạn làm thay đổi trật tự gene nhưng không làm thay đổi số lượng gene trên nhiễm sắc thể.', v: 'Có thể gây giảm khả năng sinh sản ở thể dị hợp đảo đoạn.' },
{ cd: 'Di truyền NST', m: 2, a: false, t: 'Đột biến chuyển đoạn giữa hai nhiễm sắc thể không tương đồng không ảnh hưởng đến khả năng sinh sản.', v: 'Chuyển đoạn thường làm giảm mạnh khả năng sinh sản do rối loạn phân li trong giảm phân.' },
{ cd: 'Di truyền NST', m: 2, a: true,  t: 'Nhiễm sắc thể ở sinh vật nhân thực được cấu tạo từ DNA và protein histone.', v: 'Đơn vị cơ bản là nucleosome gồm đoạn DNA quấn quanh khối 8 phân tử histone.' },
{ cd: 'Di truyền NST', m: 3, a: true,  t: 'Nếu một cặp nhiễm sắc thể không phân li trong giảm phân I thì tạo ra giao tử thừa hoặc thiếu một nhiễm sắc thể.', v: 'Giao tử n+1 và n−1 kết hợp với giao tử bình thường sẽ tạo thể ba hoặc thể một.' },
{ cd: 'Di truyền NST', m: 2, a: true,  t: 'Ở người, bộ nhiễm sắc thể lưỡng bội có 46 chiếc, gồm 44 nhiễm sắc thể thường và 2 nhiễm sắc thể giới tính.', v: 'Nữ là XX, nam là XY.' },
{ cd: 'Di truyền NST', m: 2, a: false, t: 'Ở chim và bướm, con đực có cặp nhiễm sắc thể giới tính XY.', v: 'Ngược lại — ở chim, bướm thì con ĐỰC là XX (ZZ) còn con CÁI là XY (ZW).' },

/* --- Tiến hoá (bổ sung) --- */
{ cd: 'Tiến hoá', m: 2, a: true,  t: 'Theo Darwin, chọn lọc tự nhiên giữ lại những cá thể thích nghi nhất với môi trường sống.', v: 'Kết quả là hình thành các đặc điểm thích nghi và loài mới.' },
{ cd: 'Tiến hoá', m: 3, a: true,  t: 'Di – nhập gene làm cho vốn gene của hai quần thể trở nên giống nhau hơn.', v: 'Sự trao đổi cá thể làm giảm khác biệt di truyền giữa các quần thể.' },
{ cd: 'Tiến hoá', m: 3, a: false, t: 'Di – nhập gene luôn làm tăng sự khác biệt di truyền giữa các quần thể.', v: 'Ngược lại — nó làm các quần thể GIỐNG nhau hơn về vốn gene.' },
{ cd: 'Tiến hoá', m: 3, a: true,  t: 'Chọn lọc tự nhiên chống lại allele lặn diễn ra chậm hơn nhiều so với chống lại allele trội.', v: 'Allele lặn ẩn trong thể dị hợp nên không bị chọn lọc đào thải trực tiếp.' },
{ cd: 'Tiến hoá', m: 2, a: true,  t: 'Cách li địa lí không trực tiếp tạo ra loài mới mà chỉ duy trì sự khác biệt về vốn gene giữa các quần thể.', v: 'Loài mới chỉ hình thành khi xuất hiện cách li sinh sản.' },
{ cd: 'Tiến hoá', m: 2, a: false, t: 'Cách li địa lí luôn dẫn đến hình thành loài mới.', v: 'Không nhất thiết — chỉ khi tích luỹ đủ khác biệt để dẫn tới cách li SINH SẢN.' },
{ cd: 'Tiến hoá', m: 2, a: true,  t: 'Cách li trước hợp tử ngăn cản sự thụ tinh tạo hợp tử, còn cách li sau hợp tử làm con lai không sống được hoặc bất thụ.', v: 'Cách li tập tính, thời gian, nơi ở, cơ học đều thuộc trước hợp tử.' },
{ cd: 'Tiến hoá', m: 2, a: true,  t: 'Bằng chứng tế bào học cho thấy mọi sinh vật đều được cấu tạo từ tế bào.', v: 'Kết hợp với bằng chứng sinh học phân tử về mã di truyền chung, đây là chứng cứ mạnh cho nguồn gốc chung.' },

/* --- Sinh thái (bổ sung) --- */
{ cd: 'Sinh thái học', m: 2, a: true,  t: 'Giới hạn sinh thái là khoảng giá trị của một nhân tố sinh thái mà trong đó sinh vật có thể tồn tại và phát triển.', v: 'Ngoài giới hạn đó sinh vật sẽ chết.' },
{ cd: 'Sinh thái học', m: 2, a: true,  t: 'Loài có giới hạn sinh thái rộng với nhiều nhân tố thường có vùng phân bố rộng.', v: 'Ngược lại, loài hẹp sinh thái chỉ phân bố ở vùng hạn chế.' },
{ cd: 'Sinh thái học', m: 2, a: true,  t: 'Nhân tố sinh thái hữu sinh gồm các mối quan hệ giữa sinh vật với sinh vật, trong đó con người là nhân tố có ảnh hưởng lớn nhất.', v: 'Nhân tố vô sinh gồm khí hậu, thổ nhưỡng, nước, địa hình.' },
{ cd: 'Sinh thái học', m: 3, a: true,  t: 'Lưới thức ăn càng phức tạp thì hệ sinh thái càng ổn định.', v: 'Nhiều đường truyền năng lượng thay thế nhau khi một mắt xích bị suy giảm.' },
{ cd: 'Sinh thái học', m: 3, a: false, t: 'Hệ sinh thái có chuỗi thức ăn càng dài thì hiệu suất truyền năng lượng càng cao.', v: 'Ngược lại — chuỗi càng dài thì năng lượng đến bậc cuối càng ít do hao hụt qua mỗi bậc.' },
{ cd: 'Sinh thái học', m: 2, a: true,  t: 'Hệ sinh thái gồm quần xã sinh vật và sinh cảnh, có khả năng tự điều chỉnh.', v: 'Khả năng tự điều chỉnh có giới hạn nhất định.' },
{ cd: 'Sinh thái học', m: 2, a: true,  t: 'Sinh vật phân giải có vai trò chuyển hoá chất hữu cơ thành chất vô cơ trả lại môi trường.', v: 'Nhờ vậy chu trình vật chất được khép kín.' },
{ cd: 'Sinh thái học', m: 2, a: false, t: 'Trong hệ sinh thái, sinh vật phân giải thuộc bậc dinh dưỡng cấp 1.', v: 'Bậc dinh dưỡng cấp 1 là sinh vật SẢN XUẤT. Sinh vật phân giải không xếp vào bậc dinh dưỡng của chuỗi.' },
{ cd: 'Sinh thái học', m: 2, a: true,  t: 'Hiệu ứng nhà kính tăng lên chủ yếu do lượng khí CO₂ trong khí quyển tăng.', v: 'Nguyên nhân là đốt nhiên liệu hoá thạch và phá rừng.' },
{ cd: 'Sinh thái học', m: 2, a: true,  t: 'Phát triển bền vững đòi hỏi khai thác tài nguyên hợp lí đi đôi với bảo vệ môi trường.', v: 'Đáp ứng nhu cầu hiện tại mà không làm tổn hại khả năng đáp ứng của thế hệ tương lai.' },

/* --- Sinh 10 – 11 (bổ sung) --- */
{ cd: 'Sinh 10 – 11', m: 2, a: true,  t: 'Nước được vận chuyển từ rễ lên lá chủ yếu nhờ lực hút do thoát hơi nước ở lá.', v: 'Kết hợp với lực đẩy của rễ và lực liên kết giữa các phân tử nước trong mạch gỗ.' },
{ cd: 'Sinh 10 – 11', m: 2, a: true,  t: 'Khí khổng đóng lại khi cây thiếu nước, làm giảm thoát hơi nước nhưng cũng làm giảm quang hợp.', v: 'Vì CO₂ không vào được lá.' },
{ cd: 'Sinh 10 – 11', m: 2, a: true,  t: 'Ở thực vật, mạch gỗ vận chuyển nước và muối khoáng còn mạch rây vận chuyển chất hữu cơ.', v: 'Mạch gỗ đi lên, mạch rây đi từ lá xuống các cơ quan khác.' },
{ cd: 'Sinh 10 – 11', m: 2, a: false, t: 'Mạch rây ở thực vật có chức năng vận chuyển nước và muối khoáng từ rễ lên lá.', v: 'Đó là chức năng của MẠCH GỖ. Mạch rây vận chuyển chất hữu cơ.' },
{ cd: 'Sinh 10 – 11', m: 2, a: true,  t: 'Tế bào nhân thực có màng nhân bao bọc vật chất di truyền còn tế bào nhân sơ thì không.', v: 'Tế bào nhân sơ cũng không có các bào quan có màng như ti thể, lục lạp.' },
{ cd: 'Sinh 10 – 11', m: 2, a: true,  t: 'Vận chuyển chủ động các chất qua màng sinh chất cần tiêu tốn năng lượng ATP và protein vận chuyển.', v: 'Khác với khuếch tán thụ động đi theo chiều gradient nồng độ và không tốn năng lượng.' },
{ cd: 'Sinh 10 – 11', m: 2, a: false, t: 'Khuếch tán thụ động qua màng tế bào cần tiêu tốn năng lượng ATP.', v: 'Khuếch tán thụ động đi theo chiều gradient nồng độ nên KHÔNG tốn năng lượng.' }

{ cd: 'ASEAN', m: 2, a: true,  t: 'Hiệp ước Bali năm 1976 đánh dấu bước phát triển mới của ASEAN.', v: 'Hiệp ước Thân thiện và Hợp tác (TAC) xác định các nguyên tắc cơ bản trong quan hệ giữa các nước.' },
{ cd: 'ASEAN', m: 2, a: true,  t: 'Cộng đồng ASEAN chính thức thành lập ngày 31/12/2015 với ba trụ cột.', v: 'Ba trụ cột: Chính trị – An ninh, Kinh tế và Văn hoá – Xã hội.' },
{ cd: 'ASEAN', m: 2, a: false, t: 'Cộng đồng ASEAN gồm bốn trụ cột, trong đó có trụ cột Quốc phòng.', v: 'Chỉ có BA trụ cột: Chính trị – An ninh, Kinh tế, Văn hoá – Xã hội.' },
{ cd: 'ASEAN', m: 2, a: true,  t: 'Nguyên tắc đồng thuận và không can thiệp công việc nội bộ là nguyên tắc hoạt động cơ bản của ASEAN.', v: 'Mọi quyết định quan trọng đều cần sự nhất trí của tất cả thành viên.' },
{ cd: 'ASEAN', m: 2, a: true,  t: 'Hiện nay ASEAN có 10 nước thành viên chính thức.', v: 'Timor Leste đang trong tiến trình gia nhập.' },

/* ========== CÁCH MẠNG THÁNG TÁM ========== */
{ cd: 'Cách mạng tháng Tám', m: 2, a: true,  t: 'Thời cơ của Cách mạng tháng Tám xuất hiện khi Nhật đầu hàng Đồng minh ngày 15/8/1945.', v: 'Kẻ thù chính gục ngã, chính quyền tay sai hoang mang, quân Đồng minh chưa vào Đông Dương.' },
{ cd: 'Cách mạng tháng Tám', m: 2, a: false, t: 'Cách mạng tháng Tám nổ ra khi quân Đồng minh đã vào Đông Dương giải giáp quân Nhật.', v: 'Ta chủ động giành chính quyền TRƯỚC khi quân Đồng minh vào — đó chính là nắm bắt thời cơ.' },
{ cd: 'Cách mạng tháng Tám', m: 2, a: true,  t: 'Khởi nghĩa giành chính quyền thắng lợi ở Hà Nội ngày 19/8/1945.', v: 'Huế ngày 23/8 và Sài Gòn ngày 25/8.' },
{ cd: 'Cách mạng tháng Tám', m: 2, a: true,  t: 'Ngày 2/9/1945, Chủ tịch Hồ Chí Minh đọc Tuyên ngôn Độc lập khai sinh nước Việt Nam Dân chủ Cộng hoà.', v: 'Tại Quảng trường Ba Đình, Hà Nội.' },
{ cd: 'Cách mạng tháng Tám', m: 3, a: true,  t: 'Nguyên nhân quyết định thắng lợi của Cách mạng tháng Tám là sự lãnh đạo đúng đắn của Đảng.', v: 'Cùng quá trình chuẩn bị suốt 15 năm qua ba cuộc tập dượt 1930–1931, 1936–1939 và 1939–1945.' },
{ cd: 'Cách mạng tháng Tám', m: 3, a: false, t: 'Nguyên nhân quyết định thắng lợi của Cách mạng tháng Tám là do quân Đồng minh giúp đỡ.', v: 'Nhân tố quyết định là chủ quan — sự lãnh đạo của Đảng và sức mạnh của toàn dân tộc.' },
{ cd: 'Cách mạng tháng Tám', m: 2, a: true,  t: 'Mặt trận Việt Minh được thành lập năm 1941 tại Hội nghị Trung ương lần thứ 8.', v: 'Hội nghị đặt nhiệm vụ giải phóng dân tộc lên hàng đầu.' },
{ cd: 'Cách mạng tháng Tám', m: 3, a: true,  t: 'Cách mạng tháng Tám thành công đã lập ra nhà nước dân chủ nhân dân đầu tiên ở Đông Nam Á.', v: 'Cổ vũ mạnh mẽ phong trào giải phóng dân tộc ở các nước thuộc địa.' },

/* ========== KHÁNG CHIẾN CHỐNG PHÁP ========== */
{ cd: 'Kháng chiến chống Pháp', m: 2, a: true,  t: 'Ngày 19/12/1946, Chủ tịch Hồ Chí Minh ra Lời kêu gọi toàn quốc kháng chiến.', v: 'Mở đầu cuộc kháng chiến chống thực dân Pháp trên phạm vi cả nước.' },
{ cd: 'Kháng chiến chống Pháp', m: 2, a: true,  t: 'Đường lối kháng chiến chống Pháp là toàn dân, toàn diện, trường kì và tự lực cánh sinh.', v: 'Kết hợp với tranh thủ sự ủng hộ của quốc tế.' },
{ cd: 'Kháng chiến chống Pháp', m: 3, a: true,  t: 'Chiến dịch Việt Bắc thu – đông 1947 làm phá sản kế hoạch đánh nhanh thắng nhanh của Pháp.', v: 'Buộc Pháp phải chuyển sang đánh lâu dài với ta.' },
{ cd: 'Kháng chiến chống Pháp', m: 3, a: true,  t: 'Chiến dịch Biên giới thu – đông 1950 đánh dấu ta giành thế chủ động trên chiến trường chính Bắc Bộ.', v: 'Đây cũng là chiến dịch đầu tiên ta chủ động mở, khai thông biên giới Việt – Trung.' },
{ cd: 'Kháng chiến chống Pháp', m: 3, a: false, t: 'Chiến dịch Việt Bắc thu – đông 1947 đánh dấu ta giành thế chủ động trên chiến trường chính Bắc Bộ.', v: 'Mốc giành thế chủ động là chiến dịch BIÊN GIỚI 1950. Việt Bắc 1947 chỉ phá sản kế hoạch đánh nhanh thắng nhanh.' },
{ cd: 'Kháng chiến chống Pháp', m: 2, a: true,  t: 'Chiến dịch Điện Biên Phủ diễn ra từ ngày 13/3 đến 7/5/1954.', v: 'Thắng lợi này đập tan kế hoạch Nava và buộc Pháp phải kí Hiệp định Genève.' },
{ cd: 'Kháng chiến chống Pháp', m: 2, a: true,  t: 'Hiệp định Genève được kí kết ngày 21/7/1954, lấy vĩ tuyến 17 làm giới tuyến quân sự tạm thời.', v: 'Các nước tham dự cam kết tôn trọng độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ ba nước Đông Dương.' },
{ cd: 'Kháng chiến chống Pháp', m: 2, a: false, t: 'Theo Hiệp định Genève, vĩ tuyến 17 là ranh giới chính trị chia cắt lâu dài Việt Nam thành hai quốc gia.', v: 'Đó chỉ là giới tuyến quân sự TẠM THỜI, không phải ranh giới chính trị hay lãnh thổ.' },
{ cd: 'Kháng chiến chống Pháp', m: 3, a: true,  t: 'Thắng lợi Điện Biên Phủ tạo điều kiện quyết định cho thắng lợi trên bàn đàm phán ở Genève.', v: 'Thể hiện quy luật thắng lợi quân sự quyết định thắng lợi ngoại giao.' },

/* ========== KHÁNG CHIẾN CHỐNG MỸ ========== */
{ cd: 'Kháng chiến chống Mỹ', m: 2, a: true,  t: 'Phong trào Đồng khởi 1959–1960 đưa cách mạng miền Nam từ thế giữ gìn lực lượng sang thế tiến công.', v: 'Dẫn tới sự ra đời của Mặt trận Dân tộc Giải phóng miền Nam Việt Nam ngày 20/12/1960.' },
{ cd: 'Kháng chiến chống Mỹ', m: 3, a: true,  t: 'Trong chiến lược Chiến tranh đặc biệt, lực lượng chủ yếu là quân đội Sài Gòn dưới sự chỉ huy của cố vấn Mỹ.', v: 'Còn Chiến tranh cục bộ thì quân Mỹ trực tiếp tham chiến.' },
{ cd: 'Kháng chiến chống Mỹ', m: 3, a: false, t: 'Trong chiến lược Chiến tranh đặc biệt, quân viễn chinh Mỹ trực tiếp tham chiến trên chiến trường miền Nam.', v: 'Đó là đặc điểm của Chiến tranh CỤC BỘ. Chiến tranh đặc biệt dùng quân đội Sài Gòn là chính.' },
{ cd: 'Kháng chiến chống Mỹ', m: 3, a: true,  t: 'Cuộc Tổng tiến công và nổi dậy Xuân Mậu Thân 1968 buộc Mỹ phải chấp nhận đàm phán tại Paris.', v: 'Mỹ tuyên bố phi Mỹ hoá chiến tranh và ngừng ném bom miền Bắc.' },
{ cd: 'Kháng chiến chống Mỹ', m: 3, a: true,  t: 'Chiến thắng "Điện Biên Phủ trên không" tháng 12/1972 buộc Mỹ phải kí Hiệp định Paris.', v: 'Ta đánh bại cuộc tập kích chiến lược bằng máy bay B52 vào Hà Nội và Hải Phòng.' },
{ cd: 'Kháng chiến chống Mỹ', m: 2, a: true,  t: 'Hiệp định Paris được kí ngày 27/1/1973, trong đó Mỹ cam kết rút hết quân về nước.', v: 'Đồng thời tôn trọng độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam.' },
{ cd: 'Kháng chiến chống Mỹ', m: 3, a: false, t: 'Theo Hiệp định Paris năm 1973, quân đội Sài Gòn phải rút khỏi miền Nam Việt Nam.', v: 'Chỉ QUÂN MỸ và đồng minh phải rút. Quân đội Sài Gòn vẫn ở lại.' },
{ cd: 'Kháng chiến chống Mỹ', m: 3, a: true,  t: 'Ý nghĩa quan trọng nhất của Hiệp định Paris là Mỹ phải rút hết quân, tạo thời cơ để ta giải phóng miền Nam.', v: 'So sánh lực lượng trên chiến trường thay đổi có lợi cho cách mạng.' },
{ cd: 'Kháng chiến chống Mỹ', m: 2, a: true,  t: 'Đại thắng mùa Xuân 1975 gồm ba chiến dịch lớn: Tây Nguyên, Huế – Đà Nẵng và Hồ Chí Minh.', v: 'Chiến dịch Hồ Chí Minh diễn ra từ 26/4 đến 30/4/1975.' },
{ cd: 'Kháng chiến chống Mỹ', m: 2, a: true,  t: 'Chiến dịch Tây Nguyên mở màn bằng trận đánh Buôn Ma Thuột ngày 10/3/1975.', v: 'Đây là đòn điểm huyệt làm rung chuyển toàn bộ hệ thống phòng thủ của địch.' },
{ cd: 'Kháng chiến chống Mỹ', m: 3, a: true,  t: 'Thắng lợi năm 1975 kết thúc 21 năm kháng chiến chống Mỹ và hoàn thành cách mạng dân tộc dân chủ nhân dân trong cả nước.', v: 'Mở ra kỉ nguyên độc lập, thống nhất và đi lên chủ nghĩa xã hội.' },

/* ========== ĐỔI MỚI ========== */
{ cd: 'Công cuộc Đổi mới', m: 2, a: true,  t: 'Đường lối Đổi mới được đề ra tại Đại hội đại biểu toàn quốc lần thứ VI của Đảng tháng 12/1986.', v: 'Đại hội đánh dấu bước ngoặt trong tư duy về xây dựng chủ nghĩa xã hội.' },
{ cd: 'Công cuộc Đổi mới', m: 2, a: false, t: 'Đường lối Đổi mới được đề ra tại Đại hội đại biểu toàn quốc lần thứ IV của Đảng.', v: 'Là Đại hội VI (tháng 12/1986). Đại hội IV họp năm 1976.' },
{ cd: 'Công cuộc Đổi mới', m: 2, a: true,  t: 'Đổi mới bắt đầu và có trọng tâm là đổi mới về kinh tế.', v: 'Chuyển từ cơ chế tập trung quan liêu bao cấp sang kinh tế thị trường định hướng xã hội chủ nghĩa.' },
{ cd: 'Công cuộc Đổi mới', m: 3, a: false, t: 'Đổi mới có nghĩa là thay đổi mục tiêu của chủ nghĩa xã hội.', v: 'Đổi mới KHÔNG thay đổi mục tiêu mà thay đổi cách thức, biện pháp thực hiện mục tiêu đó.' },
{ cd: 'Công cuộc Đổi mới', m: 2, a: true,  t: 'Ba chương trình kinh tế lớn trong giai đoạn đầu Đổi mới là lương thực – thực phẩm, hàng tiêu dùng và hàng xuất khẩu.', v: 'Nhờ đó Việt Nam từ nước thiếu ăn trở thành nước xuất khẩu gạo hàng đầu thế giới.' },
{ cd: 'Công cuộc Đổi mới', m: 2, a: true,  t: 'Việt Nam gia nhập Tổ chức Thương mại Thế giới WTO năm 2007.', v: 'Đánh dấu bước hội nhập kinh tế quốc tế sâu rộng.' },
{ cd: 'Công cuộc Đổi mới', m: 3, a: true,  t: 'Một bài học lớn của công cuộc Đổi mới là đổi mới toàn diện, đồng bộ nhưng phải có bước đi phù hợp.', v: 'Cùng với kiên trì mục tiêu độc lập dân tộc và chủ nghĩa xã hội, lấy dân làm gốc.' },

/* ========== HỒ CHÍ MINH ========== */
{ cd: 'Hồ Chí Minh', m: 2, a: true,  t: 'Ngày 5/6/1911, Nguyễn Tất Thành ra đi tìm đường cứu nước từ Bến Nhà Rồng.', v: 'Người sang phương Tây để tìm hiểu xem điều gì ẩn sau khẩu hiệu tự do, bình đẳng, bác ái.' },
{ cd: 'Hồ Chí Minh', m: 3, a: true,  t: 'Tháng 7/1920, Nguyễn Ái Quốc đọc Sơ thảo Luận cương của Lênin và tìm ra con đường cứu nước đúng đắn.', v: 'Người khẳng định muốn cứu nước và giải phóng dân tộc thì phải đi theo con đường cách mạng vô sản.' },
{ cd: 'Hồ Chí Minh', m: 3, a: false, t: 'Nguyễn Ái Quốc tìm ra con đường cứu nước đúng đắn khi tham gia sáng lập Đảng Cộng sản Pháp tháng 12/1920.', v: 'Mốc tìm ra con đường là tháng 7/1920 khi đọc Luận cương của Lênin. Tháng 12/1920 là mốc trở thành người cộng sản.' },
{ cd: 'Hồ Chí Minh', m: 2, a: true,  t: 'Tháng 6/1925, Nguyễn Ái Quốc thành lập Hội Việt Nam Cách mạng Thanh niên tại Quảng Châu, Trung Quốc.', v: 'Đây là tổ chức tiền thân, chuẩn bị về tổ chức và cán bộ cho sự ra đời của Đảng.' },
{ cd: 'Hồ Chí Minh', m: 2, a: true,  t: 'Đầu năm 1930, Nguyễn Ái Quốc chủ trì Hội nghị hợp nhất các tổ chức cộng sản, thành lập Đảng Cộng sản Việt Nam.', v: 'Hội nghị họp tại Cửu Long, Hương Cảng, Trung Quốc.' },
{ cd: 'Hồ Chí Minh', m: 3, a: true,  t: 'Công lao to lớn nhất của Nguyễn Ái Quốc với cách mạng Việt Nam là tìm ra con đường cứu nước đúng đắn và sáng lập Đảng.', v: 'Chấm dứt cuộc khủng hoảng về đường lối kéo dài suốt đầu thế kỉ XX.' },
{ cd: 'Hồ Chí Minh', m: 2, a: true,  t: 'Năm 1987, UNESCO vinh danh Hồ Chí Minh là Anh hùng giải phóng dân tộc và Nhà văn hoá kiệt xuất của Việt Nam.', v: 'Ghi nhận cống hiến của Người với dân tộc Việt Nam và nhân loại.' },

/* ========== BIỂN ĐÔNG ========== */
{ cd: 'Biển Đông', m: 2, a: true,  t: 'Công ước Liên hợp quốc về Luật Biển năm 1982 (UNCLOS) là cơ sở pháp lí quan trọng để giải quyết vấn đề Biển Đông.', v: 'Việt Nam phê chuẩn Công ước năm 1994.' },
{ cd: 'Biển Đông', m: 2, a: true,  t: 'Theo UNCLOS 1982, lãnh hải của quốc gia ven biển rộng 12 hải lí tính từ đường cơ sở.', v: 'Vùng đặc quyền kinh tế rộng 200 hải lí.' },
{ cd: 'Biển Đông', m: 2, a: false, t: 'Theo UNCLOS 1982, vùng đặc quyền kinh tế của quốc gia ven biển rộng 12 hải lí.', v: '12 hải lí là LÃNH HẢI. Vùng đặc quyền kinh tế rộng 200 hải lí.' },
{ cd: 'Biển Đông', m: 2, a: true,  t: 'Chủ trương nhất quán của Việt Nam là giải quyết tranh chấp ở Biển Đông bằng biện pháp hoà bình trên cơ sở luật pháp quốc tế.', v: 'Tuân thủ DOC và hướng tới xây dựng Bộ quy tắc ứng xử COC.' },
{ cd: 'Biển Đông', m: 3, a: true,  t: 'Đội Hoàng Sa và đội Bắc Hải thời chúa Nguyễn là bằng chứng lịch sử về việc Việt Nam thực thi chủ quyền ở Biển Đông.', v: 'Cùng với các châu bản triều Nguyễn và bản đồ Đại Nam nhất thống toàn đồ.' }
];

{ cd: 'Liên hợp quốc', m: 2, a: false, t: 'Mọi quốc gia thành viên Liên hợp quốc đều có quyền phủ quyết tại Hội đồng Bảo an.', v: 'Chỉ 5 uỷ viên THƯỜNG TRỰC mới có quyền này.' },
{ cd: 'Liên hợp quốc', m: 3, a: true,  t: 'Bình đẳng chủ quyền giữa các quốc gia là nguyên tắc nền tảng trong hoạt động của Liên hợp quốc.', v: 'Mọi quốc gia dù lớn hay nhỏ đều có một phiếu tại Đại hội đồng.' },

{ cd: 'Chiến tranh lạnh', m: 2, a: false, t: 'Chiến tranh lạnh là cuộc chiến tranh có sử dụng vũ khí hạt nhân giữa Mỹ và Liên Xô.', v: 'Chiến tranh lạnh là đối đầu căng thẳng nhưng KHÔNG có xung đột quân sự trực tiếp giữa hai siêu cường.' },
{ cd: 'Chiến tranh lạnh', m: 2, a: false, t: 'Kế hoạch Marshall là kế hoạch viện trợ quân sự của Liên Xô cho các nước Đông Âu.', v: 'Đó là kế hoạch viện trợ KINH TẾ của MỸ cho TÂY ÂU.' },
{ cd: 'Chiến tranh lạnh', m: 2, a: true,  t: 'Hội đồng Tương trợ Kinh tế SEV là tổ chức hợp tác kinh tế giữa Liên Xô và các nước xã hội chủ nghĩa Đông Âu.', v: 'Thành lập năm 1949 nhằm đối trọng với Kế hoạch Marshall.' },
{ cd: 'Chiến tranh lạnh', m: 3, a: true,  t: 'Chiến tranh lạnh làm cho tình hình thế giới luôn căng thẳng và tiêu tốn khối lượng khổng lồ tiền của vào chạy đua vũ trang.', v: 'Trong khi nhiều khu vực trên thế giới còn đói nghèo và lạc hậu.' },
{ cd: 'Chiến tranh lạnh', m: 2, a: false, t: 'Tổ chức Hiệp ước Warsaw vẫn tồn tại và hoạt động cho đến ngày nay.', v: 'Tổ chức này đã giải thể năm 1991 cùng với sự tan rã của hệ thống xã hội chủ nghĩa ở Đông Âu.' },
{ cd: 'Chiến tranh lạnh', m: 3, a: true,  t: 'Toàn cầu hoá là xu thế khách quan, vừa là thời cơ vừa là thách thức với các nước đang phát triển.', v: 'Thời cơ về vốn, công nghệ, thị trường; thách thức về cạnh tranh và giữ gìn bản sắc.' },

{ cd: 'ASEAN', m: 2, a: false, t: 'Việt Nam là một trong năm nước sáng lập ASEAN năm 1967.', v: 'Việt Nam gia nhập năm 1995. Năm nước sáng lập là Indonesia, Malaysia, Philippines, Singapore, Thái Lan.' },
{ cd: 'ASEAN', m: 2, a: false, t: 'Mục tiêu ban đầu của ASEAN là thành lập một liên minh quân sự trong khu vực.', v: 'Mục tiêu là hợp tác phát triển KINH TẾ – VĂN HOÁ trên tinh thần duy trì hoà bình và ổn định khu vực.' },
{ cd: 'ASEAN', m: 2, a: true,  t: 'Cộng đồng Kinh tế ASEAN (AEC) hướng tới một thị trường chung và cơ sở sản xuất thống nhất.', v: 'Tự do lưu chuyển hàng hoá, dịch vụ, đầu tư, vốn và lao động có tay nghề.' },
{ cd: 'ASEAN', m: 2, a: false, t: 'Campuchia là quốc gia gia nhập ASEAN sớm nhất trong các nước Đông Dương.', v: 'Việt Nam gia nhập sớm nhất (1995), sau đó là Lào (1997) rồi mới đến Campuchia (1999).' },
{ cd: 'ASEAN', m: 3, a: true,  t: 'ASEAN giữ vai trò trung tâm trong các cơ chế hợp tác khu vực châu Á – Thái Bình Dương.', v: 'Thể hiện qua các diễn đàn như ARF, ASEAN+3, Cấp cao Đông Á.' },

{ cd: 'Cách mạng tháng Tám', m: 2, a: false, t: 'Cách mạng tháng Tám năm 1945 nổ ra dưới sự lãnh đạo của Mặt trận Liên Việt.', v: 'Lực lượng lãnh đạo là Đảng Cộng sản Đông Dương thông qua Mặt trận VIỆT MINH. Liên Việt ra đời năm 1951.' },
{ cd: 'Cách mạng tháng Tám', m: 2, a: false, t: 'Khởi nghĩa giành chính quyền ở Sài Gòn diễn ra sớm hơn ở Hà Nội.', v: 'Hà Nội ngày 19/8, Huế ngày 23/8, Sài Gòn ngày 25/8 — Hà Nội sớm nhất.' },
{ cd: 'Cách mạng tháng Tám', m: 2, a: true,  t: 'Đại hội Quốc dân Tân Trào tháng 8/1945 đã tán thành chủ trương Tổng khởi nghĩa của Đảng.', v: 'Đồng thời thông qua 10 chính sách của Việt Minh và cử ra Uỷ ban Dân tộc Giải phóng.' },
{ cd: 'Cách mạng tháng Tám', m: 3, a: false, t: 'Cách mạng tháng Tám nổ ra hoàn toàn tự phát, không có sự chuẩn bị từ trước.', v: 'Đảng đã chuẩn bị suốt 15 năm với ba cuộc tập dượt lớn và xây dựng lực lượng chính trị, vũ trang, căn cứ địa.' },
{ cd: 'Cách mạng tháng Tám', m: 3, a: true,  t: 'Bài học lớn của Cách mạng tháng Tám là nắm bắt và chớp đúng thời cơ.', v: 'Cùng với xây dựng khối đại đoàn kết dân tộc và kết hợp đấu tranh chính trị với vũ trang.' },

{ cd: 'Kháng chiến chống Pháp', m: 2, a: false, t: 'Chiến dịch Điện Biên Phủ diễn ra trong năm 1953.', v: 'Chiến dịch diễn ra từ 13/3 đến 7/5 năm 1954.' },
{ cd: 'Kháng chiến chống Pháp', m: 2, a: false, t: 'Trong chiến dịch Việt Bắc thu – đông 1947, ta chủ động mở chiến dịch trước.', v: 'Việt Bắc 1947 là chiến dịch PHẢN CÔNG khi Pháp tấn công lên căn cứ địa. Biên giới 1950 mới là chiến dịch ta chủ động mở.' },
{ cd: 'Kháng chiến chống Pháp', m: 2, a: true,  t: 'Kế hoạch Nava là kế hoạch quân sự cuối cùng của Pháp ở Đông Dương, có sự hỗ trợ của Mỹ.', v: 'Kế hoạch bị phá sản hoàn toàn sau thất bại ở Điện Biên Phủ.' },
{ cd: 'Kháng chiến chống Pháp', m: 3, a: true,  t: 'Thắng lợi Điện Biên Phủ có ý nghĩa quốc tế to lớn, cổ vũ phong trào giải phóng dân tộc ở châu Á, châu Phi và Mỹ Latinh.', v: 'Lần đầu tiên một dân tộc thuộc địa đánh bại đội quân xâm lược của một cường quốc thực dân.' },
{ cd: 'Kháng chiến chống Pháp', m: 2, a: false, t: 'Sau Hiệp định Genève, đất nước Việt Nam được thống nhất ngay lập tức.', v: 'Đất nước tạm thời bị chia cắt; Mỹ nhảy vào miền Nam nên phải tiếp tục kháng chiến thêm 21 năm.' },

{ cd: 'Kháng chiến chống Mỹ', m: 3, a: false, t: 'Phong trào Đồng khởi 1959–1960 nổ ra ở miền Bắc Việt Nam.', v: 'Đồng khởi nổ ra ở MIỀN NAM, tiêu biểu là Bến Tre.' },
{ cd: 'Kháng chiến chống Mỹ', m: 3, a: false, t: 'Chiến lược "Việt Nam hoá chiến tranh" được Mỹ thực hiện trong giai đoạn 1961–1965.', v: 'Đó là giai đoạn của "Chiến tranh đặc biệt". Việt Nam hoá chiến tranh diễn ra 1969–1973.' },
{ cd: 'Kháng chiến chống Mỹ', m: 2, a: true,  t: 'Mặt trận Dân tộc Giải phóng miền Nam Việt Nam ra đời ngày 20/12/1960.', v: 'Là kết quả trực tiếp của phong trào Đồng khởi.' },
{ cd: 'Kháng chiến chống Mỹ', m: 3, a: true,  t: 'Đường Trường Sơn – đường Hồ Chí Minh là tuyến chi viện chiến lược từ miền Bắc cho miền Nam.', v: 'Thể hiện vai trò hậu phương lớn của miền Bắc đối với tiền tuyến lớn miền Nam.' },
{ cd: 'Kháng chiến chống Mỹ', m: 3, a: false, t: 'Chiến dịch Hồ Chí Minh là chiến dịch mở màn của cuộc Tổng tiến công và nổi dậy Xuân 1975.', v: 'Chiến dịch mở màn là TÂY NGUYÊN. Chiến dịch Hồ Chí Minh là chiến dịch KẾT THÚC.' },
{ cd: 'Kháng chiến chống Mỹ', m: 3, a: true,  t: 'Nguyên nhân quyết định thắng lợi của kháng chiến chống Mỹ là sự lãnh đạo sáng suốt của Đảng với đường lối đúng đắn, sáng tạo.', v: 'Bên cạnh truyền thống yêu nước, hậu phương miền Bắc vững mạnh và sự ủng hộ quốc tế.' },
{ cd: 'Kháng chiến chống Mỹ', m: 2, a: false, t: 'Cuộc kháng chiến chống Mỹ kết thúc bằng việc kí Hiệp định Paris năm 1973.', v: 'Hiệp định Paris chỉ buộc Mỹ rút quân. Cuộc kháng chiến kết thúc bằng Đại thắng mùa Xuân năm 1975.' },
{ cd: 'Kháng chiến chống Mỹ', m: 2, a: true,  t: 'Ngày 30/4/1975, Chiến dịch Hồ Chí Minh toàn thắng, miền Nam hoàn toàn giải phóng.', v: 'Kết thúc thắng lợi cuộc kháng chiến chống Mỹ cứu nước.' },

{ cd: 'Công cuộc Đổi mới', m: 2, a: false, t: 'Trong công cuộc Đổi mới, Việt Nam chuyển sang nền kinh tế thị trường tự do hoàn toàn.', v: 'Là kinh tế thị trường ĐỊNH HƯỚNG XÃ HỘI CHỦ NGHĨA, có sự quản lí của Nhà nước.' },
{ cd: 'Công cuộc Đổi mới', m: 2, a: false, t: 'Đổi mới được tiến hành đồng thời và ngang bằng trên cả lĩnh vực kinh tế lẫn chính trị ngay từ đầu.', v: 'Đổi mới bắt đầu từ KINH TẾ và lấy kinh tế làm trọng tâm, sau đó mới từng bước đổi mới chính trị.' },
{ cd: 'Công cuộc Đổi mới', m: 2, a: true,  t: 'Việt Nam gia nhập Diễn đàn Hợp tác Kinh tế châu Á – Thái Bình Dương (APEC) năm 1998.', v: 'Nằm trong tiến trình hội nhập kinh tế quốc tế ngày càng sâu rộng.' },
{ cd: 'Công cuộc Đổi mới', m: 3, a: true,  t: 'Thành tựu nổi bật nhất của Đổi mới trong nông nghiệp là đưa Việt Nam từ nước thiếu lương thực thành nước xuất khẩu gạo hàng đầu thế giới.', v: 'Nhờ chính sách khoán trong nông nghiệp và giải phóng sức sản xuất.' },
{ cd: 'Công cuộc Đổi mới', m: 3, a: false, t: 'Sau Đổi mới, thành phần kinh tế nhà nước là thành phần duy nhất được phép tồn tại.', v: 'Đổi mới thừa nhận nền kinh tế NHIỀU THÀNH PHẦN, trong đó kinh tế nhà nước giữ vai trò chủ đạo.' },

{ cd: 'Hồ Chí Minh', m: 2, a: false, t: 'Nguyễn Tất Thành ra đi tìm đường cứu nước năm 1911 và sang Nhật Bản.', v: 'Người sang PHƯƠNG TÂY, cụ thể là Pháp. Sang Nhật là chủ trương của Phan Bội Châu.' },
{ cd: 'Hồ Chí Minh', m: 2, a: false, t: 'Hội Việt Nam Cách mạng Thanh niên được thành lập tại Hà Nội năm 1925.', v: 'Được thành lập tại QUẢNG CHÂU, Trung Quốc.' },
{ cd: 'Hồ Chí Minh', m: 3, a: true,  t: 'Bản Yêu sách của nhân dân An Nam gửi tới Hội nghị Versailles năm 1919 là hoạt động đánh dấu Nguyễn Ái Quốc bước lên vũ đài chính trị quốc tế.', v: 'Bản yêu sách đòi các quyền tự do dân chủ tối thiểu cho nhân dân Việt Nam.' },
{ cd: 'Hồ Chí Minh', m: 2, a: false, t: 'Đảng Cộng sản Việt Nam được thành lập tại Hà Nội đầu năm 1930.', v: 'Hội nghị hợp nhất diễn ra tại Cửu Long, Hương Cảng (Trung Quốc).' },
{ cd: 'Hồ Chí Minh', m: 3, a: true,  t: 'Hội nghị Trung ương lần thứ 8 (tháng 5/1941) do Nguyễn Ái Quốc chủ trì đã đặt nhiệm vụ giải phóng dân tộc lên hàng đầu.', v: 'Tạm gác khẩu hiệu cách mạng ruộng đất để tập hợp mọi lực lượng yêu nước.' },

{ cd: 'Biển Đông', m: 2, a: false, t: 'Theo UNCLOS 1982, quốc gia ven biển có chủ quyền hoàn toàn và tuyệt đối trên vùng đặc quyền kinh tế 200 hải lí.', v: 'Trên vùng đặc quyền kinh tế quốc gia chỉ có QUYỀN CHỦ QUYỀN về kinh tế, không phải chủ quyền đầy đủ như lãnh hải.' },
{ cd: 'Biển Đông', m: 2, a: true,  t: 'Biển Đông là một trong những tuyến hàng hải nhộn nhịp nhất thế giới.', v: 'Có vị trí chiến lược quan trọng về kinh tế, giao thông và an ninh quốc phòng.' },
{ cd: 'Biển Đông', m: 2, a: false, t: 'Việt Nam chủ trương giải quyết tranh chấp ở Biển Đông bằng biện pháp quân sự.', v: 'Chủ trương nhất quán là giải quyết bằng BIỆN PHÁP HOÀ BÌNH trên cơ sở luật pháp quốc tế.' },
{ cd: 'Biển Đông', m: 2, a: true,  t: 'DOC là Tuyên bố về ứng xử của các bên ở Biển Đông, kí giữa ASEAN và Trung Quốc năm 2002.', v: 'Các bên đang tiếp tục đàm phán để xây dựng Bộ Quy tắc ứng xử COC có tính ràng buộc pháp lí.' },
{ cd: 'Biển Đông', m: 3, a: true,  t: 'Luật Biển Việt Nam được Quốc hội thông qua năm 2012, khẳng định chủ quyền với hai quần đảo Hoàng Sa và Trường Sa.', v: 'Phù hợp với các quy định của UNCLOS 1982.' }
);

{ cd: 'Liên hợp quốc', m: 4, a: true,  t: 'Việc Liên hợp quốc quy định nguyên tắc nhất trí giữa năm nước lớn phản ánh thực tế tương quan lực lượng sau Chiến tranh thế giới thứ hai.', v: 'Năm cường quốc thắng trận muốn bảo đảm vai trò chi phối của mình trong trật tự mới.' },

{ cd: 'Liên hợp quốc', m: 4, a: true,  t: 'Việc Việt Nam hai lần được bầu làm Uỷ viên không thường trực Hội đồng Bảo an thể hiện vị thế quốc tế ngày càng nâng cao.', v: 'Là kết quả của đường lối đối ngoại độc lập, tự chủ, đa phương hoá, đa dạng hoá.' },
{ cd: 'Liên hợp quốc', m: 3, a: false, t: 'Liên hợp quốc có quân đội thường trực riêng để can thiệp vào các cuộc xung đột.', v: 'Lực lượng gìn giữ hoà bình do các nước thành viên đóng góp theo từng nhiệm vụ, không phải quân đội thường trực.' },
{ cd: 'Liên hợp quốc', m: 3, a: true,  t: 'Việt Nam đã cử lực lượng tham gia hoạt động gìn giữ hoà bình của Liên hợp quốc.', v: 'Thể hiện Việt Nam là thành viên có trách nhiệm của cộng đồng quốc tế.' },

{ cd: 'Chiến tranh lạnh', m: 4, a: true,  t: 'Điểm chung của Kế hoạch Marshall và Hội đồng Tương trợ Kinh tế SEV là đều dùng công cụ kinh tế để tập hợp lực lượng cho phe mình.', v: 'Cả hai đều là biểu hiện của cuộc đối đầu hai cực trên lĩnh vực kinh tế.' },
{ cd: 'Chiến tranh lạnh', m: 4, a: true,  t: 'Chiến tranh lạnh kết thúc mở ra thời cơ lớn cho Việt Nam phá thế bao vây, cấm vận và mở rộng quan hệ đối ngoại.', v: 'Việt Nam bình thường hoá quan hệ với Trung Quốc năm 1991, với Hoa Kỳ năm 1995 và gia nhập ASEAN cùng năm.' },
{ cd: 'Chiến tranh lạnh', m: 4, a: false, t: 'Sau Chiến tranh lạnh, nguy cơ xung đột và chiến tranh trên thế giới đã bị loại bỏ hoàn toàn.', v: 'Xung đột sắc tộc, tôn giáo, ly khai và khủng bố vẫn diễn ra ở nhiều khu vực.' },
{ cd: 'Chiến tranh lạnh', m: 4, a: true,  t: 'Nguyên nhân sâu xa dẫn tới Chiến tranh lạnh là sự đối lập về mục tiêu và chiến lược giữa hai cường quốc Mỹ và Liên Xô.', v: 'Mỹ muốn thiết lập trật tự do mình chi phối, Liên Xô muốn bảo vệ và mở rộng hệ thống xã hội chủ nghĩa.' },
{ cd: 'Chiến tranh lạnh', m: 3, a: true,  t: 'Toàn cầu hoá vừa tạo thời cơ vừa đặt ra thách thức gay gắt với các nước đang phát triển.', v: 'Thời cơ về vốn, công nghệ, thị trường; thách thức về cạnh tranh, phụ thuộc và giữ gìn bản sắc.' },

{ cd: 'ASEAN', m: 4, a: true,  t: 'Việc Việt Nam gia nhập ASEAN năm 1995 đánh dấu bước chuyển từ đối đầu sang đối thoại và hợp tác ở Đông Nam Á.', v: 'Chấm dứt thời kì căng thẳng giữa hai nhóm nước Đông Dương và ASEAN.' },
{ cd: 'ASEAN', m: 4, a: true,  t: 'Nguyên tắc đồng thuận vừa là điểm mạnh vừa là điểm hạn chế của ASEAN.', v: 'Bảo đảm bình đẳng giữa các thành viên nhưng làm chậm quá trình ra quyết định trong những vấn đề gai góc.' },
{ cd: 'ASEAN', m: 4, a: false, t: 'ASEAN đã trở thành một liên minh chính trị – quân sự chặt chẽ như Liên minh châu Âu.', v: 'ASEAN là tổ chức hợp tác khu vực dựa trên đồng thuận, không có thiết chế siêu quốc gia như EU.' },
{ cd: 'ASEAN', m: 3, a: true,  t: 'Cộng đồng Kinh tế ASEAN hướng tới tự do lưu chuyển hàng hoá, dịch vụ, đầu tư, vốn và lao động có tay nghề.', v: 'Tạo ra thị trường chung hơn 650 triệu dân.' },
{ cd: 'ASEAN', m: 3, a: false, t: 'ASEAN có đồng tiền chung được sử dụng ở tất cả các nước thành viên.', v: 'ASEAN KHÔNG có đồng tiền chung. Đồng tiền chung là đặc trưng của khu vực đồng euro.' },

{ cd: 'Cách mạng tháng Tám', m: 4, a: true,  t: 'Cách mạng tháng Tám thành công nhanh và ít đổ máu chủ yếu nhờ Đảng đã chuẩn bị lực lượng chu đáo và chớp đúng thời cơ.', v: 'Thời cơ chỉ tồn tại trong khoảng hai tuần giữa lúc Nhật đầu hàng và quân Đồng minh vào.' },
{ cd: 'Cách mạng tháng Tám', m: 4, a: true,  t: 'Bài học về chớp thời cơ của Cách mạng tháng Tám vẫn còn nguyên giá trị trong công cuộc xây dựng đất nước hiện nay.', v: 'Thời cơ chỉ xuất hiện trong thời gian ngắn, không nắm bắt kịp thì sẽ mất.' },
{ cd: 'Cách mạng tháng Tám', m: 4, a: false, t: 'Cách mạng tháng Tám năm 1945 là cuộc cách mạng vô sản đầu tiên thắng lợi ở Đông Nam Á.', v: 'Đó là cuộc cách mạng DÂN TỘC DÂN CHỦ NHÂN DÂN, đặt nhiệm vụ giải phóng dân tộc lên hàng đầu.' },
{ cd: 'Cách mạng tháng Tám', m: 4, a: true,  t: 'So với Xô viết Nghệ – Tĩnh 1930–1931, Cách mạng tháng Tám 1945 khác biệt căn bản ở chỗ đã giành được chính quyền trong cả nước.', v: 'Các cao trào trước chỉ là những cuộc tập dượt, chưa giành được chính quyền trên phạm vi toàn quốc.' },
{ cd: 'Cách mạng tháng Tám', m: 3, a: true,  t: 'Mặt trận Việt Minh có vai trò quyết định trong việc tập hợp và xây dựng lực lượng chính trị cho Cách mạng tháng Tám.', v: 'Tập hợp mọi tầng lớp yêu nước không phân biệt giai cấp, tôn giáo, đảng phái.' },

{ cd: 'Kháng chiến chống Pháp', m: 4, a: true,  t: 'Điểm giống nhau giữa chiến dịch Biên giới 1950 và chiến dịch Điện Biên Phủ 1954 là ta đều chủ động mở chiến dịch.', v: 'Khác với Việt Bắc 1947 là chiến dịch phản công khi địch tấn công lên căn cứ địa.' },
{ cd: 'Kháng chiến chống Pháp', m: 4, a: true,  t: 'Thắng lợi quân sự ở Điện Biên Phủ là nhân tố quyết định để ta giành thắng lợi trên bàn đàm phán Genève.', v: 'Thể hiện quy luật thực lực trên chiến trường quyết định vị thế trên bàn ngoại giao.' },
{ cd: 'Kháng chiến chống Pháp', m: 4, a: false, t: 'Hiệp định Genève năm 1954 đã giải quyết triệt để vấn đề độc lập và thống nhất của Việt Nam.', v: 'Hiệp định mới chỉ giải phóng miền Bắc; đất nước tạm bị chia cắt và phải tiếp tục kháng chiến 21 năm nữa.' },
{ cd: 'Kháng chiến chống Pháp', m: 4, a: true,  t: 'Đường lối kháng chiến toàn dân, toàn diện, trường kì là sự vận dụng sáng tạo tư tưởng lấy nhỏ thắng lớn của dân tộc.', v: 'Phù hợp với tương quan lực lượng khi ta yếu hơn địch về vũ khí và tiềm lực kinh tế.' },
{ cd: 'Kháng chiến chống Pháp', m: 3, a: false, t: 'Trong kháng chiến chống Pháp, ta chủ trương đánh nhanh thắng nhanh để kết thúc chiến tranh sớm.', v: 'Đó là chủ trương của PHÁP. Ta chủ trương đánh lâu dài để chuyển hoá tương quan lực lượng.' },

{ cd: 'Kháng chiến chống Mỹ', m: 4, a: true,  t: 'Điểm chung của bốn chiến lược chiến tranh mà Mỹ thực hiện ở Việt Nam là đều nhằm biến miền Nam thành thuộc địa kiểu mới.', v: 'Chỉ khác nhau về lực lượng nòng cốt và quy mô, còn bản chất xâm lược thì không đổi.' },
{ cd: 'Kháng chiến chống Mỹ', m: 4, a: true,  t: 'Cuộc Tổng tiến công Xuân Mậu Thân 1968 có ý nghĩa quyết định về mặt chiến lược dù tổn thất của ta rất lớn.', v: 'Làm lung lay ý chí xâm lược của Mỹ, buộc Mỹ xuống thang chiến tranh và ngồi vào bàn đàm phán.' },
{ cd: 'Kháng chiến chống Mỹ', m: 4, a: true,  t: 'Việc Mỹ phải rút quân theo Hiệp định Paris đã tạo ra so sánh lực lượng có lợi hẳn cho cách mạng miền Nam.', v: 'Từ đó ta có điều kiện chuẩn bị và tiến hành tổng tiến công giải phóng miền Nam.' },
{ cd: 'Kháng chiến chống Mỹ', m: 4, a: false, t: 'Hậu phương miền Bắc chỉ có vai trò thứ yếu trong cuộc kháng chiến chống Mỹ.', v: 'Miền Bắc là hậu phương lớn, chi viện quyết định về sức người và sức của cho tiền tuyến lớn miền Nam.' },
{ cd: 'Kháng chiến chống Mỹ', m: 4, a: true,  t: 'Nghệ thuật quân sự nổi bật trong Đại thắng mùa Xuân 1975 là chọn đúng hướng tiến công chiến lược và đánh đòn điểm huyệt.', v: 'Chọn Tây Nguyên với trận mở màn Buôn Ma Thuột làm rung chuyển toàn bộ hệ thống phòng thủ của địch.' },
{ cd: 'Kháng chiến chống Mỹ', m: 3, a: false, t: 'Chiến thắng "Điện Biên Phủ trên không" năm 1972 diễn ra ở tỉnh Điện Biên.', v: 'Đó là trận đánh bại cuộc tập kích bằng máy bay B52 vào HÀ NỘI và HẢI PHÒNG, chỉ mượn tên gọi ẩn dụ.' },

{ cd: 'Công cuộc Đổi mới', m: 4, a: true,  t: 'Bài học lớn nhất rút ra từ giai đoạn khủng hoảng trước Đổi mới là phải tôn trọng và hành động theo quy luật khách quan.', v: 'Nóng vội, chủ quan duy ý chí trong cải tạo và xây dựng đã dẫn tới khủng hoảng kinh tế – xã hội.' },
{ cd: 'Công cuộc Đổi mới', m: 4, a: true,  t: 'Đổi mới ở Việt Nam là quá trình vừa làm vừa rút kinh nghiệm, đi từ đổi mới từng phần đến đổi mới toàn diện.', v: 'Xuất phát từ những "khoán chui" trong nông nghiệp rồi mới được tổng kết thành đường lối.' },
{ cd: 'Công cuộc Đổi mới', m: 4, a: false, t: 'Thành tựu của Đổi mới cho thấy Việt Nam nên từ bỏ vai trò quản lí của Nhà nước với nền kinh tế.', v: 'Nền kinh tế thị trường ở Việt Nam luôn gắn với ĐỊNH HƯỚNG XÃ HỘI CHỦ NGHĨA và sự quản lí của Nhà nước.' },
{ cd: 'Công cuộc Đổi mới', m: 4, a: true,  t: 'Hội nhập quốc tế trong thời kì Đổi mới đòi hỏi Việt Nam vừa mở cửa vừa giữ vững độc lập, tự chủ.', v: 'Đó là nguyên tắc xuyên suốt của đường lối đối ngoại.' },
{ cd: 'Công cuộc Đổi mới', m: 3, a: true,  t: 'Đại hội VI của Đảng đã nghiêm khắc chỉ ra những sai lầm chủ quan, nóng vội trong giai đoạn trước.', v: 'Tinh thần nhìn thẳng vào sự thật, nói rõ sự thật là tiền đề của Đổi mới.' },

{ cd: 'Hồ Chí Minh', m: 4, a: true,  t: 'Điểm khác biệt căn bản giữa con đường cứu nước của Nguyễn Ái Quốc với các bậc tiền bối là hướng sang phương Tây và gắn giải phóng dân tộc với cách mạng vô sản.', v: 'Phan Bội Châu hướng sang Nhật, Phan Châu Trinh dựa vào Pháp để cải cách.' },
{ cd: 'Hồ Chí Minh', m: 4, a: true,  t: 'Việc thành lập Đảng Cộng sản Việt Nam đầu năm 1930 đã chấm dứt cuộc khủng hoảng về đường lối cứu nước kéo dài đầu thế kỉ XX.', v: 'Cách mạng Việt Nam từ đó có một đường lối đúng đắn và một tổ chức lãnh đạo thống nhất.' },
{ cd: 'Hồ Chí Minh', m: 4, a: false, t: 'Nguyễn Ái Quốc tiếp thu chủ nghĩa Mác – Lênin một cách máy móc, không vận dụng vào điều kiện Việt Nam.', v: 'Người vận dụng SÁNG TẠO, đặt nhiệm vụ giải phóng dân tộc lên hàng đầu — điều chưa có tiền lệ trong lý luận lúc đó.' },
{ cd: 'Hồ Chí Minh', m: 4, a: true,  t: 'Tư tưởng đại đoàn kết dân tộc của Hồ Chí Minh được thể hiện rõ nhất qua việc xây dựng các mặt trận dân tộc thống nhất.', v: 'Từ Mặt trận Việt Minh đến Mặt trận Liên Việt và Mặt trận Tổ quốc Việt Nam.' },
{ cd: 'Hồ Chí Minh', m: 3, a: false, t: 'Hội nghị Trung ương lần thứ 8 (1941) chủ trương đặt nhiệm vụ cách mạng ruộng đất lên hàng đầu.', v: 'Hội nghị tạm gác khẩu hiệu ruộng đất để đặt nhiệm vụ GIẢI PHÓNG DÂN TỘC lên hàng đầu.' },

{ cd: 'Biển Đông', m: 4, a: true,  t: 'Việc kiên trì giải quyết tranh chấp Biển Đông bằng biện pháp hoà bình thể hiện sự kế thừa truyền thống ngoại giao hoà hiếu của dân tộc.', v: 'Đồng thời phù hợp với luật pháp quốc tế và lợi ích lâu dài của khu vực.' },
{ cd: 'Biển Đông', m: 4, a: true,  t: 'Các châu bản triều Nguyễn và hoạt động của đội Hoàng Sa là bằng chứng cho thấy Việt Nam đã xác lập chủ quyền một cách hoà bình và liên tục.', v: 'Đây là căn cứ lịch sử – pháp lí quan trọng theo tiêu chuẩn của luật quốc tế.' },
{ cd: 'Biển Đông', m: 4, a: false, t: 'Chủ quyền biển đảo chỉ là vấn đề của lực lượng vũ trang, không liên quan tới trách nhiệm của học sinh.', v: 'Bảo vệ chủ quyền là trách nhiệm của mọi công dân, bắt đầu từ hiểu đúng và tuyên truyền đúng.' },
{ cd: 'Biển Đông', m: 3, a: true,  t: 'Biển Đông có vai trò chiến lược với Việt Nam cả về kinh tế, giao thông lẫn an ninh quốc phòng.', v: 'Là cửa ngõ giao thương và tuyến phòng thủ hướng biển của đất nước.' },
{ cd: 'Biển Đông', m: 3, a: false, t: 'Vùng đặc quyền kinh tế và thềm lục địa là hai khái niệm hoàn toàn trùng nhau.', v: 'Vùng đặc quyền kinh tế tính theo cột nước 200 hải lí; thềm lục địa tính theo đáy biển và lòng đất dưới đáy, có thể mở rộng hơn 200 hải lí.' }
);

<script>
/* ============================================================

window.TD = window.TD || {}; TD.KHO_LT = TD.KHO_LT || {};

TD.KHO_LT.dia = [
/* ========== VỊ TRÍ ĐỊA LÍ ========== */
{ cd: 'Vị trí địa lí', m: 1, a: true,  t: 'Lãnh thổ Việt Nam nằm hoàn toàn trong vùng nội chí tuyến bán cầu Bắc.', v: 'Từ 8°34′B đến 23°23′B, nên thiên nhiên mang tính chất nhiệt đới.' },
{ cd: 'Vị trí địa lí', m: 1, a: false, t: 'Một phần lãnh thổ Việt Nam nằm trong vùng ôn đới bán cầu Bắc.', v: 'Toàn bộ lãnh thổ nằm trong vùng NỘI CHÍ TUYẾN, không có phần nào thuộc ôn đới.' },
{ cd: 'Vị trí địa lí', m: 2, a: true,  t: 'Việt Nam nằm ở múi giờ số 7.', v: 'Giờ Việt Nam sớm hơn giờ GMT 7 tiếng.' },
{ cd: 'Vị trí địa lí', m: 2, a: true,  t: 'Nhờ giáp Biển Đông nên thiên nhiên Việt Nam xanh tốt quanh năm, khác hẳn các nước cùng vĩ độ ở Tây Á và Bắc Phi.', v: 'Biển Đông cung cấp lượng ẩm lớn, làm dịu tính khắc nghiệt của khí hậu.' },
{ cd: 'Vị trí địa lí', m: 2, a: false, t: 'Việt Nam có khí hậu hoang mạc giống các nước cùng vĩ độ ở Bắc Phi.', v: 'Nhờ Biển Đông và gió mùa nên nước ta có khí hậu nhiệt đới ẩm gió mùa, không hoang mạc.' },
{ cd: 'Vị trí địa lí', m: 2, a: true,  t: 'Vị trí nằm ở nơi giao thoa của nhiều luồng sinh vật khiến tài nguyên sinh vật nước ta rất phong phú.', v: 'Luồng từ Hoa Nam, Ấn Độ – Myanmar và Malaysia – Indonesia.' },
{ cd: 'Vị trí địa lí', m: 2, a: true,  t: 'Vị trí địa lí khiến nước ta chịu nhiều thiên tai như bão, lũ lụt, hạn hán.', v: 'Đây là mặt hạn chế bên cạnh những thuận lợi to lớn.' },
{ cd: 'Vị trí địa lí', m: 2, a: true,  t: 'Phần đất liền nước ta có diện tích khoảng 331 nghìn km².', v: 'Kéo dài trên nhiều vĩ độ nên thiên nhiên phân hoá rõ theo chiều Bắc – Nam.' },

/* ========== THIÊN NHIÊN NHIỆT ĐỚI ẨM GIÓ MÙA ========== */
{ cd: 'Khí hậu', m: 2, a: true,  t: 'Gió mùa Đông Bắc thổi từ áp cao Siberia gây ra mùa đông lạnh ở miền Bắc nước ta.', v: 'Nửa đầu mùa đông lạnh khô, nửa sau lạnh ẩm có mưa phùn.' },
{ cd: 'Khí hậu', m: 2, a: true,  t: 'Ảnh hưởng của gió mùa Đông Bắc giảm dần khi đi từ Bắc vào Nam.', v: 'Đến dãy Bạch Mã thì gió mùa Đông Bắc gần như bị chặn lại hoàn toàn.' },
{ cd: 'Khí hậu', m: 2, a: false, t: 'Gió mùa Đông Bắc gây ra mùa đông lạnh trên toàn bộ lãnh thổ Việt Nam.', v: 'Chỉ ảnh hưởng rõ ở miền Bắc; càng vào Nam càng suy yếu và bị chặn bởi dãy Bạch Mã.' },
{ cd: 'Khí hậu', m: 3, a: true,  t: 'Gió phơn Tây Nam khô nóng ở Bắc Trung Bộ hình thành do khối khí từ vịnh Bengal vượt dãy Trường Sơn.', v: 'Khối khí trút hết mưa ở sườn tây rồi biến tính khô nóng khi xuống sườn đông.' },
{ cd: 'Khí hậu', m: 3, a: false, t: 'Gió Lào khô nóng ở Bắc Trung Bộ có nguồn gốc là khối khí lạnh từ phương Bắc.', v: 'Gió Lào là gió TÂY NAM từ vịnh Bengal, khô nóng do hiệu ứng phơn khi vượt Trường Sơn.' },
{ cd: 'Khí hậu', m: 2, a: true,  t: 'Nước ta có lượng mưa trung bình năm khoảng 1500–2000 mm và độ ẩm không khí trên 80%.', v: 'Cân bằng ẩm luôn dương.' },
{ cd: 'Khí hậu', m: 3, a: true,  t: 'Tính chất nhiệt đới ẩm gió mùa của khí hậu làm cho quá trình xâm thực ở miền núi và bồi tụ ở đồng bằng diễn ra mạnh mẽ.', v: 'Đó là biểu hiện của địa hình vùng nhiệt đới ẩm gió mùa.' },
{ cd: 'Khí hậu', m: 2, a: true,  t: 'Sông ngòi nước ta nhiều nước, giàu phù sa và có chế độ nước theo mùa.', v: 'Hệ quả trực tiếp của khí hậu nhiệt đới ẩm gió mùa với mùa mưa – mùa khô rõ rệt.' },
{ cd: 'Khí hậu', m: 2, a: true,  t: 'Đất feralit là loại đất chủ yếu ở vùng đồi núi nước ta.', v: 'Do quá trình phong hoá mạnh trong điều kiện nhiệt ẩm cao.' },
