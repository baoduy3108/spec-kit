<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Game tu tiên hoá thành lộ trình ôn thi tốt nghiệp THPT — Chương trình GDPT 2018.">
<meta name="theme-color" content="#0d1117">
<title>Thiên Đạo Lộ</title>
<style>
/* ===== THIÊN ĐẠO LỘ — giao diện tu tiên mực – ngọc – kim ===== */
:root{
  --nen:#0d1117; --nen2:#141b24; --nen3:#1b242f; --vien:#2a3644;
  --chu:#e6edf3; --chu2:#9aa7b4; --chu3:#6b7885;
  --ngoc:#48c9b0; --kim:#f5c76b; --lua:#e74c3c; --tim:#bb8fce; --lam:#5dade2;
  --dung:#2ecc71; --sai:#e74c3c;
  --bo:14px; --bong:0 8px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(72,201,176,.10), transparent 60%),
    radial-gradient(900px 500px at 90% 0%, rgba(245,199,107,.08), transparent 55%),
    var(--nen);
  color:var(--chu);
  font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans',Roboto,Arial,sans-serif;
  font-size:15px; line-height:1.62; min-height:100vh;
}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.3;font-weight:700}
a{color:var(--ngoc)}
b{color:#fff;font-weight:600}

/* ---------- khung ---------- */
.app{max-width:1080px;margin:0 auto;padding:0 14px 100px}

/* ---------- thanh trạng thái ---------- */
.hud{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(13,17,23,.96),rgba(13,17,23,.86));
  border-bottom:1px solid var(--vien);margin:0 -14px 18px;padding:10px 14px}
.hud-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hud-cg{font-weight:800;font-size:17px;letter-spacing:.4px}
.hud-tang{font-size:12px;color:var(--chu2);font-weight:400}
.hud-so{margin-left:auto;display:flex;gap:14px;font-size:13px;flex-wrap:wrap}
.hud-so span{color:var(--chu2)}
.hud-so b{color:var(--kim)}
.thanh{height:7px;border-radius:99px;background:var(--nen3);overflow:hidden;margin-top:8px}
.thanh > i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--ngoc),var(--kim));transition:width .5s ease}
.thanh-nho{height:5px}

/* ---------- điều hướng ---------- */
nav.tab{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
nav.tab::-webkit-scrollbar{display:none}
nav.tab button{flex:0 0 auto;background:var(--nen2);color:var(--chu2);border:1px solid var(--vien);
  border-radius:99px;padding:8px 15px;font-size:13.5px;cursor:pointer;white-space:nowrap;
  font-family:inherit;transition:.16s}
nav.tab button:hover{color:var(--chu);border-color:var(--ngoc)}
nav.tab button.on{background:linear-gradient(135deg,var(--ngoc),#2e9e88);color:#04140f;
  border-color:transparent;font-weight:700}

/* ---------- thẻ ---------- */
.the{background:linear-gradient(180deg,var(--nen2),var(--nen3));border:1px solid var(--vien);
  border-radius:var(--bo);padding:16px 18px;margin-bottom:14px;box-shadow:var(--bong)}
.the h3{color:var(--kim);font-size:16px}
.the.vien-ngoc{border-color:rgba(72,201,176,.45)}
.the.vien-kim{border-color:rgba(245,199,107,.45)}
.the.vien-lua{border-color:rgba(231,76,60,.45)}
.luoi{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.luoi-2{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

/* ---------- nút ---------- */
button.nut{background:linear-gradient(135deg,var(--ngoc),#2e9e88);color:#04140f;border:0;
  border-radius:10px;padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer;
  font-family:inherit;transition:.16s}
button.nut:hover{filter:brightness(1.12)}
button.nut:disabled{opacity:.4;cursor:not-allowed;filter:none}
button.nut.phu{background:var(--nen3);color:var(--chu);border:1px solid var(--vien)}
button.nut.kim{background:linear-gradient(135deg,var(--kim),#d9a83f);color:#231903}
button.nut.lua{background:linear-gradient(135deg,var(--lua),#b93b2c);color:#fff}
.hang-nut{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}

/* ---------- môn học ---------- */
.mon-the{cursor:pointer;transition:.18s;border-left:4px solid var(--m,var(--ngoc))}
.mon-the:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.55)}
.mon-icon{font-size:26px}
.mon-ten{font-weight:800;font-size:16px}
.mon-phai{font-size:12px;color:var(--chu3);font-style:italic}

/* ---------- câu hỏi ---------- */
.dapan{display:block;width:100%;text-align:left;background:var(--nen3);border:1px solid var(--vien);
  color:var(--chu);border-radius:10px;padding:12px 14px;margin:7px 0;cursor:pointer;font-size:14.5px;
  font-family:inherit;transition:.14s;line-height:1.5}
.dapan:hover:not(:disabled){border-color:var(--ngoc);background:#20303b}
.dapan .ky{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;
  border-radius:50%;background:var(--nen);margin-right:9px;font-weight:800;font-size:12.5px;flex:0 0 auto}
.dapan.dung{border-color:var(--dung);background:rgba(46,204,113,.14)}
.dapan.dung .ky{background:var(--dung);color:#04140f}
.dapan.sai{border-color:var(--sai);background:rgba(231,76,60,.14)}
.dapan.sai .ky{background:var(--sai);color:#fff}
.dapan.mo{opacity:.32}
.dapan:disabled{cursor:default}

.ds-y{display:flex;gap:10px;align-items:flex-start;background:var(--nen3);border:1px solid var(--vien);
  border-radius:10px;padding:11px 13px;margin:7px 0}
.ds-y .noi{flex:1;font-size:14.3px}
.ds-nut{display:flex;gap:5px;flex:0 0 auto}
.ds-nut button{width:42px;padding:6px 0;border-radius:8px;border:1px solid var(--vien);
  background:var(--nen);color:var(--chu2);cursor:pointer;font-size:12.5px;font-weight:700;font-family:inherit}
.ds-nut button.chon{background:var(--lam);color:#04140f;border-color:transparent}
.ds-y.dung{border-color:var(--dung)} .ds-y.sai{border-color:var(--sai)}

input.o-nhap{background:var(--nen);border:1px solid var(--vien);color:var(--chu);border-radius:10px;
  padding:12px 14px;font-size:16px;font-family:inherit;width:100%;max-width:260px}
input.o-nhap:focus{outline:0;border-color:var(--ngoc)}

.giai{background:rgba(72,201,176,.07);border-left:3px solid var(--ngoc);border-radius:0 10px 10px 0;
  padding:12px 15px;margin-top:13px;font-size:14px;white-space:pre-wrap;line-height:1.7}
.meo{background:rgba(245,199,107,.08);border-left:3px solid var(--kim);border-radius:0 10px 10px 0;
  padding:10px 15px;margin-top:9px;font-size:13.6px}
.meo::before{content:'💡 MẸO: ';color:var(--kim);font-weight:700}
.dc{background:rgba(231,76,60,.09);border-left:3px solid var(--lua);border-radius:0 10px 10px 0;
  padding:10px 15px;margin-top:9px;font-size:13.6px}
.dc::before{content:'⚠ ĐÍNH CHÍNH: ';color:var(--lua);font-weight:700}

/* ---------- nhãn ---------- */
.nhan{display:inline-block;padding:2.5px 9px;border-radius:99px;font-size:11.5px;font-weight:700;
  background:var(--nen);border:1px solid var(--vien);color:var(--chu2);margin:0 5px 5px 0}
.nhan.m1{color:#7fb3d5;border-color:#7fb3d5}
.nhan.m2{color:#48c9b0;border-color:#48c9b0}
.nhan.m3{color:#f5c76b;border-color:#f5c76b}
.nhan.m4{color:#e74c3c;border-color:#e74c3c}
.nhan.moi{color:#04140f;background:var(--kim);border-color:var(--kim)}

/* ---------- bảng trong nội dung ---------- */
table.kq{width:100%;border-collapse:collapse;margin:9px 0;font-size:13.6px}
table.kq td,table.kq th{border:1px solid var(--vien);padding:6px 9px;text-align:left;vertical-align:top}
table.kq th{background:var(--nen);color:var(--kim);font-weight:700}
table.kq.small{font-size:12.4px}
table.kq.small td,table.kq.small th{padding:4px 6px}
.cuon-ngang{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dayvt{background:var(--nen);border:1px solid var(--vien);border-radius:9px;padding:9px 11px;
  margin:8px 0;font-size:13px;overflow-x:auto}
.dvt-row{white-space:nowrap;padding:3px 0}
.dvt-l{color:var(--kim);font-style:italic;margin-right:7px;font-size:11.5px}
.pu{background:var(--nen);border:1px solid var(--vien);border-radius:9px;padding:11px 13px;
  margin:8px 0;font-size:13.6px;line-height:2;overflow-x:auto}
.ar{display:inline-block;color:var(--kim);font-size:11px;font-style:italic;
  border-bottom:1px solid var(--kim);padding:0 6px;margin:0 3px}
.ar::after{content:' →'}

/* ---------- thẻ lật ---------- */
.lat{min-height:190px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.lat .goi{color:var(--chu3);font-size:12px;text-align:center;margin-top:12px}

/* ---------- lộ trình ---------- */
.tuan{border-left:3px solid var(--g,var(--ngoc));padding-left:15px;margin-bottom:16px}
.tuan-so{font-weight:800;color:var(--g,var(--ngoc));font-size:14px}
.tuan ul{margin:7px 0;padding-left:19px}
.tuan li{margin-bottom:5px;font-size:14px}
.moc{background:rgba(245,199,107,.1);border-radius:8px;padding:7px 11px;font-size:13.3px;margin-top:7px}

/* ---------- thống kê ---------- */
.so-to{font-size:29px;font-weight:800;color:var(--kim);line-height:1.15}
.so-nhan{font-size:12px;color:var(--chu3);text-transform:uppercase;letter-spacing:.6px}
.doc-thanh{display:flex;align-items:center;gap:9px;margin:7px 0;font-size:13px}
.doc-thanh .ten{width:78px;flex:0 0 auto;color:var(--chu2)}
.doc-thanh .thanh{flex:1;margin:0}
.doc-thanh .pt{width:52px;text-align:right;flex:0 0 auto;font-weight:700}

/* ---------- thông báo ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 28px);max-width:430px}
.toast{background:var(--nen3);border:1px solid var(--ngoc);border-radius:11px;padding:11px 17px;
  font-size:14px;box-shadow:var(--bong);animation:hien .3s ease}
.toast.kim{border-color:var(--kim)} .toast.lua{border-color:var(--lua)}
@keyframes hien{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- đột phá cảnh giới ---------- */
#dotpha{position:fixed;inset:0;z-index:300;display:none;place-items:center;
  background:rgba(4,8,12,.93);backdrop-filter:blur(6px);text-align:center;padding:24px}
#dotpha.hien{display:grid;animation:hien .4s ease}
#dotpha .vong{font-size:64px;animation:xoay 3s linear infinite}
@keyframes xoay{to{transform:rotate(360deg)}}
#dotpha h2{font-size:31px;color:var(--kim);margin:14px 0 6px}

/* ---------- linh tinh ---------- */
.mo-nhat{color:var(--chu3);font-size:13px}
.giua{text-align:center}
.tren12{margin-top:12px} .tren20{margin-top:20px}
hr.mo{border:0;border-top:1px solid var(--vien);margin:16px 0}
.dem-nguoc{font-size:26px;font-weight:800;color:var(--lua)}

@media (max-width:640px){
  body{font-size:14.5px}
  .app{padding:0 11px 90px}
  .hud{margin:0 -11px 15px}
  .hud-so{width:100%;margin-left:0;gap:11px;font-size:12.3px}
  .so-to{font-size:25px}
  table.kq{font-size:12.4px}
  table.kq.small{font-size:11.4px}
}

</style>
</head>
<body>
<div class="app">
  <div class="hud" id="hud"></div>
  <nav class="tab" id="tab"></nav>
  <main id="noidung"></main>
  <footer style="margin-top:34px;padding-top:16px;border-top:1px solid var(--vien);
                 font-size:12px;color:var(--chu3);text-align:center">
    Thiên Đạo Lộ · bám Chương trình GDPT 2018 (thi từ 2025).
    Tiến độ lưu ngay trên máy bạn, không gửi đi đâu cả.
  </footer>
</div>
<div id="toast"></div>
<div id="dotpha"></div>

<script>
/* ============================================================
   THIÊN ĐẠO LỘ — Cấu hình cốt lõi
   Game tu tiên = lộ trình ôn thi tốt nghiệp THPT (CT GDPT 2018)
   ============================================================ */
window.TD = window.TD || {};

/* ---------- 1. CẢNH GIỚI TU LUYỆN ---------- */
/* exp: linh khí tích luỹ. Mỗi câu đúng = exp theo mức độ. */
TD.CANH_GIOI = [
  { id: 0, ten: 'Phàm Nhân',    tang: 'Chưa dẫn khí',        exp: 0,     mau: '#8a8f98', mo_ta: 'Chưa mở linh mạch. Bắt đầu từ lý thuyết nền.' },
  { id: 1, ten: 'Luyện Khí',    tang: 'Tầng 1–3',            exp: 300,   mau: '#7fb3d5', mo_ta: 'Dẫn khí nhập thể — nắm định nghĩa, công thức gốc.' },
  { id: 2, ten: 'Luyện Khí',    tang: 'Tầng 4–9',            exp: 900,   mau: '#5dade2', mo_ta: 'Khí lưu chuyển — làm trọn vẹn câu nhận biết.' },
  { id: 3, ten: 'Trúc Cơ',      tang: 'Sơ kỳ → Hậu kỳ',      exp: 2000,  mau: '#48c9b0', mo_ta: 'Xây nền vững — thông hiểu, đọc đề không sợ.' },
  { id: 4, ten: 'Kim Đan',      tang: 'Kết đan',             exp: 4000,  mau: '#f5c76b', mo_ta: 'Ngưng đan — vận dụng, giải bài tập chuẩn.' },
  { id: 5, ten: 'Nguyên Anh',   tang: 'Xuất khiếu',          exp: 7000,  mau: '#e59866', mo_ta: 'Nguyên anh xuất thế — xử lý câu đúng/sai 4 ý.' },
  { id: 6, ten: 'Hóa Thần',     tang: 'Thần niệm',           exp: 11000, mau: '#bb8fce', mo_ta: 'Thần thức bao trùm — trả lời ngắn, tính nhanh.' },
  { id: 7, ten: 'Luyện Hư',     tang: 'Phá hư',              exp: 16000, mau: '#af7ac5', mo_ta: 'Phá vỡ giới hạn — vận dụng cao, câu phân hoá.' },
  { id: 8, ten: 'Hợp Thể',      tang: 'Thiên nhân hợp nhất', exp: 22000, mau: '#ec7063', mo_ta: 'Hợp nhất kiến thức liên môn, tốc độ ổn định.' },
  { id: 9, ten: 'Đại Thừa',     tang: 'Viên mãn',            exp: 30000, mau: '#e74c3c', mo_ta: 'Viên mãn — đề nào cũng giữ được nhịp.' },
  { id: 10, ten: 'Độ Kiếp',     tang: 'Cửu Trọng Lôi Kiếp',  exp: 40000, mau: '#f39c12', mo_ta: 'Vượt kiếp = vượt kỳ thi thật. 28+ điểm trong tầm tay.' },
  { id: 11, ten: 'Phi Thăng',   tang: 'Thượng Giới',         exp: 55000, mau: '#ffd700', mo_ta: 'Đăng khoa. Chúc mừng đạo hữu.' }
];

/* ---------- 2. MÔN THI & CẤU TRÚC ĐỀ (TN THPT — CT 2018) ---------- */
/* p1: trắc nghiệm 4 lựa chọn (0,25đ/câu)
   p2: đúng/sai, mỗi câu 4 ý — 1 ý đúng 0,1 | 2 ý 0,25 | 3 ý 0,5 | 4 ý 1,0
   p3: trả lời ngắn (Toán 0,5đ/câu; môn khác 0,25đ/câu) */
TD.MON = {
  toan: { ten: 'Toán',        icon: '⚔️', phai: 'Kiếm Tông',    mau: '#5dade2',
          p1: 12, p2: 4, p3: 6, phut: 90, d1: 0.25, d3: 0.5,
          slogan: 'Một kiếm phá vạn pháp — nhanh, chuẩn, không do dự.' },
  ly:   { ten: 'Vật lí',      icon: '⚡', phai: 'Lôi Đình Điện', mau: '#f4d03f',
          p1: 18, p2: 4, p3: 6, phut: 50, d1: 0.25, d3: 0.25,
          slogan: 'Nắm quy luật trời đất, mượn lực mà thắng.' },
  hoa:  { ten: 'Hoá học',     icon: '⚗️', phai: 'Đan Đỉnh Các',  mau: '#48c9b0',
          p1: 18, p2: 4, p3: 6, phut: 50, d1: 0.25, d3: 0.25,
          slogan: 'Luyện đan cần đúng liều — bảo toàn là đạo.' },
  sinh: { ten: 'Sinh học',    icon: '🌿', phai: 'Vạn Dược Cốc',  mau: '#82e0aa',
          p1: 18, p2: 4, p3: 6, phut: 50, d1: 0.25, d3: 0.25,
          slogan: 'Vạn vật sinh trưởng đều có đạo lý của nó.' },
  su:   { ten: 'Lịch sử',     icon: '📜', phai: 'Tàng Sử Lâu',   mau: '#e59866',
          p1: 24, p2: 4, p3: 0, phut: 50, d1: 0.25, d3: 0,
          slogan: 'Đọc sử ngàn năm, biết hưng vong thiên hạ.' },
  dia:  { ten: 'Địa lí',      icon: '🗺️', phai: 'Sơn Hà Môn',    mau: '#7dcea0',
          p1: 24, p2: 4, p3: 0, phut: 50, d1: 0.25, d3: 0,
          slogan: 'Atlat trong tay, thiên hạ trong lòng.' },
  gdkt: { ten: 'GDKT & PL',   icon: '⚖️', phai: 'Chấp Pháp Đường', mau: '#bb8fce',
          p1: 24, p2: 4, p3: 0, phut: 50, d1: 0.25, d3: 0,
          slogan: 'Luật là giới, hiểu giới mới đi xa.' },
  van:  { ten: 'Ngữ văn',     icon: '🖌️', phai: 'Văn Tâm Các',   mau: '#f1948a',
          p1: 0, p2: 0, p3: 0, phut: 120, tuluan: true, d1: 0, d3: 0,
          slogan: 'Tự luận 120 phút — đọc hiểu 4đ, viết 6đ.' },
  anh:  { ten: 'Tiếng Anh',   icon: '🌐', phai: 'Dịch Ngữ Cung',  mau: '#85c1e9',
          p1: 40, p2: 0, p3: 0, phut: 50, d1: 0.25, d3: 0,
          slogan: '40 câu, 50 phút — 1 phút 1 câu, không luyến tiếc.' }
};

/* Thứ tự hiển thị */
TD.THU_TU_MON = ['toan', 'van', 'hoa', 'ly', 'sinh', 'su', 'dia', 'gdkt', 'anh'];

/* ---------- 3. MỨC ĐỘ CÂU HỎI ---------- */
TD.MUC = {
  1: { ten: 'Nhận biết',     ky: 'Dẫn Khí',   exp: 6,  mau: '#7fb3d5' },
  2: { ten: 'Thông hiểu',    ky: 'Ngưng Thần', exp: 12, mau: '#48c9b0' },
  3: { ten: 'Vận dụng',      ky: 'Ngự Kiếm',  exp: 24, mau: '#f5c76b' },
  4: { ten: 'Vận dụng cao',  ky: 'Độ Kiếp',   exp: 50, mau: '#e74c3c' }
};

/* ---------- 4. CẤU HÌNH MẶC ĐỊNH ---------- */
TD.MAC_DINH = {
  ngay_thi: '2027-06-11',        // đổi được trong phần Cài đặt
  to_hop: ['toan', 'hoa', 'ly'], // tổ hợp xét tuyển (mục tiêu 28đ)
  muc_tieu: 28,
  chi_tieu_ngay: 30              // số câu/ngày
};

/* ---------- 5. VẬT PHẨM ---------- */
TD.VAT_PHAM = {
  thien_co:   { ten: 'Thiên Cơ Phù',  icon: '🔮', gia: 30,  mo_ta: 'Loại bỏ 2 đáp án sai.' },
  hoi_xuan:   { ten: 'Hồi Xuân Đan',  icon: '💊', gia: 60,  mo_ta: 'Giữ nguyên chuỗi liên kích khi trả lời sai 1 câu.' },
  ngo_dao:    { ten: 'Ngộ Đạo Trà',   icon: '🍵', gia: 80,  mo_ta: 'Nhân đôi linh khí nhận được trong 10 câu kế.' },
  truy_hon:   { ten: 'Truy Hồn Kính', icon: '🪞', gia: 45,  mo_ta: 'Xem ngay lời giải + mẹo mà không mất linh khí.' }
};

/* ---------- 6. THANG QUY ĐỔI ĐIỂM ---------- */
/* Ước lượng điểm từ độ chính xác theo mức độ, có trọng số theo cấu trúc đề. */
TD.TRONG_SO_MUC = { 1: 0.30, 2: 0.30, 3: 0.25, 4: 0.15 };

TD.hamMucTieu = function (diem) {
  if (diem >= 9.5) return 'Thủ khoa cấp tỉnh';
  if (diem >= 9.0) return 'Top trường Y – Bách khoa';
  if (diem >= 8.0) return 'Đại học tốp đầu';
  if (diem >= 7.0) return 'Đại học khá';
  if (diem >= 5.0) return 'Đủ tốt nghiệp';
  return 'Cần cày thêm';
};

<script>
/* ============================================================
   TRẠNG THÁI & LƯU TIẾN ĐỘ (localStorage) + THUẬT TOÁN ÔN GIÃN CÁCH
   ============================================================ */
window.TD = window.TD || {};

TD.KHOA = 'thien-dao-lo-v1';

TD.macDinhTrangThai = function () {
  return {
    ten: 'Đạo hữu',
    exp: 0,
    linh_thach: 100,
    ngay_thi: TD.MAC_DINH.ngay_thi,
    to_hop: TD.MAC_DINH.to_hop.slice(),
    chi_tieu_ngay: TD.MAC_DINH.chi_tieu_ngay,
    so_cau_phien: 30,           /* độ dài mỗi phiên Luyện Công */
    bat_dau: TD.homNay(),
    /* thống kê: thong_ke[mon][muc] = {dung, tong} */
    thong_ke: {},
    /* nhật ký theo ngày: nhat_ky['2026-08-19'] = số câu đã làm */
    nhat_ky: {},
    /* thẻ ôn giãn cách: the[id] = {lan, khoang, de, han, sai} */
    the: {},
    /* khẩu quyết đã "khắc cốt" */
    da_khac: {},
    /* kết quả độ kiếp: do_kiep[mon] = [{ngay, diem}] */
    do_kiep: {},
    /* kết quả Tà Đạo: ta_dao['mon|loai|so'] = {pt, dung, tong, ngay} */
    ta_dao: {},
    /* tiến độ đang dở của bộ đề Tà Đạo */
    ta_dao_tien: {},
    tui: { thien_co: 2, hoi_xuan: 1, ngo_dao: 0, truy_hon: 1 },
    chuoi: 0, chuoi_max: 0,
    ngay_lien_tiep: 0, ngay_cuoi: null
  };
};

TD.homNay = function () {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};

TD.tai = function () {
  let s;
  try { s = JSON.parse(localStorage.getItem(TD.KHOA) || 'null'); } catch (e) { s = null; }
  const md = TD.macDinhTrangThai();
  if (!s) return md;
  /* bổ sung khoá mới khi nâng cấp phiên bản */
  for (const k in md) if (!(k in s)) s[k] = md[k];
  return s;
};

TD.luu = function () {
  try { localStorage.setItem(TD.KHOA, JSON.stringify(TD.S)); }
  catch (e) { console.warn('Không lưu được tiến độ:', e); }
};

TD.xoaHet = function () {
  try { localStorage.removeItem(TD.KHOA); } catch (e) {}
  TD.S = TD.macDinhTrangThai();
};

/* ---------- CẢNH GIỚI ---------- */
TD.canhGioi = function (exp) {
  let cg = TD.CANH_GIOI[0];
  for (const c of TD.CANH_GIOI) if (exp >= c.exp) cg = c;
  return cg;
};

TD.canhGioiSau = function (exp) {
  for (const c of TD.CANH_GIOI) if (exp < c.exp) return c;
  return null;
};

/* Tỉ lệ % tiến độ tới cảnh giới kế tiếp */
TD.tienDoCanhGioi = function (exp) {
  const nay = TD.canhGioi(exp), sau = TD.canhGioiSau(exp);
  if (!sau) return 100;
  const khoang = sau.exp - nay.exp;
  return khoang <= 0 ? 100 : Math.min(100, Math.round(((exp - nay.exp) / khoang) * 100));
};

/* ---------- CỘNG LINH KHÍ ---------- */
TD.themExp = function (n) {
  const truoc = TD.canhGioi(TD.S.exp);
  TD.S.exp += n;
  const sau = TD.canhGioi(TD.S.exp);
  if (sau.id !== truoc.id) TD.moDotPha(sau);
  return sau.id !== truoc.id;
};

/* ---------- ĐIỂM DANH NGÀY ---------- */
TD.diemDanh = function () {
  const h = TD.homNay();
  if (TD.S.ngay_cuoi === h) return;
  if (TD.S.ngay_cuoi) {
    const cach = Math.round((new Date(h) - new Date(TD.S.ngay_cuoi)) / 86400000);
    TD.S.ngay_lien_tiep = cach === 1 ? TD.S.ngay_lien_tiep + 1 : 1;
  } else TD.S.ngay_lien_tiep = 1;
  TD.S.ngay_cuoi = h;
};

/* ---------- THUẬT TOÁN ÔN GIÃN CÁCH (biến thể SM-2) ----------
   Mỗi thẻ: lan (số lần đúng liên tiếp), khoang (ngày), de (hệ số dễ), han (mốc ôn lại) */
TD.SRS = {
  moi: function () { return { lan: 0, khoang: 0, de: 2.5, han: Date.now(), sai: 0 }; },

  /* dung=true: trả lời đúng · false: sai */
  capNhat: function (id, dung) {
    const t = TD.S.the[id] || TD.SRS.moi();
    if (dung) {
      t.lan += 1;
      if (t.lan === 1) t.khoang = 1;
      else if (t.lan === 2) t.khoang = 3;
      else t.khoang = Math.round(t.khoang * t.de);
      t.de = Math.min(2.8, t.de + 0.08);
    } else {
      t.lan = 0;
      t.khoang = 0;              /* ôn lại ngay trong phiên */
      t.de = Math.max(1.3, t.de - 0.22);
      t.sai = (t.sai || 0) + 1;
    }
    t.han = Date.now() + (t.khoang > 0 ? t.khoang * 86400000 : 10 * 60000);
    TD.S.the[id] = t;
    return t;
  },

  denHan: function () {
    const bay = Date.now();
    return Object.keys(TD.S.the).filter(id => TD.S.the[id].han <= bay);
  },

  /* Số thẻ sẽ đến hạn trong n ngày tới */
  sapToi: function (ngay) {
    const moc = Date.now() + ngay * 86400000;
    return Object.keys(TD.S.the).filter(id => {
      const h = TD.S.the[id].han;
      return h > Date.now() && h <= moc;
    }).length;
  }
};

/* ---------- THỐNG KÊ ---------- */
TD.ghiNhan = function (mon, muc, dung) {
  TD.S.thong_ke[mon] = TD.S.thong_ke[mon] || {};
  const o = TD.S.thong_ke[mon][muc] = TD.S.thong_ke[mon][muc] || { dung: 0, tong: 0 };
  o.tong++; if (dung) o.dung++;

  const h = TD.homNay();
  TD.S.nhat_ky[h] = (TD.S.nhat_ky[h] || 0) + 1;

  if (dung) {
    TD.S.chuoi++;
    if (TD.S.chuoi > TD.S.chuoi_max) TD.S.chuoi_max = TD.S.chuoi;
  } else if (TD.S.tui.hoi_xuan > 0 && TD.S.chuoi >= 5) {
    TD.S.tui.hoi_xuan--;                       /* Hồi Xuân Đan tự động giữ chuỗi */
    TD.bao('💊 Hồi Xuân Đan đã giữ lại chuỗi liên kích ' + TD.S.chuoi + '!', 'kim');
  } else TD.S.chuoi = 0;

  TD.diemDanh();
};

/* Độ chính xác tổng của một môn (0–100) */
TD.doChinhXac = function (mon) {
  const t = TD.S.thong_ke[mon]; if (!t) return null;
  let d = 0, n = 0;
  for (const m in t) { d += t[m].dung; n += t[m].tong; }
  return n ? Math.round((d / n) * 100) : null;
};

TD.soCauDaLam = function (mon) {
  const t = TD.S.thong_ke[mon]; if (!t) return 0;
  let n = 0; for (const m in t) n += t[m].tong;
  return n;
};

/* ---------- ƯỚC LƯỢNG ĐIỂM THI ----------
   Lấy độ chính xác từng mức độ nhân trọng số theo cấu trúc đề.
   Mức chưa làm câu nào thì coi như chưa có dữ liệu và bị chiết khấu. */
TD.uocLuongDiem = function (mon) {
  const t = TD.S.thong_ke[mon];
  if (!t) return null;
  let tong = 0, trongSoCo = 0;
  for (const m of [1, 2, 3, 4]) {
    const w = TD.TRONG_SO_MUC[m];
    const o = t[m];
    if (o && o.tong >= 3) { tong += (o.dung / o.tong) * w; trongSoCo += w; }
  }
  if (trongSoCo < 0.5) return null;             /* chưa đủ dữ liệu để ước lượng */
  const tyLe = tong / trongSoCo;
  /* chiết khấu theo phần trọng số chưa có dữ liệu (tránh ảo tưởng điểm cao) */
  return Math.round(tyLe * 10 * (0.75 + 0.25 * trongSoCo) * 10) / 10;
};

TD.tongDiemToHop = function () {
  let tong = 0, du = true;
  for (const m of TD.S.to_hop) {
    const d = TD.uocLuongDiem(m);
    if (d === null) du = false; else tong += d;
  }
  return { tong: Math.round(tong * 10) / 10, du: du };
};

/* ---------- NGÀY CÒN LẠI ---------- */
TD.ngayConLai = function () {
  const t = new Date(TD.S.ngay_thi + 'T00:00:00');
  const h = new Date(TD.homNay() + 'T00:00:00');
  return Math.round((t - h) / 86400000);
};

/* Tuần hiện tại trong lộ trình 20 tuần, tính từ ngày bắt đầu */
TD.tuanHienTai = function () {
  const bd = new Date(TD.S.bat_dau + 'T00:00:00');
  const h = new Date(TD.homNay() + 'T00:00:00');
  const ngay = Math.max(0, Math.round((h - bd) / 86400000));
  return Math.min(20, Math.floor(ngay / 7) + 1);
};

/* ============================================================
   BỘ SINH ĐỀ — mỗi "mẫu đề" là một dạng bài tự random số liệu,
   tự tính đáp án và tự viết lời giải theo đúng số liệu đó.
   ⇒ một mẫu = vô hạn câu, đáp án không thể sai.
   ============================================================ */
TD.GEN = {};                      /* TD.GEN[mon] = [mau, ...] */

/* Bộ sinh số giả ngẫu nhiên có hạt giống (mulberry32) — cùng seed cho cùng đề */
TD.rng = function (seed) {
  let a = (seed >>> 0) || 1;
  const r = function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  /* tiện ích dùng trong mẫu đề */
  r.nguyen = (min, max) => min + Math.floor(r() * (max - min + 1));
  r.chon = arr => arr[Math.floor(r() * arr.length)];
  /* chọn k phần tử khác nhau */
  r.chonNhieu = (arr, k) => {
    const b = arr.slice();
    for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
    return b.slice(0, k);
  };
  return r;
};

/* Làm tròn và định dạng số kiểu Việt Nam (dấu phẩy thập phân) */
TD.lamTron = function (x, n) {
  const m = Math.pow(10, n === undefined ? 2 : n);
  return Math.round(x * m) / m;
};
TD.soVN = function (x, n) {
  const v = TD.lamTron(x, n);
  return String(v).replace('.', ',');
};

/* Đáp án số cho câu trả lời ngắn: làm tròn ĐÚNG số chữ số thập phân mà đề yêu cầu,
   giữ cả chữ số 0 ở cuối để học sinh biết mức chính xác cần ghi. */
TD.dapSo = function (x, n) {
  const v = TD.lamTron(x, n || 0);
  return (n ? v.toFixed(n) : String(Math.round(v))).replace('.', ',');
};

/* ============================================================
   GHÉP THẺ TÀNG KINH CÁC ↔ CHỦ ĐỀ TRONG KHO MỆNH ĐỀ
   Thẻ có thể tự khai bằng trường `cd`. Không khai thì so khớp theo từ khoá.

   ném cho người học một mớ câu hỏi lạc chuyên đề.
   ============================================================ */
const CHI_SO = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9',
                 '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
TD.khongDau = function (t) {
  return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[đĐ]/g, 'd')
    /* CO₂, HNO₃, Fe³⁺ … phải quy về co2, hno3, fe3 thì bảng từ khoá mới bắt được */
    .replace(/[₀-₉⁰-⁹¹²³]/g, c => CHI_SO[c] || c)
    .toLowerCase();
};

const BO_QUA = ['va', 'voi', 'cua', 'trong', 'cac', 'nhung', 'mot', 'cho', 'tren', 'theo'];

TD.tuKhoa = function (t) {
  return TD.khongDau(t)
    .replace(/^[ivxlcdm]+\s*[.\-–]\s*/i, '')       /* bỏ "I. ", "IV. " */
    .replace(/^[a-z]\s*[.\-–]\s*/i, '')            /* bỏ "A. ", "B. " */
    .replace(/^\d+\s*[.\-–]\s*/, '')              /* bỏ "1. " */
    .split(/[^a-z0-9]+/)
    .filter(w => w.length >= 3 && BO_QUA.indexOf(w) < 0);
};

/* Bảng từ khoá → chủ đề. Nhiều thẻ đặt tên theo KỸ THUẬT ("Bảo toàn", "Quy đổi")

TD.chuDeCuaThe = function (mon, x) {
  const kho = TD.KHO_LT[mon] || [];
  const dsCD = [];
  kho.forEach(z => { if (z.cd && dsCD.indexOf(z.cd) < 0) dsCD.push(z.cd); });
  if (!dsCD.length) return null;
  /* ① thẻ tự khai chủ đề thì tin tuyệt đối */
  if (x.cd && dsCD.indexOf(x.cd) >= 0) return x.cd;
  if (x.cd === '*') return null;                 /* thẻ khai rõ là kỹ thuật xuyên suốt */

  const van = TD.khongDau((x.nhom || '') + ' ' + (x.ten || '') + ' ' + (x.chu_de || ''));
  /* ② bảng từ khoá */
  for (const [re, cd] of (TD.BAN_DO_CD[mon] || []))
    if (re.test(van) && dsCD.indexOf(cd) >= 0) return cd;

  /* ③ so trùng từ khoá với tên chủ đề */
  const nguon = TD.tuKhoa((x.nhom || '') + ' ' + (x.ten || x.chu_de || ''));
  if (!nguon.length) return null;
  let tot = null, diemTot = 0;
  for (const cd of dsCD) {
    const dich = TD.tuKhoa(cd);
    if (!dich.length) continue;
    let trung = 0;
    for (const w of dich) if (nguon.indexOf(w) >= 0) trung++;
    const diem = trung / dich.length;
    if (diem > diemTot) { diemTot = diem; tot = cd; }
  }
  /* ④ dưới ngưỡng ⇒ null. Thà kiểm tra tổng hợp cả môn còn hơn gắn nhãn sai chuyên đề. */
  return diemTot >= 0.5 ? tot : null;
};

TD.SO_CAU_KIEM_TRA = 50;

/* Bộ đề kiểm tra một chuyên đề: chỉ lấy mệnh đề đúng chủ đề đó và bài tập
   thuộc đúng chương đó. cd = null ⇒ kiểm tra tổng hợp cả môn.
   Thứ tự: hỏi hết mệnh đề → thêm bài tập tính toán → bù bằng câu đúng/sai 4 ý
   (mỗi câu là một tổ hợp 4 mệnh đề khác nhau nên không lặp lại). */
TD.deChuyenDe = function (mon, cd, soCau) {
  const kho = TD.KHO_LT[mon] || [];
  const n = soCau || TD.SO_CAU_KIEM_TRA;
  const chiSo = [];
  kho.forEach((z, i) => { if (!cd || (z.cd || '') === cd) chiSo.push(i); });
  if (chiSo.length < 4) return [];
  const ds = [];

  /* ① mỗi mệnh đề một câu: đúng thì hỏi "chọn phát biểu ĐÚNG", sai thì hỏi "chọn phát biểu SAI" */
  TD.xao(chiSo).slice(0, n).forEach(i => ds.push({ mon: mon, lt: i,
    c: kho[i].a ? 'd' : 's', s: (Math.random() * 4294967295) >>> 0 }));

  /* ② bài tập tính toán thuộc đúng chương đó (nếu môn có bộ sinh đề) */
  const mau = (TD.GEN[mon] || []).filter(t =>
    !t._tuLT && (!cd || TD.chuDeCuaThe(mon, { nhom: t.chuong }) === cd));
  if (mau.length) {
    const soBT = Math.min(Math.round(n * 0.3), n - ds.length);
    let vt = 0, quay = TD.xao(mau);
    for (let k = 0, thu = 0; k < soBT && thu < soBT * 8; thu++) {
      if (vt >= quay.length) { quay = TD.xao(mau); vt = 0; }
      const t = quay[vt++], seed = (Math.random() * 4294967295) >>> 0;
      if (TD.sinhCau(t, seed)) { ds.push({ mon: mon, g: t.ma, s: seed }); k++; }
    }
  }

  /* ③ bù cho đủ số câu bằng câu đúng/sai 4 ý, không trùng tổ hợp */
  const daDung = {}, cdDS = cd || kho[chiSo[0]].cd;
  let thu = 0;
  while (ds.length < n && thu++ < n * 60) {
    const bo = TD.xao(chiSo).slice(0, 4).sort((a, b) => a - b), khoa = bo.join('-');
    if (daDung[khoa]) continue;
    daDung[khoa] = 1;
    ds.push({ mon: mon, dsy: bo, cd: cdDS, s: (Math.random() * 4294967295) >>> 0 });
  }
  return TD.xao(ds).slice(0, n);
};

TD.timMau = function (mon, ma) {
  return (TD.GEN[mon] || []).find(t => t.ma === ma);
};

/* Dựng một câu hỏi cụ thể từ mẫu đề + hạt giống */
TD.sinhCau = function (mau, seed) {
  const R = TD.rng(seed);
  let o;
  try { o = mau.tao(R); } catch (e) { console.warn('Mẫu đề lỗi:', mau.ma, e); return null; }
  if (!o) return null;
  return Object.assign({
    chuong: mau.chuong, muc: mau.muc, dang: mau.dang, _ma: mau.ma, _sinh: true
  }, o);
};

/* Lấy câu hỏi từ một mục trong danh sách phiên.
   Mục tĩnh: {mon, i} · Mục sinh: {mon, g: mã mẫu, s: hạt giống} */
TD.layCau = function (it) {
  if (!it) return null;
  if (it.dsy) return TD.cauDsTuMenhDe(it.mon, it.dsy, it.cd, it.s);
  if (it.lt !== undefined) return TD.cauTuMenhDe(it.mon, it.lt, it.c, it.s);
  if (it.g) {
    const mau = TD.timMau(it.mon, it.g);
    return mau ? TD.sinhCau(mau, it.s) : null;
  }
  return (TD.KHO[it.mon] || [])[it.i];
};

/* Khoá thẻ ôn giãn cách.
   Với câu sinh tự động, thẻ gắn với MẪU ĐỀ chứ không phải số liệu cụ thể
   — nên khi tâm ma quay lại, bạn gặp một biến thể MỚI của cùng dạng bài. */
TD.idThe = function (it) {
  if (it.dsy) return it.mon + '\u00A7' + it.cd;
  if (it.lt !== undefined) return it.mon + '$' + it.lt;
  return it.g ? it.mon + '@' + it.g : it.mon + '#' + it.i;
};

/* Đọc ngược khoá thẻ thành mục danh sách (hạt giống mới mỗi lần ôn) */
TD.theThanhMuc = function (id) {
  if (id.indexOf('\u00A7') > 0) {
    const [mon, cd] = id.split('\u00A7');
    const kho = TD.KHO_LT[mon] || [];
    const nhom = [];
    kho.forEach((x, i) => { if ((x.cd || 'Khác') === cd) nhom.push(i); });
    if (nhom.length < 4) return null;
    const R = TD.rng((Math.random() * 4294967295) >>> 0);
    return { mon: mon, dsy: R.chonNhieu(nhom, 4), cd: cd, s: (Math.random() * 4294967295) >>> 0 };
  }
  if (id.indexOf('$') > 0) {
    const [mon, i] = id.split('$');
    const goc = (TD.KHO_LT[mon] || [])[+i];
    if (!goc) return null;
    return { mon: mon, lt: +i, c: goc.a ? 'd' : 's', s: (Math.random() * 4294967295) >>> 0 };
  }
  if (id.indexOf('@') > 0) {
    const [mon, ma] = id.split('@');
    if (!TD.timMau(mon, ma)) return null;
    return { mon: mon, g: ma, s: (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0 };
  }
  const [mon, i] = id.split('#');
  if (!TD.KHO[mon] || !TD.KHO[mon][+i]) return null;
  return { mon: mon, i: +i };
};

/* Sinh n mục câu hỏi tự động cho một môn, lọc theo mức độ nếu có */
TD.sinhNhieu = function (mon, muc, n) {
  const mau = (TD.GEN[mon] || []).filter(t => !muc || t.muc === muc);
  if (!mau.length) return [];
  /* Xáo danh sách mẫu rồi duyệt vòng — mỗi dạng bài đều được chạm tới
     trước khi lặp lại dạng nào, nên phiên luyện phủ đều chứ không dồn cục. */
  let dsMau = TD.xao(mau), vt = 0;
  const ra = [];
  for (let thu = 0; ra.length < n && thu < n * 6; thu++) {
    if (vt >= dsMau.length) { dsMau = TD.xao(mau); vt = 0; }
    const t = dsMau[vt++];
    const seed = (Math.random() * 4294967295) >>> 0;
    if (TD.sinhCau(t, seed)) ra.push({ mon: mon, g: t.ma, s: seed });
  }
  return TD.xao(ra);
};

/* Đếm số mẫu đề của một môn */
TD.soMau = function (mon, muc) {
  return (TD.GEN[mon] || []).filter(t => !muc || t.muc === muc).length;
};

/* ============================================================
   TÀ ĐẠO — bộ đề lý thuyết & bài tập trọng điểm
   Đề được LẮP từ kho mệnh đề đã thẩm định, theo hạt giống cố định
   ⇒ "đề số 7 môn Hoá" lúc nào cũng là đúng đề đó, mở lại vẫn thế.
   Mỗi mệnh đề được hỏi cả hai chiều:
     chiều 'd' — chọn phát biểu ĐÚNG (đáp án là mệnh đề đúng)
     chiều 's' — chọn phát biểu SAI  (đáp án là mệnh đề sai)
   ============================================================ */
TD.KHO_LT = TD.KHO_LT || {};        /* TD.KHO_LT[mon] = [{t, a, v, cd}, ...] */

TD.SO_DE_TA_DAO = 20;
TD.SO_CAU_TA_DAO = 120;

/* Băm chuỗi thành hạt giống ổn định */
TD.bam = function (chuoi) {
  let h = 2166136261;
  for (let i = 0; i < chuoi.length; i++) { h ^= chuoi.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
};

/* Dựng một bộ đề Tà Đạo. so = 1..20 · loai = 'lythuyet' | 'baitap' */
TD.deTaDao = function (mon, so, loai) {
  const R = TD.rng(TD.bam(mon + '|' + loai + '|' + so));
  const N = TD.SO_CAU_TA_DAO;

  if (loai === 'baitap') {
    const mau = (TD.GEN[mon] || []).filter(t => !t._tuLT);   /* chỉ bài tập tính toán */
    if (!mau.length) return [];
    const ra = [];
    /* Rải đều các dạng bài rồi mới xáo, để đề nào cũng phủ hết dạng.
       Một số mẫu đề từ chối vài hạt giống (số liệu ra không đẹp), nên phải
       đổi hạt giống cho tới khi dựng được câu hợp lệ — đề không được có câu trống. */
    for (let k = 0; k < N; k++) {
      const t = mau[k % mau.length];
      let seed = TD.bam(mon + so + t.ma + k), duoc = false;
      for (let lan = 0; lan < 40; lan++) {
        if (TD.sinhCau(t, seed)) { duoc = true; break; }
        seed = TD.bam(mon + so + t.ma + k + '#' + lan);
      }
      if (duoc) ra.push({ mon: mon, g: t.ma, s: seed });
    }
    /* nếu vẫn thiếu (mẫu đề quá kén), bù thêm biến thể của các dạng đã dựng được */
    for (let k = 0; ra.length && ra.length < N && k < N * 4; k++) {
      const goc = ra[k % ra.length];
      const t = TD.timMau(mon, goc.g);
      const seed = TD.bam(mon + so + goc.g + 'bu' + k);
      if (t && TD.sinhCau(t, seed)) ra.push({ mon: mon, g: goc.g, s: seed });
    }
    return TD.xaoR(R, ra);
  }

  const kho = TD.KHO_LT[mon] || [];
  if (kho.length < 8) return [];
  const dung = [], sai = [];
  kho.forEach((x, i) => (x.a ? dung : sai).push(i));
  if (dung.length < 4 || sai.length < 4) return [];

  /* Phần I — mỗi mệnh đề đúng cho 1 câu "chọn phát biểu ĐÚNG",
     mỗi mệnh đề sai cho 1 câu "chọn phát biểu SAI" ⇒ phủ hết kho, không lặp. */
  const von = TD.xaoR(R, dung.map(i => ({ lt: i, c: 'd' })).concat(sai.map(i => ({ lt: i, c: 's' }))));
  const soMC = Math.min(von.length, Math.round(N * 0.75));
  const ra = von.slice(0, soMC).map((v, k) =>
    ({ mon: mon, lt: v.lt, c: v.c, s: TD.bam(mon + so + v.lt + v.c + k) }));

  /* Phần II — câu đúng/sai 4 ý, mỗi câu gom 4 mệnh đề cùng một chủ đề.
     Kho vài trăm mệnh đề cho số tổ hợp khổng lồ nên không lo trùng. */
  const theoCD = {};
  kho.forEach((x, i) => { const c = x.cd || 'Khác'; (theoCD[c] = theoCD[c] || []).push(i); });
  const cdDung = Object.keys(theoCD).filter(c => theoCD[c].length >= 4);
  let k2 = 0;
  while (ra.length < N && cdDung.length) {
    const cd = cdDung[k2 % cdDung.length];
    const chon = R.chonNhieu(theoCD[cd], 4);
    ra.push({ mon: mon, dsy: chon, cd: cd, s: TD.bam(mon + so + cd + k2) });
    k2++;
    if (k2 > N * 3) break;                    /* chốt chặn an toàn */
  }
  return TD.xaoR(R, ra);
};

/* Dựng câu Đúng/Sai 4 ý từ bốn mệnh đề trong kho */
TD.cauDsTuMenhDe = function (mon, chiSos, cd, seed) {
  const kho = TD.KHO_LT[mon] || [];
  const y = chiSos.map(i => kho[i]);
  if (y.some(x => !x)) return null;
  const R = TD.rng(seed >>> 0);
  const t = TD.xaoR(R, y);
  return {
    chuong: cd || 'Lý thuyết trọng điểm',
    muc: Math.max.apply(null, t.map(x => x.m || 2)),
    dang: 'ds',
    _lt: true,
    q: `Về chủ đề <b>${cd}</b>, xét tính đúng/sai của từng phát biểu sau:`,
    items: t.map(x => ({ t: x.t, a: !!x.a })),
    giai: t.map((x, i) => `Ý ${'abcd'[i]}) ${x.a ? 'ĐÚNG' : 'SAI'} — ${x.v}`).join('\n'),
    meo: 'Xét từng ý ĐỘC LẬP với nhau. Đừng nghĩ "chắc phải có 2 đúng 2 sai" — cả 4 ý cùng đúng là hoàn toàn có thể.'
  };
};

/* Dựng câu hỏi trắc nghiệm từ một mệnh đề trong kho */
TD.cauTuMenhDe = function (mon, chiSo, chieu, seed) {
  const kho = TD.KHO_LT[mon] || [];
  const goc = kho[chiSo];
  if (!goc) return null;
  /* đáp án phải cùng chiều với mệnh đề: hỏi "đúng" thì mệnh đề phải đúng */
  if ((chieu === 'd') !== !!goc.a) return null;

  const R = TD.rng(seed >>> 0);
  const nguoc = kho.filter(x => !!x.a !== !!goc.a);
  if (nguoc.length < 3) return null;
  /* ưu tiên phương án nhiễu cùng chủ đề cho câu hỏi có sức nặng */
  const cungCD = nguoc.filter(x => x.cd === goc.cd);
  const nguon = cungCD.length >= 3 ? cungCD : nguoc;
  const nhieu = R.chonNhieu(nguon, 3);

  const opts = TD.xaoR(R, [goc].concat(nhieu));
  return {
    chuong: goc.cd || 'Lý thuyết trọng điểm',
    muc: goc.m || 2,
    dang: 'mc',
    _lt: true,
    q: chieu === 'd' ? 'Phát biểu nào sau đây <b>đúng</b>?' : 'Phát biểu nào sau đây <b>sai</b>?',
    opts: opts.map(x => x.t),
    ans: opts.indexOf(goc),
    giai: `Đáp án: ${goc.t}\n→ ${goc.v}\n\nCác phát biểu còn lại:\n`
        + nhieu.map(x => `· ${x.t}\n  → ${x.v}`).join('\n'),
    meo: goc.meo
  };
};

/* Đếm số câu hỏi lý thuyết khả dụng của một môn */
TD.soMenhDe = function (mon) { return (TD.KHO_LT[mon] || []).length; };

/* Bộ đề Tà Đạo có dùng được không */
TD.taDaoSan = function (mon, loai) {
  if (loai === 'baitap') return (TD.GEN[mon] || []).filter(t => !t._tuLT).length >= 3;
  const kho = TD.KHO_LT[mon] || [];
  return kho.filter(x => x.a).length >= 4 && kho.filter(x => !x.a).length >= 4;
};

/* Ghi nhận kết quả một bộ đề Tà Đạo */
TD.ghiTaDao = function (mon, so, loai, dung, tong) {
  TD.S.ta_dao = TD.S.ta_dao || {};
  const k = mon + '|' + loai + '|' + so;
  const cu = TD.S.ta_dao[k];
  const pt = Math.round((dung / tong) * 100);
  if (!cu || pt > cu.pt) TD.S.ta_dao[k] = { pt: pt, dung: dung, tong: tong, ngay: TD.homNay() };
};

TD.ketQuaTaDao = function (mon, so, loai) {
  return (TD.S.ta_dao || {})[mon + '|' + loai + '|' + so] || null;
};

/* ============================================================
   TỰ ĐĂNG KÝ MẪU ĐỀ TỪ KHO MỆNH ĐỀ
   Mọi môn đều có kho mệnh đề trọng điểm, nên mọi môn đều phải có
   đề tự sinh ở Luyện Công — kể cả Sử, Địa, GDKT&PL, Văn, Anh.
   Mỗi CHỦ ĐỀ sinh ra 3 dạng bài:
     · chọn phát biểu ĐÚNG  · chọn phát biểu SAI  · đúng/sai 4 ý
   Đánh dấu _tuLT để Tà Đạo Bài tập không lấy nhầm — phần đó chỉ
   dành cho bài tập tính toán.
   ============================================================ */
TD.dangKyMauTuMenhDe = function () {
  if (TD._daDangKyLT) return;                 /* chỉ chạy một lần */
  TD._daDangKyLT = true;

  const slug = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[đĐ]/g, 'd').replace(/[^A-Za-z0-9]+/g, '-')
    .replace(/^-|-$/g, '').toLowerCase().slice(0, 26);

  for (const mon of Object.keys(TD.KHO_LT)) {
    const kho = TD.KHO_LT[mon];
    if (!Array.isArray(kho) || kho.length < 8) continue;
    const gDung = kho.filter(x => x.a).length, gSai = kho.length - gDung;

    const theoCD = {};
    kho.forEach((x, i2) => { const c = x.cd || 'Khác'; (theoCD[c] = theoCD[c] || []).push(i2); });

    TD.GEN[mon] = TD.GEN[mon] || [];
    for (const cd of Object.keys(theoCD)) {
      const idx = theoCD[cd];
      const ma = slug(cd);

      /* Đăng ký RIÊNG cho từng mức độ — nếu gộp lại rồi lấy mức trung bình
         thì mức 1 và mức 4 sẽ trống, người học không luyện riêng được. */
      for (let muc = 1; muc <= 4; muc++) {
        const dungM = idx.filter(i2 => kho[i2].a && (kho[i2].m || 2) === muc);
        const saiM = idx.filter(i2 => !kho[i2].a && (kho[i2].m || 2) === muc);

        if (dungM.length >= 1 && gSai >= 3) TD.GEN[mon].push({
          ma: mon + '-ltd' + muc + '-' + ma, chuong: cd, muc: muc, dang: 'mc', _tuLT: true,
          tao(R) { return TD.cauTuMenhDe(mon, R.chon(dungM), 'd', (R() * 4294967295) >>> 0); }
        });
        if (saiM.length >= 1 && gDung >= 3) TD.GEN[mon].push({
          ma: mon + '-lts' + muc + '-' + ma, chuong: cd, muc: muc, dang: 'mc', _tuLT: true,
          tao(R) { return TD.cauTuMenhDe(mon, R.chon(saiM), 's', (R() * 4294967295) >>> 0); }
        });
      }

      /* Câu đúng/sai 4 ý xếp ở mức cao nhất trong chủ đề — phải soi 4 ý một lúc */
      if (idx.length >= 6) {
        const mucDS = Math.min(4, Math.max.apply(null, idx.map(i2 => kho[i2].m || 2)));
        TD.GEN[mon].push({
          ma: mon + '-ltds-' + ma, chuong: cd, muc: mucDS, dang: 'ds', _tuLT: true,
          tao(R) { return TD.cauDsTuMenhDe(mon, R.chonNhieu(idx, 4), cd, (R() * 4294967295) >>> 0); }
        });
      }
    }
  }
};

/* ---------- ƯỚC LƯỢNG SỐ CÂU KHÁC NHAU CÓ THỂ SINH ----------
   Đếm thật theo tổ hợp, không phải con số quảng cáo:
   · câu nhiều lựa chọn = (số mệnh đề làm đáp án) × (số bộ 3 phương án nhiễu)
   · câu đúng/sai       = số cách chọn 4 mệnh đề trong cùng chủ đề
   · dạng bài tính toán = lấy 200 biến thể/dạng (mức đã đo được ở check-gen) */
const toHop = (n, k) => {
  if (n < k) return 0;
  let r = 1; for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1);
  return Math.round(r);
};

TD.soCauKhaDung = function (mon, muc) {
  let tong = TD.layCauHoi(mon, muc || null).length;

  const kho = TD.KHO_LT[mon] || [];
  if (kho.length >= 8) {
    const gDung = kho.filter(x => x.a).length, gSai = kho.length - gDung;
    const theoCD = {};
    kho.forEach((x, i) => { const c = x.cd || 'Khác'; (theoCD[c] = theoCD[c] || []).push(i); });
    for (const cd of Object.keys(theoCD)) {
      const idx = theoCD[cd];
      const d = idx.filter(i => kho[i].a).length, s2 = idx.length - d;
      const nhieuSai = s2 >= 3 ? s2 : gSai;      /* nhiễu ưu tiên cùng chủ đề */
      const nhieuDung = d >= 3 ? d : gDung;
      /* đếm theo đúng cách đăng ký: từng mức độ một */
      const dM = muc ? idx.filter(i => kho[i].a && (kho[i].m || 2) === muc).length : d;
      const sM = muc ? idx.filter(i => !kho[i].a && (kho[i].m || 2) === muc).length : s2;
      tong += dM * toHop(nhieuSai, 3);           /* câu "chọn phát biểu đúng" */
      tong += sM * toHop(nhieuDung, 3);          /* câu "chọn phát biểu sai"  */
      if (idx.length >= 6) {
        const mucDS = Math.min(4, Math.max.apply(null, idx.map(i => kho[i].m || 2)));
        if (!muc || mucDS === muc) tong += toHop(idx.length, 4);   /* câu đúng/sai 4 ý */
      }
    }
  }

  const mauSo = (TD.GEN[mon] || []).filter(t => !t._tuLT && (!muc || t.muc === muc)).length;
  tong += mauSo * 200;
  return tong;
};

/* ---------- KHO CÂU HỎI ---------- */
TD.layCauHoi = function (mon, locMuc) {
  const kho = (TD.KHO[mon] || []).slice();
  return locMuc ? kho.filter(c => c.muc === locMuc) : kho;
};

/* id ổn định cho một câu hỏi (dùng làm khoá SRS) */
TD.idCau = function (mon, c) {
  const i = (TD.KHO[mon] || []).indexOf(c);
  return mon + '#' + i;
};

TD.trichCau = function (mon, c) {
  const i = typeof c === 'number' ? c : (TD.KHO[mon] || []).indexOf(c);
  return (TD.KHO[mon] || [])[i];
};

/* Xáo mảng bằng bộ ngẫu nhiên CÓ HẠT GIỐNG — cùng seed cho cùng thứ tự */
TD.xaoR = function (R, a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(R() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
};

/* Xáo trộn mảng (Fisher–Yates) */
TD.xao = function (a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
};

/* So khớp đáp án trả lời ngắn: bỏ qua dấu cách, chấp nhận cả dấu , và . */
TD.khopTLN = function (nhap, dung) {
  const chuan = s => String(s).trim().toLowerCase()
    .replace(/\s+/g, '').replace(/\./g, ',').replace(/,+$/, '');
  const a = chuan(nhap), b = chuan(dung);
  if (a === b) return true;
  /* so sánh dạng số, cho phép sai số làm tròn nhỏ */
  const so = s => parseFloat(String(s).replace(/\s/g, '').replace(',', '.'));
  const x = so(a), y = so(b);
  if (!isNaN(x) && !isNaN(y) && b.indexOf(';') < 0) return Math.abs(x - y) < 1e-6;
  return false;
};

</script>

{ so: 16, chu_de: 'CO₂ + kiềm / NaOH + AlCl₃ (bài toán tỉ lệ)', cap: 3,
  hoi: 'Xét tỉ lệ T = n<sub>OH⁻</sub>/n<sub>CO₂</sub> và T = n<sub>OH⁻</sub>/n<sub>Al³⁺</sub> để xác định muối và số mol kết tủa.',
  dap: `<b>CO₂ + kiềm</b> (T = n<sub>OH⁻</sub>/n<sub>CO₂</sub>): T ≤ 1 → chỉ HCO₃⁻ | 1 &lt; T &lt; 2 → cả 2 muối | T ≥ 2 → chỉ CO₃²⁻.<br>

<tr><td>0,1 mol P₂O₅ (= 0,2 mol H₃PO₄) + 0,3 mol NaOH (T = 1,5)</td><td>NaH₂PO₄ và Na₂HPO₄; <b>không có kết tủa</b></td></tr></table>`,
  dc: 'Bảng photo ghi "0,1 mol P₂O₅ + 3 mol NaOH" — với 3 mol NaOH thì T = 15, chỉ tạo Na₃PO₄. Số liệu đúng để ra 2 muối NaH₂PO₄ + Na₂HPO₄ phải là <b>0,3 mol NaOH</b>.',
  meo: 'Nhớ 2 công thức "vàng": n↓ = 2n<sub>Ca(OH)₂</sub> − n<sub>CO₂</sub> (khi có 2 muối) và n↓ = 4n<sub>Al³⁺</sub> − n<sub>OH⁻</sub> (khi ↓ đã tan 1 phần).' },

  dap: `Dựa vào <b>hiệu độ âm điện Δχ</b>: Δχ &lt; 0,4 → CHT không cực · 0,4 ≤ Δχ &lt; 1,7 → CHT có cực · Δχ ≥ 1,7 → <b>ion</b>.<br>
<table class="kq"><tr><td>CHT không cực</td><td>O₃, O₂, H₂, Cl₂, N₂ (2 nguyên tử giống nhau)</td></tr>

  dap: `<b>Quy tắc nhiệt phân muối nitrat theo vị trí kim loại:</b><br>
<table class="kq"><tr><td>Trước Mg (K, Na, Ca, Ba)</td><td>muối <b>nitrit</b> + O₂ &nbsp;· 2NaNO₃ → 2NaNO₂ + O₂</td></tr>
<tr><td>Từ Mg đến Cu</td><td><b>oxit</b> + NO₂ + O₂ &nbsp;· 2Cu(NO₃)₂ → 2CuO + 4NO₂ + O₂</td></tr>
<tr><td>Sau Cu (Ag, Hg, Au)</td><td><b>kim loại</b> + NO₂ + O₂ &nbsp;· 2AgNO₃ → 2Ag + 2NO₂ + O₂</td></tr></table>

  meo: 'Nhớ mốc: “Trước Mg – nitrit; Mg→Cu – oxit; sau Cu – kim loại”.' },

<table class="kq"><tr><td>N</td><td>−3, 0, +1, +2, +3, +4, +5</td></tr><tr><td>S</td><td>−2, 0, +4, +6</td></tr>

{ so: 36, cd: 'Phi kim – Vô cơ', chu_de: 'Phương pháp thu khí', cap: 1,
  hoi: 'Khí nào thu bằng cách dời chỗ nước? Khí nào phải dời chỗ không khí (úp/ngửa bình)?',
  dap: `<b>Dời chỗ nước</b> (khí <b>không tan</b> và không phản ứng với nước): O₂, H₂, N₂, CH₄, C₂H₄, C₂H₂, CO.<br>
<b>Dời chỗ không khí</b> (khí <b>tan nhiều</b> trong nước): HCl, NH₃, SO₂, CO₂, Cl₂, NO₂.<br>
&nbsp;&nbsp;• Nặng hơn không khí (M &gt; 29) → <b>ngửa bình</b>: HCl, SO₂, CO₂, Cl₂, NO₂.<br>
&nbsp;&nbsp;• Nhẹ hơn không khí (M &lt; 29) → <b>úp bình</b>: NH₃ (M = 17), H₂, CH₄.`,
  meo: 'So M của khí với 29 để quyết định úp hay ngửa bình — câu thực hành rất hay hỏi.' },

<tr><td>Tác dụng <b>NaOH</b>, không tác dụng Na</td><td>ester (ethyl acetate, methyl acrylate), muối amoni</td></tr>
<tr><td>Tác dụng NaOH <b>tạo alcohol</b></td><td>ester của alcohol: ethyl acetate, methyl acrylate</td></tr></table>
<b>Nguyên tắc:</b> có <b>H linh động</b> (–OH, –COOH) → tác dụng Na. Có tính <b>acid</b> (–COOH, phenol) hoặc bị thuỷ phân (ester) → tác dụng NaOH.`,
  meo: 'n<sub>H₂</sub> = ½·n<sub>H linh động</sub>. Ancol đa chức x nhóm OH ⇒ n<sub>H₂</sub> = x/2 · n<sub>ancol</sub>.' },

{ so: 44, chu_de: 'Oxi hoá alcohol bằng CuO', cap: 2,
  hoi: 'Alcohol bậc I, bậc II bị oxi hoá cho sản phẩm gì? Bậc III thì sao?',
  dap: `Bậc I → <b>aldehyde</b> · Bậc II → <b>ketone</b> · Bậc III → <b>không phản ứng</b>.<br>
<div class="pu">
CH₃OH + CuO <span class="ar">t°</span> HCHO + Cu + H₂O<br>
C₂H₅OH + CuO <span class="ar">t°</span> CH₃CHO + Cu + H₂O<br>
CH₃CH₂CH₂OH + CuO <span class="ar">t°</span> CH₃CH₂CHO + Cu + H₂O<br>
C₂H₄(OH)₂ + 2CuO <span class="ar">t°</span> (CHO)₂ + 2Cu + 2H₂O<br>
(CH₃)₂CHOH + CuO <span class="ar">t°</span> CH₃COCH₃ (acetone) + Cu + H₂O
</div>
<b>Dấu hiệu:</b> chất rắn đen CuO → đỏ Cu; khối lượng rắn <b>giảm 16 g/mol</b> alcohol phản ứng.`,
  meo: 'Δm(rắn giảm) = 16·n<sub>alcohol p/ứ</sub> — công thức "ăn tiền" của dạng bài này.' },

{ so: 45, cd: 'Đại cương hữu cơ', chu_de: 'Phản ứng tách nước tạo ether', cap: 2,
  hoi: 'n alcohol tách nước tạo bao nhiêu ether? Quan hệ mol và bảo toàn khối lượng?',
  dap: `R₁OH + R₂OH <span class="ar">H₂SO₄ đặc, 140°C</span> R₁OR₂ + H₂O<br>
<b>n alcohol khác nhau → n(n+1)/2 ether</b>, trong đó n ether đối xứng.<br>
&nbsp;&nbsp;• 2 alcohol → <b>3 ether</b> (2 đối xứng) · 3 alcohol → 6 ether.<br>
<b>Quan hệ mol:</b> n<sub>alcohol p/ứ</sub> = 2·n<sub>ether</sub> = 2·n<sub>H₂O</sub><br>
<b>Bảo toàn khối lượng:</b> m<sub>alcohol p/ứ</sub> = m<sub>ether</sub> + m<sub>H₂O</sub><br>
<i>Lưu ý 170°C thì tách nước tạo alkene: CₙH₂ₙ₊₁OH → CₙH₂ₙ + H₂O.</i>`,
  meo: 'Ether tạo thành đều có cùng số mol ⇒ nếu 3 ether có số mol bằng nhau thì 2 alcohol ban đầu cũng bằng nhau.' },

{ so: 46, chu_de: 'Aldehyde', cap: 2,
  hoi: 'Viết phương trình tráng bạc. Aldehyde đóng vai trò gì trong từng phản ứng?',
  dap: `CH₃CHO + 2AgNO₃ + 3NH₃ + H₂O <span class="ar">t°</span> CH₃COONH₄ + <b>2Ag↓</b> + 2NH₄NO₃<br>
<table class="kq small"><tr><th>Thuốc thử</th><th>Hiện tượng</th><th>Vai trò aldehyde</th></tr>
<tr><td>AgNO₃/NH₃ (tráng bạc)</td><td>↓ 2Ag</td><td><b>chất khử</b></td></tr>
<tr><td>dd Br₂</td><td>mất màu nâu đỏ</td><td><b>chất khử</b></td></tr>
<tr><td>Cu(OH)₂/OH⁻, t°</td><td>↓ Cu₂O đỏ gạch</td><td><b>chất khử</b></td></tr>
<tr><td>dd KMnO₄</td><td>mất màu tím</td><td><b>chất khử</b></td></tr>
<tr><td>H₂ (Ni, t°)</td><td>tạo alcohol bậc I</td><td><b>chất oxi hoá</b></td></tr></table>`,
  meo: 'Aldehyde vừa khử vừa oxi hoá — nhưng trong đề "tráng bạc/Br₂/Cu(OH)₂" thì nó LUÔN là chất khử.' },

{ so: 47, chu_de: 'Carboxylic acid', cap: 2,
  hoi: 'So sánh acid acetic và acid formic qua các thuốc thử.',
  dap: `Acid tác dụng kim loại <b>đứng trước H</b>.<br>
<table class="kq small"><tr><th></th><th>CaCO₃</th><th>Tráng bạc</th><th>Quỳ tím</th><th>Na</th><th>Cu</th><th>Cu(OH)₂</th><th>NaOH</th><th>Nước Br₂</th></tr>
<tr><td>CH₃COOH</td><td>↑CO₂</td><td>✗</td><td>đỏ</td><td>↑H₂</td><td>✗</td><td>↓ tan</td><td>✓</td><td>✗</td></tr>
<tr><td>HCOOH</td><td>↑CO₂</td><td><b>2Ag↓</b></td><td>đỏ</td><td>↑H₂</td><td>✗</td><td>↓ tan</td><td>✓</td><td><b>mất màu</b></td></tr></table>
<b>HCOOH đặc biệt</b> vì trong phân tử có nhóm <b>H–CO–</b> tức là nhóm –CHO ⇒ mang cả tính chất aldehyde.`,
  meo: 'HCOOH, HCOOR, HCOONa, (HCOO)ₙR đều tráng bạc được vì đều chứa gốc HCOO– (có –CHO).' },

{ so: 48, chu_de: 'Ester – thuỷ phân', cap: 2,
  hoi: 'Ester + NaOH cho sản phẩm gì? Ester nào cho aldehyde/ketone? Ester nào cần 2 NaOH?',
  dap: `<div class="pu">
Ethyl acetate: CH₃COOC₂H₅ + NaOH → CH₃COONa + <b>C₂H₅OH</b><br>
Methyl acrylate: CH₂=CHCOOCH₃ + NaOH → CH₂=CHCOONa + CH₃OH<br>
Vinyl acetate: CH₃COOCH=CH₂ + NaOH → CH₃COONa + <b>CH₃CHO</b> <i>(aldehyde, không phải alcohol!)</i><br>
Isopropenyl acetate: CH₃COOC(CH₃)=CH₂ + NaOH → CH₃COONa + <b>CH₃COCH₃</b> <i>(ketone)</i><br>
Phenyl acetate: CH₃COOC₆H₅ + <b>2NaOH</b> → CH₃COONa + <b>C₆H₅ONa</b> + H₂O
</div>
<b>Quy tắc:</b> gốc alcohol là <b>vinyl/phenyl</b> ⇒ không cho alcohol. Ester của <b>phenol</b> cần <b>2 NaOH</b> và cho 2 muối + H₂O.`,
  meo: 'Đề cho "ester + NaOH tạo 2 muối" ⇒ chắc chắn là ester của phenol. "Tạo muối + aldehyde" ⇒ ester của vinyl.' },

{ so: 49, chu_de: 'Chất béo (lipid)', cap: 2,
  hoi: 'Công thức chung chất béo? Xà phòng hoá cho sản phẩm gì? Nhớ M của các acid béo.',
  dap: `Chất béo = triester của <b>glycerol</b> với acid béo: <b>(RCOO)₃C₃H₅</b>. Xà phòng hoá luôn cho <b>glycerol C₃H₅(OH)₃</b>.<br>
<table class="kq small"><tr><th></th><th>Acid stearic</th><th>Acid oleic</th><th>Tristearin</th><th>Triolein</th></tr>
<tr><td>Công thức</td><td>C₁₇H₃₅COOH</td><td>C₁₇H₃₃COOH</td><td>(C₁₇H₃₅COO)₃C₃H₅</td><td>(C₁₇H₃₃COO)₃C₃H₅</td></tr>
<tr><td>M</td><td><b>284</b></td><td><b>282</b></td><td><b>890</b></td><td><b>884</b></td></tr>
<tr><td>Đặc điểm</td><td>18C no</td><td>18C, 1 nối đôi</td><td>57C, rắn (mỡ)</td><td>57C, lỏng (dầu)</td></tr>
<tr><td>+ NaOH</td><td>sodium stearate</td><td>sodium oleate</td><td colspan="2">xà phòng + glycerol</td></tr>
<tr><td>+ H₂, Br₂</td><td>✗</td><td>✓</td><td>✗</td><td><b>✓ (3 mol Br₂)</b></td></tr></table>
Các acid béo khác: palmitic C₁₅H₃₁COOH (M = 256), linoleic C₁₇H₃₁COOH (M = 280, 2 nối đôi).`,
  meo: 'Nhớ 3 số: <b>890 – 884 – 806</b> (tristearin – triolein – tripalmitin). Chất béo lỏng (dầu) = không no; rắn (mỡ) = no.' },

{ so: 50, chu_de: 'Amine – Phenol', cap: 2,
  hoi: 'Tính chất chung của amine? Xử lí mùi tanh của cá bằng gì? So sánh methylamine, aniline, phenol.',
  dap: `Amine có <b>tính base</b>. Mùi tanh cá do amine (trimethylamine) ⇒ khử bằng <b>chanh, giấm</b> (acid).<br>
<table class="kq small"><tr><th></th><th>Methylamine CH₃NH₂</th><th>Aniline C₆H₅NH₂</th><th>Phenol C₆H₅OH</th></tr>
<tr><td>Trạng thái</td><td>khí, mùi khai</td><td>lỏng, ít tan</td><td>rắn, ít tan</td></tr>
<tr><td>+ HCl</td><td>CH₃NH₃Cl</td><td>C₆H₅NH₃Cl</td><td>✗</td></tr>
<tr><td>+ NaOH</td><td>✗</td><td>✗</td><td>C₆H₅ONa</td></tr>
<tr><td>Quỳ tím</td><td><b>xanh</b></td><td>không đổi</td><td>không đổi</td></tr>
<tr><td>dd Br₂</td><td>✗</td><td><b>↓ trắng</b> (thế o, p)</td><td><b>↓ trắng</b> (thế o, p)</td></tr></table>`,
  meo: 'Aniline có tính base nhưng YẾU đến mức không đổi màu quỳ — bẫy kinh điển.' },

{ so: 51, chu_de: 'Amino acid', cap: 2,
  hoi: 'Amino acid là hợp chất loại nào? Nhớ công thức và M của 5 amino acid quan trọng.',
  dap: `Amino acid là hợp chất <b>tạp chức</b> (–NH₂ và –COOH), có tính <b>lưỡng tính</b>, tồn tại dạng ion lưỡng cực.<br>
<table class="kq small"><tr><th></th><th>Glycine</th><th>Alanine</th><th>Valine</th><th>Glutamic acid</th><th>Lysine</th></tr>
<tr><td>Công thức</td><td>H₂NCH₂COOH</td><td>CH₃CH(NH₂)COOH</td><td>(CH₃)₂CHCH(NH₂)COOH</td><td>C₃H₅(NH₂)(COOH)₂</td><td>C₅H₉(NH₂)₂COOH</td></tr>
<tr><td>CTPT / M</td><td>C₂H₅NO₂ / <b>75</b></td><td>C₃H₇NO₂ / <b>89</b></td><td>C₅H₁₁NO₂ / <b>117</b></td><td>C₅H₉NO₄ / <b>147</b></td><td>C₆H₁₄N₂O₂ / <b>146</b></td></tr>
<tr><td>Quỳ tím</td><td>không đổi</td><td>không đổi</td><td>không đổi</td><td><b>hồng</b> (2 COOH)</td><td><b>xanh</b> (2 NH₂)</td></tr>
<tr><td>+ NaOH, + HCl</td><td colspan="5">cả 5 chất đều phản ứng được với <b>cả hai</b></td></tr></table>`,
  meo: 'Nhớ dãy M: <b>75 – 89 – 117 – 147 – 146</b>. So NH₂ với COOH: nhiều COOH → hồng, nhiều NH₂ → xanh, bằng nhau → không đổi.' },

{ so: 52, chu_de: 'Peptide', cap: 3,
  hoi: 'Peptide luôn có phản ứng nào? Cách tính M, số liên kết peptide, phản ứng biure?',
  dap: `Peptide luôn có phản ứng <b>thuỷ phân</b> → α-amino acid.<br>
<b>Công thức vàng:</b> n-peptide có <b>(n − 1) liên kết peptide</b>; M<sub>peptide</sub> = Σ M<sub>amino acid</sub> − <b>18(n − 1)</b>.<br>
<table class="kq small"><tr><th></th><th>Đipeptide Ala-Gly</th><th>Tripeptide Ala-Ala-Gly</th><th>Pentapeptide Ala-Val-Val-Gly-Gly</th></tr>
<tr><td>Số gốc = số N</td><td>2</td><td>3</td><td>5</td></tr>
<tr><td>Số lk peptide, M</td><td>1 · 89+75−18 = <b>146</b></td><td>2 · 89·2+75−18·2 = <b>217</b></td><td>4 · 89+117·2+75·2−18·4 = <b>401</b></td></tr>
<tr><td>Biure với Cu(OH)₂</td><td><b>không</b> phản ứng</td><td>có, màu <b>tím</b></td><td>có, màu <b>tím</b></td></tr>
<tr><td>Thuỷ phân NaOH</td><td>→ Ala-Na + Gly-Na</td><td>+3NaOH → 2Ala-Na + Gly-Na + H₂O</td><td>+5NaOH → Ala-Na + 2Val-Na + 2Gly-Na + H₂O</td></tr></table>
<b>Thuỷ phân n-peptide:</b> + nNaOH → n muối + <b>1 H₂O</b> · + nHCl + (n−1)H₂O → n muối amoni clorua.`,
  meo: 'Đipeptide KHÔNG có phản ứng biure (cần ≥ 2 liên kết peptide) — bẫy xuất hiện gần như mọi năm.' },

{ so: 53, chu_de: 'Polymer – trùng hợp', cap: 2,
  hoi: 'Tên, loại phản ứng và ứng dụng của các polymer trùng hợp thường gặp?',
  dap: `<table class="kq small"><tr><th>Monomer</th><th>Polymer</th><th>Loại p/ứ</th><th>Ứng dụng</th></tr>
<tr><td>CH₂=CH₂</td><td>PE (polyethylene)</td><td>trùng hợp</td><td>túi, màng mỏng</td></tr>
<tr><td>CH₂=CH–CH₃</td><td>PP (polypropylene)</td><td>trùng hợp</td><td>bao bì, sợi</td></tr>
<tr><td>CF₂=CF₂</td><td>Teflon</td><td>trùng hợp</td><td><b>chống dính</b>, bền nhiệt</td></tr>
<tr><td>CH₂=CHCl</td><td>PVC</td><td>trùng hợp</td><td>ống nước, da giả</td></tr>
<tr><td>CH₂=CH–CN</td><td>Nitron (olon)</td><td>trùng hợp</td><td><b>tơ</b>, đan áo ấm</td></tr>
<tr><td>C₆H₅CH=CH₂</td><td>PS (polystyrene)</td><td>trùng hợp</td><td>xốp, đồ nhựa</td></tr>
<tr><td>CH₂=C(CH₃)COOCH₃</td><td>PMM — <b>thuỷ tinh hữu cơ</b> (plexiglas)</td><td>trùng hợp</td><td>kính ô tô, răng giả</td></tr>
<tr><td>CH₂=CH–CH=CH₂</td><td>Cao su buna</td><td>trùng hợp</td><td>cao su</td></tr>
<tr><td>H₂N(CH₂)₅COOH</td><td>Nilon-6 (capron)</td><td><b>trùng ngưng</b></td><td>tơ</td></tr>
<tr><td>Caprolactam</td><td>Nilon-6 (capron)</td><td><b>trùng hợp</b> mở vòng</td><td>tơ</td></tr></table>
<b>Điều kiện:</b> trùng hợp cần <b>liên kết bội hoặc vòng kém bền</b>; trùng ngưng cần <b>≥ 2 nhóm chức</b> có khả năng phản ứng.`,
  meo: 'Nilon-6 làm được bằng CẢ HAI cách: trùng ngưng ε-aminocaproic hoặc trùng hợp caprolactam — đề rất hay hỏi mẹo này.' },

{ so: 54, chu_de: 'Đồng trùng ngưng – đồng trùng hợp', cap: 2,
  hoi: 'Monomer tạo nilon-6,6, PET, nhựa phenol-formaldehyde, cao su Buna-S/N?',
  dap: `<table class="kq small"><tr><th>Polymer</th><th>Monomer</th><th>Loại</th></tr>
<tr><td><b>Nilon-6,6</b></td><td>hexamethylenediamine H₂N(CH₂)₆NH₂ + adipic acid HOOC(CH₂)₄COOH</td><td>đồng trùng ngưng</td></tr>
<tr><td><b>PET</b> (poly(ethylene terephthalate))</td><td>ethylene glycol C₂H₄(OH)₂ + terephthalic acid C₆H₄(COOH)₂</td><td>đồng trùng ngưng</td></tr>
<tr><td><b>Nhựa phenol-formaldehyde</b> (bakelit)</td><td>phenol C₆H₅OH + formaldehyde HCHO</td><td>đồng trùng ngưng</td></tr>
<tr><td><b>Cao su Buna-S</b></td><td>buta-1,3-diene + <b>styrene</b> C₆H₅CH=CH₂</td><td>đồng trùng hợp</td></tr>
<tr><td><b>Cao su Buna-N</b></td><td>buta-1,3-diene + <b>acrylonitrile</b> CH₂=CH–CN</td><td>đồng trùng hợp</td></tr></table>`,
  dc: 'Bảng photo ghi acrylonitrile là "CH₂=CH–N" — thiếu C. Đúng là <b>CH₂=CH–CN</b>.' },

{ so: 55, cd: 'Polymer', chu_de: 'Phân loại tơ', cap: 1,
  hoi: 'Tơ khác chất dẻo ở điểm nào? Phân loại tơ và cho ví dụ.',
  dap: `Tơ: vật liệu polymer <b>hình sợi dài, mảnh, bền</b>. Chất dẻo: có tính <b>dẻo</b>, tạo hình được.<br>
<table class="kq"><tr><th>Loại</th><th>Ví dụ</th><th>Có phải tơ hoá học?</th></tr>
<tr><td>Tơ <b>thiên nhiên</b></td><td>bông, len, tơ tằm, đay, gai</td><td>✗</td></tr>
<tr><td>Tơ <b>nhân tạo</b> (bán tổng hợp)</td><td>tơ visco, tơ acetate, tơ đồng-amoniac</td><td><b>✓</b></td></tr>
<tr><td>Tơ <b>tổng hợp</b></td><td>nilon-6, nilon-6,6, capron, nitron (olon), lapsan</td><td><b>✓</b></td></tr></table>
<b>Tơ hoá học = nhân tạo + tổng hợp.</b> Tơ nhân tạo chế biến từ polymer thiên nhiên (cellulose).`,
  meo: 'Bẫy: tơ visco, tơ acetate làm TỪ cellulose (thiên nhiên) nhưng vẫn xếp là tơ HOÁ HỌC vì có gia công hoá học.' },

{ so: 56, chu_de: 'Carbohydrate – bảng tổng hợp', cap: 3,
  hoi: 'So sánh glucose, fructose, saccharose, maltose, tinh bột, cellulose trên mọi tiêu chí.',
  dap: `Carbohydrate là hợp chất <b>tạp chức</b>, chứa <b>C, H, O</b>.<br>
<table class="kq small"><tr><th></th><th>Glucose</th><th>Fructose</th><th>Saccharose</th><th>Maltose</th><th>Tinh bột</th><th>Cellulose</th></tr>
<tr><td>Tên gọi</td><td>đường nho</td><td>đường mật ong</td><td>đường mía</td><td>đường mạch nha</td><td>gạo, ngô</td><td>bông, gỗ</td></tr>

<tr><td>Tan / màu</td><td>tan, không màu</td><td>tan</td><td>tan</td><td>tan</td><td>không tan, trắng</td><td>không tan, trắng</td></tr>
<tr><td>Cấu tạo</td><td>5 OH + 1 CHO</td><td>5 OH + 1 C=O</td><td>Glu–Fru</td><td>Glu–Glu</td><td>nhiều Glu</td><td><b>3 OH</b> mỗi mắt xích</td></tr>
<tr><td>Thuỷ phân</td><td>✗</td><td>✗</td><td>1 Glu + 1 Fru</td><td>2 Glu</td><td>nhiều Glu</td><td>nhiều Glu</td></tr>
<tr><td>Tráng bạc</td><td><b>2Ag</b></td><td><b>2Ag</b>*</td><td>✗</td><td><b>2Ag</b></td><td>✗</td><td>✗</td></tr>
<tr><td>Cu(OH)₂ lắc nhẹ</td><td>xanh lam</td><td>xanh lam</td><td>xanh lam</td><td>xanh lam</td><td>✗</td><td>✗</td></tr>
<tr><td>Cu(OH)₂, t°</td><td>↓ Cu₂O đỏ gạch</td><td>↓ Cu₂O</td><td>✗</td><td>↓ Cu₂O</td><td>✗</td><td>✗</td></tr>
<tr><td>Phản ứng riêng</td><td>mất màu Br₂</td><td><b>không</b> mất màu Br₂</td><td>—</td><td>mất màu Br₂</td><td>+ I₂ → xanh tím</td><td>tan trong Svayde; + HNO₃</td></tr></table>
* Fructose tráng bạc được vì trong môi trường <b>base (NH₃)</b> nó chuyển hoá thành glucose. Nhưng môi trường Br₂ trung tính thì không ⇒ <b>Br₂ dùng để phân biệt glucose và fructose</b>.`,
  meo: 'Saccharose là chất DUY NHẤT trong bảng vừa không tráng bạc vừa tan Cu(OH)₂ xanh lam ⇒ nhận biết cực nhanh.' },

{ so: 57, chu_de: 'Cấu tạo glucose', cap: 2,
  hoi: 'Mỗi phản ứng của glucose chứng minh cấu tạo gì?',
  dap: `Glucose có tính chất của <b>alcohol đa chức + aldehyde</b>. CTCT: CH₂OH[CHOH]₄CHO.<br>
<table class="kq"><tr><th>Phản ứng</th><th>Chứng minh</th></tr>
<tr><td>+ Cu(OH)₂ lắc nhẹ → dd xanh lam</td><td>có <b>nhiều nhóm OH kề nhau</b></td></tr>
<tr><td>Tráng bạc; mất màu dd Br₂</td><td>có nhóm <b>–CHO</b></td></tr>
<tr><td>+ Cu(OH)₂/OH⁻, t° → ↓ Cu₂O</td><td>có nhóm <b>–CHO</b></td></tr>
<tr><td>Khử hoàn toàn tạo <b>hexane</b></td><td>mạch <b>6C không phân nhánh</b></td></tr>
<tr><td>+ (CH₃CO)₂O tạo ester 5 chức</td><td>có đúng <b>5 nhóm OH</b></td></tr></table>` },

{ so: 58, chu_de: 'Phản ứng của carbohydrate', cap: 2,
  hoi: 'Viết phản ứng lên men rượu, điều chế ethanol từ tinh bột, nitro hoá cellulose, khử glucose.',
  dap: `<div class="pu">
C₆H₁₂O₆ <span class="ar">men rượu, 30–35°C</span> 2C₂H₅OH + 2CO₂↑<br>
(C₆H₁₀O₅)ₙ <span class="ar">+H₂O, H⁺</span> nC₆H₁₂O₆ (X = glucose) <span class="ar">men</span> 2nC₂H₅OH (Y) + 2nCO₂<br>
[C₆H₇O₂(OH)₃]ₙ + 3nHNO₃ <span class="ar">H₂SO₄ đặc</span> [C₆H₇O₂(ONO₂)₃]ₙ + 3nH₂O &nbsp;<i>(cellulose trinitrate — thuốc súng không khói)</i><br>
C₆H₁₂O₆ + H₂ <span class="ar">Ni, t°</span> C₆H₁₄O₆ (<b>sorbitol</b>)<br>
6nCO₂ + 5nH₂O <span class="ar">ánh sáng, chlorophyll</span> (C₆H₁₀O₅)ₙ + 6nO₂ &nbsp;<i>(quang hợp)</i>
</div>
<b>Hiệu suất:</b> m<sub>ethanol</sub> = m<sub>tinh bột</sub> · (92/162) · H%.`,
  meo: 'Tỉ lệ khối lượng tinh bột → ethanol là 162 → 92 (2·46). Nhớ cặp số <b>162/92</b>.' },

{ so: 59, cd: '*', chu_de: 'Bài toán khối lượng bình tăng/giảm', cap: 3,
  hoi: 'Khi hấp thụ sản phẩm cháy, khối lượng bình và khối lượng dung dịch thay đổi thế nào?',
  dap: `<table class="kq"><tr><td>Bình đựng <b>H₂SO₄ đặc / P₂O₅ / CaCl₂ khan</b> tăng</td><td>= m<sub>H₂O</sub></td></tr>
<tr><td>Bình đựng <b>dd kiềm</b> (NaOH, Ca(OH)₂) tăng</td><td>= m<sub>CO₂</sub> + m<sub>H₂O</sub></td></tr>
<tr><td>Bình đựng <b>NaOH rắn / KOH rắn</b> tăng</td><td>= m<sub>CO₂</sub> + m<sub>H₂O</sub></td></tr>
<tr><td><b>Khối lượng dung dịch tăng</b></td><td>= (m<sub>CO₂</sub> + m<sub>H₂O</sub>) − m<sub>↓</sub></td></tr>
<tr><td><b>Khối lượng dung dịch giảm</b></td><td>= m<sub>↓</sub> − (m<sub>CO₂</sub> + m<sub>H₂O</sub>)</td></tr></table>
CO₂ vào nước vôi trong <b>dư</b> ⇒ chỉ tạo CaCO₃, <b>n<sub>CO₂</sub> = n<sub>CaCO₃</sub></b>.`,
  meo: 'Nhớ: "bình tăng = chất bị hấp thụ; dung dịch giảm = kết tủa trừ đi chất hấp thụ".' },

{ so: 60, chu_de: 'Bậc alcohol và bậc amine', cap: 1,
  hoi: 'Bậc alcohol và bậc amine xác định khác nhau thế nào?',
  dap: `<b>Bậc alcohol</b> = bậc của <b>nguyên tử C</b> mang nhóm –OH (số C gắn vào C đó).<br>
<b>Bậc amine</b> = <b>số gốc hydrocarbon</b> gắn trực tiếp vào nguyên tử <b>N</b>.<br>
<table class="kq"><tr><td>Propan-1-ol CH₃CH₂CH₂OH</td><td>alcohol bậc <b>I</b></td></tr>
<tr><td>Propan-2-ol (CH₃)₂CHOH</td><td>alcohol bậc <b>II</b></td></tr>
<tr><td>2-methylpropan-2-ol (CH₃)₃COH</td><td>alcohol bậc <b>III</b></td></tr>
<tr><td>Isopropylamine (CH₃)₂CH–NH₂</td><td>amine bậc <b>I</b> (chỉ 1 gốc gắn N)</td></tr>
<tr><td>Ethylmethylamine C₂H₅–NH–CH₃</td><td>amine bậc <b>II</b></td></tr>
<tr><td>Trimethylamine (CH₃)₃N</td><td>amine bậc <b>III</b></td></tr></table>`,
  meo: 'Bẫy kinh điển: isopropylamine có C bậc II nhưng là AMINE BẬC I — vì bậc amine đếm ở N, không đếm ở C.' },

{ so: 61, chu_de: 'Cấu trúc và phân tử khối polymer', cap: 1,
  hoi: 'Polymer nào có cấu trúc mạng không gian? Khối lượng mắt xích các polymer thường gặp?',
  dap: `<b>Mạng không gian:</b> cao su lưu hoá, nhựa bakelit (rezit). <b>Mạch phân nhánh:</b> amylopectin, glycogen. Còn lại đa số mạch thẳng.<br>
<table class="kq"><tr><td>Sợi bông, gai, đay (cellulose)</td><td>M = <b>162n</b></td></tr>
<tr><td>Tinh bột</td><td>M = 162n</td></tr>
<tr><td>Nilon-6 (capron)</td><td>M = <b>113n</b></td></tr>
<tr><td>Nilon-7 (enang)</td><td>M = 127n</td></tr>
<tr><td>Nilon-6,6</td><td>M = <b>226n</b></td></tr>
<tr><td>PE</td><td>M = 28n</td></tr><tr><td>PVC</td><td>M = 62,5n</td></tr>
<tr><td>PS</td><td>M = 104n</td></tr><tr><td>Cao su isoprene</td><td>M = 68n</td></tr></table>
<b>Hệ số polymer hoá:</b> n = M<sub>polymer</sub> / M<sub>mắt xích</sub>.` },

{ so: 62, cd: 'Đại cương hữu cơ', chu_de: 'Số sản phẩm phản ứng cộng/thế', cap: 2,
  hoi: 'Quy tắc Markovnikov là gì? Đếm số sản phẩm của propene + HCl, propane + Cl₂, but-2-ene + H₂O.',
  dap: `<b>Quy tắc Markovnikov:</b> khi cộng HX vào alkene bất đối xứng, <b>H cộng vào C có nhiều H hơn</b>, X vào C ít H hơn ⇒ đó là sản phẩm <b>chính</b>.<br>
<table class="kq"><tr><th>Phản ứng</th><th>Số sản phẩm</th><th>Sản phẩm chính</th></tr>
<tr><td>Propene + HCl</td><td>2</td><td><b>2-chloropropane</b></td></tr>
<tr><td>Propene + H₂O</td><td>2</td><td><b>propan-2-ol</b></td></tr>
<tr><td>Propene + Br₂</td><td>1</td><td>1,2-dibromopropane</td></tr>
<tr><td>Propane + Cl₂ (1:1, as)</td><td><b>2</b></td><td><b>2-chloropropane</b> (thế H ở C bậc cao hơn)</td></tr>
<tr><td>But-2-ene + HCl</td><td>1</td><td>2-chlorobutane (alkene đối xứng)</td></tr>
<tr><td>But-2-ene + H₂O</td><td><b>1</b></td><td>butan-2-ol</td></tr></table>`,
  dc: 'Bảng photo ghi "Propan + Cl₂ → 1 sp" và "But-2-ene + H₂O → 2 sp" — cả hai đều ngược. Propane có 2 loại H (bậc I và bậc II) ⇒ <b>2 sản phẩm</b>. But-2-ene <b>đối xứng</b> ⇒ chỉ <b>1 sản phẩm</b>.' },

{ so: 63, chu_de: 'Phản ứng điều chế quan trọng', cap: 2,
  hoi: 'Điền sản phẩm: 2CH₄ (1500°C), C₂H₂ + H₂O, CaC₂ + H₂O, Al₄C₃ + H₂O, CH₃COONa + NaOH (CaO).',
  dap: `<div class="pu">
2CH₄ <span class="ar">1500°C, làm lạnh nhanh</span> C₂H₂ + 3H₂↑<br>
C₂H₂ + H₂O <span class="ar">HgSO₄/H₂SO₄, 80°C</span> CH₃CHO<br>
CaC₂ + 2H₂O → C₂H₂↑ + Ca(OH)₂<br>
Al₄C₃ + 12H₂O → 3CH₄↑ + 4Al(OH)₃↓<br>
CH₃COONa + NaOH <span class="ar">CaO, t°</span> CH₄↑ + Na₂CO₃ &nbsp;<i>(phản ứng vôi tôi xút)</i><br>
C₂H₄ + H₂O <span class="ar">H₃PO₄, t°</span> C₂H₅OH<br>
C₆H₁₂O₆ <span class="ar">men</span> 2C₂H₅OH + 2CO₂
</div>`,
  meo: 'Vôi tôi xút RCOONa + NaOH → RH giảm 1C. Đề hỏi "điều chế CH₄ trong phòng thí nghiệm" ⇒ chọn CH₃COONa + NaOH/CaO.' },

{ so: 64, chu_de: 'Số Ag khi tráng bạc', cap: 3,
  hoi: 'Mỗi chất cho bao nhiêu Ag khi tráng bạc? Ứng dụng thực tế của glucose?',
  dap: `Ứng dụng glucose: <b>tráng gương, tráng ruột phích</b> (công nghiệp); <b>thuốc tăng lực, dịch truyền</b> (y học).<br>
<table class="kq small"><tr><th>Chất</th><th>HCOOCH₃</th><th>HCHO</th><th>CH₃CHO</th><th>HCOOC₂H₅</th><th>Glucose</th><th>Fructose</th><th>Maltose</th><th>HCOOH</th><th>(CHO)₂</th></tr>
<tr><td>Số Ag</td><td>2</td><td><b>4</b></td><td>2</td><td>2</td><td>2</td><td>2</td><td>2</td><td>2</td><td><b>4</b></td></tr></table>
<b>Quy tắc:</b> mỗi nhóm –CHO cho <b>2Ag</b>. Riêng <b>HCHO cho 4Ag</b> (bị oxi hoá 2 nấc lên (NH₄)₂CO₃).<br>
n<sub>Ag</sub>/n<sub>chất</sub> = 4 ⇒ chất là HCHO hoặc aldehyde 2 chức.`,
  meo: 'Thấy tỉ lệ n<sub>Ag</sub> = 4n<sub>X</sub> mà X đơn chức ⇒ X là <b>HCHO</b> (hoặc HCOOH nếu đề hỏi acid... nhưng HCOOH chỉ cho 2Ag).' },

{ so: 65, chu_de: 'Phản ứng với AgNO₃/NH₃', cap: 2,
  hoi: 'Nhóm chức nào tác dụng AgNO₃/NH₃? Hiện tượng khác nhau ra sao?',
  dap: `<b>2 trường hợp:</b> ① có <b>–CHO</b> → ↓ Ag trắng bạc (tráng bạc) · ② có <b>liên kết ba đầu mạch (C≡CH)</b> → ↓ <b>vàng</b> (kết tủa acetylide).<br>
<table class="kq small"><tr><th>Chất</th><th>Hiện tượng / sản phẩm</th></tr>
<tr><td>HCHO</td><td>4Ag↓ + (NH₄)₂CO₃</td></tr>
<tr><td>CH₃CHO</td><td>2Ag↓ + CH₃COONH₄</td></tr>
<tr><td>Acetylene CH≡CH</td><td>↓ <b>vàng</b> AgC≡CAg</td></tr>
<tr><td>Propyne CH≡C–CH₃</td><td>↓ <b>vàng</b> AgC≡C–CH₃</td></tr>
<tr><td>But-2-yne CH₃–C≡C–CH₃</td><td><b>✗ không phản ứng</b> (nối ba ở giữa mạch)</td></tr>
<tr><td>CH₃OH</td><td>✗</td></tr>
<tr><td>CH₃COOH</td><td>không tráng bạc, chỉ tạo muối CH₃COONH₄</td></tr></table>`,
  meo: 'Bẫy: but-2-yne có nối ba nhưng ở GIỮA mạch ⇒ không tạo kết tủa vàng.' },

{ so: 66, chu_de: 'So sánh n(H₂O) và n(CO₂) khi đốt cháy', cap: 3,
  hoi: 'Đốt cháy dãy nào cho nH₂O > nCO₂, = , < ? Suy ra công thức tính số mol.',
  dap: `<table class="kq"><tr><th>Chất đốt cháy</th><th>Quan hệ</th><th>Công thức</th></tr>
<tr><td>Alkane</td><td>n<sub>H₂O</sub> &gt; n<sub>CO₂</sub></td><td><b>n<sub>alkane</sub> = n<sub>H₂O</sub> − n<sub>CO₂</sub></b></td></tr>
<tr><td>Alkene, cycloalkane</td><td>=</td><td>—</td></tr>
<tr><td>Alkyne, alkadiene</td><td>n<sub>H₂O</sub> &lt; n<sub>CO₂</sub></td><td><b>n<sub>chất</sub> = n<sub>CO₂</sub> − n<sub>H₂O</sub></b></td></tr>
<tr><td>Alcohol no, hở</td><td>&gt;</td><td>n<sub>alcohol</sub> = n<sub>H₂O</sub> − n<sub>CO₂</sub></td></tr>
<tr><td>Aldehyde / acid / ester đơn, no, hở</td><td>=</td><td>—</td></tr>
<tr><td>Amine no, hở</td><td>&gt;</td><td>n<sub>amine</sub> = (n<sub>H₂O</sub> − n<sub>CO₂</sub>)/1,5</td></tr></table>
<b>Tổng quát:</b> n<sub>chất</sub> · (k − 1) = n<sub>CO₂</sub> − n<sub>H₂O</sub> &nbsp;(k = độ bất bão hoà).`,
  meo: 'Công thức tổng quát trên giải được MỌI bài đốt cháy — chỉ cần biết k. Học thuộc nó thay vì học 6 dòng riêng lẻ.' },

{ so: 67, chu_de: 'So sánh nhiệt độ sôi, tính base, tính acid', cap: 2,
  hoi: 'Sắp xếp nhiệt độ sôi, tính base của amine, tính acid của các chất.',
  dap: `<b>Nhiệt độ sôi</b> (cùng số C): <b>acid &gt; alcohol &gt; amine &gt; ester &gt; aldehyde/ketone &gt; hydrocarbon</b> (do liên kết hydrogen mạnh dần).<br>
<b>Tính base:</b> (CH₃)₂NH &gt; C₂H₅NH₂ &gt; CH₃NH₂ &gt; NH₃ &gt; C₆H₅NH₂<br>
&nbsp;&nbsp;→ gốc <b>đẩy e (alkyl)</b> làm tăng tính base; gốc <b>hút e (phenyl)</b> làm giảm mạnh.<br>
<b>Tính acid:</b> HCOOH &gt; CH₃COOH &gt; C₂H₅COOH &gt; ... &gt; H₂CO₃ &gt; <b>C₆H₅OH</b> &gt; H₂O &gt; alcohol<br>
&nbsp;&nbsp;→ gốc <b>hút e (Cl, F, NO₂)</b> làm tăng tính acid: Cl₃CCOOH &gt; Cl₂CHCOOH &gt; ClCH₂COOH &gt; CH₃COOH.`,
  meo: 'Phenol tan được NaOH nhưng KHÔNG tan Na₂CO₃/NaHCO₃ (vì yếu hơn H₂CO₃) — cách phân biệt phenol với carboxylic acid.' },

{ so: 68, chu_de: 'Đếm đồng phân cấu tạo', cap: 3,
  hoi: 'Số đồng phân cấu tạo mạch hở của C₄H₁₀, C₄H₈, C₄H₆, C₃H₈O, C₄H₈O, C₃H₆O₂, C₄H₈O₂, C₃H₉N?',
  dap: `<table class="kq small"><tr><th>CTPT</th><th>Số đồng phân cấu tạo</th></tr>
<tr><td>C₄H₁₀</td><td><b>2</b> alkane</td></tr>
<tr><td>C₄H₈</td><td><b>3</b> alkene mạch hở (thêm đồng phân hình học cis/trans của but-2-ene ⇒ <b>4</b>)</td></tr>
<tr><td>C₄H₆</td><td><b>2</b> alkyne + <b>2</b> alkadiene (mạch hở)</td></tr>
<tr><td>C₃H₈O</td><td><b>2</b> alcohol + <b>1</b> ether</td></tr>
<tr><td>C₄H₈O</td><td><b>2</b> aldehyde + <b>1</b> ketone</td></tr>
<tr><td>C₃H₆O₂</td><td><b>2</b> ester + <b>1</b> carboxylic acid</td></tr>
<tr><td>C₄H₈O₂</td><td><b>4</b> ester + <b>2</b> carboxylic acid</td></tr>
<tr><td>C₃H₉N</td><td><b>4</b> amine — bậc I/II/III = <b>2/1/1</b></td></tr></table>`,
  meo: 'Nhớ cặp <b>4 ester – 2 acid</b> của C₄H₈O₂; và <b>2/1/1</b> cho amine C₃H₉N.' },

{ so: 69, chu_de: 'Đếm đồng phân nâng cao', cap: 4,
  hoi: 'C₇H₈O có mấy đồng phân + Br₂? 2 acid béo tạo mấy chất béo? 2 amino acid tạo mấy đipeptide?',
  dap: `<table class="kq"><tr><th>Bài toán</th><th>Đáp số</th><th>Cách đếm</th></tr>
<tr><td>C₇H₈O: số đồng phân tác dụng NaOH (là phenol)</td><td><b>3</b></td><td>o-, m-, p-cresol</td></tr>
<tr><td>C₇H₈O: số đồng phân có vòng benzene</td><td><b>5</b></td><td>3 cresol + benzyl alcohol + anisole</td></tr>
<tr><td>2 acid béo khác nhau tạo bao nhiêu triglyceride?</td><td><b>6</b></td><td>công thức n²(n+1)/2 với n = 2</td></tr>
<tr><td>3 acid béo tạo bao nhiêu triglyceride?</td><td><b>18</b></td><td>n²(n+1)/2 với n = 3</td></tr>
<tr><td>2 amino acid tạo mấy đipeptide?</td><td><b>4</b></td><td>n² = 2² (kể cả A-A, B-B)</td></tr>
<tr><td>3 amino acid tạo mấy tripeptide (mỗi loại 1 lần)?</td><td><b>6</b></td><td>3! = 6 hoán vị</td></tr></table>`,
  meo: 'Nhớ 2 công thức: triglyceride từ n acid béo = <b>n²(n+1)/2</b>; k-peptide từ n amino acid = <b>nᵏ</b>.' },

{ so: 70, cd: '*', chu_de: 'Tên gọi các phản ứng', cap: 1,
  hoi: 'Gọi tên các phản ứng: ester + H₂O, ester + NaOH, acid + alcohol, ethylene → PE, tạo nilon-6,6, cây xanh tạo tinh bột.',
  dap: `<table class="kq"><tr><td>Ester + H₂O (H⁺, ⇄)</td><td>phản ứng <b>thuỷ phân</b> (thuận nghịch)</td></tr>
<tr><td>Ester + NaOH (→)</td><td>phản ứng <b>xà phòng hoá</b> (một chiều)</td></tr>
<tr><td>Carboxylic acid + alcohol (⇄)</td><td>phản ứng <b>ester hoá</b></td></tr>
<tr><td>Ethylene → PE</td><td><b>trùng hợp</b></td></tr>
<tr><td>Tạo nilon-6,6</td><td><b>(đồng) trùng ngưng</b></td></tr>
<tr><td>Cây xanh tạo tinh bột</td><td><b>quang hợp</b></td></tr>

{ so: 74, cd: '*', moi: true, chu_de: 'Năng lượng hoá học – Enthalpy ΔH', cap: 2,
  hoi: 'Định nghĩa ΔH? Cách tính biến thiên enthalpy theo nhiệt tạo thành và theo năng lượng liên kết?',
  dap: `Δ<sub>r</sub>H°₂₉₈ &lt; 0 → phản ứng <b>toả nhiệt</b>. Δ<sub>r</sub>H°₂₉₈ &gt; 0 → phản ứng <b>thu nhiệt</b>.<br>
<b>① Theo nhiệt tạo thành:</b><br>
Δ<sub>r</sub>H°₂₉₈ = Σ Δ<sub>f</sub>H°(<b>sản phẩm</b>) − Σ Δ<sub>f</sub>H°(<b>chất đầu</b>)<br>
<b>② Theo năng lượng liên kết</b> (chỉ dùng cho chất khí):<br>
Δ<sub>r</sub>H°₂₉₈ = Σ E<sub>b</sub>(<b>chất đầu</b>) − Σ E<sub>b</sub>(<b>sản phẩm</b>) &nbsp;<i>(ngược thứ tự với ①!)</i><br>
<b>Lưu ý:</b> Δ<sub>f</sub>H° của <b>đơn chất bền</b> ở trạng thái chuẩn = <b>0</b> (O₂ khí, C graphite, Fe rắn…).`,
  meo: 'Đảo dấu: công thức ① là "SP − ĐẦU", công thức ② là "ĐẦU − SP". Nhầm chỗ này là mất trọn câu.' },

{ so: 75, cd: '*', moi: true, chu_de: 'Tốc độ phản ứng – biểu thức', cap: 2,
  hoi: 'Biểu thức tốc độ tức thời? Hệ số nhiệt độ Van’t Hoff?',
  dap: `Với aA + bB → cC + dD:<br>
v = −(1/a)·ΔC<sub>A</sub>/Δt = −(1/b)·ΔC<sub>B</sub>/Δt = (1/c)·ΔC<sub>C</sub>/Δt = (1/d)·ΔC<sub>D</sub>/Δt<br>
<b>Định luật tác dụng khối lượng:</b> v = k·C<sub>A</sub>^a · C<sub>B</sub>^b (k = hằng số tốc độ, chỉ phụ thuộc bản chất và nhiệt độ).<br>
<b>Van’t Hoff:</b> v₂/v₁ = γ^((T₂ − T₁)/10) — γ là hệ số nhiệt độ (thường 2–4).`,
  meo: 'Tăng 10 °C mà γ = 2 thì tốc độ gấp đôi; tăng 30 °C thì gấp 2³ = 8 lần.' },

{ so: 76, moi: true, chu_de: 'Thế điện cực chuẩn & pin Galvani', cap: 3,
  hoi: 'Cách xác định cực âm/cực dương của pin? Tính sức điện động chuẩn?',
  dap: `<b>E°<sub>pin</sub> = E°<sub>cathode</sub> − E°<sub>anode</sub> = E°<sub>(+)</sub> − E°<sub>(−)</sub></b> &nbsp;(luôn &gt; 0 với pin hoạt động được).<br>
<table class="kq"><tr><td>Điện cực có E° <b>nhỏ hơn</b></td><td><b>anode</b>, cực <b>âm (−)</b>, xảy ra <b>oxi hoá</b>, kim loại <b>bị tan</b></td></tr>
<tr><td>Điện cực có E° <b>lớn hơn</b></td><td><b>cathode</b>, cực <b>dương (+)</b>, xảy ra <b>khử</b>, kim loại <b>được bám vào</b></td></tr></table>
Một số E° cần nhớ (V): Zn²⁺/Zn = −0,76 · Fe²⁺/Fe = −0,44 · 2H⁺/H₂ = <b>0,00</b> · Cu²⁺/Cu = +0,34 · Ag⁺/Ag = +0,80.<br>
<b>Ví dụ pin Zn–Cu:</b> E°<sub>pin</sub> = 0,34 − (−0,76) = <b>1,10 V</b>; Zn là cực âm bị ăn mòn.<br>
Phản ứng tự xảy ra khi E°<sub>pin</sub> &gt; 0, tức chất khử của cặp có E° nhỏ khử ion của cặp có E° lớn (đúng quy tắc α).`,
  meo: 'Trong PIN: anode là cực ÂM. Trong ĐIỆN PHÂN: anode là cực DƯƠNG. Nhưng ở cả hai, anode luôn xảy ra OXI HOÁ.' },

{ so: 77, moi: true, chu_de: 'Điện phân – định luật Faraday', cap: 3,
  hoi: 'Công thức Faraday? Cách xử lí bài điện phân có dòng điện và thời gian?',
  dap: `<b>m = (A·I·t)/(n·F)</b> &nbsp;với F = 96500 C/mol, A = nguyên tử khối, n = số e trao đổi.<br>
<b>Số mol electron trao đổi: n<sub>e</sub> = I·t/96500</b> — đây mới là công thức dùng nhiều nhất.<br>
<b>Bảo toàn electron:</b> n<sub>e</sub> (catot nhận) = n<sub>e</sub> (anot nhường).<br>
<b>Thứ tự điện phân:</b><br>
&nbsp;&nbsp;• Catot (khử): Ag⁺ &gt; Fe³⁺ &gt; Cu²⁺ &gt; H⁺(acid) &gt; Fe²⁺ &gt; H₂O &nbsp;<i>(ion KL từ Al³⁺ trở về trước KHÔNG bị điện phân trong dung dịch)</i><br>
&nbsp;&nbsp;• Anot (oxi hoá): S²⁻ &gt; I⁻ &gt; Br⁻ &gt; Cl⁻ &gt; H₂O &nbsp;<i>(NO₃⁻, SO₄²⁻, F⁻ không bị điện phân)</i><br>
<b>m<sub>dd giảm</sub> = m<sub>KL bám catot</sub> + m<sub>khí thoát ra</sub></b>`,
  meo: 'Bài điện phân luôn quy về n<sub>e</sub> = It/96500 rồi "chia" cho 2 cực. Vẽ 2 cột catot/anot trên nháp là xong.' },

{ so: 78, cd: 'Sắt – Crom', moi: true, chu_de: 'Phức chất', cap: 2,
  hoi: 'Phức chất gồm những thành phần nào? Số phối trí và dạng hình học thường gặp?',
  dap: `<b>Phức chất</b> = <b>nguyên tử/ion trung tâm</b> (thường là ion kim loại chuyển tiếp) + các <b>phối tử (ligand)</b> liên kết bằng <b>liên kết cho – nhận</b> (phối tử cho cặp e).<br>
<table class="kq"><tr><td>Phối tử hay gặp</td><td>H₂O (aqua), NH₃ (ammine), Cl⁻ (chlorido), OH⁻, CN⁻</td></tr>
<tr><td>Số phối trí <b>6</b></td><td>dạng <b>bát diện</b> — [Cu(H₂O)₆]²⁺ xanh, [Fe(H₂O)₆]³⁺, [Co(H₂O)₆]²⁺ hồng</td></tr>
<tr><td>Số phối trí <b>4</b></td><td><b>tứ diện</b> ([CoCl₄]²⁻ xanh lam) hoặc <b>vuông phẳng</b> ([Cu(NH₃)₄]²⁺)</td></tr>
<tr><td>Số phối trí 2</td><td>đường thẳng — [Ag(NH₃)₂]⁺</td></tr></table>
<b>Phản ứng thay thế phối tử</b> làm <b>đổi màu</b> dung dịch — đây là dạng câu hay hỏi:<br>
[Cu(H₂O)₆]²⁺ (xanh lam) + 4NH₃ → [Cu(NH₃)₄]²⁺ (<b>xanh lam đậm</b>) + 6H₂O<br>
[Cu(H₂O)₆]²⁺ + 4Cl⁻ → [CuCl₄]²⁻ (<b>vàng/lục</b>) + 6H₂O`,
  meo: 'Cu(OH)₂ tan trong NH₃ dư chính là tạo phức [Cu(NH₃)₄](OH)₂ — nối luôn với khẩu quyết số 17.' },

{ so: 79, moi: true, chu_de: 'Nguyên tố nhóm IA – IIA (CT mới)', cap: 2,
  hoi: 'Màu ngọn lửa của các kim loại kiềm, kiềm thổ? Tính tan của muối nhóm IIA?',
  dap: `<b>Màu ngọn lửa</b> (dùng nhận biết, thi rất hay hỏi):<br>
<table class="kq small"><tr><td>Li</td><td>đỏ tía</td><td>Na</td><td><b>vàng</b></td><td>K</td><td><b>tím</b></td></tr>
<tr><td>Ca</td><td>đỏ cam</td><td>Sr</td><td>đỏ son</td><td>Ba</td><td><b>lục (vàng lục)</b></td></tr></table>
<b>Tính tan nhóm IIA:</b><br>
