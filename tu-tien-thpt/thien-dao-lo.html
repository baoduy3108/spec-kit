<script>
/* ============================================================
   VẬT LÍ — MẪU ĐỀ TỰ SINH
   ============================================================ */
window.TD = window.TD || {}; TD.GEN = TD.GEN || {};

(function () {
const S = TD.soVN, T = TD.lamTron;

TD.GEN.ly = [
{ ma: 'ly-nhietluong', chuong: 'Vật lí nhiệt', muc: 2, dang: 'tln',
  tao(R) {
    const c = R.chon([
      { t: 'nước', c: 4200 }, { t: 'nhôm', c: 880 }, { t: 'đồng', c: 380 },
      { t: 'sắt', c: 460 }, { t: 'chì', c: 130 }, { t: 'thuỷ tinh', c: 840 }
    ]);
    const m = T(R.nguyen(5, 60) / 10, 1);
    const t1 = R.nguyen(10, 40), t2 = t1 + R.nguyen(20, 70);
    const Q = T(m * c.c * (t2 - t1) / 1000, 3);
    return {
      q: `Tính nhiệt lượng cần cung cấp để làm ${S(m)} kg ${c.t} nóng lên từ ${t1} °C đến ${t2} °C. `
       + `Biết nhiệt dung riêng của ${c.t} là ${c.c} J/(kg·K). Đáp án tính bằng kJ (làm tròn đến hàng phần trăm).`,
      ans: S(Q),
      giai: `Q = m·c·Δt\n`
          + `Δt = ${t2} − ${t1} = ${t2 - t1} °C (cũng chính là ${t2 - t1} K)\n`
          + `Q = ${S(m)} · ${c.c} · ${t2 - t1} = ${S(T(m * c.c * (t2 - t1), 1))} J = ${S(Q)} kJ.`,
      meo: 'Độ chênh nhiệt độ trong thang °C và K là như nhau. Đọc kỹ đề hỏi J hay kJ.'
    };
  } },

{ ma: 'ly-chuyenthe', chuong: 'Vật lí nhiệt', muc: 2, dang: 'tln',
  tao(R) {
    const loai = R() < 0.5;
    const c = loai
      ? { t: 'làm nóng chảy hoàn toàn', ten: 'nhiệt nóng chảy riêng', k: 3.34e5, mo: 'nước đá ở 0 °C' }
      : { t: 'làm hoá hơi hoàn toàn', ten: 'nhiệt hoá hơi riêng', k: 2.26e6, mo: 'nước ở 100 °C' };
    const m = T(R.nguyen(2, 50) / 10, 1);
    const Q = T(m * c.k / 1000, 2);
    return {
      q: `Tính nhiệt lượng cần cung cấp để ${c.t} ${S(m)} kg ${c.mo}. `
       + `Biết ${c.ten} là ${c.k.toExponential(2).replace('e+', '·10^').replace('.', ',')} J/kg. Đáp án tính bằng kJ (làm tròn đến hàng phần trăm).`,
      ans: S(Q),
      giai: `Trong quá trình chuyển thể, nhiệt độ KHÔNG đổi nên không dùng công thức mcΔt.\n`
          + `Q = ${loai ? 'λ' : 'L'}·m = ${S(T(c.k, 0))} · ${S(m)} = ${S(T(m * c.k, 0))} J = ${S(Q)} kJ.`,
      meo: 'Nóng chảy dùng Q = λm, hoá hơi dùng Q = Lm. Trong lúc chuyển thể nhiệt độ đứng yên.'
    };
  } },

{ ma: 'ly-canbangnhiet', chuong: 'Vật lí nhiệt', muc: 3, dang: 'tln',
  tao(R) {
    const kl = R.chon([{ t: 'đồng', c: 380 }, { t: 'nhôm', c: 880 }, { t: 'sắt', c: 460 }]);
    const m1 = T(R.nguyen(2, 10) / 10, 1);           /* kim loại */
    const t1 = R.nguyen(80, 150);
    const m2 = T(R.nguyen(5, 30) / 10, 1);           /* nước */
    const t2 = R.nguyen(15, 30);
    const tcb = (m1 * kl.c * t1 + m2 * 4200 * t2) / (m1 * kl.c + m2 * 4200);
    const kq = T(tcb, 2);
    if (kq <= t2 || kq >= t1) return null;
    return {
      q: `Thả ${S(m1)} kg ${kl.t} ở ${t1} °C vào ${S(m2)} kg nước ở ${t2} °C. Bỏ qua hao phí nhiệt. `
       + `Nhiệt độ khi cân bằng là bao nhiêu °C? (c<sub>${kl.t}</sub> = ${kl.c}, c<sub>nước</sub> = 4200 J/kg·K; làm tròn đến hàng phần trăm)`,
      ans: S(kq),
      giai: `Phương trình cân bằng nhiệt: Q(toả) = Q(thu)\n`
          + `${S(m1)}·${kl.c}·(${t1} − t) = ${S(m2)}·4200·(t − ${t2})\n`
          + `${S(T(m1 * kl.c, 2))}·(${t1} − t) = ${S(T(m2 * 4200, 2))}·(t − ${t2})\n`
          + `⇒ t = [${S(T(m1 * kl.c * t1, 1))} + ${S(T(m2 * 4200 * t2, 1))}] / [${S(T(m1 * kl.c, 2))} + ${S(T(m2 * 4200, 2))}] = ${S(kq)} °C.`,
      meo: 'Nhiệt độ cân bằng luôn nằm GIỮA hai nhiệt độ ban đầu — dùng để kiểm tra kết quả.'
    };
  } },

{ ma: 'ly-nhietdong1', chuong: 'Nhiệt động lực học', muc: 3, dang: 'tln',
  tao(R) {
    const Q = R.nguyen(-40, 40) * 10;
    const A = R.nguyen(-40, 40) * 10;
    if (Q === 0 && A === 0) return null;
    const dU = Q + A;
    const moQ = Q >= 0 ? `nhận nhiệt lượng ${Q} J` : `toả ra nhiệt lượng ${-Q} J`;
    const moA = A >= 0 ? `nhận công ${A} J` : `thực hiện công ${-A} J lên môi trường ngoài`;
    return {
      q: `Một khối khí ${moQ} và ${moA}. Tính độ biến thiên nội năng của khối khí (đơn vị J).`,
      ans: String(dU),
      giai: `Định luật I nhiệt động lực học: ΔU = A + Q\n`
          + `Quy ước dấu: nhận nhiệt Q > 0, toả nhiệt Q < 0; nhận công A > 0, sinh công A < 0.\n`
          + `Ở đây Q = ${Q} J và A = ${A} J\n`
          + `ΔU = ${A} + ${Q} = ${dU} J ⇒ nội năng ${dU > 0 ? 'TĂNG' : dU < 0 ? 'GIẢM' : 'không đổi'}.`,
      meo: 'Quy ước dấu là chỗ mất điểm nhiều nhất. Sinh công thì A ÂM, toả nhiệt thì Q ÂM.'
    };
  } },

{ ma: 'ly-boyle', chuong: 'Khí lí tưởng', muc: 2, dang: 'tln',
  tao(R) {
    const p1 = R.nguyen(1, 8), V1 = R.nguyen(2, 20);
    const V2 = R.nguyen(1, 20);
    if (V2 === V1) return null;
    const p2 = T(p1 * V1 / V2, 3);
    return {
      q: `Nén đẳng nhiệt một lượng khí từ thể tích ${V1} lít xuống ${V2} lít. Áp suất ban đầu là ${p1} atm. `
       + `Áp suất sau khi nén là bao nhiêu atm? (làm tròn đến hàng phần trăm)`,
      ans: S(p2),
      giai: `Quá trình đẳng nhiệt, áp dụng định luật Boyle: p₁V₁ = p₂V₂\n`
          + `${p1}·${V1} = p₂·${V2}\n`
          + `p₂ = ${p1 * V1}/${V2} = ${S(p2)} atm.`,
      meo: 'Đẳng nhiệt: p và V tỉ lệ NGHỊCH. Thể tích giảm bao nhiêu lần thì áp suất tăng bấy nhiêu lần.'
    };
  } },

{ ma: 'ly-dangtich', chuong: 'Khí lí tưởng', muc: 3, dang: 'tln',
  tao(R) {
    const t1 = R.nguyen(0, 60), t2 = R.nguyen(60, 250);
    const p1 = R.nguyen(1, 6);
    const T1 = t1 + 273, T2 = t2 + 273;
    const p2 = T(p1 * T2 / T1, 3);
    return {
      q: `Một lượng khí trong bình kín có áp suất ${p1} atm ở ${t1} °C. Nung nóng bình đến ${t2} °C. `
       + `Áp suất của khí lúc này là bao nhiêu atm? (làm tròn đến hàng phần trăm)`,
      ans: S(p2),
      giai: `Thể tích không đổi ⇒ quá trình đẳng tích, áp dụng định luật Charles: p₁/T₁ = p₂/T₂\n`
          + `Đổi sang Kelvin: T₁ = ${t1} + 273 = ${T1} K ; T₂ = ${t2} + 273 = ${T2} K\n`
          + `p₂ = p₁·T₂/T₁ = ${p1}·${T2}/${T1} = ${S(p2)} atm.`,
      meo: 'BẮT BUỘC đổi sang Kelvin. Dùng thẳng độ C là sai hoàn toàn.'
    };
  } },

{ ma: 'ly-clapeyron', chuong: 'Khí lí tưởng', muc: 3, dang: 'tln',
  tao(R) {
    const n = T(R.nguyen(1, 20) / 10, 1);
    const t = R.nguyen(0, 150);
    const V = T(R.nguyen(5, 50) / 1000, 4);          /* m³ */
    const Tk = t + 273;
    const p = T(n * 8.31 * Tk / V, 0);
    return {
      q: `Một bình có thể tích ${S(T(V * 1000, 1))} lít chứa ${S(n)} mol khí lí tưởng ở nhiệt độ ${t} °C. `
       + `Tính áp suất của khí trong bình (đơn vị Pa, làm tròn đến hàng đơn vị). Cho R = 8,31 J/(mol·K).`,
      ans: S(p),
      giai: `Phương trình Clapeyron–Mendeleev: pV = nRT\n`
          + `Đổi đơn vị: V = ${S(T(V * 1000, 1))} lít = ${S(V)} m³ ; T = ${t} + 273 = ${Tk} K\n`
          + `p = nRT/V = ${S(n)}·8,31·${Tk}/${S(V)} = ${S(p)} Pa.`,
      meo: 'Đơn vị chuẩn: p (Pa), V (m³), T (K). Sai đơn vị là sai cả bài.'
    };
  } },

{ ma: 'ly-dongnang-phantu', chuong: 'Khí lí tưởng', muc: 3, dang: 'tln',
  tao(R) {
    const t = R.nguyen(-50, 300);
    const Tk = t + 273;
    if (Tk <= 0) return null;
    const W = 1.5 * 1.38e-23 * Tk;
    const heSo = T(W / 1e-21, 3);
    return {
      q: `Tính động năng trung bình của một phân tử khí lí tưởng ở nhiệt độ ${t} °C. `
       + `Cho k = 1,38·10⁻²³ J/K. Đáp án có dạng x·10⁻²¹ J, hãy tìm x (làm tròn đến hàng phần trăm).`,
      ans: S(heSo),
      giai: `Động năng trung bình: W̄đ = (3/2)·k·T\n`
          + `T = ${t} + 273 = ${Tk} K\n`
          + `W̄đ = 1,5 · 1,38·10⁻²³ · ${Tk} = ${S(heSo)}·10⁻²¹ J.`,
      meo: 'Động năng trung bình phân tử CHỈ phụ thuộc nhiệt độ, không phụ thuộc loại khí.'
    };
  } },

{ ma: 'ly-lucthu', chuong: 'Từ trường', muc: 2, dang: 'tln',
  tao(R) {
    const B = T(R.nguyen(1, 20) / 10, 1);
    const I = T(R.nguyen(10, 100) / 10, 1);
    const L = T(R.nguyen(5, 80) / 100, 2);
    const goc = R.chon([90, 30, 60, 45]);
    const sin = goc === 90 ? 1 : goc === 30 ? 0.5 : goc === 60 ? Math.sqrt(3) / 2 : Math.sqrt(2) / 2;
    const F = T(B * I * L * sin, 4);
    return {
      q: `Một đoạn dây dẫn dài ${S(L)} m mang dòng điện ${S(I)} A đặt trong từ trường đều có cảm ứng từ ${S(B)} T. `
       + `Dây hợp với đường sức từ góc ${goc}°. Tính lực từ tác dụng lên đoạn dây (đơn vị N, làm tròn đến hàng phần trăm).`,
      ans: S(F),
      giai: `F = B·I·L·sinα\n`
          + `sin${goc}° = ${S(T(sin, 4))}\n`
          + `F = ${S(B)} · ${S(I)} · ${S(L)} · ${S(T(sin, 4))} = ${S(F)} N.`,
      meo: 'Dây SONG SONG đường sức (α = 0) thì F = 0. Lực cực đại khi dây vuông góc.'
    };
  } },

{ ma: 'ly-tuthong', chuong: 'Từ trường', muc: 3, dang: 'tln',
  tao(R) {
    const N = R.chon([1, 10, 20, 50, 100, 200]);
    const B = T(R.nguyen(1, 50) / 100, 2);
    const Scm = R.nguyen(20, 400);                    /* cm² */
    const goc = R.chon([0, 30, 60, 45]);
    const cos = goc === 0 ? 1 : goc === 30 ? Math.sqrt(3) / 2 : goc === 60 ? 0.5 : Math.sqrt(2) / 2;
    const phi = T(N * B * (Scm / 10000) * cos, 6);
    if (phi === 0) return null;
    return {
      q: `Một khung dây gồm ${N} vòng, diện tích mỗi vòng ${Scm} cm², đặt trong từ trường đều B = ${S(B)} T. `
       + `Vectơ cảm ứng từ hợp với vectơ pháp tuyến của mặt phẳng khung góc ${goc}°. `
       + `Tính từ thông qua khung dây (đơn vị Wb, làm tròn đến 4 chữ số thập phân).`,
      ans: S(phi, 4),
      giai: `Φ = N·B·S·cosα\n`
          + `Đổi diện tích: S = ${Scm} cm² = ${S(T(Scm / 10000, 4))} m²\n`
          + `cos${goc}° = ${S(T(cos, 4))}\n`
          + `Φ = ${N} · ${S(B)} · ${S(T(Scm / 10000, 4))} · ${S(T(cos, 4))} = ${S(phi, 4)} Wb.`,
      meo: 'α là góc với PHÁP TUYẾN, không phải với mặt phẳng khung. Nhớ đổi cm² sang m² (chia 10 000).'
    };
  } },

{ ma: 'ly-sdd-camung', chuong: 'Cảm ứng điện từ', muc: 3, dang: 'tln',
  tao(R) {
    const N = R.chon([50, 100, 200, 250, 500]);
    const dPhi = T(R.nguyen(1, 60) / 1000, 4);
    const dt = T(R.chon([1, 2, 5, 10, 20, 25, 50]) / 100, 2);
    const e = T(N * dPhi / dt, 3);
    return {
      q: `Một khung dây gồm ${N} vòng. Từ thông qua mỗi vòng biến thiên một lượng ${S(dPhi)} Wb trong thời gian ${S(dt)} s. `
       + `Tính độ lớn suất điện động cảm ứng xuất hiện trong khung (đơn vị V, làm tròn đến hàng phần trăm).`,
      ans: S(e),
      giai: `Định luật Faraday: |e| = N·|ΔΦ|/Δt\n`
          + `|e| = ${N} · ${S(dPhi)} / ${S(dt)} = ${S(e)} V.`,
      meo: 'Dấu trừ trong công thức Faraday chỉ thể hiện định luật Lenz (chiều). Hỏi ĐỘ LỚN thì bỏ dấu trừ.'
    };
  } },

{ ma: 'ly-bienap', chuong: 'Máy biến áp', muc: 3, dang: 'tln',
  tao(R) {
    const N1 = R.chon([200, 500, 800, 1000, 1200, 2000, 2500]);
    const k = R.chon([2, 4, 5, 8, 10, 0.5, 0.25]);
    const N2 = Math.round(N1 / k);
    if (N2 < 10) return null;
    const U1 = R.chon([110, 220, 380]);
    const U2 = T(U1 * N2 / N1, 3);
    const hoiU = R() < 0.6;
    const I1 = T(R.nguyen(5, 50) / 10, 1);
    const I2 = T(I1 * N1 / N2, 3);
    return {
      q: `Một máy biến áp lí tưởng có cuộn sơ cấp ${N1} vòng và cuộn thứ cấp ${N2} vòng. `
       + (hoiU
          ? `Đặt vào hai đầu cuộn sơ cấp điện áp hiệu dụng ${U1} V. Điện áp hiệu dụng ở hai đầu cuộn thứ cấp là bao nhiêu V? (làm tròn đến hàng phần trăm)`
          : `Cường độ dòng điện hiệu dụng ở cuộn sơ cấp là ${S(I1)} A. Cường độ dòng điện ở cuộn thứ cấp là bao nhiêu A? (làm tròn đến hàng phần trăm)`),
      ans: hoiU ? S(U2) : S(I2),
      giai: hoiU
        ? `U₂/U₁ = N₂/N₁\nU₂ = ${U1} · ${N2}/${N1} = ${S(U2)} V.\n`
          + `(${N2 < N1 ? 'N₂ < N₁ nên đây là máy HẠ áp.' : 'N₂ > N₁ nên đây là máy TĂNG áp.'})`
        : `Với máy biến áp lí tưởng: U₁I₁ = U₂I₂ và U₂/U₁ = N₂/N₁\n`
          + `⇒ I₂/I₁ = N₁/N₂\nI₂ = ${S(I1)} · ${N1}/${N2} = ${S(I2)} A.\n`
          + `(${N2 < N1 ? 'Máy hạ áp: điện áp giảm nhưng dòng điện TĂNG.' : 'Máy tăng áp: điện áp tăng nhưng dòng điện GIẢM.'})`,
      meo: 'Điện áp và số vòng tỉ lệ THUẬN; cường độ dòng điện và số vòng tỉ lệ NGHỊCH.'
    };
  } },

{ ma: 'ly-haophi', chuong: 'Truyền tải điện', muc: 3, dang: 'tln',
  tao(R) {
    const k = R.nguyen(2, 40);
    const tang = R() < 0.5;
    return {
      q: tang
        ? `Khi truyền tải điện năng đi xa, nếu tăng điện áp ở nơi phát lên ${k} lần (giữ nguyên công suất truyền tải `
          + `và hệ số công suất) thì công suất hao phí trên đường dây giảm bao nhiêu lần?`
        : `Khi truyền tải điện năng đi xa, nếu giảm điện áp ở nơi phát đi ${k} lần (giữ nguyên công suất truyền tải `
          + `và hệ số công suất) thì công suất hao phí trên đường dây tăng bao nhiêu lần?`,
      ans: String(k * k),
      giai: `Công suất hao phí: P_hp = P²R/(U²cos²φ)\n`
          + `P, R, cosφ không đổi ⇒ P_hp tỉ lệ NGHỊCH với U².\n`
          + (tang
             ? `U tăng ${k} lần ⇒ U² tăng ${k * k} lần ⇒ P_hp giảm ${k * k} lần.`
             : `U giảm ${k} lần ⇒ U² giảm ${k * k} lần ⇒ P_hp tăng ${k * k} lần.`),
      meo: 'Hao phí tỉ lệ nghịch với BÌNH PHƯƠNG điện áp — đó là lý do có đường dây cao thế 500 kV.'
    };
  } },

{ ma: 'ly-dohutkhoi', chuong: 'Vật lí hạt nhân', muc: 3, dang: 'tln',
  tao(R) {
    /* Chọn hạt nhân và một giá trị năng lượng liên kết riêng thực tế, rồi SUY NGƯỢC
       ra khối lượng hạt nhân. Nhờ vậy số liệu vừa hợp lí về vật lí vừa nhất quán về số học. */
    const hn = R.chon([
      { t: '⁴₂He', Z: 2, A: 4 }, { t: '⁷₃Li', Z: 3, A: 7 }, { t: '⁹₄Be', Z: 4, A: 9 },
      { t: '¹¹₅B', Z: 5, A: 11 }, { t: '¹²₆C', Z: 6, A: 12 }, { t: '¹⁴₇N', Z: 7, A: 14 },
      { t: '¹⁶₈O', Z: 8, A: 16 }, { t: '²⁰₁₀Ne', Z: 10, A: 20 }, { t: '²³₁₁Na', Z: 11, A: 23 },
      { t: '²⁴₁₂Mg', Z: 12, A: 24 }, { t: '²⁷₁₃Al', Z: 13, A: 27 }, { t: '³¹₁₅P', Z: 15, A: 31 },
      { t: '³²₁₆S', Z: 16, A: 32 }, { t: '⁴⁰₂₀Ca', Z: 20, A: 40 }, { t: '⁵⁶₂₆Fe', Z: 26, A: 56 },
      { t: '⁶³₂₉Cu', Z: 29, A: 63 }, { t: '¹⁰⁸₄₇Ag', Z: 47, A: 108 }, { t: '²⁰⁷₈₂Pb', Z: 82, A: 207 }
    ]);
    const N = hn.A - hn.Z;
    const eps = R.nguyen(700, 880) / 100;            /* MeV/nuclon — dải thực tế 7,0–8,8 */
    const Wlk = eps * hn.A;
    const dm = Wlk / 931.5;
    const m = T(hn.Z * 1.00728 + N * 1.00866 - dm, 4);
    /* tính lại từ khối lượng đã làm tròn để lời giải khớp tuyệt đối với đề */
    const dm2 = hn.Z * 1.00728 + N * 1.00866 - m;
    const Wlk2 = dm2 * 931.5;
    const hoi = R.nguyen(1, 3);
    const kq = hoi === 1 ? T(dm2, 4) : hoi === 2 ? T(Wlk2, 2) : T(Wlk2 / hn.A, 2);
    if (kq <= 0) return null;
    const tenHoi = hoi === 1 ? 'độ hụt khối của hạt nhân (đơn vị u, làm tròn đến 4 chữ số thập phân)'
                 : hoi === 2 ? 'năng lượng liên kết của hạt nhân (đơn vị MeV, làm tròn đến hàng phần trăm)'
                             : 'năng lượng liên kết riêng của hạt nhân (đơn vị MeV/nuclon, làm tròn đến hàng phần trăm)';
    return {
      q: `Hạt nhân ${hn.t} có khối lượng ${S(m, 4)} u. Cho m<sub>p</sub> = 1,00728 u, m<sub>n</sub> = 1,00866 u, `
       + `1u = 931,5 MeV/c². Tính ${tenHoi}.`,
      ans: S(kq, hoi === 1 ? 4 : 2),
      giai: `Hạt nhân ${hn.t} có Z = ${hn.Z} proton và A − Z = ${N} neutron.\n`
          + `Độ hụt khối: Δm = ${hn.Z}·1,00728 + ${N}·1,00866 − ${S(m, 4)}\n`
          + `= ${S(T(hn.Z * 1.00728, 5), 5)} + ${S(T(N * 1.00866, 5), 5)} − ${S(m, 4)} = ${S(T(dm2, 4), 4)} u\n`
          + (hoi === 1 ? `Vậy Δm = ${S(kq, 4)} u.`
             : `Năng lượng liên kết: W_lk = Δm·931,5 = ${S(T(dm2, 4), 4)}·931,5 = ${S(T(Wlk2, 2), 2)} MeV\n`
               + (hoi === 2 ? `Vậy W_lk = ${S(kq, 2)} MeV.`
                            : `Năng lượng liên kết riêng: ε = W_lk/A = ${S(T(Wlk2, 2), 2)}/${hn.A} = ${S(kq, 2)} MeV/nuclon.`)),
      meo: 'So sánh độ bền các hạt nhân phải dùng W_lk/A (năng lượng liên kết RIÊNG), không dùng W_lk.'
    };
  } },

{ ma: 'ly-phongxa', chuong: 'Vật lí hạt nhân', muc: 3, dang: 'tln',
  tao(R) {
    const m0 = R.chon([8, 16, 32, 64, 128, 100, 200, 256]);
    const k = R.nguyen(1, 6);
    const hoiConLai = R() < 0.6;
    const conLai = T(m0 / Math.pow(2, k), 4);
    const daRa = T(m0 - conLai, 4);
    return {
      q: `Một mẫu chất phóng xạ ban đầu có khối lượng ${m0} g và chu kì bán rã T. `
       + `Sau khoảng thời gian t = ${k}T, khối lượng chất phóng xạ ${hoiConLai ? 'còn lại' : 'đã bị phân rã'} là bao nhiêu gam? `
       + `(làm tròn đến hàng phần trăm nếu cần)`,
      ans: S(hoiConLai ? conLai : daRa),
      giai: `Định luật phóng xạ: m = m₀·2^(−t/T)\n`
          + `Với t = ${k}T: m còn lại = ${m0}/2^${k} = ${m0}/${Math.pow(2, k)} = ${S(conLai)} g\n`
          + (hoiConLai ? `Vậy khối lượng còn lại là ${S(conLai)} g.`
                       : `Khối lượng đã phân rã = ${m0} − ${S(conLai)} = ${S(daRa)} g.`),
      meo: 'Đọc kỹ đề hỏi CÒN LẠI hay ĐÃ PHÂN RÃ — hai đáp án hoàn toàn khác nhau.'
    };
  } },

{ ma: 'ly-chukiban', chuong: 'Vật lí hạt nhân', muc: 3, dang: 'tln',
  tao(R) {
    const T0 = R.nguyen(2, 60);
    const k = R.nguyen(1, 6);
    const t = T0 * k;
    return {
      q: `Một chất phóng xạ có chu kì bán rã ${T0} ngày. Sau bao nhiêu ngày thì số hạt nhân của mẫu chất còn lại `
       + `bằng 1/${Math.pow(2, k)} số hạt nhân ban đầu?`,
      ans: String(t),
      giai: `N/N₀ = 2^(−t/T) = 1/${Math.pow(2, k)} = 2^(−${k})\n`
          + `⇒ t/T = ${k} ⇒ t = ${k}·T = ${k}·${T0} = ${t} ngày.`,
      meo: 'Còn lại 1/2ᵏ nghĩa là đã trôi qua đúng k chu kì bán rã.'
    };
  } },

{ ma: 'ly-daodong', chuong: 'Dao động điều hoà', muc: 2, dang: 'tln',
  tao(R) {
    const A = R.nguyen(2, 20);                        /* cm */
    const w = R.chon([2, 4, 5, 10, 20]);
    const hoiV = R() < 0.5;
    const vmax = A * w, amax = A * w * w;
    return {
      q: `Một vật dao động điều hoà với biên độ ${A} cm và tần số góc ${w} rad/s. `
       + `Tính ${hoiV ? 'tốc độ cực đại của vật (cm/s)' : 'gia tốc cực đại của vật (cm/s²)'}.`,
      ans: String(hoiV ? vmax : amax),
      giai: hoiV
        ? `v_max = ω·A = ${w}·${A} = ${vmax} cm/s (đạt tại vị trí cân bằng).`
        : `a_max = ω²·A = ${w}²·${A} = ${w * w}·${A} = ${amax} cm/s² (đạt tại hai vị trí biên).`,
      meo: 'Tại vị trí cân bằng: v cực đại, a = 0. Tại biên: v = 0, a cực đại. Hai đại lượng ngược pha nhau.'
    };
  } },

{ ma: 'ly-ohm', chuong: 'Dòng điện', muc: 2, dang: 'tln',
  tao(R) {
    const xi = R.nguyen(6, 24);
    const r = T(R.nguyen(2, 20) / 10, 1);
    const Rn = R.nguyen(2, 20);
    const I = T(xi / (Rn + r), 3);
    const hoiI = R() < 0.6;
    const U = T(I * Rn, 3);
    return {
      q: `Một nguồn điện có suất điện động ${xi} V và điện trở trong ${S(r)} Ω được nối với điện trở ngoài ${Rn} Ω. `
       + `Tính ${hoiI ? 'cường độ dòng điện trong mạch (A)' : 'hiệu điện thế giữa hai cực của nguồn (V)'}. (làm tròn đến hàng phần trăm)`,
      ans: hoiI ? S(I) : S(U),
      giai: `Định luật Ohm cho toàn mạch: I = ξ/(R + r)\n`
          + `I = ${xi}/(${Rn} + ${S(r)}) = ${xi}/${S(T(Rn + r, 2))} = ${S(I)} A\n`
          + (hoiI ? `Vậy I = ${S(I)} A.`
                  : `Hiệu điện thế hai cực: U = I·R = ${S(I)}·${Rn} = ${S(U)} V.\n(Cũng bằng U = ξ − I·r = ${xi} − ${S(I)}·${S(r)}.)`),
      meo: 'U hai cực nguồn chỉ bằng ξ khi mạch HỞ. Có dòng chạy thì U = ξ − I·r luôn nhỏ hơn ξ.'
    };
  } },

{ ma: 'ly-joule', chuong: 'Dòng điện', muc: 2, dang: 'tln',
  tao(R) {
    const I = T(R.nguyen(5, 60) / 10, 1);
    const Rn = R.nguyen(2, 40);
    const t = R.chon([10, 30, 60, 120, 300, 600]);
    const Q = T(I * I * Rn * t / 1000, 3);
    return {
      q: `Cho dòng điện cường độ ${S(I)} A chạy qua điện trở ${Rn} Ω trong ${t} giây. `
       + `Tính nhiệt lượng toả ra trên điện trở (đơn vị kJ, làm tròn đến hàng phần trăm).`,
      ans: S(Q),
      giai: `Định luật Joule–Lenz: Q = I²·R·t\n`
          + `Q = ${S(I)}² · ${Rn} · ${t} = ${S(T(I * I, 3))} · ${Rn} · ${t} = ${S(T(I * I * Rn * t, 1))} J = ${S(Q)} kJ.`,
      meo: 'Nhiệt lượng tỉ lệ với BÌNH PHƯƠNG cường độ dòng điện — tăng I gấp đôi thì nhiệt gấp bốn.'
    };
  } },

{ ma: 'ly-kelvin', chuong: 'Vật lí nhiệt', muc: 1, dang: 'tln',
  tao(R) {
    const sangK = R() < 0.5;
    const t = R.nguyen(-100, 400);
    return {
      q: sangK
        ? `Đổi nhiệt độ ${t} °C sang thang Kelvin.`
        : `Đổi nhiệt độ ${t + 273} K sang thang Celsius.`,
      ans: String(sangK ? t + 273 : t),
      giai: sangK
        ? `T(K) = t(°C) + 273 = ${t} + 273 = ${t + 273} K.`
        : `t(°C) = T(K) − 273 = ${t + 273} − 273 = ${t} °C.`,
      meo: 'Nhớ mốc: 0 K = −273 °C (độ không tuyệt đối). Độ CHÊNH LỆCH thì hai thang như nhau.'
    };
  } }
];
})();

</script>
<script>
/* ============================================================
   SINH HỌC — MẪU ĐỀ TỰ SINH
   ============================================================ */
window.TD = window.TD || {}; TD.GEN = TD.GEN || {};

(function () {
const S = TD.soVN, T = TD.lamTron;

TD.GEN.sinh = [
{ ma: 'sinh-gene-N', chuong: 'Di truyền phân tử', muc: 2, dang: 'tln',
  tao(R) {
    const N = R.nguyen(15, 200) * 20;               /* bội của 20 để số chu kì xoắn nguyên */
    const L = T(N / 2 * 3.4, 2);
    const hoi = R.nguyen(1, 3);
    const C = N / 20, M = N * 300;
    const kq = hoi === 1 ? N : hoi === 2 ? C : M;
    const ten = hoi === 1 ? 'tổng số nucleotide của gene'
              : hoi === 2 ? 'số chu kì xoắn của gene'
                          : 'khối lượng phân tử của gene (đơn vị đvC)';
    return {
      q: `Một gene có chiều dài ${S(L)} Å. Tính ${ten}.`,
      ans: S(kq),
      giai: `Công thức: L = (N/2)·3,4 Å ⇒ N = 2L/3,4\n`
          + `N = 2·${S(L)}/3,4 = ${N} nucleotide\n`
          + (hoi === 1 ? `Vậy tổng số nucleotide là ${N}.`
             : hoi === 2 ? `Số chu kì xoắn: C = N/20 = ${N}/20 = ${C}.`
                         : `Khối lượng: M = N·300 = ${N}·300 = ${M} đvC.`),
      meo: 'Chiều dài tính theo SỐ CẶP nu (N/2), mỗi cặp dài 3,4 Å. Một chu kì xoắn gồm 10 cặp nu.'
    };
  } },

{ ma: 'sinh-lienket-H', chuong: 'Di truyền phân tử', muc: 3, dang: 'tln',
  tao(R) {
    const N = R.nguyen(60, 300) * 10;
    const A = R.nguyen(10, Math.floor(N / 2) - 10) * 1;
    const G = N / 2 - A;
    if (G <= 0) return null;
    const H = 2 * A + 3 * G;
    return {
      q: `Một gene có tổng số ${N} nucleotide, trong đó có ${A} nucleotide loại A. `
       + `Tính số liên kết hydrogen của gene.`,
      ans: S(H),
      giai: `Trong DNA mạch kép: A = T, G = C và A + G = N/2\n`
          + `G = N/2 − A = ${N / 2} − ${A} = ${G}\n`
          + `Số liên kết hydrogen: H = 2A + 3G = 2·${A} + 3·${G} = ${2 * A} + ${3 * G} = ${H}.`,
      meo: 'A–T có 2 liên kết hydrogen, G–C có 3. Gene giàu G–C thì bền nhiệt hơn.'
    };
  } },

{ ma: 'sinh-nhandoi', chuong: 'Nhân đôi DNA', muc: 3, dang: 'tln',
  tao(R) {
    const N = R.nguyen(30, 400) * 10;
    const k = R.nguyen(2, 6);
    const hoi = R.nguyen(1, 3);
    const soCon = Math.pow(2, k);
    const cungCap = N * (soCon - 1);
    const hoanToanMoi = soCon - 2;
    const kq = hoi === 1 ? cungCap : hoi === 2 ? soCon : hoanToanMoi;
    const ten = hoi === 1 ? 'số nucleotide mà môi trường nội bào phải cung cấp'
              : hoi === 2 ? 'số phân tử DNA con được tạo ra'
                          : 'số phân tử DNA con được cấu tạo hoàn toàn từ nucleotide mới của môi trường';
    return {
      q: `Một phân tử DNA có ${N} nucleotide, tiến hành nhân đôi ${k} lần liên tiếp. Tính ${ten}.`,
      ans: S(kq),
      giai: `Sau ${k} lần nhân đôi từ 1 phân tử mẹ:\n`
          + `· Số DNA con = 2^${k} = ${soCon}\n`
          + `· Số nu môi trường cung cấp = N·(2^${k} − 1) = ${N}·${soCon - 1} = ${cungCap}\n`
          + `· Số DNA con hoàn toàn mới = 2^${k} − 2 = ${hoanToanMoi} (vì theo nguyên tắc bán bảo toàn, luôn có đúng 2 phân tử còn giữ mạch của DNA mẹ)\n`
          + `Đáp án cần tìm: ${S(kq)}.`,
      meo: 'Nhớ trừ 1 ở công thức nu môi trường (2ᵏ − 1) và trừ 2 ở số DNA hoàn toàn mới (2ᵏ − 2).'
    };
  } },

{ ma: 'sinh-dichma', chuong: 'Phiên mã – Dịch mã', muc: 3, dang: 'tln',
  tao(R) {
    const soBoBa = R.nguyen(80, 700);
    const rN = soBoBa * 3;
    const N = rN * 2;
    const hoi = R.nguyen(1, 3);
    const kq = hoi === 1 ? soBoBa : hoi === 2 ? soBoBa - 1 : soBoBa - 2;
    const ten = hoi === 1 ? 'số bộ ba trên phân tử mRNA'
              : hoi === 2 ? 'số amino acid mà môi trường cung cấp cho quá trình dịch mã'
                          : 'số amino acid trong chuỗi polypeptide hoàn chỉnh';
    return {
      q: `Một gene có ${N} nucleotide tiến hành phiên mã rồi dịch mã. Tính ${ten}.`,
      ans: S(kq),
      giai: `Số nu trên mRNA: rN = N/2 = ${N}/2 = ${rN}\n`
          + `Số bộ ba trên mRNA: ${rN}/3 = ${soBoBa}\n`
          + `Trừ 1 bộ ba kết thúc (không mã hoá amino acid) ⇒ môi trường cung cấp ${soBoBa - 1} amino acid\n`
          + `Chuỗi HOÀN CHỈNH bị cắt bỏ methionine mở đầu ⇒ còn ${soBoBa - 2} amino acid\n`
          + `Đáp án cần tìm: ${S(kq)}.`,
      meo: 'Ba con số khác nhau: số bộ ba, số aa môi trường cung cấp (−1), số aa chuỗi hoàn chỉnh (−2). Đọc kỹ đề.'
    };
  } },

{ ma: 'sinh-hardy', chuong: 'Di truyền quần thể', muc: 3, dang: 'tln',
  tao(R) {
    const q = R.nguyen(5, 45) / 100;
    const p = T(1 - q, 2);
    const hoi = R.nguyen(1, 3);
    const q2 = T(q * q * 100, 2), hai_pq = T(2 * p * q * 100, 2), p2 = T(p * p * 100, 2);
    const kq = hoi === 1 ? hai_pq : hoi === 2 ? p2 : T((hai_pq + p2), 2);
    const ten = hoi === 1 ? 'tỉ lệ cá thể mang gene bệnh nhưng không biểu hiện (thể dị hợp)'
              : hoi === 2 ? 'tỉ lệ cá thể có kiểu gene đồng hợp trội'
                          : 'tỉ lệ cá thể không bị bệnh';
    return {
      q: `Một quần thể ở trạng thái cân bằng di truyền, bệnh do allele lặn trên nhiễm sắc thể thường quy định. `
       + `Tỉ lệ người mắc bệnh là ${S(q2)}%. Tính ${ten}, tính theo phần trăm (làm tròn đến hàng phần trăm).`,
      ans: S(kq),
      giai: `Quần thể cân bằng: p²AA + 2pqAa + q²aa = 1\n`
          + `Người bệnh (aa) chiếm q² = ${S(q2)}% = ${S(T(q * q, 4))} ⇒ q = ${S(q)}\n`
          + `p = 1 − ${S(q)} = ${S(p)}\n`
          + `· Dị hợp Aa = 2pq = 2·${S(p)}·${S(q)} = ${S(T(2 * p * q, 4))} = ${S(hai_pq)}%\n`
          + `· Đồng hợp trội AA = p² = ${S(T(p * p, 4))} = ${S(p2)}%\n`
          + `· Không bị bệnh = AA + Aa = ${S(T(p2 + hai_pq, 2))}%\n`
          + `Đáp án cần tìm: ${S(kq)}%.`,
      meo: 'Từ tỉ lệ người bệnh phải CĂN BẬC HAI mới ra tần số allele lặn q.'
    };
  } },

{ ma: 'sinh-tuthu', chuong: 'Di truyền quần thể', muc: 3, dang: 'tln',
  tao(R) {
    const n = R.nguyen(1, 8);
    const Aa0 = R.nguyen(20, 80);                    /* % dị hợp ban đầu */
    const AA0 = R.nguyen(0, 100 - Aa0);
    const aa0 = 100 - Aa0 - AA0;
    const Aa = Aa0 / Math.pow(2, n);
    const them = (Aa0 - Aa) / 2;
    const AA = AA0 + them, aa = aa0 + them;
    const hoi = R.nguyen(1, 3);
    const kq = T(hoi === 1 ? Aa : hoi === 2 ? AA : aa, 2);
    const ten = hoi === 1 ? 'Aa' : hoi === 2 ? 'AA' : 'aa';
    return {
      q: `Một quần thể có cấu trúc di truyền ban đầu ${S(AA0)}% AA : ${S(Aa0)}% Aa : ${S(aa0)}% aa, `
       + `tiến hành tự thụ phấn qua ${n} thế hệ. Tính tỉ lệ cá thể có kiểu gene ${ten} ở thế hệ thứ ${n}, `
       + `theo phần trăm (làm tròn đến hàng phần trăm).`,
      ans: S(kq),
      giai: `Tự thụ phấn chỉ làm biến đổi phần dị hợp; phần đồng hợp ban đầu giữ nguyên và được cộng thêm.\n`
          + `· Aa sau ${n} thế hệ = ${S(Aa0)}% × (1/2)^${n} = ${S(Aa0)}%/${Math.pow(2, n)} = ${S(T(Aa, 4))}%\n`
          + `· Phần dị hợp chuyển thành đồng hợp = ${S(Aa0)}% − ${S(T(Aa, 4))}% = ${S(T(Aa0 - Aa, 4))}%, chia đều cho AA và aa\n`
          + `  ⇒ mỗi bên nhận thêm ${S(T(them, 4))}%\n`
          + `· AA = ${S(AA0)}% + ${S(T(them, 4))}% = ${S(T(AA, 4))}%\n`
          + `· aa = ${S(aa0)}% + ${S(T(them, 4))}% = ${S(T(aa, 4))}%\n`
          + `Đáp án cần tìm: ${S(kq)}%.`,
      meo: 'Tự thụ làm TĂNG đồng hợp, GIẢM dị hợp, nhưng KHÔNG đổi tần số allele của quần thể.'
    };
  } },

{ ma: 'sinh-hoanvi', chuong: 'Hoán vị gene', muc: 4, dang: 'tln',
  tao(R) {
    const f = R.nguyen(2, 24) * 2;                   /* tần số hoán vị, % chẵn */
    const deu = R() < 0.5;                            /* dị hợp đều AB/ab hay chéo Ab/aB */
    const hoiHV = R() < 0.5;
    const gtHV = T(f / 2, 2), gtLK = T((100 - f) / 2, 2);
    const kg = deu ? 'AB/ab' : 'Ab/aB';
    const loaiHoi = deu ? (hoiHV ? 'Ab' : 'AB') : (hoiHV ? 'AB' : 'Ab');
    const laHoanVi = deu ? hoiHV : hoiHV;             /* với AB/ab: Ab là hoán vị; với Ab/aB: AB là hoán vị */
    const kq = laHoanVi ? gtHV : gtLK;
    return {
      q: `Một cơ thể có kiểu gene ${kg}, xảy ra hoán vị gene với tần số ${f}%. `
       + `Tính tỉ lệ giao tử ${loaiHoi} được tạo ra, theo phần trăm.`,
      ans: S(kq),
      giai: `Kiểu gene ${kg} là dị hợp ${deu ? 'ĐỀU' : 'CHÉO'}.\n`
          + `⇒ Giao tử liên kết (giống bố mẹ): ${deu ? 'AB và ab' : 'Ab và aB'}\n`
          + `⇒ Giao tử hoán vị: ${deu ? 'Ab và aB' : 'AB và ab'}\n`
          + `Tổng giao tử hoán vị = f = ${f}% ⇒ mỗi loại = ${f}/2 = ${S(gtHV)}%\n`
          + `Tổng giao tử liên kết = 100% − ${f}% = ${100 - f}% ⇒ mỗi loại = ${S(gtLK)}%\n`
          + `Giao tử ${loaiHoi} là giao tử ${laHoanVi ? 'HOÁN VỊ' : 'LIÊN KẾT'} ⇒ tỉ lệ = ${S(kq)}%.`,
      meo: 'Phải xác định đúng dị hợp ĐỀU hay CHÉO mới biết loại nào là giao tử hoán vị. f ≤ 50%.'
    };
  } },

{ ma: 'sinh-sokieugen', chuong: 'Quy luật Mendel', muc: 3, dang: 'tln',
  tao(R) {
    const n = R.nguyen(2, 8);
    const tuThu = R() < 0.5;
    const hoi = R.nguyen(1, 4);
    const kg = 'AaBbCcDdEeFfGgHh'.slice(0, n * 2);
    let kq, giaiThem;
    if (tuThu) {
      kq = hoi === 1 ? Math.pow(2, n) : hoi === 2 ? Math.pow(3, n)
         : hoi === 3 ? Math.pow(2, n) : Math.pow(4, n);
      giaiThem = `· Số loại giao tử = 2^${n} = ${Math.pow(2, n)}\n`
               + `· Số kiểu tổ hợp giao tử = 2^${n} × 2^${n} = 4^${n} = ${Math.pow(4, n)}\n`
               + `· Số loại kiểu gene ở đời con = 3^${n} = ${Math.pow(3, n)}\n`
               + `· Số loại kiểu hình (trội hoàn toàn) = 2^${n} = ${Math.pow(2, n)}`;
    } else {
      /* lai phân tích: cơ thể kia đồng hợp lặn, chỉ cho 1 loại giao tử */
      kq = hoi === 1 ? Math.pow(2, n) : hoi === 2 ? Math.pow(2, n)
         : hoi === 3 ? Math.pow(2, n) : Math.pow(2, n);
      giaiThem = `Cơ thể đồng hợp lặn chỉ cho 1 loại giao tử nên mọi số lượng đều bằng số loại giao tử của cơ thể dị hợp:\n`
               + `· Số loại giao tử của ${kg} = 2^${n} = ${Math.pow(2, n)}\n`
               + `· Số kiểu tổ hợp = 2^${n} × 1 = ${Math.pow(2, n)}\n`
               + `· Số loại kiểu gene và kiểu hình ở đời con đều = ${Math.pow(2, n)}`;
    }
    const ten = hoi === 1 ? `số loại giao tử tối đa mà cơ thể ${kg} tạo ra`
              : hoi === 2 ? 'số loại kiểu gene tối đa ở đời con'
              : hoi === 3 ? 'số loại kiểu hình ở đời con (các gene trội hoàn toàn)'
                          : 'số kiểu tổ hợp giao tử ở đời con';
    return {
      q: `Cho cơ thể có kiểu gene ${kg} (các cặp gene phân li độc lập) ${tuThu ? 'tự thụ phấn' : 'lai phân tích'}. Tính ${ten}.`,
      ans: S(kq),
      giai: `Cơ thể dị hợp ${n} cặp gene phân li độc lập${tuThu ? ', tự thụ phấn' : ', lai với cơ thể đồng hợp lặn'}:\n`
          + giaiThem + `\nĐáp án cần tìm: ${S(kq)}.`,
      meo: 'Tự thụ: giao tử 2ⁿ, kiểu gene 3ⁿ, kiểu hình 2ⁿ. Lai phân tích: mọi số đều bằng 2ⁿ vì bên kia chỉ cho 1 loại giao tử.'
    };
  } },

{ ma: 'sinh-giamphan', chuong: 'Giảm phân', muc: 2, dang: 'tln',
  tao(R) {
    const so = R.nguyen(3, 60);
    const laDuc = R() < 0.5;
    const kq = laDuc ? so * 4 : so;
    return {
      q: `Có ${so} tế bào sinh ${laDuc ? 'tinh' : 'trứng'} của một loài động vật tiến hành giảm phân bình thường. `
       + `Số ${laDuc ? 'tinh trùng' : 'trứng'} được tạo ra là bao nhiêu?`,
      ans: S(kq),
      giai: laDuc
        ? `Mỗi tế bào sinh tinh giảm phân tạo 4 tinh trùng đều có khả năng thụ tinh.\nSố tinh trùng = ${so} × 4 = ${kq}.`
        : `Mỗi tế bào sinh trứng giảm phân tạo 4 tế bào con nhưng chỉ 1 phát triển thành trứng, 3 tế bào còn lại thoái hoá thành thể cực.\n`
          + `Số trứng = ${so} × 1 = ${kq}.\n(Số thể cực tạo ra là ${so * 3}.)`,
      meo: 'Tế bào sinh tinh → 4 tinh trùng. Tế bào sinh trứng → chỉ 1 trứng + 3 thể cực. Bẫy kinh điển.'
    };
  } },

{ ma: 'sinh-nguyenphan', chuong: 'Nguyên phân', muc: 2, dang: 'tln',
  tao(R) {
    const so = R.nguyen(1, 12);
    const k = R.nguyen(2, 8);
    const con = so * Math.pow(2, k);
    const hoi = R() < 0.5;
    const moi = con - so;
    return {
      q: `Có ${so} tế bào tiến hành nguyên phân liên tiếp ${k} lần. `
       + `Tính ${hoi ? 'tổng số tế bào con được tạo ra' : 'số tế bào con mới được sinh thêm so với ban đầu'}.`,
      ans: S(hoi ? con : moi),
      giai: `Sau ${k} lần nguyên phân, mỗi tế bào tạo ra 2^${k} = ${Math.pow(2, k)} tế bào con.\n`
          + `Tổng số tế bào con = ${so} × 2^${k} = ${con}\n`
          + (hoi ? `Đáp án: ${con}.` : `Số tế bào sinh thêm = ${con} − ${so} = ${moi}.`),
      meo: 'Nguyên phân giữ nguyên bộ nhiễm sắc thể 2n; giảm phân mới làm giảm một nửa.'
    };
  } },

{ ma: 'sinh-hieusuat', chuong: 'Sinh thái học', muc: 3, dang: 'tln',
  tao(R) {
    const mu = R.nguyen(4, 8);
    const E0 = Math.pow(10, mu);
    const H = R.chon([10, 12, 15, 20, 8, 5]) / 100;
    const bac = R.nguyen(2, 4);
    const E = T(E0 * Math.pow(H, bac - 1), 4);
    if (E < 1) return null;
    return {
      q: `Trong một chuỗi thức ăn, sinh vật sản xuất tích luỹ được ${S(E0)} kcal. Hiệu suất sinh thái giữa các bậc `
       + `dinh dưỡng liền kề đều bằng ${S(H * 100)}%. Tính năng lượng tích luỹ ở bậc dinh dưỡng cấp ${bac} (kcal).`,
      ans: S(E),
      giai: `Sinh vật sản xuất là bậc dinh dưỡng cấp 1.\n`
          + `Từ cấp 1 lên cấp ${bac} phải qua ${bac - 1} lần chuyển hoá.\n`
          + `E = ${S(E0)} × ${S(H)}^${bac - 1} = ${S(E)} kcal.`,
      meo: 'Sinh vật SẢN XUẤT là bậc dinh dưỡng cấp 1. Từ cấp 1 lên cấp n phải nhân hiệu suất (n−1) lần.'
    };
  } },

{ ma: 'sinh-lechboi', chuong: 'Đột biến NST', muc: 2, dang: 'tln',
  tao(R) {
    const loai = R.chon([
      { t: 'người', n2: 46 }, { t: 'ruồi giấm', n2: 8 }, { t: 'đậu Hà Lan', n2: 14 },
      { t: 'ngô', n2: 20 }, { t: 'lúa nước', n2: 24 }, { t: 'cà chua', n2: 24 },
      { t: 'tinh tinh', n2: 48 }, { t: 'lúa mì', n2: 42 }, { t: 'khoai tây', n2: 48 },
      { t: 'bắp cải', n2: 18 }, { t: 'củ cải', n2: 18 }, { t: 'gà', n2: 78 },
      { t: 'bò', n2: 60 }, { t: 'mèo', n2: 38 }, { t: 'chó', n2: 78 }, { t: 'thỏ', n2: 44 }
    ]);
    const the = R.chon([
      { t: 'thể một', d: -1 }, { t: 'thể ba', d: +1 }, { t: 'thể không', d: -2 },
      { t: 'thể bốn', d: +2 }, { t: 'thể tam bội', d: 'x1.5' }, { t: 'thể tứ bội', d: 'x2' }
    ]);
    let kq, gt;
    if (the.d === 'x1.5') { if (loai.n2 % 2) return null; kq = loai.n2 / 2 * 3; gt = `Thể tam bội có bộ 3n = 3 × ${loai.n2 / 2} = ${kq}`; }
    else if (the.d === 'x2') { kq = loai.n2 * 2; gt = `Thể tứ bội có bộ 4n = 2 × ${loai.n2} = ${kq}`; }
    else { kq = loai.n2 + the.d; gt = `${the.t} có bộ 2n ${the.d > 0 ? '+ ' + the.d : '− ' + (-the.d)} = ${loai.n2} ${the.d > 0 ? '+ ' + the.d : '− ' + (-the.d)} = ${kq}`; }
    return {
      q: `Ở ${loai.t} có bộ nhiễm sắc thể lưỡng bội 2n = ${loai.n2}. Một ${the.t} của loài này có bao nhiêu nhiễm sắc thể?`,
      ans: S(kq),
      giai: `Bộ lưỡng bội 2n = ${loai.n2} ⇒ n = ${loai.n2 / 2}\n${gt}.`,
      meo: 'Lệch bội thay đổi số NST ở MỘT vài cặp (2n±1, 2n±2). Đa bội thay đổi CẢ BỘ (3n, 4n).'
    };
  } },

{ ma: 'sinh-tansoallele', chuong: 'Di truyền quần thể', muc: 3, dang: 'tln',
  tao(R) {
    const AA = R.nguyen(5, 60), Aa = R.nguyen(5, 60);
    const aa = 100 - AA - Aa;
    if (aa < 5) return null;
    const p = T((AA + Aa / 2) / 100, 4);
    const hoiP = R() < 0.5;
    return {
      q: `Một quần thể có cấu trúc di truyền ${S(AA / 100)} AA : ${S(Aa / 100)} Aa : ${S(aa / 100)} aa. `
       + `Tính tần số allele ${hoiP ? 'A' : 'a'} của quần thể. (làm tròn đến hàng phần trăm)`,
      ans: S(T(hoiP ? p : 1 - p, 2)),
      giai: `Tần số allele A: p = (tỉ lệ AA) + (tỉ lệ Aa)/2 = ${S(AA / 100)} + ${S(Aa / 100)}/2 = ${S(p)}\n`
          + `Tần số allele a: q = 1 − p = ${S(T(1 - p, 4))}\n`
          + `Đáp án cần tìm: ${S(T(hoiP ? p : 1 - p, 2))}.`,
      meo: 'Công thức: p = AA + Aa/2 và q = aa + Aa/2. Kiểm tra p + q phải bằng 1.' 
    };
  } },

{ ma: 'sinh-peptide-lk', chuong: 'Dịch mã', muc: 3, dang: 'tln',
  tao(R) {
    const aa = R.nguyen(50, 500);
    const hoi = R() < 0.5;
    return {
      q: `Một chuỗi polypeptide hoàn chỉnh có ${aa} amino acid. Tính ${hoi ? 'số liên kết peptide trong chuỗi' : 'số phân tử nước được giải phóng khi hình thành chuỗi'}.`,
      ans: S(aa - 1),
      giai: `Cứ hai amino acid liên kết với nhau thì tạo 1 liên kết peptide và giải phóng 1 phân tử nước.\n`
          + `Chuỗi có ${aa} amino acid ⇒ số liên kết peptide = số phân tử nước = ${aa} − 1 = ${aa - 1}.`,
      meo: 'Số liên kết peptide = số phân tử nước = số amino acid − 1. Hai đại lượng luôn bằng nhau.'
    };
  } },

{ ma: 'sinh-mtcungcap-aa', chuong: 'Dịch mã', muc: 3, dang: 'tln',
  tao(R) {
    const aa = R.nguyen(50, 400);
    const soRibo = R.nguyen(2, 10);
    const tong = aa * soRibo;
    return {
      q: `Có ${soRibo} ribosome cùng trượt qua một phân tử mRNA (không lặp lại). Biết mỗi chuỗi polypeptide `
       + `được tổng hợp cần môi trường cung cấp ${aa} amino acid. Tính tổng số amino acid môi trường phải cung cấp.`,
      ans: S(tong),
      giai: `Mỗi ribosome trượt qua mRNA tổng hợp được 1 chuỗi polypeptide.\n`
          + `${soRibo} ribosome ⇒ tạo ${soRibo} chuỗi polypeptide.\n`
          + `Tổng amino acid cần cung cấp = ${soRibo} × ${aa} = ${tong}.`,
      meo: 'Nhiều ribosome cùng dịch mã trên một mRNA tạo thành polysome, giúp tăng nhanh số chuỗi polypeptide.'
    };
  } },

{ ma: 'sinh-adn-tile', chuong: 'Di truyền phân tử', muc: 3, dang: 'tln',
  tao(R) {
    const N = R.nguyen(60, 300) * 10;
    const ptA = R.nguyen(10, 40);                     /* %A */
    const A = Math.round(N * ptA / 100);
    const G = N / 2 - A;
    if (G <= 0) return null;
    const hoi = R() < 0.5;
    const ptG = T(G / N * 100, 2);
    return {
      q: `Một gene có ${N} nucleotide, trong đó nucleotide loại A chiếm ${ptA}% tổng số nucleotide. `
       + `Tính ${hoi ? 'số nucleotide loại G của gene' : 'tỉ lệ phần trăm nucleotide loại G của gene'}. `
       + (hoi ? '' : '(làm tròn đến hàng phần trăm)'),
      ans: S(hoi ? G : ptG),
      giai: `Số nu loại A: A = ${N} × ${ptA}% = ${A}\n`
          + `Trong DNA mạch kép: A + G = N/2 = ${N / 2}\n`
          + `⇒ G = ${N / 2} − ${A} = ${G} nucleotide\n`
          + `Tỉ lệ: %G = ${G}/${N} × 100 = ${S(ptG)}%\n`
          + `Đáp án cần tìm: ${S(hoi ? G : ptG)}.`,
      meo: 'Luôn nhớ %A + %G = 50% và A = T, G = C trong DNA mạch kép.'
    };
  } }
];
})();

</script>
<script>
/* ============================================================
   VẬN DỤNG CAO — MẪU ĐỀ NHIỀU BƯỚC, GẮN BỐI CẢNH THỰC TIỄN
   Bám định hướng CT GDPT 2018: câu mức 4 không nặng tính toán
   thuần tuý mà bắt phải hiểu bản chất, ghép nhiều mảng kiến thức
   và xử lí bối cảnh đời sống — sản xuất, năng lượng, môi trường.
   Mỗi mẫu tự random số liệu, tự tính đáp án và tự viết lời giải.
   ============================================================ */
window.TD = window.TD || {}; TD.GEN = TD.GEN || {};

(function () {
const S = TD.soVN;
const T = TD.lamTron;
const D = TD.dapSo;          /* đáp án số: đúng số chữ số thập phân đề yêu cầu */

/* ==========================================================
   HOÁ HỌC — VẬN DỤNG CAO
   ========================================================== */
TD.GEN.hoa = (TD.GEN.hoa || []).concat([

/* --- Làm mềm nước cứng: đổi mg/L → mol, cộng hai cation --- */
{ ma: 'hoa-vdc-lammem', chuong: 'Phi kim – Vô cơ', muc: 4, dang: 'tln',
  tao(R) {
    const a = R.nguyen(1, 7) * 40;          /* mg/L Ca²⁺ */
    const b = R.nguyen(1, 5) * 24;          /* mg/L Mg²⁺ */
    const V = R.chon([1, 2, 4, 5, 10]);     /* m³ nước */
    const nCa = V * a / 40, nMg = V * b / 24;   /* mol trong V m³ */
    const m = T(106 * (nCa + nMg) / 1000, 3);   /* kg */
    return {
      q: `Một nhà máy xử lí nước sinh hoạt phân tích được mẫu nước cứng chứa `
        + `${S(a)} mg/L ion Ca²⁺ và ${S(b)} mg/L ion Mg²⁺. Để làm mềm ${S(V)} m³ nước này bằng `
        + `sodium carbonate (Na₂CO₃), cần dùng bao nhiêu kilôgam Na₂CO₃? `
        + `(Ca = 40; Mg = 24; Na₂CO₃ có M = 106; làm tròn đến hàng phần nghìn)`,
      ans: D(m, 3),
      giai: `Bước 1 — quy về mol trong ${S(V)} m³ = ${S(V * 1000)} lít nước:\n`
        + `  m(Ca²⁺) = ${S(a)} mg/L × ${S(V * 1000)} L = ${S(a * V)} g ⇒ n(Ca²⁺) = ${S(a * V)}/40 = ${S(nCa, 3)} mol\n`
        + `  m(Mg²⁺) = ${S(b)} mg/L × ${S(V * 1000)} L = ${S(b * V)} g ⇒ n(Mg²⁺) = ${S(b * V)}/24 = ${S(nMg, 3)} mol\n`
        + `Bước 2 — mỗi ion Ca²⁺ hoặc Mg²⁺ cần 1 ion CO₃²⁻ để kết tủa:\n`
        + `  Ca²⁺ + CO₃²⁻ → CaCO₃↓ ; Mg²⁺ + CO₃²⁻ → MgCO₃↓\n`
        + `  n(Na₂CO₃) = ${S(nCa, 3)} + ${S(nMg, 3)} = ${S(nCa + nMg, 3)} mol\n`
        + `Bước 3 — m = ${S(nCa + nMg, 3)} × 106 = ${S(106 * (nCa + nMg), 2)} g = ${D(m, 3)} kg.`,
      meo: 'Na₂CO₃ xử lí được cả nước cứng tạm thời lẫn vĩnh cửu vì nó hạ trực tiếp nồng độ Ca²⁺, Mg²⁺. '
        + 'Đun nóng chỉ trị được nước cứng tạm thời (chứa HCO₃⁻).'
    };
  } },

/* --- Quang hợp: nối nhiệt hoá học với sinh học, có hiệu suất --- */
{ ma: 'hoa-vdc-quanghop', chuong: 'Carbohydrate', muc: 4, dang: 'tln',
  tao(R) {
    const m = R.nguyen(1, 12) * 18;         /* gam glucose */
    const H = R.chon([10, 15, 20, 25, 30, 40, 50]);
    const n = m / 180;
    const E = T(n * 2803 / (H / 100), 1);
    return {
      q: `Phản ứng quang hợp 6CO₂(g) + 6H₂O(l) → C₆H₁₂O₆(s) + 6O₂(g) có Δ<sub>r</sub>H°₂₉₈ = +2803 kJ/mol. `
        + `Một cây xanh chuyển hoá được ${S(H)}% năng lượng ánh sáng hấp thụ thành năng lượng hoá học. `
        + `Để tạo ra ${S(m)} gam glucose, cây cần hấp thụ bao nhiêu kJ năng lượng ánh sáng? `
        + `(C = 12; H = 1; O = 16; làm tròn đến hàng phần mười)`,
      ans: D(E, 1),
      giai: `Bước 1 — n(glucose) = ${S(m)}/180 = ${S(n, 4)} mol.\n`
        + `Bước 2 — năng lượng hoá học tích luỹ được (phản ứng thu nhiệt nên cần cấp vào):\n`
        + `  Q<sub>ích</sub> = ${S(n, 4)} × 2803 = ${S(n * 2803, 2)} kJ\n`
        + `Bước 3 — hiệu suất ${S(H)}% ⇒ năng lượng ánh sáng phải hấp thụ:\n`
        + `  E = ${S(n * 2803, 2)} ÷ ${S(H / 100)} = ${D(E, 1)} kJ.`,
      meo: 'Δ<sub>r</sub>H > 0 nghĩa là phản ứng THU nhiệt — quang hợp tích trữ năng lượng. '
        + 'Hiệu suất luôn nằm ở MẪU khi tính lượng đầu vào, ở TỬ khi tính lượng đầu ra.'
    };
  } },

/* --- Đốt nhiên liệu đun nước: ghép nhiệt hoá học với nhiệt lượng --- */
{ ma: 'hoa-vdc-nhienlieu', chuong: 'Đại cương hữu cơ', muc: 4, dang: 'tln',
  tao(R) {
    const nl = R.chon([
      { t: 'khí methane CH₄', M: 16, dH: 890.3, khi: true },
      { t: 'ethanol C₂H₅OH (lỏng)', M: 46, dH: 1366.9, khi: false },
      { t: 'khí propane C₃H₈', M: 44, dH: 2220.0, khi: true }
    ]);
    const V = R.chon([2, 3, 4, 5, 10]);     /* lít nước */
    const t1 = R.chon([20, 25, 30]);
    const H = R.chon([50, 60, 70, 80, 90]);
    const Q = V * 4200 * (100 - t1) / 1000;             /* kJ cần cho nước */
    const n = Q / (nl.dH * H / 100);                    /* mol nhiên liệu */
    const dv = nl.khi ? 'lít (đkc, 24,79 L/mol)' : 'gam';
    const kq = T(nl.khi ? n * 24.79 : n * nl.M, 2);
    return {
      q: `Đốt cháy hoàn toàn ${nl.t} toả ra ${S(nl.dH)} kJ/mol. Dùng nhiên liệu này đun `
        + `${S(V)} lít nước từ ${S(t1)} °C lên 100 °C trên một bếp có hiệu suất ${S(H)}%. `
        + `Cần bao nhiêu ${dv} nhiên liệu? `
        + `(nước: D = 1 g/mL, c = 4200 J/(kg·K); làm tròn đến hàng phần trăm)`,
      ans: D(kq, 2),
      giai: `Bước 1 — nhiệt lượng nước cần nhận:\n`
        + `  Q = m·c·Δt = ${S(V)} × 4200 × (100 − ${S(t1)}) = ${S(V * 4200 * (100 - t1))} J = ${S(Q, 2)} kJ\n`
        + `Bước 2 — bếp chỉ đạt hiệu suất ${S(H)}% nên nhiệt do nhiên liệu toả ra phải lớn hơn:\n`
        + `  Q<sub>toả</sub> = ${S(Q, 2)} ÷ ${S(H / 100)} = ${S(Q / (H / 100), 2)} kJ\n`
        + `Bước 3 — n(nhiên liệu) = ${S(Q / (H / 100), 2)} ÷ ${S(nl.dH)} = ${S(n, 4)} mol\n`
        + `Bước 4 — ${nl.khi
            ? `V = ${S(n, 4)} × 24,79 = ${D(kq, 2)} lít.`
            : `m = ${S(n, 4)} × ${S(nl.M)} = ${D(kq, 2)} gam.`}`,
      meo: 'Chương trình mới dùng điều kiện chuẩn 25 °C, 1 bar ⇒ 1 mol khí chiếm 24,79 lít, KHÔNG phải 22,4 lít. '
        + 'Đây là bẫy chuyển tiếp giữa hai chương trình.'
    };
  } },

/* --- Điện phân hai giai đoạn: catot hết Cu²⁺ rồi mới sinh H₂ --- */
{ ma: 'hoa-vdc-dp2gd', chuong: 'Điện phân – Pin điện', muc: 4, dang: 'tln',
  tao(R) {
    const a = R.nguyen(1, 6) * 0.05;                 /* mol CuSO₄ */
    const I = R.chon([1, 2, 5, 10]);
    const k = R.nguyen(1, 40);
    const t = 965 * k;
    const ne = T(0.01 * I * k, 4);                   /* mol electron */
    if (ne < 0.02 || ne > 1.2) return null;
    const hai = ne > 2 * a;                          /* đã sang giai đoạn 2 chưa */
    const nCu = hai ? a : ne / 2;
    const nH2 = hai ? (ne - 2 * a) / 2 : 0;
    const nO2 = ne / 4;
    const dm = T(64 * nCu + 2 * nH2 + 32 * nO2, 3);
    return {
      q: `Điện phân 500 mL dung dịch CuSO₄ ${S(T(a / 0.5, 2))}M (điện cực trơ) với cường độ dòng điện `
        + `${S(I)} A trong ${S(t)} giây. Khối lượng dung dịch giảm bao nhiêu gam? `
        + `(F = 96500 C/mol; Cu = 64; O = 16; H = 1; làm tròn đến hàng phần nghìn)`,
      ans: D(dm, 3),
      giai: `Bước 1 — số mol electron trao đổi: n<sub>e</sub> = I·t/F = ${S(I)}×${S(t)}/96500 = ${S(ne, 4)} mol.\n`
        + `Bước 2 — n(CuSO₄) = ${S(a, 2)} mol, cần ${S(2 * a, 2)} mol electron để khử hết Cu²⁺.\n`
        + (hai
            ? `  Vì ${S(ne, 4)} > ${S(2 * a, 2)} nên Cu²⁺ bị khử HẾT rồi nước tiếp tục bị điện phân ở catot:\n`
              + `  Cu = ${S(a, 2)} mol; H₂ = (${S(ne, 4)} − ${S(2 * a, 2)})/2 = ${S(nH2, 4)} mol\n`
            : `  Vì ${S(ne, 4)} ≤ ${S(2 * a, 2)} nên catot mới chỉ có Cu bám ra:\n`
              + `  Cu = ${S(ne, 4)}/2 = ${S(nCu, 4)} mol; chưa có H₂\n`)
        + `Bước 3 — anot luôn là nước bị oxi hoá: O₂ = n<sub>e</sub>/4 = ${S(nO2, 4)} mol.\n`
        + `Bước 4 — khối lượng dung dịch giảm = khối lượng chất rời khỏi dung dịch:\n`
        + `  Δm = 64×${S(nCu, 4)} + 2×${S(nH2, 4)} + 32×${S(nO2, 4)} = ${D(dm, 3)} gam.`,
      meo: 'Luôn so n(electron) với 2·n(Cu²⁺) TRƯỚC. Vượt ngưỡng là bài đổi hẳn sang giai đoạn hai — '
        + 'đây chính là chỗ đề gài để phân loại điểm 9–10.'
    };
  } },

/* --- Mạ điện: hình học → khối lượng → Faraday --- */
{ ma: 'hoa-vdc-madien', chuong: 'Điện phân – Pin điện', muc: 4, dang: 'tln',
  tao(R) {
    const kl = R.chon([
      { t: 'nickel', kh: 'Ni', M: 58.7, n: 2, D: 8.9 },
      { t: 'chromium', kh: 'Cr', M: 52, n: 3, D: 7.2 },
      { t: 'copper', kh: 'Cu', M: 64, n: 2, D: 8.96 },
      { t: 'silver', kh: 'Ag', M: 108, n: 1, D: 10.5 }
    ]);
    const Scm = R.nguyen(2, 20) * 25;        /* cm² */
    const d = R.chon([5, 10, 15, 20, 25, 30]);  /* μm */
    const I = R.chon([1.5, 2, 2.5, 4, 5]);
    const H = R.chon([80, 85, 90, 95]);
    const m = Scm * d * 1e-4 * kl.D;         /* gam */
    const ne = m / kl.M * kl.n;
    const t = T(ne * 96500 / (I * H / 100), 0);
    return {
      q: `Mạ một lớp ${kl.t} dày ${S(d)} μm lên bề mặt kim loại có diện tích ${S(Scm)} cm² bằng phương pháp `
        + `điện phân với cường độ dòng điện ${S(I)} A, hiệu suất dòng điện ${S(H)}%. `
        + `Thời gian mạ là bao nhiêu giây? `
        + `(${kl.kh}: M = ${S(kl.M)}, khối lượng riêng ${S(kl.D)} g/cm³; F = 96500 C/mol; làm tròn đến hàng đơn vị)`,
      ans: D(t, 0),
      giai: `Bước 1 — thể tích lớp mạ: V = S·d = ${S(Scm)} cm² × ${S(d)}×10⁻⁴ cm = ${S(Scm * d * 1e-4, 5)} cm³.\n`
        + `Bước 2 — khối lượng ${kl.kh} cần bám: m = V·D = ${S(Scm * d * 1e-4, 5)} × ${S(kl.D)} = ${S(m, 4)} gam.\n`
        + `Bước 3 — ${kl.kh}<sup>${kl.n}+</sup> + ${kl.n}e → ${kl.kh}:\n`
        + `  n<sub>e</sub> = (${S(m, 4)}/${S(kl.M)}) × ${S(kl.n)} = ${S(ne, 5)} mol\n`
        + `Bước 4 — t = n<sub>e</sub>·F/(I·H) = ${S(ne, 5)}×96500/(${S(I)}×${S(H / 100)}) = ${D(t, 0)} giây.`,
      meo: '1 μm = 10⁻⁴ cm. Đổi sai đơn vị bề dày là lệch cả vạn lần — kiểm tra lại trước khi tô đáp án.'
    };
  } },

/* --- Chuẩn độ có pha loãng: hệ số pha loãng là chỗ gài --- */
{ ma: 'hoa-vdc-chuando', chuong: 'Đại cương hữu cơ', muc: 4, dang: 'tln',
  tao(R) {
    const Vg = R.chon([5, 10, 20, 25]);        /* mL giấm lấy ra */
    const Vb = R.chon([100, 200, 250]);        /* pha loãng thành */
    const Vh = R.chon([10, 20, 25]);           /* thể tích hút đi chuẩn độ */
    const C = R.chon([0.05, 0.1, 0.2]);
    const Vn = R.nguyen(40, 240) / 10;         /* mL NaOH */
    const Dg = 1.01;   /* khối lượng riêng của giấm; đặt tên khác D để không che hàm định dạng đáp án */
    const nPhan = C * Vn / 1000;
    const nTong = nPhan * (Vb / Vh);
    const pct = T(nTong * 60 / (Vg * Dg) * 100, 2);
    if (pct < 1 || pct > 15) return null;      /* giữ trong khoảng giấm ăn thật */
    return {
      q: `Để xác định hàm lượng acetic acid trong một mẫu giấm ăn, người ta lấy ${S(Vg)} mL giấm rồi pha loãng `
        + `thành ${S(Vb)} mL. Hút ${S(Vh)} mL dung dịch sau pha loãng đem chuẩn độ bằng dung dịch NaOH `
        + `${S(C)}M thì hết ${S(Vn, 1)} mL. Tính nồng độ phần trăm của CH₃COOH trong mẫu giấm ban đầu. `
        + `(giấm có D = 1,01 g/mL; CH₃COOH có M = 60; làm tròn đến hàng phần trăm)`,
      ans: D(pct, 2),
      giai: `Bước 1 — CH₃COOH + NaOH → CH₃COONa + H₂O, tỉ lệ 1 : 1.\n`
        + `  n(CH₃COOH) trong ${S(Vh)} mL = n(NaOH) = ${S(C)} × ${S(Vn / 1000, 4)} = ${S(nPhan, 5)} mol\n`
        + `Bước 2 — quy về toàn bộ ${S(Vb)} mL dung dịch loãng (hệ số pha loãng ${S(Vb)}/${S(Vh)} = ${S(Vb / Vh, 2)}):\n`
        + `  n(CH₃COOH) tổng = ${S(nPhan, 5)} × ${S(Vb / Vh, 2)} = ${S(nTong, 5)} mol\n`
        + `Bước 3 — khối lượng acid = ${S(nTong, 5)} × 60 = ${S(nTong * 60, 4)} gam;\n`
        + `  khối lượng giấm lấy ra = ${S(Vg)} × 1,01 = ${S(Vg * Dg, 2)} gam\n`
        + `Bước 4 — C% = ${S(nTong * 60, 4)}/${S(Vg * Dg, 2)} × 100 = ${D(pct, 2)}%.`,
      meo: 'Quên nhân hệ số pha loãng là lỗi mất trọn câu. Cứ thấy "pha loãng thành V mL rồi hút V′ mL" là phải nhân V/V′.'
    };
  } },

/* --- Độ dinh dưỡng phân bón: khái niệm dễ nhầm --- */
{ ma: 'hoa-vdc-phanbon', chuong: 'Phi kim – Vô cơ', muc: 4, dang: 'tln',
  tao(R) {
    const p = R.chon([
      { t: 'phân urea (NH₂)₂CO', M: 60, ngto: 'N', he: 28 / 60, dd: '%N' },
      { t: 'phân ammonium nitrate NH₄NO₃', M: 80, ngto: 'N', he: 28 / 80, dd: '%N' },
      { t: 'phân ammonium sulfate (NH₄)₂SO₄', M: 132, ngto: 'N', he: 28 / 132, dd: '%N' },
      { t: 'phân potassium chloride KCl', M: 74.5, ngto: 'K₂O', he: 94 / 149, dd: '%K₂O' }
    ]);
    const dt = R.nguyen(1, 20) * 5;        /* kg dưỡng chất cần cho ruộng */
    const tc = R.chon([90, 92, 95, 97, 98]);  /* độ tinh khiết của phân thương phẩm */
    const m = T(dt / (p.he * tc / 100), 2);
    return {
      q: `Một thửa ruộng cần bón ${S(dt)} kg ${p.ngto}. Trên thị trường có ${p.t} với độ tinh khiết ${S(tc)}%. `
        + `Cần mua bao nhiêu kilôgam phân này? `
        + `(N = 14; H = 1; C = 12; O = 16; S = 32; K = 39; Cl = 35,5; làm tròn đến hàng phần trăm)`,
      ans: D(m, 2),
      giai: `Bước 1 — độ dinh dưỡng (${p.dd}) của ${p.t} nguyên chất:\n`
        + `  ${S(p.he * 100, 2)}% — tức 100 kg phân nguyên chất chứa ${S(p.he * 100, 2)} kg ${p.ngto}.\n`
        + `Bước 2 — khối lượng phân NGUYÊN CHẤT cần: ${S(dt)} ÷ ${S(p.he, 4)} = ${S(dt / p.he, 2)} kg\n`
        + `Bước 3 — phân thương phẩm chỉ đạt ${S(tc)}% tinh khiết:\n`
        + `  m = ${S(dt / p.he, 2)} ÷ ${S(tc / 100)} = ${D(m, 2)} kg.`,
      meo: 'Độ dinh dưỡng đạm quy về %N, lân quy về %P₂O₅, kali quy về %K₂O — không phải phần trăm của cả phân tử muối.'
    };
  } },

/* --- Đốt cháy hỗn hợp ester no đơn hở: dùng bảo toàn nguyên tố O --- */
{ ma: 'hoa-vdc-dotester', chuong: 'Ester – Lipid', muc: 4, dang: 'tln',
  tao(R) {
    const n = R.nguyen(2, 5);
    const x = R.nguyen(2, 12) / 100, y = R.nguyen(2, 12) / 100;
    const nCO2 = T(x * n + y * (n + 1), 4);
    const nO2 = T(x * (3 * n - 2) / 2 + y * (3 * (n + 1) - 2) / 2, 4);
    const m = T(62 * nCO2 - 32 * nO2, 3);
    if (m <= 0) return null;
    return {
      q: `Đốt cháy hoàn toàn m gam hỗn hợp E gồm hai ester no, đơn chức, mạch hở là đồng đẳng kế tiếp, `
        + `cần vừa đủ ${S(nO2, 4)} mol O₂, thu được ${S(nCO2, 4)} mol CO₂. Giá trị của m là bao nhiêu? `
        + `(C = 12; H = 1; O = 16; làm tròn đến hàng phần nghìn)`,
      ans: D(m, 3),
      giai: `Bước 1 — ester no, đơn chức, mạch hở có dạng C<sub>n</sub>H<sub>2n</sub>O₂ ⇒ khi cháy `
        + `n(H₂O) = n(CO₂) = ${S(nCO2, 4)} mol.\n`
        + `Bước 2 — bảo toàn nguyên tố O:\n`
        + `  2·n(E) + 2·n(O₂) = 2·n(CO₂) + n(H₂O)\n`
        + `  2·n(E) = 2×${S(nCO2, 4)} + ${S(nCO2, 4)} − 2×${S(nO2, 4)} = ${S(3 * nCO2 - 2 * nO2, 4)}\n`
        + `  ⇒ n(E) = ${S((3 * nCO2 - 2 * nO2) / 2, 4)} mol\n`
        + `Bước 3 — bảo toàn khối lượng theo nguyên tố:\n`
        + `  m = 12·n(C) + 2·n(H₂O)·1 + 16·n(O trong E)\n`
        + `  m = 12×${S(nCO2, 4)} + 2×${S(nCO2, 4)} + 32×${S((3 * nCO2 - 2 * nO2) / 2, 4)} = ${D(m, 3)} gam.\n`
        + `Cách nhẩm nhanh: với ester no đơn hở luôn có m = 62·n(CO₂) − 32·n(O₂).`,
      meo: 'Ghi nhớ công thức tắt m = 62·n(CO₂) − 32·n(O₂) cho ester no đơn chức mạch hở — '
        + 'suy ra từ bảo toàn O, tiết kiệm được cả phút trong phòng thi.'
    };
  } },

        v: `Trong ăn mòn điện hoá, kim loại HOẠT ĐỘNG HƠN (${c.a}) mới bị ăn mòn trước. Đây là nguyên lí bảo vệ vỏ tàu bằng khối kẽm.` },
      { t: `Sức điện động chuẩn của pin dương chứng tỏ phản ứng trong pin tự xảy ra.`, a: true,

TD.GEN.ly = (TD.GEN.ly || []).concat([

/* --- Làm lạnh nước thành đá: ba chặng nhiệt + công suất --- */
{ ma: 'ly-vdc-lamlanh', chuong: 'Vật lí nhiệt', muc: 4, dang: 'tln', duong: true,
  tao(R) {
    const m = R.chon([0.5, 1, 1.5, 2, 2.5, 3]);
    const t1 = R.chon([15, 20, 25, 30]);
    const t2 = R.chon([5, 10, 15, 18, 20]);
    const tau = R.chon([30, 45, 60, 70, 90, 120]);   /* phút */
    const Q1 = m * 4200 * t1, Q2 = m * 3.34e5, Q3 = m * 2100 * t2;
    const P = T((Q1 + Q2 + Q3) / (tau * 60), 1);
    return {
      q: `Một tủ lạnh làm ${S(m)} kg nước ở ${S(t1)} °C đông thành nước đá ở −${S(t2)} °C trong ${S(tau)} phút. `
        + `Coi toàn bộ nhiệt lượng lấy ra chỉ dùng cho lượng nước này. Công suất làm lạnh của tủ bằng bao nhiêu watt? `
        + `(nước: c = 4200 J/(kg·K); nước đá: c = 2100 J/(kg·K); nhiệt nóng chảy riêng của nước đá `
        + `λ = 3,34·10⁵ J/kg; làm tròn đến hàng phần mười)`,
      ans: D(P, 1),
      giai: `Chia làm ba chặng — vẽ trục nhiệt độ ra là thấy ngay:\n`
        + `  ① Hạ nước từ ${S(t1)} °C xuống 0 °C: Q₁ = m·c·Δt = ${S(m)}×4200×${S(t1)} = ${S(Q1)} J\n`
        + `  ② Nước đông đặc ở 0 °C (nhiệt độ KHÔNG đổi): Q₂ = λ·m = 3,34·10⁵×${S(m)} = ${S(Q2)} J\n`
        + `  ③ Hạ nước đá từ 0 °C xuống −${S(t2)} °C: Q₃ = m·c<sub>đá</sub>·Δt = ${S(m)}×2100×${S(t2)} = ${S(Q3)} J\n`
        + `Tổng nhiệt phải lấy đi: Q = ${S(Q1 + Q2 + Q3)} J.\n`
        + `Công suất: P = Q/t = ${S(Q1 + Q2 + Q3)} / (${S(tau)}×60) = ${D(P, 1)} W.`,
      meo: 'Bỏ sót chặng đông đặc (λm) là lỗi phổ biến nhất — mà chặng đó thường chiếm phần lớn nhiệt lượng. '
        + 'Cứ thấy đề vượt qua mốc 0 °C hoặc 100 °C là phải chèn thêm một chặng chuyển thể.'
    };
  } },

/* --- Ấm điện: đun sôi rồi hoá hơi một phần --- */
{ ma: 'ly-vdc-amdien', chuong: 'Vật lí nhiệt', muc: 4, dang: 'tln', duong: true,
  tao(R) {
    const P = R.chon([1000, 1200, 1500, 1800, 2000, 2200]);
    const m = R.chon([0.5, 1, 1.5, 2, 2.5]);
    const t1 = R.chon([20, 25, 30]);
    const x = R.chon([0.05, 0.1, 0.15, 0.2]);      /* kg nước hoá hơi */
    const H = R.chon([70, 80, 85, 90]);
    const Q = m * 4200 * (100 - t1) + x * 2.26e6;
    const t = T(Q / (P * H / 100), 1);
    return {
      q: `Một ấm điện công suất ${S(P)} W có hiệu suất ${S(H)}% được dùng để đun ${S(m)} kg nước từ ${S(t1)} °C `
        + `đến khi sôi và làm bay hơi ${S(x)} kg nước. Thời gian đun là bao nhiêu giây? `
        + `(c<sub>nước</sub> = 4200 J/(kg·K); nhiệt hoá hơi riêng L = 2,26·10⁶ J/kg; làm tròn đến hàng phần mười)`,
      ans: D(t, 1),
      giai: `Bước 1 — đun nóng tới 100 °C: Q₁ = ${S(m)}×4200×(100 − ${S(t1)}) = ${S(m * 4200 * (100 - t1))} J\n`
        + `Bước 2 — hoá hơi ${S(x)} kg ở 100 °C: Q₂ = L·x = 2,26·10⁶×${S(x)} = ${S(x * 2.26e6)} J\n`
        + `Bước 3 — tổng nhiệt CÓ ÍCH: Q = ${S(Q)} J\n`
        + `Bước 4 — ấm chỉ đạt hiệu suất ${S(H)}% nên công suất có ích là ${S(P)}×${S(H / 100)} = ${S(P * H / 100)} W\n`
        + `  t = ${S(Q)} / ${S(P * H / 100)} = ${D(t, 1)} giây.`,
      meo: 'Nhiệt hoá hơi riêng của nước lớn gấp gần 7 lần nhiệt nóng chảy — chỉ bay hơi vài lạng nước '
        + 'đã tốn nhiều năng lượng hơn cả việc đun cả ấm từ nguội tới sôi.'
    };
  } },

/* --- Bình khí rò rỉ: dùng pV = nRT hai lần --- */
{ ma: 'ly-vdc-binhkhi', chuong: 'Khí lí tưởng', muc: 4, dang: 'tln', duong: true,
  tao(R) {
    const p1 = R.nguyen(6, 20);              /* bar */
    const t1 = R.chon([17, 27, 37, 47]);
    const p2 = R.nguyen(2, p1 - 2);
    const t2 = R.chon([7, 17, 27, 37, 57]);
    const T1 = t1 + 273, T2 = t2 + 273;
    const ti = (p2 / T2) / (p1 / T1);
    if (ti >= 1) return null;
    const pct = T((1 - ti) * 100, 2);
    return {
      q: `Một bình thép dung tích không đổi chứa khí ở áp suất ${S(p1)} bar, nhiệt độ ${S(t1)} °C. `
        + `Sau một thời gian bình bị rò rỉ, áp suất còn ${S(p2)} bar và nhiệt độ lúc này là ${S(t2)} °C. `
        + `Bao nhiêu phần trăm khối lượng khí đã thoát ra khỏi bình? (làm tròn đến hàng phần trăm)`,
      ans: D(pct, 2),
      giai: `Bước 1 — thể tích bình không đổi, dùng pV = nRT ⇒ n = pV/(RT), tức n ∝ p/T.\n`
        + `  Đổi Kelvin: T₁ = ${S(t1)} + 273 = ${S(T1)} K; T₂ = ${S(t2)} + 273 = ${S(T2)} K\n`
        + `Bước 2 — tỉ lệ khí còn lại:\n`
        + `  n₂/n₁ = (p₂/T₂)/(p₁/T₁) = (${S(p2)}/${S(T2)}) ÷ (${S(p1)}/${S(T1)}) = ${S(ti, 4)}\n`
        + `Bước 3 — phần trăm khí đã thoát:\n`
        + `  (1 − ${S(ti, 4)}) × 100 = ${D(pct, 2)}%.`,
      meo: 'Bài rò rỉ khí thì SỐ MOL thay đổi nên không được dùng p₁V₁/T₁ = p₂V₂/T₂ (công thức đó chỉ đúng khi n không đổi). '
        + 'Phải quay về pV = nRT.'
    };
  } },

/* --- Định tuổi bằng đồng vị phóng xạ --- */
{ ma: 'ly-vdc-dinhtuoi', chuong: 'Vật lí hạt nhân', muc: 4, dang: 'tln', duong: true,
  tao(R) {
    const dv = R.chon([
      { t: '¹⁴C', T: 5730, dv: 'năm', vat: 'mẫu gỗ khảo cổ' },
      { t: '²³⁸U', T: 4.5e9, dv: 'năm', vat: 'mẫu quặng' },
      { t: '⁴⁰K', T: 1.3e9, dv: 'năm', vat: 'mẫu đá núi lửa' }
    ]);
    const kieu = R.nguyen(0, 1);
    const pc = R.nguyen(10, 90);                    /* % còn lại */
    const tiCon = R.nguyen(1, 30) / 10;             /* hạt con / hạt mẹ */
    let de, ti, buoc;
    if (kieu === 0) {
      ti = pc / 100;
      de = `Độ phóng xạ của ${dv.vat} chỉ còn ${S(pc)}% so với một mẫu cùng loại còn sống (hoặc mới hình thành).`;
      buoc = `  Độ phóng xạ H tỉ lệ với số hạt nhân N, nên N/N₀ = ${S(pc)}% = ${S(ti, 4)}.\n`;
    } else {
      ti = 1 / (1 + tiCon);
      de = `Trong ${dv.vat}, tỉ lệ số hạt nhân con sinh ra so với số hạt nhân ${dv.t} còn lại là ${S(tiCon, 1)}.`;
      buoc = `  Cứ 1 hạt mẹ phân rã thì sinh 1 hạt con ⇒ N₀ = N + N<sub>con</sub> = N(1 + ${S(tiCon, 1)}).\n`
           + `  Vậy N/N₀ = 1/(1 + ${S(tiCon, 1)}) = ${S(ti, 4)}.\n`;
    }
    const tuoi = dv.T * Math.log(1 / ti) / Math.LN2;
    const kq = dv.T > 1e6 ? T(tuoi / 1e9, 3) : T(tuoi, 0);
    const donvi = dv.T > 1e6 ? 'tỉ năm' : 'năm';
    return {
      q: `${dv.t} có chu kì bán rã T = ${dv.T > 1e6 ? S(dv.T / 1e9) + '·10⁹' : S(dv.T)} năm. ${de} `
        + `Tuổi của mẫu vật là bao nhiêu ${donvi}? (làm tròn đến hàng ${dv.T > 1e6 ? 'phần nghìn' : 'đơn vị'})`,
      ans: D(kq, dv.T > 1e6 ? 3 : 0),
      giai: `Bước 1 — lập tỉ số hạt nhân còn lại:\n${buoc}`
        + `Bước 2 — định luật phóng xạ N = N₀·2^(−t/T) ⇒ 2^(−t/T) = ${S(ti, 4)}\n`
        + `  ⇒ t = T·log₂(1/${S(ti, 4)}) = ${dv.T > 1e6 ? S(dv.T / 1e9) + '·10⁹' : S(dv.T)} × ${S(Math.log(1 / ti) / Math.LN2, 4)}\n`
        + `Bước 3 — t ≈ ${D(kq, dv.T > 1e6 ? 3 : 0)} ${donvi}.`,
      meo: 'Tỉ số hạt CON trên hạt MẸ bằng 2^(t/T) − 1, không phải 2^(t/T). Nhớ trừ 1 là qua được bẫy quen nhất của dạng này.'
    };
  } },

/* --- Nhà máy điện hạt nhân: MeV → J → khối lượng nhiên liệu --- */
{ ma: 'ly-vdc-nhamayhn', chuong: 'Vật lí hạt nhân', muc: 4, dang: 'tln', duong: true,
  tao(R) {
    const P = R.chon([100, 200, 400, 500, 600, 1000]);   /* MW điện */
    const H = R.chon([25, 30, 32, 35, 40]);
    const ngay = R.chon([1, 7, 30, 100, 365]);
    const Q = P * 1e6 * ngay * 86400 / (H / 100);        /* J nhiệt cần */
    const E1 = 200 * 1.6e-13;                            /* J mỗi phân hạch */
    const soHat = Q / E1;
    const m = T(soHat / 6.022e23 * 235 / 1000, 3);       /* kg */
    return {
      q: `Một nhà máy điện hạt nhân có công suất điện ${S(P)} MW, hiệu suất chuyển hoá nhiệt thành điện ${S(H)}%. `
        + `Mỗi phân hạch ²³⁵U toả ra 200 MeV. Trong ${S(ngay)} ngày hoạt động liên tục, nhà máy tiêu thụ bao nhiêu `
        + `kilôgam ²³⁵U? (1 MeV = 1,6·10⁻¹³ J; N<sub>A</sub> = 6,022·10²³; làm tròn đến hàng phần nghìn)`,
      ans: D(m, 3),
      giai: `Bước 1 — điện năng sản ra: A = P·t = ${S(P)}·10⁶ × ${S(ngay)} × 86400 = ${S(P * 1e6 * ngay * 86400, 0)} J\n`
        + `Bước 2 — hiệu suất ${S(H)}% ⇒ nhiệt lượng phân hạch phải cung cấp:\n`
        + `  Q = A ÷ ${S(H / 100)} = ${S(Q, 0)} J\n`
        + `Bước 3 — năng lượng mỗi phân hạch: 200 MeV = 200 × 1,6·10⁻¹³ = 3,2·10⁻¹¹ J\n`
        + `  Số hạt ²³⁵U đã phân hạch: N = ${S(Q, 0)} ÷ 3,2·10⁻¹¹ = ${S(soHat, 0)}\n`
        + `Bước 4 — m = (N/N<sub>A</sub>)·235 = ${S(soHat / 6.022e23, 4)} mol × 235 = ${S(soHat / 6.022e23 * 235, 2)} g = ${D(m, 3)} kg.`,
      meo: 'So sánh cho thấm: 1 kg ²³⁵U cho năng lượng tương đương khoảng 2 500 tấn than. '
        + 'Đó là lí do năng lượng hạt nhân có mật độ năng lượng vượt trội.'
    };
  } },

/* --- Truyền tải điện năng: hai trạng thái điện áp --- */
{ ma: 'ly-vdc-truyentai', chuong: 'Từ trường', muc: 4, dang: 'tln', duong: true,
  tao(R) {
    const P = R.chon([100, 200, 500, 1000, 2000]);   /* kW */
    const U1 = R.chon([2, 5, 10, 20]);               /* kV */
    const H1 = R.chon([80, 85, 90, 92]);             /* % hiệu suất ban đầu */
    const H2 = R.chon([95, 96, 97, 98, 99]);
    if (H2 <= H1) return null;
    /* ΔP = P²R/U² ⇒ (1−H) ∝ 1/U² ⇒ U2 = U1·√((1−H1)/(1−H2)) */
    const U2 = T(U1 * Math.sqrt((1 - H1 / 100) / (1 - H2 / 100)), 3);
    return {
      q: `Điện năng ${S(P)} kW được truyền đi xa bằng đường dây có điện trở không đổi, hệ số công suất bằng 1. `
        + `Khi điện áp nơi phát là ${S(U1)} kV thì hiệu suất truyền tải đạt ${S(H1)}%. `
        + `Muốn hiệu suất truyền tải đạt ${S(H2)}% thì điện áp nơi phát phải bằng bao nhiêu kV? `
        + `(làm tròn đến hàng phần nghìn)`,
      ans: D(U2, 3),
      giai: `Bước 1 — công suất hao phí ΔP = P²R/(U²cos²φ), với P, R, cosφ không đổi ⇒ ΔP ∝ 1/U².\n`
        + `Bước 2 — hiệu suất H = 1 − ΔP/P ⇒ phần hao phí (1 − H) cũng tỉ lệ nghịch với U²:\n`
        + `  (1 − H₁)/(1 − H₂) = U₂²/U₁²\n`
        + `Bước 3 — thay số: (1 − ${S(H1 / 100)})/(1 − ${S(H2 / 100)}) = ${S((1 - H1 / 100) / (1 - H2 / 100), 4)}\n`
        + `  U₂ = ${S(U1)} × √${S((1 - H1 / 100) / (1 - H2 / 100), 4)} = ${D(U2, 3)} kV.`,
      meo: 'Đừng lập tỉ lệ với H mà phải lập tỉ lệ với (1 − H) — chính phần HAO PHÍ mới tỉ lệ nghịch với U². '
        + 'Nhầm chỗ này là ra đáp án sai mà vẫn thấy "hợp lí".'
    };
  } },

/* --- Năng lượng phản ứng hạt nhân từ năng lượng liên kết riêng --- */
{ ma: 'ly-vdc-nlpu', chuong: 'Vật lí hạt nhân', muc: 4, dang: 'tln', duong: true,
  tao(R) {
    const A1 = R.nguyen(2, 4), e1 = R.nguyen(10, 40) / 10;      /* hạt nhẹ tham gia */
    const A2 = R.nguyen(2, 4), e2 = R.nguyen(10, 40) / 10;
    const A3 = A1 + A2 - 1, e3 = R.nguyen(60, 88) / 10;         /* sản phẩm bền hơn */
    if (A3 < 3) return null;
    const dE = T(A3 * e3 - (A1 * e1 + A2 * e2), 3);
    if (dE <= 0) return null;
    return {
      q: `Xét phản ứng hạt nhân X + Y → Z + n, trong đó X có số khối ${S(A1)} và năng lượng liên kết riêng `
        + `${S(e1, 1)} MeV/nucleon; Y có số khối ${S(A2)} và năng lượng liên kết riêng ${S(e2, 1)} MeV/nucleon; `
        + `Z có số khối ${S(A3)} và năng lượng liên kết riêng ${S(e3, 1)} MeV/nucleon. Hạt neutron có năng lượng `
        + `liên kết bằng 0. Phản ứng toả ra bao nhiêu MeV? (làm tròn đến hàng phần nghìn)`,
      ans: D(dE, 3),
      giai: `Bước 1 — năng lượng liên kết của một hạt nhân = ε × A:\n`
        + `  W(X) = ${S(A1)} × ${S(e1, 1)} = ${S(A1 * e1, 2)} MeV\n`
        + `  W(Y) = ${S(A2)} × ${S(e2, 1)} = ${S(A2 * e2, 2)} MeV\n`
        + `  W(Z) = ${S(A3)} × ${S(e3, 1)} = ${S(A3 * e3, 2)} MeV; W(n) = 0\n`
        + `Bước 2 — năng lượng toả ra = tổng năng lượng liên kết SAU trừ TRƯỚC:\n`
        + `  ΔE = ${S(A3 * e3, 2)} − (${S(A1 * e1, 2)} + ${S(A2 * e2, 2)}) = ${D(dE, 3)} MeV.\n`
        + `Kết quả dương ⇒ phản ứng toả năng lượng, sản phẩm bền vững hơn các hạt ban đầu.`,
      meo: 'Với năng lượng LIÊN KẾT thì lấy sau trừ trước; với KHỐI LƯỢNG thì lấy trước trừ sau. '
        + 'Hai công thức ngược chiều nhau nhưng cùng cho một kết quả.'
    };
  } },

/* --- Thả kim loại nóng vào nước đá: hai kịch bản --- */
{ ma: 'ly-vdc-thakimloai', chuong: 'Vật lí nhiệt', muc: 4, dang: 'tln', duong: true,
  tao(R) {
    const kl = R.chon([
      { t: 'đồng', c: 380 }, { t: 'nhôm', c: 880 }, { t: 'sắt', c: 460 }, { t: 'chì', c: 130 }
    ]);
    const mk = R.nguyen(2, 10) / 10;          /* kg kim loại */
    const tk = R.chon([100, 150, 200, 250, 300]);
    const md = R.nguyen(1, 8) / 10;           /* kg nước đá ở 0 °C */
    const Qtoa = mk * kl.c * tk;              /* toả khi hạ về 0 °C */
    const Qtan = md * 3.34e5;                 /* cần để tan hết đá */
    if (Qtoa >= Qtan) return null;            /* giữ kịch bản đá chưa tan hết */
    const mTan = T(Qtoa / 3.34e5, 4);
    return {
      q: `Thả một miếng ${kl.t} khối lượng ${S(mk)} kg đang ở ${S(tk)} °C vào một bình chứa ${S(md)} kg `
        + `nước đá ở 0 °C. Bỏ qua hao phí nhiệt ra môi trường và nhiệt dung của bình. `
        + `Khối lượng nước đá đã tan là bao nhiêu kilôgam? `
        + `(c<sub>${kl.t}</sub> = ${S(kl.c)} J/(kg·K); λ = 3,34·10⁵ J/kg; làm tròn đến hàng phần vạn)`,
      ans: D(mTan, 4),
      giai: `Bước 1 — kiểm tra kịch bản trước đã. Nhiệt lượng miếng ${kl.t} toả ra khi hạ xuống 0 °C:\n`
        + `  Q<sub>toả</sub> = m·c·Δt = ${S(mk)}×${S(kl.c)}×${S(tk)} = ${S(Qtoa)} J\n`
        + `  Nhiệt cần để tan HẾT ${S(md)} kg đá: Q<sub>tan hết</sub> = λ·m = 3,34·10⁵×${S(md)} = ${S(Qtan)} J\n`
        + `Bước 2 — vì ${S(Qtoa)} J < ${S(Qtan)} J nên đá CHƯA tan hết. Hỗn hợp dừng ở 0 °C, `
        + `toàn bộ nhiệt do kim loại toả ra chỉ dùng để làm tan đá.\n`
        + `Bước 3 — m<sub>tan</sub> = Q<sub>toả</sub>/λ = ${S(Qtoa)} / 3,34·10⁵ = ${D(mTan, 4)} kg.`,
      meo: 'Luôn SO SÁNH trước khi lập phương trình cân bằng nhiệt. Nếu đá chưa tan hết thì nhiệt độ cuối là 0 °C '
        + '— viết phương trình m₁c₁(t₁−t) = m₂c₂(t−t₂) ở đây là sai ngay từ đầu.'
    };
  } },

/* --- Câu đúng/sai vận dụng cao: đồ thị đun nóng chất --- */
{ ma: 'ly-vdc-ds-nhiet', chuong: 'Vật lí nhiệt', muc: 4, dang: 'ds',
  tao(R) {
    const P = R.chon([500, 800, 1000, 1200]);
    const m = R.chon([0.2, 0.5, 1]);
    const t1 = R.nguyen(2, 8) * 60;                /* giây đoạn nghiêng đầu */
    const t2 = R.nguyen(5, 15) * 60;              /* giây đoạn nằm ngang */
    const c = T(P * t1 / (m * 100), 0);           /* J/(kg·K) nếu tăng 100 K */
    const L = T(P * t2 / m, 0);
    const kho = [
      { t: `Đoạn nằm ngang của đồ thị ứng với giai đoạn chất đang chuyển thể.`, a: true,
        v: `Nhiệt độ không đổi dù vẫn nhận nhiệt — toàn bộ nhiệt lượng dùng để phá vỡ liên kết giữa các phân tử.` },
      { t: `Trong đoạn nằm ngang, chất không nhận thêm nhiệt lượng nào từ nguồn.`, a: false,
        v: `Vẫn nhận nhiệt đều đặn ${S(P)} J mỗi giây; nhiệt đó chuyển thành thế năng tương tác chứ không thành động năng phân tử.` },
      { t: `Nhiệt dung riêng của chất trong giai đoạn đầu bằng ${S(c)} J/(kg·K).`, a: true,
        v: `c = P·t/(m·Δt) = ${S(P)}×${S(t1)}/(${S(m)}×100) = ${S(c)} J/(kg·K).` },
      { t: `Nhiệt chuyển thể riêng của chất bằng ${S(L)} J/kg.`, a: true,
        v: `L = P·t/m = ${S(P)}×${S(t2)}/${S(m)} = ${S(L)} J/kg.` },
      { t: `Nếu tăng gấp đôi khối lượng chất mà giữ nguyên công suất thì đoạn nằm ngang dài gấp đôi.`, a: true,
        v: `Q = L·m tăng gấp đôi trong khi công suất không đổi nên thời gian tăng gấp đôi.` },
      { t: `Nếu dùng nguồn có công suất lớn hơn thì nhiệt độ chuyển thể của chất sẽ cao hơn.`, a: false,
        v: `Nhiệt độ chuyển thể là hằng số của chất ở áp suất cho trước, không phụ thuộc công suất nguồn. Chỉ có thời gian chuyển thể ngắn lại.` },
      { t: `Độ dốc của đồ thị trong giai đoạn đầu càng lớn thì nhiệt dung riêng của chất càng nhỏ.`, a: true,
        v: `Độ dốc Δt/Δτ = P/(m·c); c nhỏ thì độ dốc lớn — chất nóng lên nhanh hơn.` },
      { t: `Nội năng của chất không đổi trong suốt đoạn nằm ngang vì nhiệt độ không đổi.`, a: false,
        v: `Nội năng vẫn TĂNG: phần thế năng tương tác phân tử tăng lên dù động năng (ứng với nhiệt độ) giữ nguyên.` }
    ];
    return TD.dsTu(R, `Dùng một nguồn nhiệt công suất không đổi ${S(P)} W đun ${S(m)} kg một chất. `
      + `Đồ thị nhiệt độ theo thời gian gồm một đoạn đi lên (chất tăng thêm 100 °C trong ${S(t1)} giây), `
      + `rồi một đoạn nằm ngang kéo dài ${S(t2)} giây. Bỏ qua mọi hao phí. Xét các phát biểu sau:`, kho,
      'Đồ thị nhiệt độ – thời gian: đoạn NGHIÊNG là mcΔt, đoạn NGANG là λm hoặc Lm. '
      + 'Đọc được hai đoạn đó là giải được mọi câu của dạng này.');
  } }

]);

})();

const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

/* ---------------- THÔNG BÁO ---------------- */
TD.bao = function (chu, loai) {
  const h = $('#toast'); if (!h) return;
  const t = el('div', 'toast' + (loai ? ' ' + loai : ''), chu);
  h.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .4s'; setTimeout(() => t.remove(), 400); }, 2600);
};

/* ---------------- ĐỘT PHÁ CẢNH GIỚI ---------------- */

    <div class="vong">☯</div>
    <div style="color:var(--chu2);letter-spacing:3px;font-size:13px">ĐỘT PHÁ CẢNH GIỚI</div>
    <h2>${cg.ten}</h2>
    <div style="color:var(--kim);font-size:15px">${cg.tang}</div>
    <p style="color:var(--chu2);max-width:430px;margin:16px auto">${cg.mo_ta}</p>
    <button class="nut kim" id="dp-dong">Tiếp tục tu luyện</button>
  </div>`;
  h.classList.add('hien');
  $('#dp-dong').onclick = () => h.classList.remove('hien');
  TD.S.linh_thach += 50;
  TD.bao('💎 +50 linh thạch mừng đột phá!', 'kim');
};

      <div>
        <div class="hud-cg" style="color:${cg.mau}">${cg.ten}
          <span class="hud-tang">· ${cg.tang}</span></div>
