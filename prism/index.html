<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a14" />
    <meta name="description" content="PRISM — turn the mirrors, light the lanterns. Every puzzle is proven solvable." />
    <title>PRISM</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div><b id="level">1</b><span>PUZZLE</span></div>
        <div><b id="moves">0</b><span>TURNS</span></div>
        <div><b id="par">—</b><span>BEST KNOWN</span></div>
      </header>
      <canvas id="board" width="700" height="700"></canvas>
      <p id="hint">Tap a mirror to turn it. Get the beam into every lantern.</p>
      <div class="row">
        <button class="btn" data-action="reset">RESET</button>
        <button class="btn" data-action="hint">SHOW ME</button>
        <button class="btn" data-action="skip">SKIP</button>
      </div>
      <p class="fine" id="status"></p>
    </div>
    <div id="win" class="screen hidden">
      <h2>LIT</h2>
      <p id="win-line" class="tag"></p>
      <button class="btn primary" data-action="next">NEXT PUZZLE</button>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
