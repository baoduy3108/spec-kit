<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMINA · Pixel Platformer</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0b1020;
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;color:#eef0ff}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  canvas{image-rendering:pixelated;background:#121a33;box-shadow:0 30px 80px -20px rgba(0,0,0,.8);
    border-radius:10px;max-width:100vw;max-height:100vh}
  #hud{position:fixed;left:0;right:0;top:0;pointer-events:none;padding:14px 18px;
    display:flex;justify-content:space-between;align-items:flex-start;z-index:5;
    font-weight:800;letter-spacing:.3px;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 10px rgba(0,0,0,.5)}
  .pill{background:rgba(10,14,30,.55);border:1px solid rgba(255,255,255,.14);border-radius:999px;
    padding:7px 13px;font-size:15px;display:flex;gap:8px;align-items:center;backdrop-filter:blur(6px)}
  #tip{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:5;pointer-events:none;
    background:rgba(10,14,30,.55);border:1px solid rgba(255,255,255,.14);border-radius:12px;
    padding:9px 15px;font-size:13px;color:#c7cdf0;text-shadow:0 1px 0 rgba(0,0,0,.6)}
  #win{position:fixed;inset:0;z-index:8;display:none;place-items:center;background:rgba(6,9,20,.72);backdrop-filter:blur(4px)}
  #win .card{background:rgba(16,20,40,.9);border:1px solid rgba(255,255,255,.14);border-radius:18px;
    padding:30px 36px;text-align:center;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
  #win h1{font-size:30px;margin-bottom:8px;background:linear-gradient(90deg,#a78bfa,#22d3ee);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #win p{color:#aab0d4;margin-bottom:16px}
  #win button{pointer-events:auto;cursor:pointer;border:0;border-radius:999px;padding:11px 26px;font-weight:800;
    font-size:15px;color:#0a0c18;background:linear-gradient(90deg,#a78bfa,#22d3ee)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud">
  <div class="pill">🪙 <span id="coins">0</span> / <span id="coinsTotal">0</span></div>
  <div class="pill">⏱ <span id="time">0.0</span>s</div>
</div>
<div id="tip">← → di chuyển · <b>Space</b>/<b>↑</b> nhảy (giữ để nhảy cao) · <b>R</b> chơi lại</div>
<div id="win"><div class="card"><h1>🏁 Về đích!</h1><p id="winStats"></p><button onclick="resetGame()">Chơi lại</button></div></div>
<script>
"use strict";
// ─────────────────────────────────────────────────────────────────────────────
// LUMINA · Pixel Platformer — self-contained (canvas 2D, no libs).
// Rèn các skill: tilemap-and-level-design, character-controller-and-platformer-
// movement (coyote time + jump buffer + variable jump + fast-fall), particle-
// systems-and-vfx, 2d-lighting-and-shadows, game-ui-and-hud-design, game-feel.
// ─────────────────────────────────────────────────────────────────────────────
const TILE = 32;
// Tilemap: '#'=đất, '='=nền, '.'=trống, 'o'=xu, 'P'=người chơi, 'F'=cờ đích, '^'=gai
const LEVEL = [
  "................................................",
  "................................................",
  "..........o.o...................................",
  ".........======.........o.o.o...................",
  "....................===========.........o......F",
  "..........o.................................===",
  "....P...o.o.o..........^^..........o.o...........",
  "..===========....===.=====....========.====.....",
  "###########..#####.#######..##########.####.#####",
  "###########..#####.#######..##########.####.#####",
];
const ROWS = LEVEL.length, COLS = LEVEL[0].length;
const W = COLS * TILE, H = ROWS * TILE;

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
// Kích thước hiển thị (camera thấy một phần thế giới).
const VIEW_W = 15 * TILE, VIEW_H = ROWS * TILE;
cv.width = VIEW_W; cv.height = VIEW_H;
// Light buffer (2d-lighting): vẽ sáng riêng rồi phủ lên cảnh bằng multiply.
const lightCv = document.createElement("canvas"); lightCv.width = VIEW_W; lightCv.height = VIEW_H;
const lc = lightCv.getContext("2d");

// ── Âm thanh (WebAudio, không file ngoài) ───────────────────────────────────
let actx = null;
function beep(freq, dur, type = "square", vol = 0.05) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
const sndJump = () => beep(520, 0.14, "square", 0.05);
const sndLand = () => beep(160, 0.10, "sine", 0.04);
const sndCoin = () => { beep(880, 0.08, "square", 0.05); setTimeout(() => beep(1320, 0.09, "square", 0.05), 60); };
const sndDie  = () => beep(120, 0.35, "sawtooth", 0.06);
const sndWin  = () => { [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.16,"square",0.05),i*110)); };

// ── Thế giới: bảng va chạm + xu + spawn ──────────────────────────────────────
let solid, coins, spikes, spawn, flag, coinsTotal;
function parseLevel() {
  solid = []; coins = []; spikes = []; coinsTotal = 0;
  for (let r = 0; r < ROWS; r++) {
    solid[r] = [];
    for (let c = 0; c < COLS; c++) {
      const ch = LEVEL[r][c];
      solid[r][c] = (ch === "#" || ch === "=");
      if (ch === "o") { coins.push({ x: c*TILE+TILE/2, y: r*TILE+TILE/2, got: false }); coinsTotal++; }
      if (ch === "^") spikes.push({ x: c*TILE, y: r*TILE });
      if (ch === "P") spawn = { x: c*TILE, y: r*TILE };
      if (ch === "F") flag = { x: c*TILE, y: r*TILE };
    }
  }
  document.getElementById("coinsTotal").textContent = coinsTotal;
}
const isSolid = (c, r) => r < 0 || c < 0 || c >= COLS ? (c<0||c>=COLS) : (r >= ROWS ? false : solid[r][c]);

// ── Người chơi + hằng số điều chỉnh (character-controller) ───────────────────
const P = { w: 20, h: 26 };
// Từ ý định thiết kế: độ cao nhảy & thời gian tới đỉnh → gravity, impulse.
const JUMP_H = 3.1 * TILE, T_APEX = 0.34;
const GRAV = (2 * JUMP_H) / (T_APEX * T_APEX);
const JUMP_V = -(2 * JUMP_H) / T_APEX;
const FALL_MULT = 1.7;          // fast-fall: rơi nặng hơn bay lên → nhảy "đã tay"
const LOW_JUMP_MULT = 2.4;      // thả nút sớm → cắt độ cao (variable jump)
const RUN = 3.3 * TILE, ACCEL = 22 * TILE, FRICTION = 20 * TILE, AIR_ACCEL = 14 * TILE;
const COYOTE = 0.09, BUFFER = 0.10;  // forgiveness: coyote time + jump buffering

let player, particles, cam, elapsed, won, shake;
function resetGame() {
  parseLevel();
  player = { x: spawn.x, y: spawn.y, vx: 0, vy: 0, grounded: false, coyote: 0, jumpBuf: 0,
             face: 1, sx: 1, sy: 1, coins: 0, dead: 0 };
  particles = []; cam = { x: 0, y: 0 }; elapsed = 0; won = false; shake = 0;
  document.getElementById("coins").textContent = 0;
  document.getElementById("win").style.display = "none";
}

// ── Hạt (particle-systems-and-vfx) ───────────────────────────────────────────
function burst(x, y, n, opt = {}) {
  for (let i = 0; i < n; i++) {
    const a = opt.ang != null ? opt.ang + (Math.random()-0.5)*(opt.spread||Math.PI*2)
                              : Math.random()*Math.PI*2;
    const sp = (opt.spd||60) * (0.4 + Math.random()*0.8);
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - (opt.up||0),
      life: 0, ttl: (opt.ttl||0.5)*(0.6+Math.random()*0.6),
      size: (opt.size||3)*(0.6+Math.random()*0.8), col: opt.col||"#fde68a", grav: opt.grav??220 });
  }
}

// ── Input ────────────────────────────────────────────────────────────────────
const keys = {};
addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code)) e.preventDefault();
  if ((e.code === "Space" || e.code === "ArrowUp") && !keys._jump) player.jumpBuf = BUFFER;
  keys[e.code] = true; if (e.code==="Space"||e.code==="ArrowUp") keys._jump = true;
  if (e.code === "KeyR") resetGame();
  if (!actx) beep(1,0.001); // mở audio sau tương tác đầu
});
addEventListener("keyup", e => { keys[e.code] = false; if (e.code==="Space"||e.code==="ArrowUp") keys._jump = false; });

// ── Va chạm theo trục (axis-separated, tilemap) ──────────────────────────────
function moveAxis(dx, dy) {
  player.x += dx;
  if (dx !== 0) {
    const dir = dx > 0 ? 1 : -1, edge = dir > 0 ? player.x + P.w : player.x;
    const c = Math.floor(edge / TILE);
    for (let r = Math.floor(player.y/TILE); r <= Math.floor((player.y+P.h-1)/TILE); r++)
      if (isSolid(c, r)) { player.x = dir>0 ? c*TILE - P.w : (c+1)*TILE; player.vx = 0; break; }
  }
  player.y += dy;
  if (dy !== 0) {
    const dir = dy > 0 ? 1 : -1, edge = dir > 0 ? player.y + P.h : player.y;
    const r = Math.floor(edge / TILE);
    for (let c = Math.floor(player.x/TILE); c <= Math.floor((player.x+P.w-1)/TILE); c++)
      if (isSolid(c, r)) {
        if (dir > 0) { // chạm đất
          if (!player.grounded && player.vy > 120) { // landing juice
            burst(player.x+P.w/2, player.y+P.h, 8, {ang:-Math.PI/2, spread:Math.PI*0.9, spd:70, col:"#cbd5e1", ttl:0.4, size:2.5, grav:120});
            player.sy = 0.7; player.sx = 1.3; shake = Math.min(6, player.vy*0.02); sndLand();
          }
          player.y = r*TILE - P.h; player.grounded = true;
        } else { player.y = (r+1)*TILE; }
        player.vy = 0; break;
      }
  }
}

function die() {
  if (player.dead) return;
  player.dead = 0.6; shake = 8; sndDie();
  burst(player.x+P.w/2, player.y+P.h/2, 26, {spd:150, col:"#fb7185", ttl:0.7, size:3, grav:120});
}

// ── Update ───────────────────────────────────────────────────────────────────
function update(dt) {
  if (won) { stepParticles(dt); return; }  // vẫn chạy hạt ăn mừng khi đã thắng
  if (player.dead > 0) { player.dead -= dt; if (player.dead <= 0) resetGame(); stepParticles(dt); return; }
  elapsed += dt;

  // Chạy ngang với gia tốc/ma sát (khác air vs ground)
  const wantL = keys.ArrowLeft, wantR = keys.ArrowRight;
  const a = player.grounded ? ACCEL : AIR_ACCEL;
  if (wantR && !wantL) { player.vx += a*dt; player.face = 1; }
  else if (wantL && !wantR) { player.vx -= a*dt; player.face = -1; }
  else { const f = FRICTION*dt; player.vx = Math.abs(player.vx)<=f ? 0 : player.vx - Math.sign(player.vx)*f; }
  player.vx = Math.max(-RUN, Math.min(RUN, player.vx));

  // Coyote time + jump buffer
  player.coyote = player.grounded ? COYOTE : Math.max(0, player.coyote - dt);
  player.jumpBuf = Math.max(0, player.jumpBuf - dt);
  if (player.jumpBuf > 0 && player.coyote > 0) {
    player.vy = JUMP_V; player.grounded = false; player.coyote = 0; player.jumpBuf = 0;
    player.sy = 1.35; player.sx = 0.7; sndJump();
    burst(player.x+P.w/2, player.y+P.h, 7, {ang:Math.PI/2, spread:Math.PI*0.7, spd:55, col:"#a5b4fc", ttl:0.35, size:2.2, grav:80});
  }

  // Trọng lực bất đối xứng (fast-fall + variable jump)
  let g = GRAV;
  if (player.vy > 0) g *= FALL_MULT;
  else if (player.vy < 0 && !keys._jump) g *= LOW_JUMP_MULT;
  player.vy = Math.min(player.vy + g*dt, 16*TILE);

  player.grounded = false;
  moveAxis(player.vx*dt, 0);
  moveAxis(0, player.vy*dt);

  // Squash & stretch hồi về 1
  player.sx += (1 - player.sx) * Math.min(1, dt*12);
  player.sy += (1 - player.sy) * Math.min(1, dt*12);

  // Rơi khỏi map → chết
  if (player.y > H + 40) die();

  // Gai
  for (const s of spikes)
    if (player.x+P.w>s.x+4 && player.x<s.x+TILE-4 && player.y+P.h>s.y+10 && player.y<s.y+TILE) die();

  // Xu
  for (const c of coins) if (!c.got) {
    if (Math.abs(player.x+P.w/2-c.x)<18 && Math.abs(player.y+P.h/2-c.y)<18) {
      c.got = true; player.coins++; sndCoin();
      document.getElementById("coins").textContent = player.coins;
      burst(c.x, c.y, 12, {spd:90, col:"#fde047", ttl:0.5, size:2.5, grav:60});
    }
  }

  // Cờ đích
  if (flag && player.x+P.w>flag.x+2 && player.x<flag.x+TILE && player.y+P.h>flag.y && player.y<flag.y+TILE+TILE) {
    won = true; sndWin();
    document.getElementById("winStats").textContent =
      `🪙 ${player.coins}/${coinsTotal} xu · ⏱ ${elapsed.toFixed(1)}s`;
    document.getElementById("win").style.display = "grid";
    for (let i=0;i<40;i++) setTimeout(()=>burst(flag.x+TILE/2, flag.y, 6, {spd:130,col:["#a78bfa","#22d3ee","#fde047"][i%3],ttl:0.8,size:3,up:40}), i*25);
  }

  stepParticles(dt);
  // Camera bám mượt, kẹp trong biên
  const tx = player.x + P.w/2 - VIEW_W/2;
  cam.x += (Math.max(0, Math.min(W - VIEW_W, tx)) - cam.x) * Math.min(1, dt*6);
  shake = Math.max(0, shake - dt*30);
}
function stepParticles(dt) {
  for (const p of particles) { p.life += dt; p.vy += p.grav*dt; p.x += p.vx*dt; p.y += p.vy*dt; }
  particles = particles.filter(p => p.life < p.ttl);
}

// ── Render ───────────────────────────────────────────────────────────────────
const TCOL = { grass:"#4ade80", grassDark:"#22c55e", dirt:"#7c4a2d", dirtDark:"#5c3620", stone:"#475569" };
function draw() {
  const ox = -Math.round(cam.x) + (Math.random()-0.5)*shake, oy = (Math.random()-0.5)*shake;
  // Nền trời gradient (bầu không khí)
  const sky = ctx.createLinearGradient(0,0,0,VIEW_H);
  sky.addColorStop(0,"#1e2a54"); sky.addColorStop(0.6,"#2d3a6b"); sky.addColorStop(1,"#3b4a7a");
  ctx.fillStyle = sky; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  // Núi parallax
  ctx.fillStyle = "rgba(30,41,80,.6)";
  for (let i=0;i<8;i++){ const mx = ((i*260 - cam.x*0.3)%(W)); ctx.beginPath();
    ctx.moveTo(mx-120,VIEW_H); ctx.lineTo(mx,VIEW_H-140); ctx.lineTo(mx+120,VIEW_H); ctx.fill(); }

  ctx.save(); ctx.translate(ox, oy);
  // Tiles (chỉ vẽ cột nhìn thấy)
  const c0 = Math.max(0, Math.floor(cam.x/TILE)-1), c1 = Math.min(COLS, c0 + VIEW_W/TILE + 3);
  for (let r=0;r<ROWS;r++) for (let c=c0;c<c1;c++){
    if (!solid[r][c]) continue;
    const x=c*TILE, y=r*TILE, top = !isSolid(c, r-1);
    ctx.fillStyle = LEVEL[r][c]==="#" ? TCOL.stone : TCOL.dirt;
    ctx.fillRect(x,y,TILE,TILE);
    ctx.fillStyle = LEVEL[r][c]==="#" ? "#334155" : TCOL.dirtDark;
    ctx.fillRect(x,y+TILE-6,TILE,6); ctx.fillRect(x,y,4,TILE);
    if (top && LEVEL[r][c]!=="#"){ ctx.fillStyle=TCOL.grass; ctx.fillRect(x,y,TILE,8);
      ctx.fillStyle=TCOL.grassDark; for(let k=0;k<TILE;k+=6) ctx.fillRect(x+k,y+6,3,4); }
  }
  // Gai
  for (const s of spikes){ ctx.fillStyle="#94a3b8"; for(let k=0;k<TILE;k+=8){
    ctx.beginPath(); ctx.moveTo(s.x+k,s.y+TILE); ctx.lineTo(s.x+k+4,s.y+8); ctx.lineTo(s.x+k+8,s.y+TILE); ctx.fill(); } }
  // Xu (xoay bằng scale ngang theo thời gian)
  const t = performance.now()/1000;
  for (const c of coins) if (!c.got){ const s = Math.abs(Math.cos(t*3 + c.x))*0.8+0.2;
    ctx.save(); ctx.translate(c.x,c.y+Math.sin(t*3+c.x)*3); ctx.scale(s,1);
    ctx.fillStyle="#fde047"; ctx.beginPath(); ctx.arc(0,0,8,0,7); ctx.fill();
    ctx.fillStyle="#eab308"; ctx.beginPath(); ctx.arc(0,0,5,0,7); ctx.fill(); ctx.restore(); }
  // Cờ đích
  if (flag){ ctx.fillStyle="#cbd5e1"; ctx.fillRect(flag.x+6,flag.y-TILE,3,TILE*2);
    ctx.fillStyle="#22d3ee"; ctx.beginPath(); ctx.moveTo(flag.x+9,flag.y-TILE);
    ctx.lineTo(flag.x+28,flag.y-TILE+8); ctx.lineTo(flag.x+9,flag.y-TILE+16); ctx.fill(); }
  // Hạt
  for (const p of particles){ ctx.globalAlpha = Math.max(0,1-p.life/p.ttl); ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size); }
  ctx.globalAlpha = 1;
  // Người chơi (squash/stretch quanh chân)
  if (player.dead<=0 || Math.floor(player.dead*20)%2===0){
    const cx=player.x+P.w/2, by=player.y+P.h;
    ctx.save(); ctx.translate(cx, by); ctx.scale(player.sx, player.sy); ctx.translate(-cx,-by);
    ctx.fillStyle="#a78bfa"; roundRect(player.x, player.y, P.w, P.h, 5); ctx.fill();
    ctx.fillStyle="#0b1020"; const ex = player.face>0?player.x+P.w-8:player.x+3;
    ctx.fillRect(ex, player.y+7, 4, 5);
    ctx.fillStyle="rgba(255,255,255,.35)"; ctx.fillRect(player.x+3, player.y+3, P.w-6, 4);
    ctx.restore();
  }
  ctx.restore();

  // ── 2D lighting: light buffer → multiply lên cảnh ──────────────────────────
  lc.globalCompositeOperation = "source-over";
  lc.fillStyle = "#20264d"; lc.fillRect(0,0,VIEW_W,VIEW_H);       // ambient (tối)
  lc.globalCompositeOperation = "lighter";
  const glow = (wx,wy,rad,col) => { const sx=wx-cam.x+ox, sy=wy+oy;
    const g=lc.createRadialGradient(sx,sy,0,sx,sy,rad); g.addColorStop(0,col); g.addColorStop(1,"rgba(0,0,0,0)");
    lc.fillStyle=g; lc.beginPath(); lc.arc(sx,sy,rad,0,7); lc.fill(); };
  glow(player.x+P.w/2, player.y+P.h/2, 150, "rgba(200,190,255,.9)");   // hào quang người chơi
  for (const c of coins) if(!c.got) glow(c.x,c.y,55,"rgba(253,224,71,.55)"); // xu phát sáng
  if (flag) glow(flag.x+TILE/2, flag.y, 120, "rgba(34,211,238,.6)");
  lc.fillStyle = "rgba(120,140,255,.10)"; lc.globalCompositeOperation="source-over"; // trời hắt nhẹ
  ctx.globalCompositeOperation = "multiply"; ctx.drawImage(lightCv,0,0);
  ctx.globalCompositeOperation = "source-over";
  // Vignette
  const vg = ctx.createRadialGradient(VIEW_W/2,VIEW_H/2,VIEW_H*0.3,VIEW_W/2,VIEW_H/2,VIEW_H*0.75);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.45)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,VIEW_W,VIEW_H);

  document.getElementById("time").textContent = elapsed.toFixed(1);
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// ── Vòng lặp game (dt cố định, chống spiral of death) ────────────────────────
let last = performance.now(), acc = 0; const STEP = 1/120;
function loop(now) {
  acc += Math.min(0.1, (now - last)/1000); last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  draw(); requestAnimationFrame(loop);
}
resetGame(); requestAnimationFrame(loop);
</script>
</body>
</html>
