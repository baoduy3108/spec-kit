# Dựng file APK cài thẳng lên điện thoại Android.
#
# CỐ Ý để chạy tay: Actions → "Thiên Đạo Lộ · dựng APK" → Run workflow.
# Chạy xong tải APK ở mục Artifacts của lần chạy đó (chỉ người có quyền
# vào repo mới tải được, không công khai như GitHub Pages).
#
# Máy chủ của GitHub có sẵn Android SDK nên không phải cài gì thêm.
name: Thiên Đạo Lộ · dựng APK

on:
  workflow_dispatch:
    inputs:
      loai:
        description: 'debug = cài được ngay, không cần cấu hình gì. release = cần đủ 4 secret ký tên ở dưới.'
        type: choice
        default: debug
        options: [debug, release]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dựng lại game từ nguồn và soi dữ liệu
        working-directory: tu-tien-thpt
        run: |
          node build.mjs
          node check.mjs

      - name: Nhét bản HTML một tệp vào assets của app
        working-directory: tu-tien-thpt
        run: |
          mkdir -p android/app/src/main/assets
          cp thien-dao-lo.html android/app/src/main/assets/index.html
          ls -lh android/app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Nhận giấy phép Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # Ký tên bằng khoá riêng: chỉ chạy khi đã nạp đủ 4 secret.
      # Có khoá cố định thì cài đè bản mới được, KHÔNG mất tiến độ.
      - name: Chuẩn bị khoá ký
        if: inputs.loai == 'release'
        env:
          KHO: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KHO" ]; then
            echo "::error::Chọn release thì phải nạp đủ 4 secret: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Xem tu-tien-thpt/android/README.md."
            exit 1
          fi
          echo "$KHO" | base64 -d > "$RUNNER_TEMP/ky.jks"
          echo "DUONG_KHO=$RUNNER_TEMP/ky.jks" >> "$GITHUB_ENV"

      - name: Dựng APK
        working-directory: tu-tien-thpt/android
        env:
          TDL_KEYSTORE:     ${{ env.DUONG_KHO }}
          TDL_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TDL_KEY_ALIAS:     ${{ secrets.ANDROID_KEY_ALIAS }}
          TDL_KEY_PASS:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ inputs.loai }}" = "release" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Gom APK lại và đặt tên tử tế
        working-directory: tu-tien-thpt/android
        run: |
          mkdir -p ../../apk-ra
          f=$(find app/build/outputs/apk -name '*.apk' | head -1)
          [ -n "$f" ] || { echo "::error::Không tìm thấy APK nào"; exit 1; }
          cp "$f" "../../apk-ra/thien-dao-lo-${{ inputs.loai }}.apk"
          ls -lh ../../apk-ra/

      - name: Kiểm tra APK có đủ thứ cần
        working-directory: apk-ra
        run: |
          f=$(ls *.apk)
          unzip -l "$f" | grep -q 'assets/index.html' || { echo "::error::APK thiếu assets/index.html"; exit 1; }
          unzip -l "$f" | grep -q 'classes.dex'       || { echo "::error::APK thiếu classes.dex"; exit 1; }
          unzip -l "$f" | grep -qi 'META-INF/.*\.RSA\|META-INF/.*\.EC\|META-INF/.*\.DSA' \
            || echo "::warning::Không thấy chữ ký v1, có thể chỉ ký v2/v3 — vẫn cài được trên Android 7 trở lên."
          echo "### APK đã dựng xong :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh "$f" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Tải ở mục **Artifacts** ngay dưới đây, bung zip ra là được file .apk." >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: thien-dao-lo-apk-${{ inputs.loai }}
          path: apk-ra/*.apk
          if-no-files-found: error
          retention-days: 30
