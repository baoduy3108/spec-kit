# Dựng file APK cài thẳng lên điện thoại Android.
#
# Chạy theo hai đường:
#  · Tự chạy khi nhánh phát triển có thay đổi phần app hoặc nội dung game.
#    Cần thế vì nút "Run workflow" chỉ hiện khi file này đã nằm trên nhánh
#    chính — mà nó thì chưa.
#  · Chạy tay từ tab Actions sau khi nhánh đã gộp vào nhánh chính.
#
# Tải APK ở mục Artifacts của lần chạy. Artifact chỉ người có quyền vào
# repo mới tải được, KHÔNG công khai như GitHub Pages.
#
# Máy chủ của GitHub có sẵn Android SDK nên không phải cài gì thêm — đây
# chính là lý do phải dựng ở đây: mạng trong môi trường soạn thảo chặn
# dl.google.com, nơi chứa cả SDK lẫn Android Gradle Plugin.
name: Thiên Đạo Lộ · dựng APK

on:
  workflow_dispatch:
    inputs:
      loai:
        description: 'debug = cài được ngay, không cần cấu hình. release = cần đủ 4 secret ký tên.'
        type: choice
        default: debug
        options: [debug, release]
  push:
    branches: [claude/game-hoc-tap-on-thi-thpt-kwsnz9]
    paths:
      - 'tu-tien-thpt/android/**'
      - 'tu-tien-thpt/src/**'
      - 'tu-tien-thpt/assets/**'
      - 'tu-tien-thpt/build.mjs'
      - '.github/workflows/thien-dao-lo-apk.yml'

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # push không có inputs ⇒ mặc định debug
      LOAI: ${{ inputs.loai || 'debug' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dựng lại game từ nguồn và soi dữ liệu
        working-directory: tu-tien-thpt
        run: |
          node build.mjs
          node check.mjs

      - name: Nhét bản HTML một tệp vào assets của app
        working-directory: tu-tien-thpt
        run: |
          mkdir -p android/app/src/main/assets
          cp thien-dao-lo.html android/app/src/main/assets/index.html
          ls -lh android/app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Nhận giấy phép Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      # Ký bằng khoá riêng: chỉ khi chọn release và đã nạp đủ secret.
      # Khoá cố định thì cài đè bản mới được mà KHÔNG mất tiến độ.
      - name: Chuẩn bị khoá ký
        if: env.LOAI == 'release'
        env:
          KHO: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KHO" ]; then
            echo "::error::Chọn release thì phải nạp đủ 4 secret: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Xem tu-tien-thpt/android/README.md."
            exit 1
          fi
          echo "$KHO" | base64 -d > "$RUNNER_TEMP/ky.jks"
          echo "DUONG_KHO=$RUNNER_TEMP/ky.jks" >> "$GITHUB_ENV"

      - name: Dựng APK
        working-directory: tu-tien-thpt/android
        env:
          TDL_KEYSTORE:      ${{ env.DUONG_KHO }}
          TDL_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TDL_KEY_ALIAS:     ${{ secrets.ANDROID_KEY_ALIAS }}
          TDL_KEY_PASS:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$LOAI" = "release" ]; then
            ./gradlew --no-daemon --stacktrace assembleRelease
          else
            ./gradlew --no-daemon --stacktrace assembleDebug
          fi

      - name: Gom APK lại và đặt tên tử tế
        working-directory: tu-tien-thpt/android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-ra"
          f=$(find app/build/outputs/apk -name '*.apk' | head -1)
          [ -n "$f" ] || { echo "::error::Không tìm thấy APK nào"; exit 1; }
          cp "$f" "$GITHUB_WORKSPACE/apk-ra/thien-dao-lo-$LOAI.apk"
          ls -lh "$GITHUB_WORKSPACE/apk-ra/"

      - name: Kiểm tra APK có đủ thứ cần
        working-directory: apk-ra
        run: |
          f=$(ls *.apk)
          unzip -l "$f" | grep -q 'assets/index.html' || { echo "::error::APK thiếu assets/index.html"; exit 1; }
          unzip -l "$f" | grep -q 'classes.dex'       || { echo "::error::APK thiếu classes.dex"; exit 1; }
          unzip -l "$f" | grep -q 'resources.arsc'    || { echo "::error::APK thiếu resources.arsc"; exit 1; }
          unzip -l "$f" | grep -q 'res/mipmap'        || echo "::warning::Không thấy icon trong APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$f" \
            && echo "Chữ ký hợp lệ" || echo "::warning::apksigner không xác minh được chữ ký"
          {
            echo "### APK đã dựng xong ✅"
            echo '```'
            ls -lh "$f"
            echo '```'
            echo "Tải ở mục **Artifacts** ngay dưới đây, bung zip ra là được file \`.apk\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: thien-dao-lo-apk-${{ env.LOAI }}
          path: apk-ra/*.apk
          if-no-files-found: error
          retention-days: 30
