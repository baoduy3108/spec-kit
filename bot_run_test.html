<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<style>
body { margin: 0; font-family: monospace; background: #000; color: #0f0; }
#result { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.95); padding: 40px; border: 3px solid #0f0;
  border-radius: 10px; text-align: center; font-size: 20px; z-index: 99999;
}
.big { font-size: 48px; color: #ff0; font-weight: bold; margin: 20px 0; }
.label { color: #0f0; margin-top: 20px; }
</style>
</head>
<body>
<div id="result">
  <div>🤖 BOT TEST RUNNING...</div>
  <div class="big" id="score">0</div>
  <div class="label" id="status">Starting...</div>
</div>

<script>
let gameLoaded = false;

fetch('hacdong_working.html')
  .then(r => r.text())
  .then(html => {
    const bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/);
    if(bodyMatch) {
      const div = document.createElement('div');
      div.style.display = 'none';
      div.innerHTML = bodyMatch[1];
      document.body.appendChild(div);
    }
    
    const scriptMatches = html.match(/<script>([\s\S]*?)<\/script>/g);
    if(scriptMatches) {
      scriptMatches.forEach(tag => {
        try { eval(tag.replace(/<\/?script>/g, '')); } catch(e) {}
      });
    }
    
    gameLoaded = true;
    setTimeout(runBot, 1000);
  });

function runBot() {
  if(!gameLoaded || !botPlayFunction) return;
  
  const startTime = Date.now();
  document.getElementById('status').textContent = '⏱️ Game in progress...';
  
  botPlayFunction();
  
  const monitor = setInterval(() => {
    if(typeof score !== 'undefined') {
      document.getElementById('score').textContent = score.toLocaleString();
    }
    
    const elapsed = Math.round((Date.now() - startTime) / 1000);
    
    if(typeof state !== 'undefined' && state !== 'play') {
      clearInterval(monitor);
      
      const finalScore = typeof score !== 'undefined' ? score : 0;
      const fill = typeof boardFill === 'function' ? Math.round(boardFill() * 100) : 0;
      
      document.getElementById('score').textContent = finalScore.toLocaleString();
      document.getElementById('result').innerHTML = `
        <div>✅ BOT GAME COMPLETE</div>
        <div class="big">${finalScore.toLocaleString()}</div>
        <div class="label">⏱️ Time: ${elapsed}s</div>
        <div class="label">📊 Board: ${fill}%</div>
        <div style="margin-top: 30px; font-size: 16px; color: #0f0;">Score recorded</div>
      `;
      
      // Log to console for capture
      console.log('='.repeat(50));
      console.log('BOT TEST FINAL RESULT');
      console.log('='.repeat(50));
      console.log('FINAL SCORE: ' + finalScore);
      console.log('TIME: ' + elapsed + 's');
      console.log('BOARD FILL: ' + fill + '%');
      console.log('='.repeat(50));
    }
  }, 50);
  
  setTimeout(() => {
    clearInterval(monitor);
    if(typeof state !== 'undefined' && state === 'play') {
      const finalScore = typeof score !== 'undefined' ? score : 0;
      console.log('BOT TEST TIMEOUT - SCORE: ' + finalScore);
    }
  }, 120000);
}
</script>
</body>
</html>
